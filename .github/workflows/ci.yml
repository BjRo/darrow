name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18
      - run: bun install --frozen-lockfile
      - run: bun run plugins:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:projections
      - run: bun run test:cli
