name: Installed Sevro integration

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published Sevro version (no tag or range)
        required: true
        type: string
      sha256:
        description: SHA-256 of the reviewed npm package tarball
        required: true
        type: string

permissions:
  contents: read

jobs:
  installed-candidate:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SEVRO_VERSION: ${{ inputs.version }}
      SEVRO_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Prepare retained evidence directory
        shell: bash
        run: |
          ci_artifact_dir="$RUNNER_TEMP/sevro-integration"
          mkdir -p "$ci_artifact_dir"
          printf 'SEVRO_ARTIFACT_DIR=%s\n' "$ci_artifact_dir" >> "$GITHUB_ENV"
      - name: Fetch and verify the exact published candidate
        shell: bash
        run: |
          if [[ ! "$SEVRO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo 'error: version must be an exact published version' >&2
            exit 1
          fi
          if [[ ! "$SEVRO_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'error: sha256 must contain 64 lowercase hexadecimal characters' >&2
            exit 1
          fi
          mkdir -p "$SEVRO_ARTIFACT_DIR"
          npm pack "@bjoernrochel/sevro@$SEVRO_VERSION" --ignore-scripts \
            --registry https://registry.npmjs.org/ --json \
            --pack-destination "$SEVRO_ARTIFACT_DIR" \
            > "$SEVRO_ARTIFACT_DIR/npm-pack.json"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { basename, join } from 'node:path';
          const root = process.env.SEVRO_ARTIFACT_DIR;
          const records = JSON.parse(readFileSync(join(root, 'npm-pack.json'), 'utf8'));
          if (!Array.isArray(records) || records.length !== 1)
            throw new Error('npm must return one package');
          const pkg = records[0];
          if (pkg.name !== '@bjoernrochel/sevro' || pkg.version !== process.env.SEVRO_VERSION)
            throw new Error('downloaded package does not match the exact requested version');
          if (typeof pkg.filename !== 'string' || basename(pkg.filename) !== pkg.filename)
            throw new Error('invalid package archive filename');
          const archive = join(root, pkg.filename);
          const sha256 = createHash('sha256').update(readFileSync(archive)).digest('hex');
          if (sha256 !== process.env.SEVRO_SHA256)
            throw new Error('package SHA-256 does not match the reviewed candidate');
          writeFileSync(join(root, 'candidate.json'), JSON.stringify({
            format: 'darrow-sevro-ci-candidate-v1',
            package: { name: pkg.name, version: pkg.version, sha256, archive },
            darrowRevision: process.env.GITHUB_SHA,
            workflowRun: process.env.GITHUB_RUN_ID,
            node: process.version,
            bun: '1.3.13',
          }, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_ENV, `SEVRO_PACKAGE_TARBALL=${archive}\n`);
          NODE
      - name: Run installed public-interface parity
        shell: bash
        run: |
          env -u SEVRO_CHECKOUT -u SEVRO_PACKAGE_BIN \
            bun run test:eval-runner-sevro-package 2>&1 \
            | tee "$SEVRO_ARTIFACT_DIR/parity.log"
      - name: Retain candidate and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sevro-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SEVRO_ARTIFACT_DIR }}
          if-no-files-found: ignore
          retention-days: 30
