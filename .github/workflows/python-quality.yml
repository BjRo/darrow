name: Python quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Python change scopes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.scopes.outputs.packages }}
      package_selected: ${{ steps.scopes.outputs.package_selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scopes
        name: Select changed Python packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            scripts/detect-python-quality-changes --all >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = pull_request ]; then
            merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            scripts/detect-python-quality-changes "$merge_base" "$HEAD_SHA" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          zero=0000000000000000000000000000000000000000
          if [ "$BEFORE_SHA" = "$zero" ]; then
            scripts/detect-python-quality-changes --all >>"$GITHUB_OUTPUT"
          else
            scripts/detect-python-quality-changes "$BEFORE_SHA" "$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          fi

  package:
    name: ${{ matrix.package }} Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.package_selected == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: ${{ matrix.package }}
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install zsh for Artificer shell integration tests
        if: runner.os == 'Linux' && matrix.package == 'plugins/automation/darrow-artificer/backend'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - run: scripts/check-python --package "$PACKAGE"

  git-windows:
    name: Git Python ${{ matrix.python-version }} on windows-latest
    needs: changes
    if: contains(needs.changes.outputs.packages, 'plugins/capability/darrow-git/backend')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python --package plugins/capability/darrow-git/backend

  git-fresh-install:
    name: Fresh install git on ${{ matrix.os }}
    needs: changes
    if: contains(needs.changes.outputs.packages, 'plugins/capability/darrow-git/backend')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --quiet --frozen --no-dev --project plugins/capability/darrow-git/backend python plugins/capability/darrow-git/backend/tests/fresh_install.py
      - name: Verify Git CLI regression scenarios
        if: runner.os != 'Windows'
        shell: bash
        run: |
          /bin/bash --version
          for test in plugins/capability/darrow-git/backend/tests/shell/*.test.sh; do
            /bin/bash "$test"
          done

  review-windows:
    name: Review Python ${{ matrix.python-version }} on windows-latest
    needs: changes
    if: contains(needs.changes.outputs.packages, 'plugins/capability/darrow-review/backend')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python --package plugins/capability/darrow-review/backend

  review-fresh-install:
    name: Fresh install review on ${{ matrix.os }}
    needs: changes
    if: contains(needs.changes.outputs.packages, 'plugins/capability/darrow-review/backend')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --quiet --frozen --no-dev --project plugins/capability/darrow-review/backend python plugins/capability/darrow-review/backend/tests/fresh_install.py
  information-architecture-windows:
    name: Information architecture Python ${{ matrix.python-version }} on windows-latest
    needs: changes
    if: contains(needs.changes.outputs.packages, 'plugins/foundation/darrow-information-architecture/backend')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python --package plugins/foundation/darrow-information-architecture/backend

  information-architecture-fresh-install:
    name: Fresh install information architecture on ${{ matrix.os }}
    needs: changes
    if: contains(needs.changes.outputs.packages, 'plugins/foundation/darrow-information-architecture/backend')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --quiet --frozen --no-dev --project plugins/foundation/darrow-information-architecture/backend python plugins/foundation/darrow-information-architecture/backend/tests/fresh_install.py

  adaptive-goal-windows:
    name: Adaptive goal Python ${{ matrix.python-version }} on windows-latest
    needs: changes
    if: contains(needs.changes.outputs.packages, 'plugins/orchestration/darrow-adaptive-goal/backend')
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python --package plugins/orchestration/darrow-adaptive-goal/backend

  adaptive-goal-fresh-install:
    name: Fresh install adaptive goal on ${{ matrix.os }}
    needs: changes
    if: contains(needs.changes.outputs.packages, 'plugins/orchestration/darrow-adaptive-goal/backend')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --quiet --frozen --no-dev --project plugins/orchestration/darrow-adaptive-goal/backend python plugins/orchestration/darrow-adaptive-goal/backend/tests/fresh_install.py

  artificer-fresh-install:
    name: Fresh install artificer on ${{ matrix.os }}
    needs: changes
    if: contains(needs.changes.outputs.packages, 'plugins/automation/darrow-artificer/backend')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --quiet --frozen --no-dev --project plugins/automation/darrow-artificer/backend python plugins/automation/darrow-artificer/backend/tests/fresh_install.py

  inventory:
    name: Python inventory guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-python-inventory
      - run: scripts/test-python-quality-changes

  aggregate:
    name: Python quality
    if: always()
    needs:
      - changes
      - package
      - git-windows
      - git-fresh-install
      - review-windows
      - review-fresh-install
      - information-architecture-windows
      - information-architecture-fresh-install
      - adaptive-goal-windows
      - adaptive-goal-fresh-install
      - artificer-fresh-install
      - inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected Python quality job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PACKAGE_SELECTED: ${{ needs.changes.outputs.package_selected }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          REVIEW_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/capability/darrow-review/backend') }}
          REVIEW_WINDOWS_RESULT: ${{ needs.review-windows.result }}
          REVIEW_INSTALL_RESULT: ${{ needs.review-fresh-install.result }}
          GIT_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/capability/darrow-git/backend') }}
          GIT_WINDOWS_RESULT: ${{ needs.git-windows.result }}
          GIT_INSTALL_RESULT: ${{ needs.git-fresh-install.result }}
          IA_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/foundation/darrow-information-architecture/backend') }}
          IA_WINDOWS_RESULT: ${{ needs.information-architecture-windows.result }}
          IA_INSTALL_RESULT: ${{ needs.information-architecture-fresh-install.result }}
          ADAPTIVE_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/orchestration/darrow-adaptive-goal/backend') }}
          ADAPTIVE_WINDOWS_RESULT: ${{ needs.adaptive-goal-windows.result }}
          ADAPTIVE_INSTALL_RESULT: ${{ needs.adaptive-goal-fresh-install.result }}
          ARTIFICER_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/automation/darrow-artificer/backend') }}
          ARTIFICER_INSTALL_RESULT: ${{ needs.artificer-fresh-install.result }}
        run: |
          scripts/verify-python-quality-results \
            "$CHANGES_RESULT" "$INVENTORY_RESULT" \
            "$PACKAGE_SELECTED" "$PACKAGE_RESULT"
          expected=skipped
          if [ "$GIT_SELECTED" = true ]; then expected=success; fi
          test "$GIT_WINDOWS_RESULT" = "$expected"
          test "$GIT_INSTALL_RESULT" = "$expected"
          expected=skipped
          if [ "$IA_SELECTED" = true ]; then expected=success; fi
          test "$IA_WINDOWS_RESULT" = "$expected"
          test "$IA_INSTALL_RESULT" = "$expected"
          expected=skipped
          if [ "$REVIEW_SELECTED" = true ]; then expected=success; fi
          test "$REVIEW_WINDOWS_RESULT" = "$expected"
          test "$REVIEW_INSTALL_RESULT" = "$expected"
          expected=skipped
          if [ "$ADAPTIVE_SELECTED" = true ]; then expected=success; fi
          test "$ADAPTIVE_WINDOWS_RESULT" = "$expected"
          test "$ADAPTIVE_INSTALL_RESULT" = "$expected"
          expected=skipped
          if [ "$ARTIFICER_SELECTED" = true ]; then expected=success; fi
          test "$ARTIFICER_INSTALL_RESULT" = "$expected"
