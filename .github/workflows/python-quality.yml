      - uses: astral-sh/setup-uv@v6
      - run: uv run --quiet --frozen --no-dev --project plugins/orchestration/darrow-ticket-pipeline/backend python plugins/orchestration/darrow-ticket-pipeline/backend/tests/fresh_install.py

  artificer-fresh-install:
