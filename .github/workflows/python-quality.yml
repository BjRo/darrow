      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python --package plugins/capability/darrow-git/backend

  git-fresh-install:
    name: Fresh install git on ${{ matrix.os }}
    needs: changes
    if: contains(needs.changes.outputs.packages, 'plugins/capability/darrow-git/backend')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv run --quiet --frozen --no-dev --project plugins/capability/darrow-git/backend python plugins/capability/darrow-git/backend/tests/fresh_install.py
      - name: Verify Git CLI regression scenarios
        if: runner.os != 'Windows'
        shell: bash
        run: |
          /bin/bash --version
          for test in plugins/capability/darrow-git/backend/tests/shell/*.test.sh; do
            /bin/bash "$test"
