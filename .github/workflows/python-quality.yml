      - artificer-fresh-install
      - inventory
      - skill-authoring-fresh-install
      - observability-windows
      - observability-fresh-install
      - discovery-fresh-install
      - verification-fresh-install
      - performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected Python quality job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PACKAGE_SELECTED: ${{ needs.changes.outputs.package_selected }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          SKILL_AUTHORING_CHANGED: ${{ needs.changes.outputs.skill_authoring }}
          OBSERVABILITY_CHANGED: ${{ needs.changes.outputs.observability_langfuse }}
          DISCOVERY_CHANGED: ${{ needs.changes.outputs.discovery }}
          VERIFICATION_CHANGED: ${{ needs.changes.outputs.verification }}
          WINDOWS_RESULT: ${{ needs.skill-authoring-windows.result }}
          DISCOVERY_WINDOWS_RESULT: ${{ needs.discovery-windows.result }}
          VERIFICATION_WINDOWS_RESULT: ${{ needs.verification-windows.result }}
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          SKILL_INSTALL_RESULT: ${{ needs.skill-authoring-fresh-install.result }}
          OBSERVABILITY_WINDOWS_RESULT: ${{ needs.observability-windows.result }}
          OBSERVABILITY_INSTALL_RESULT: ${{ needs.observability-fresh-install.result }}
          DISCOVERY_INSTALL_RESULT: ${{ needs.discovery-fresh-install.result }}
          VERIFICATION_INSTALL_RESULT: ${{ needs.verification-fresh-install.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          REVIEW_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/capability/darrow-review/backend') }}
          REVIEW_WINDOWS_RESULT: ${{ needs.review-windows.result }}
          REVIEW_INSTALL_RESULT: ${{ needs.review-fresh-install.result }}
          GIT_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/capability/darrow-git/backend') }}
          GIT_WINDOWS_RESULT: ${{ needs.git-windows.result }}
          GIT_INSTALL_RESULT: ${{ needs.git-fresh-install.result }}
          TICKETS_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/capability/darrow-tickets/backend') }}
          TICKETS_WINDOWS_RESULT: ${{ needs.tickets-windows.result }}
          TICKETS_INSTALL_RESULT: ${{ needs.tickets-fresh-install.result }}
          DECISIONS_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/foundation/darrow-decisions/backend') }}
          DECISIONS_WINDOWS_RESULT: ${{ needs.decisions-windows.result }}
          DECISIONS_INSTALL_RESULT: ${{ needs.decisions-fresh-install.result }}
          IA_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/foundation/darrow-information-architecture/backend') }}
          IA_WINDOWS_RESULT: ${{ needs.information-architecture-windows.result }}
          IA_INSTALL_RESULT: ${{ needs.information-architecture-fresh-install.result }}
          ADAPTIVE_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/orchestration/darrow-adaptive-delivery/backend') }}
          ADAPTIVE_WINDOWS_RESULT: ${{ needs.adaptive-delivery-windows.result }}
          ADAPTIVE_INSTALL_RESULT: ${{ needs.adaptive-delivery-fresh-install.result }}
          PIPELINE_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/orchestration/darrow-ticket-pipeline/backend') }}
          PIPELINE_WINDOWS_RESULT: ${{ needs.ticket-pipeline-windows.result }}
          PIPELINE_INSTALL_RESULT: ${{ needs.ticket-pipeline-fresh-install.result }}
          ARTIFICER_SELECTED: ${{ contains(needs.changes.outputs.packages, 'plugins/automation/darrow-artificer/backend') }}
          ARTIFICER_INSTALL_RESULT: ${{ needs.artificer-fresh-install.result }}
        run: |
