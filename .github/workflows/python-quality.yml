name: Python quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Python change scopes
    runs-on: ubuntu-latest
    outputs:
      skill_authoring: ${{ steps.scopes.outputs.skill_authoring }}
      observability_langfuse: ${{ steps.scopes.outputs.observability_langfuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scopes
        name: Select changed Python packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            scripts/detect-python-quality-changes --all >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = pull_request ]; then
            scripts/detect-python-quality-changes "$BASE_SHA" "$HEAD_SHA" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          zero=0000000000000000000000000000000000000000
          if [ "$BEFORE_SHA" = "$zero" ]; then
            scripts/detect-python-quality-changes --all >>"$GITHUB_OUTPUT"
          else
            scripts/detect-python-quality-changes "$BEFORE_SHA" "$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          fi

  skill-authoring-package:
    name: Skill authoring Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.skill_authoring == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python --package plugins/foundation/darrow-skill-authoring/skills/author-agent-skill/backend

  observability-package:
    name: Observability Langfuse Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.observability_langfuse == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python --package plugins/capability/darrow-observability-langfuse/backend

  skill-authoring-windows:
    name: Skill authoring Python ${{ matrix.python-version }} on windows-latest
    needs: changes
    if: needs.changes.outputs.skill_authoring == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python --package plugins/foundation/darrow-skill-authoring/skills/author-agent-skill/backend

  inventory:
    name: Python inventory guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-python-inventory
      - run: scripts/test-python-quality-changes

  skill-authoring-fresh-install:
    name: Fresh install skill-authoring on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.skill_authoring == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            test: plugins/foundation/darrow-skill-authoring/tests/fresh-install.test.sh
          - os: macos-latest
            shell: bash
            test: plugins/foundation/darrow-skill-authoring/tests/fresh-install.test.sh
          - os: windows-latest
            shell: pwsh
            test: plugins/foundation/darrow-skill-authoring/tests/fresh-install.test.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - if: matrix.shell == 'bash'
        run: bash "${{ matrix.test }}"
      - if: matrix.shell == 'pwsh'
        shell: pwsh
        run: "& '${{ matrix.test }}'"

  observability-fresh-install:
    name: Fresh install observability-langfuse on ubuntu-latest
    needs: changes
    if: needs.changes.outputs.observability_langfuse == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: bash plugins/capability/darrow-observability-langfuse/tests/fresh-install.test.sh

  performance:
    name: Python performance invariants
    needs: changes
    if: needs.changes.outputs.observability_langfuse == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: plugins/capability/darrow-observability-langfuse/tests/performance.test.sh

  aggregate:
    name: Python quality
    if: always()
    needs:
      - changes
      - skill-authoring-package
      - observability-package
      - skill-authoring-windows
      - inventory
      - skill-authoring-fresh-install
      - observability-fresh-install
      - performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected Python quality job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SKILL_AUTHORING_CHANGED: ${{ needs.changes.outputs.skill_authoring }}
          OBSERVABILITY_CHANGED: ${{ needs.changes.outputs.observability_langfuse }}
          SKILL_PACKAGE_RESULT: ${{ needs.skill-authoring-package.result }}
          OBSERVABILITY_PACKAGE_RESULT: ${{ needs.observability-package.result }}
          WINDOWS_RESULT: ${{ needs.skill-authoring-windows.result }}
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          SKILL_INSTALL_RESULT: ${{ needs.skill-authoring-fresh-install.result }}
          OBSERVABILITY_INSTALL_RESULT: ${{ needs.observability-fresh-install.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: |
          scripts/verify-python-quality-results \
            "$CHANGES_RESULT" "$INVENTORY_RESULT" \
            "$SKILL_AUTHORING_CHANGED" "$SKILL_PACKAGE_RESULT" \
            "$WINDOWS_RESULT" "$SKILL_INSTALL_RESULT" \
            "$OBSERVABILITY_CHANGED" "$OBSERVABILITY_PACKAGE_RESULT" \
            "$OBSERVABILITY_INSTALL_RESULT" "$PERFORMANCE_RESULT"
