name: Python quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Python change scopes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.scopes.outputs.packages }}
      package_selected: ${{ steps.scopes.outputs.package_selected }}
      skill_authoring: ${{ steps.scopes.outputs.skill_authoring }}
      observability_langfuse: ${{ steps.scopes.outputs.observability_langfuse }}
      discovery: ${{ steps.scopes.outputs.discovery }}
      verification: ${{ steps.scopes.outputs.verification }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scopes
        name: Select changed Python packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            scripts/detect-python-quality-changes --all >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = pull_request ]; then
            scripts/detect-python-quality-changes "$BASE_SHA" "$HEAD_SHA" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          zero=0000000000000000000000000000000000000000
          if [ "$BEFORE_SHA" = "$zero" ]; then
            scripts/detect-python-quality-changes --all >>"$GITHUB_OUTPUT"
          else
            scripts/detect-python-quality-changes "$BEFORE_SHA" "$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          fi

  package:
    name: ${{ matrix.package }} Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.package_selected == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: ${{ matrix.package }}
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python --package "$PACKAGE"

  skill-authoring-windows:
    name: Skill authoring Python ${{ matrix.python-version }} on windows-latest
    needs: changes
    if: needs.changes.outputs.skill_authoring == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python --package plugins/foundation/darrow-skill-authoring/skills/author-agent-skill/backend

  discovery-windows:
    name: Discovery Python ${{ matrix.python-version }} on windows-latest
    needs: changes
    if: needs.changes.outputs.discovery == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
