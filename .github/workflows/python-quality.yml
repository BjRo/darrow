name: Python quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: scripts/check-python

  inventory:
    name: Python inventory guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-python-inventory

  fresh-install:
    name: Fresh install ${{ matrix.plugin }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plugin: observability-langfuse
            shell: bash
            test: plugins/capability/darrow-observability-langfuse/tests/fresh-install.test.sh
          - os: ubuntu-latest
            plugin: skill-authoring
            shell: bash
            test: plugins/foundation/darrow-skill-authoring/tests/fresh-install.test.sh
          - os: macos-latest
            plugin: skill-authoring
            shell: bash
            test: plugins/foundation/darrow-skill-authoring/tests/fresh-install.test.sh
          - os: windows-latest
            plugin: skill-authoring
            shell: pwsh
            test: plugins/foundation/darrow-skill-authoring/tests/fresh-install.test.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - if: matrix.shell == 'bash'
        run: bash "${{ matrix.test }}"
      - if: matrix.shell == 'pwsh'
        shell: pwsh
        run: "& '${{ matrix.test }}'"

  performance:
    name: Python performance invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: plugins/capability/darrow-observability-langfuse/tests/performance.test.sh

  aggregate:
    name: Python quality
    if: always()
    needs: [package, inventory, fresh-install, performance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python quality job
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          INSTALL_RESULT: ${{ needs.fresh-install.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$INVENTORY_RESULT" = success
          test "$INSTALL_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
