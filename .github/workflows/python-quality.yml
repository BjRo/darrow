  performance:
    name: Python performance invariants
    needs: changes
    if: needs.changes.outputs.observability_langfuse == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: plugins/capability/darrow-observability-langfuse/tests/performance.test.sh

  aggregate:
    name: Python quality
    if: always()
    needs:
      - changes
      - package
      - skill-authoring-windows
      - discovery-windows
      - verification-windows
      - git-windows
      - git-fresh-install
      - review-windows
      - review-fresh-install
      - tickets-windows
      - tickets-fresh-install
      - decisions-windows
      - decisions-fresh-install
      - information-architecture-windows
