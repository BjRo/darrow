name: Explanation portability

on:
  pull_request:
    paths:
      - "plugins/capability/darrow-explanation/**"
      - "scripts/check-explanation-install.ts"
      - "evals/runner/explanation-eval-checks.test.ts"
      - "evals/runner/checks.ts"
      - "bun.lock"
      - ".github/workflows/explanation-portability.yml"
  push:
    branches: [main]
    paths:
      - "plugins/capability/darrow-explanation/**"
      - "scripts/check-explanation-install.ts"
      - "evals/runner/explanation-eval-checks.test.ts"
      - "evals/runner/checks.ts"
      - "bun.lock"
      - ".github/workflows/explanation-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: npm install --global @openai/codex@0.154.0 @anthropic-ai/claude-code@2.1.223
      - name: Resolve native Windows host entrypoints
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $modules = npm root --global
          if ($LASTEXITCODE -ne 0) { throw "Cannot locate installed host packages" }
          "DARROW_CERT_NPM_ROOT=$modules" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: bun test evals/runner/explanation-eval-checks.test.ts
      - run: bun scripts/check-explanation-install.ts
