schemaVersion: 0.1.0
id: implement-change
version: 0.2.0
engine: ^0.1.0
inputs:
  change:
    type: string
    required: true
requirements:
  capabilities:
    - contract: git.branch.create
      version: ^1.0.0
profile: codex
loops:
  - id: final-verification
    steps: [verify-and-repair]
    maxAttempts: 2
    until: { stepId: verify-and-repair, output: verified, equals: true }
    waiver: null
steps:
  - id: implement
    dependsOn: []
    command:
      id: darrow-delivery:implement
      version: ^0.1.0
    with:
      change: ${inputs.change}
  - id: verify-and-repair
    dependsOn: [implement]
    command:
      id: darrow-delivery:verify-and-repair
      version: ^0.1.0
    with:
      change: ${inputs.change}
