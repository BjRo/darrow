id: create-pr-default-branch-refuse
invariant: GW-P4
skill: create-pr
prompt: Open a PR for my latest change.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      case "$1 $2" in
        "pr list")
          if [ -f "$(git rev-parse --git-dir)/fixture-gh-fail" ]; then
            echo "HTTP 502: bad gateway" >&2
            exit 1
          fi
          if [ -f "$(git rev-parse --git-dir)/fixture-gh-existing" ]; then
            cat "$(git rev-parse --git-dir)/fixture-gh-existing"
          fi
          ;;
        "pr create")
          mkdir -p "$d"
          shift 2
          while [ $# -gt 0 ]; do
            case "$1" in
              --title) printf '%s' "$2" > "$d/title"; shift 2 ;;
              --body) printf '%s' "$2" > "$d/body"; shift 2 ;;
              --base) printf '%s' "$2" > "$d/base"; shift 2 ;;
              --head) printf '%s' "$2" > "$d/head"; shift 2 ;;
              --draft) : > "$d/draft"; shift ;;
              *) shift ;;
            esac
          done
          echo "https://github.com/fixture/repo/pull/1"
          ;;
        *)
          echo "mock gh: unsupported: $*" >&2
          exit 1
          ;;
      esac
  setup: |
    git init -q --bare .git/remote.git
    git remote add origin "$PWD/.git/remote.git"
    git push -qu origin main
    git remote set-head origin main
    mkdir -p src
    printf 'export const cached = true;\n' > src/cache.ts
    git add src/cache.ts
    git commit -qm "perf: cache config lookups"
checks:
  - name: no PR created
    run: test ! -f .git/fixture-gh/title && echo none
    expect_regex: "^none$"
  - name: still on main
    run: git rev-parse --abbrev-ref HEAD
    expect_regex: "^main$"
  - name: no branch invented
    run: git for-each-ref refs/heads | wc -l
    expect_regex: "^\\s*1$"
  - name: main not pushed
    run: test "$(git -C .git/remote.git rev-parse refs/heads/main)" != "$(git rev-parse main)" && echo unpushed
    expect_regex: "^unpushed$"
