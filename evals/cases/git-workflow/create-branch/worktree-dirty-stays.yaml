id: create-branch-worktree-dirty-stays
invariant: GW-B6
skill: create-branch
prompt: Create a worktree for fixing the request timeout in src/api.ts — leave my current checkout as it is.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
        src/api.ts: "export const timeoutMs = 1000;\n"
  files:
    src/api.ts: "export const timeoutMs = 30000;\n"
    notes.txt: "scratch notes\n"
checks:
  - name: fix branch checked out in a linked worktree
    run: git worktree list --porcelain
    expect_regex: "branch refs/heads/fix/"
  - name: current checkout untouched
    run: git rev-parse --abbrev-ref HEAD
    expect_regex: "^main$"
  - name: modified file stayed behind
    run: git status --porcelain
    expect_regex: "^ M src/api\\.ts$"
  - name: untracked file stayed behind
    run: git status --porcelain
    expect_regex: "^\\?\\? notes\\.txt$"
  - name: nothing stashed
    run: git stash list
    not_regex: "stash@"
  - name: no commit created
    run: git rev-list --count HEAD
    expect_regex: "^1$"
