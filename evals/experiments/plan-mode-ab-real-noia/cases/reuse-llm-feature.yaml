id: plan-ab4-reuse-llm-feature
invariant: PLAN-AB4-REUSE
prompt: >-
  Add a skill-gap analysis feature to the backend: when a profile has a job
  target, run an asynchronous LLM job that compares the profile's skills
  against the job target's requirements and stores a structured list of
  missing or weak skills. Expose a mutation to trigger the analysis and a
  query to fetch the results.
fixture:
  repo: /Users/bjro/Sources/credfolio2
  setup: |
    find . -name .git -prune -o \( -name AGENTS.md -o -name CLAUDE.md \) -type f -print0 | xargs -0 rm -f
    rm -rf .agent-shared .claude .agents .codex .beans
    git add -A
    git commit -qm "chore: remove agent-facing configuration"
checks:
  - name: async work goes through the existing job queue
    run: cat .git/last-message.md
    expect_regex: "internal/job/|[Rr]iver"
  - name: builds on the existing LLM infrastructure
    run: cat .git/last-message.md
    expect_regex: "internal/infrastructure/llm/"
  - name: follows a sibling LLM-pipeline pattern rather than reinventing
    run: cat .git/last-message.md
    expect_regex: "positioning_review|[Rr]esilient|provider_chain|pipeline_coordinator|extraction"
  - name: exposes it over the GraphQL schema
    run: cat .git/last-message.md
    expect_regex: "schema\\.graphqls"
  - name: grounding - every non-(new) path exists
    run: >-
      re='[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+[.](ts|tsx|js|json|md|yml|yaml|sh|go|sql|graphql|graphqls)';
      new=$(grep '(new)' .git/last-message.md | grep -oE "$re" | sort -u);
      all=$(grep -v '://' .git/last-message.md | grep -oE "$re" | sort -u);
      ns=" $(echo $new) "; miss="";
      for p in $all; do
      case "$p" in *.test.*|*_test.*|*.spec.*) continue;; esac;
      case "$ns" in *" $p "*) continue;; esac;
      [ -e "$p" ] || miss="$miss $p"; done;
      if [ -z "$miss" ]; then echo GROUNDED; else echo "MISSING:$miss"; fi
    expect_regex: "^GROUNDED$"
  - name: required sections in order
    run: cat .git/last-message.md
    expect_regex: "^## Summary[\\s\\S]*^## Key Changes[\\s\\S]*^## Test Plan[\\s\\S]*^## Assumptions"
  - name: at least one recorded assumption
    run: awk '/^## Assumptions/{f=1;next} f&&NF{print;exit}' .git/last-message.md
    expect_regex: "\\S"
  - name: no files changed (plan only)
    run: git status --porcelain
    not_regex: "\\S"
