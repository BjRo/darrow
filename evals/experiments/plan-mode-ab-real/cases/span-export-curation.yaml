id: plan-ab2-span-export-curation
invariant: PLAN-AB2-SPAN
prompt: >-
  Add curated experience selections for the concise PDF export: a user can
  choose which experiences appear in the exported PDF and in what order.
  Persist the selection, expose it over the API, and make the export respect
  it. Follow how similar curation features are built in this codebase.
fixture:
  repo: /Users/bjro/Sources/credfolio2
  setup: |
    rm -rf .codex/hooks.json .codex/hooks
    git add -A
    git commit -qm "chore: remove codex lifecycle hooks"
checks:
  - name: adds a migration
    run: cat .git/last-message.md
    expect_regex: "migrations/"
  - name: touches the repository layer
    run: cat .git/last-message.md
    expect_regex: "repository/postgres/"
  - name: extends the GraphQL schema
    run: cat .git/last-message.md
    expect_regex: "schema\\.graphqls"
  - name: integrates with the PDF assembler
    run: cat .git/last-message.md
    expect_regex: "assembler\\.go|internal/export/"
  - name: wires the frontend
    run: cat .git/last-message.md
    expect_regex: "src/frontend/"
  - name: finds the sibling curation features
    run: cat .git/last-message.md
    expect_regex: "[Ee]xport[_ ]?[Ss]kill[_ ]?[Ss]election|[Ee]xport[_ ]?[Tt]estimonial[_ ]?[Ss]election"
  - name: grounding - every non-(new) path exists
    run: >-
      re='[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+[.](ts|tsx|js|json|md|yml|yaml|sh|go|sql|graphql|graphqls)';
      new=$(grep '(new)' .git/last-message.md | grep -oE "$re" | sort -u);
      all=$(grep -v '://' .git/last-message.md | grep -oE "$re" | sort -u);
      ns=" $(echo $new) "; miss="";
      for p in $all; do
      case "$p" in *.test.*|*_test.*|*.spec.*) continue;; esac;
      case "$ns" in *" $p "*) continue;; esac;
      [ -e "$p" ] || miss="$miss $p"; done;
      if [ -z "$miss" ]; then echo GROUNDED; else echo "MISSING:$miss"; fi
    expect_regex: "^GROUNDED$"
  - name: required sections in order
    run: cat .git/last-message.md
    expect_regex: "^## Summary[\\s\\S]*^## Key Changes[\\s\\S]*^## Test Plan[\\s\\S]*^## Assumptions"
  - name: at least one recorded assumption
    run: awk '/^## Assumptions/{f=1;next} f&&NF{print;exit}' .git/last-message.md
    expect_regex: "\\S"
  - name: no files changed (plan only)
    run: git status --porcelain
    not_regex: "\\S"
