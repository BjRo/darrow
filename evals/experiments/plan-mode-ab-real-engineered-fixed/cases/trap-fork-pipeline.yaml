id: plan-ab6b-trap-fork-pipeline
invariant: PLAN-AB6B-TRAP
prompt: >-
  Add per-step progress reporting to the fork generation pipeline: the
  frontend should be able to show which step a fork generation run is
  currently in. Plan the backend changes (status model, job workers, GraphQL
  exposure) and the minimal frontend data wiring.
fixture:
  repo: /Users/bjro/Sources/credfolio2
  setup: |
    cp src/backend/CLAUDE.md src/backend/MAP.md
    cp src/frontend/CLAUDE.md src/frontend/MAP.md
    sed -e 's|`cmd/|`src/backend/cmd/|g' -e 's|`internal/|`src/backend/internal/|g' -e 's|`migrations/|`src/backend/migrations/|g' -e 's|`gqlgen.yml`|`src/backend/gqlgen.yml`|g' -e 's|`Makefile`|`src/backend/Makefile`|g' src/backend/MAP.md > .map.tmp && mv .map.tmp src/backend/MAP.md
    sed -e 's|`src/|`src/frontend/src/|g' -e 's|`middleware.ts`|`src/frontend/middleware.ts`|g' -e 's|`codegen.ts`|`src/frontend/codegen.ts`|g' -e 's|`vitest.config.ts`|`src/frontend/vitest.config.ts`|g' src/frontend/MAP.md > .map.tmp && mv .map.tmp src/frontend/MAP.md
    find . -name .git -prune -o \( -name AGENTS.md -o -name CLAUDE.md \) -type f -print0 | xargs -0 rm -f
    rm -rf .agent-shared .claude .agents .codex .beans documentation decisions .demos
    cat > AGENTS.md <<'ROUTER'
    # Project Guide

    Monorepo: Go backend (src/backend) and React/TypeScript frontend (src/frontend).

    Compact file maps with integration guidance exist for each area. Read them
    at the right moment:

    - [src/backend/MAP.md](./src/backend/MAP.md): read before planning or
      changing anything under src/backend/ (Go, GraphQL schema/resolvers,
      background jobs, migrations, PDF export)
    - [src/frontend/MAP.md](./src/frontend/MAP.md): read before planning or
      changing anything under src/frontend/ (React app, hooks, GraphQL
      operations)
    - Read both maps before planning a change that spans backend and frontend
      (a new field, a new API, a new setting)
    ROUTER
    git add -A
    git commit -qm "chore: restructure project documentation"
checks:
  - name: plans against the actual single-worker pipeline
    run: cat .git/last-message.md
    expect_regex: "fork_generation\\.go"
  - name: grounding - every non-(new) path exists
    run: >-
      re='[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+[.](ts|tsx|js|json|md|yml|yaml|sh|go|sql|graphql|graphqls)';
      new=$(grep '(new)' .git/last-message.md | grep -oE "$re" | sort -u);
      all=$(grep -v '://' .git/last-message.md | grep -oE "$re" | sort -u);
      ns=" $(echo $new) "; miss="";
      for p in $all; do
      case "$p" in *.test.*|*_test.*|*.spec.*) continue;; esac;
      case "$ns" in *" $p "*) continue;; esac;
      [ -e "$p" ] || miss="$miss $p"; done;
      if [ -z "$miss" ]; then echo GROUNDED; else echo "MISSING:$miss"; fi
    expect_regex: "^GROUNDED$"
  - name: exposes progress over the GraphQL schema
    run: cat .git/last-message.md
    expect_regex: "schema\\.graphqls"
  - name: required sections in order
    run: cat .git/last-message.md
    expect_regex: "^## Summary[\\s\\S]*^## Key Changes[\\s\\S]*^## Test Plan[\\s\\S]*^## Assumptions"
  - name: at least one recorded assumption
    run: awk '/^## Assumptions/{f=1;next} f&&NF{print;exit}' .git/last-message.md
    expect_regex: "\\S"
  - name: no files changed (plan only)
    run: git status --porcelain
    not_regex: "\\S"
