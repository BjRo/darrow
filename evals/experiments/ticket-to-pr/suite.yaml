version: 1
experiment: ticket-to-pr-core-comparison
case_match: exact
case_filter:
  - ticket-to-pr-e1-ready-delivery
  - ticket-to-pr-e2-authoritative-intake
  - ticket-to-pr-e3-adaptive-preflight
  - ticket-to-pr-e4-dirty-safety
  - ticket-to-pr-e5-reentry
  - ticket-to-pr-e6-recoverable-push
  - ticket-to-pr-e7-scope
  - ticket-to-pr-e8-review
  - ticket-to-pr-e9-pr-shape
  - ticket-to-pr-e10-terminal
  - ticket-to-pr-e11-cross-host
modes:
