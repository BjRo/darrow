      ticket-to-pr-e3-adaptive-preflight:
        - adaptive-goal
    entrypoint_by_harness:
      claude: /darrow-ticket-to-pr:ticket-to-pr
      codex: $darrow-ticket-to-pr:ticket-to-pr
  raw-adaptive-goal:
    gating: false
    skill_dir: ../../../plugins/orchestration/darrow-goal-loop/skills/adaptive-goal
    entrypoint_by_harness:
      claude: /darrow-goal-loop:adaptive-goal
      codex: $darrow-goal-loop:adaptive-goal
  ticket-pipeline:
    gating: false
    skill_dir: ../../../plugins/orchestration/darrow-ticket-pipeline/skills/deliver-ticket
    mount_plugin_skills: true
    entrypoint_by_harness:
      claude: /darrow-ticket-pipeline:deliver-ticket
      codex: $darrow-ticket-pipeline:deliver-ticket
