# Round 7, bare row: mixed patterns, NO router — measures the model's own
# heuristic. The two style checks are informational: exactly one is expected
# to pass per trial (analysis reads per-check results; overall pass-rate is
# meaningless for this case by design).
id: plan-ab7-endorsement-bare
invariant: PLAN-AB7-MIXED-BARE
prompt: >-
  Add persistence for profile endorsements to the backend: an endorsement
  records that another person (name, role title, optional company) vouched
  for a specific profile with a short note. Plan the domain entity, the
  repository layer, and the database migration needed to create, list by
  profile, and delete endorsements. Persistence layer only — do not plan
  API or frontend changes.
fixture:
  repo: /Users/bjro/Sources/credfolio2
  setup: |
    mkdir -p src/backend/internal/repository/sqlpg
    cp /Users/bjro/Sources/darrow/evals/experiments/plan-mode-ab-real-mixed/inject/session_repository.go src/backend/internal/repository/sqlpg/session_repository.go
    cp /Users/bjro/Sources/darrow/evals/experiments/plan-mode-ab-real-mixed/inject/positioning_review_repository.go src/backend/internal/repository/sqlpg/positioning_review_repository.go
    rm src/backend/internal/repository/postgres/session_repository.go src/backend/internal/repository/postgres/session_repository_test.go
    rm src/backend/internal/repository/postgres/positioning_review_repository.go src/backend/internal/repository/postgres/positioning_review_repository_test.go
    perl -0pi -e 's|\t"backend/internal/repository/postgres"\n|\t"backend/internal/repository/postgres"\n\t"backend/internal/repository/sqlpg"\n|' src/backend/cmd/server/main.go
    perl -0pi -e 's|postgres\.NewSessionRepository\(db\)|sqlpg.NewSessionRepository(db.DB)|; s|postgres\.NewPositioningReviewRepository\(db\)|sqlpg.NewPositioningReviewRepository(db.DB)|' src/backend/cmd/server/main.go
    grep -q '"backend/internal/repository/sqlpg"' src/backend/cmd/server/main.go
    grep -q 'sqlpg.NewSessionRepository(db.DB)' src/backend/cmd/server/main.go
    find . -name .git -prune -o \( -name AGENTS.md -o -name CLAUDE.md \) -type f -print0 | xargs -0 rm -f
    rm -rf .agent-shared .claude .agents .codex .beans documentation decisions .demos
    git add -A
    git commit -qm "chore: remove agent-facing configuration"
checks:
  - name: "style adopted: sqlpg (informational)"
    run: cat .git/last-message.md
    expect_regex: "repository/sqlpg/[A-Za-z0-9_]*endorsement[A-Za-z0-9_]*\\.go"
  - name: "style adopted: postgres (informational)"
    run: cat .git/last-message.md
    expect_regex: "repository/postgres/[A-Za-z0-9_]*endorsement[A-Za-z0-9_]*\\.go"
  - name: plans a database migration
    run: cat .git/last-message.md
    expect_regex: "migrations/"
  - name: grounding - every non-(new) path exists
    run: >-
      re='[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+[.](ts|tsx|js|json|md|yml|yaml|sh|go|sql|graphql|graphqls)';
      new=$(grep '(new)' .git/last-message.md | grep -oE "$re" | sort -u);
      all=$(grep -v '://' .git/last-message.md | grep -oE "$re" | sort -u);
      ns=" $(echo $new) "; miss="";
      for p in $all; do
      case "$p" in *.test.*|*_test.*|*.spec.*) continue;; esac;
      case "$ns" in *" $p "*) continue;; esac;
      [ -e "$p" ] || miss="$miss $p"; done;
      if [ -z "$miss" ]; then echo GROUNDED; else echo "MISSING:$miss"; fi
    expect_regex: "^GROUNDED$"
  - name: required sections in order
    run: cat .git/last-message.md
    expect_regex: "^## Summary[\\s\\S]*^## Key Changes[\\s\\S]*^## Test Plan[\\s\\S]*^## Assumptions"
  - name: at least one recorded assumption
    run: awk '/^## Assumptions/{f=1;next} f&&NF{print;exit}' .git/last-message.md
    expect_regex: "\\S"
  - name: no files changed (plan only)
    run: git status --porcelain
    not_regex: "\\S"
