id: orchestration-routing-localized-mechanical
invariant: ORCH-ROUTING-LOCALIZED-MECHANICAL
prompt: |-
  Work directly in this small repository. Alphabetize the three entries in `NOTES.md` under the existing heading. Run `bash check.sh` before finishing. Do not commit or publish changes.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for NOTES.md changes.
        NOTES.md: |
          # Notes

          - zebra
          - alpha
          - maple
        check.sh: |
          #!/usr/bin/env bash
          printf '%s\n' '# Notes' '' '- alpha' '- maple' '- zebra' >.git/expected-notes
          cmp -s .git/expected-notes NOTES.md
checks:
  - name: deterministic prose transformation is correct
    run: bash check.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
