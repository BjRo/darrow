id: orchestration-routing-localized-retry-after
invariant: ORCH-ROUTING-LOCALIZED-PARSER
prompt: |-
  Work directly in this small JavaScript repository and implement the requested behavior. Do not commit or publish changes.

  Implement `parseRetryAfter(value, nowMs)` in `src/retry-after.js`. A canonical non-negative decimal integer is a delay in seconds and must be returned unchanged when it is a safe integer. Otherwise, accept only an IMF-fixdate such as `Wed, 21 Oct 2015 07:28:00 GMT`; return the number of whole seconds until that date, rounded up, or zero when the date is in the past. Return `null` for every other value, including surrounding whitespace, signed numbers, unsafe integers, and non-string inputs.

  Add focused tests for both valid forms and rejection boundaries and run `bash test.sh` before finishing.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash test.sh` for JavaScript changes.
        package.json: '{"type":"module"}'
        src/retry-after.js: |
          export const parseRetryAfter = (_value, _nowMs) => null;
        test/retry-after.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { parseRetryAfter } from "../src/retry-after.js";

          test("parses delay seconds", () => {
            assert.equal(parseRetryAfter("120", 0), 120);
          });
        test.sh: |
          #!/usr/bin/env bash
          node --test test/retry-after.test.js
checks:
  - name: canonical delay seconds are parsed
    run: >-
      node --input-type=module -e
      "import('./src/retry-after.js').then(({parseRetryAfter}) => {
      if (parseRetryAfter('0', 99) !== 0 ||
      parseRetryAfter('120', 99) !== 120 ||
      parseRetryAfter('9007199254740991', 99) !== 9007199254740991)
      process.exit(1) })"
  - name: IMF-fixdate values are parsed relative to now
    run: >-
      node --input-type=module -e
      "import('./src/retry-after.js').then(({parseRetryAfter}) => {
      const date = 'Wed, 21 Oct 2015 07:28:00 GMT';
      const target = Date.parse(date);
      if (parseRetryAfter(date, target - 1501) !== 2 ||
      parseRetryAfter(date, target + 1) !== 0) process.exit(1) })"
  - name: invalid and noncanonical values are rejected
    metric: escaped_defect
    run: >-
      node --input-type=module -e
      "import('./src/retry-after.js').then(({parseRetryAfter}) => {
      for (const value of [' 120', '120 ', '+1', '-1', '1.5',
      '9007199254740992', 'Wed, 21 Oct 2015 07:28:00 UTC', '', 120, null]) {
      if (parseRetryAfter(value, 0) !== null) process.exit(1) } })"
  - name: repository tests pass
    run: bash test.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
