id: orchestration-oss-cobra-lifecycle
invariant: ORCH-OSS-HELDOUT-REFACTOR
prompt: &task |-
  Work directly in this Cobra repository and perform a behavior-preserving refactor. Do not commit or publish changes.

  Decompose the lifecycle callback block in `(*Command).execute` into three private methods named `executePreRun`, `executeRun`, and `executePostRun`. Keep `execute` responsible for parsing, help/version handling, argument validation, and sequencing those methods. Preserve the exact nearest-persistent-hook behavior, local hook order, required-flag validation point, `RunE`/`Run` and error short-circuit semantics. Do not introduce new public API or intentionally change command behavior.

  Add characterization tests for successful hook order and failure short-circuiting. Run the focused command tests and the full Go test suite before finishing.
fixture:
  source: cobra-1.1.3
  files:
    AGENTS.md: |-
      This is a pinned evaluation checkout. Do not commit or publish changes.
      Work only on the requested command lifecycle refactor. Dependencies are preinstalled.
      Before editing, inspect `(*Command).execute` in `command.go`, lifecycle tests in `command_test.go`, required-flag validation, and the command execution helpers. Preserve Go 1.12 compatibility and run `gofmt` on changed Go files.
  commit_files: true
  setup: go mod download
  ticket:
    id: "1"
    title: Decompose command lifecycle execution without behavior changes
    body: *task
checks:
  - name: lifecycle phases are structurally separated
    run: |-
      rg -q 'func \(c \*Command\) executePreRun\(' command.go &&
      rg -q 'func \(c \*Command\) executeRun\(' command.go &&
      rg -q 'func \(c \*Command\) executePostRun\(' command.go
  - name: hidden lifecycle compatibility contract
    metric: escaped_defect
    run: |-
      hidden_test=zz_darrow_lifecycle_hidden_test.go
      trap 'rm -f "$hidden_test"' EXIT
      cat >"$hidden_test" <<'GO'
      package cobra

      import (
        "errors"
        "reflect"
        "testing"
      )

      func TestDarrowLifecycleOrder(t *testing.T) {
        var got []string
        record := func(name string) func(*Command, []string) {
          return func(*Command, []string) { got = append(got, name) }
        }
        root := &Command{Use: "root", PersistentPreRun: record("root-persistent-pre"), PersistentPostRun: record("root-persistent-post")}
        child := &Command{
          Use: "child", PersistentPreRun: record("child-persistent-pre"), PreRun: record("pre"),
          Run: record("run"), PostRun: record("post"), PersistentPostRun: record("child-persistent-post"),
        }
        root.AddCommand(child)
        if _, _, err := executeCommandC(root, "child"); err != nil { t.Fatal(err) }
        want := []string{"child-persistent-pre", "pre", "run", "post", "child-persistent-post"}
        if !reflect.DeepEqual(got, want) { t.Fatalf("order = %v, want %v", got, want) }
      }

      func TestDarrowLifecycleShortCircuit(t *testing.T) {
        boom := errors.New("boom")
        called := false
        root := &Command{Use: "root"}
        child := &Command{Use: "child", PreRunE: func(*Command, []string) error { return boom }, Run: func(*Command, []string) { called = true }, PostRun: func(*Command, []string) { called = true }}
        root.AddCommand(child)
        _, _, err := executeCommandC(root, "child")
        if err != boom { t.Fatalf("error = %v, want %v", err, boom) }
        if called { t.Fatal("run or post hook called after pre-run failure") }
      }
      GO
      go test ./... -run 'TestDarrowLifecycle' -count=1
