id: orchestration-oss-express-links
invariant: ORCH-OSS-SECURITY-HARDENING
prompt: &task |-
  Work directly in this Express repository and implement the requested behavior. Do not commit or publish changes.

  Harden `res.links()` so caller-provided link relations and targets cannot break the RFC 8288 Link header structure. Serialize relation names as HTTP quoted strings, escaping `"` and `\\`. Reject relation names containing control characters. Reject link targets containing control characters, `<`, or `>` instead of emitting an ambiguous or injectable header. Existing valid links, multiple entries, repeated calls, and chaining behavior must remain unchanged. Throw a `TypeError` for invalid input before setting the header.

  Keep the implementation compatible with this repository's supported Node style. Add focused regression tests and run `npm test -- --grep 'res.links'` before finishing.
fixture:
  source: express-4.17.1
  files:
    AGENTS.md: |-
      This is a pinned evaluation checkout. Do not commit or publish changes.
      Work only on the requested Express behavior. Dependencies are preinstalled. Use `npx mocha --reporter dot test/res.links.js` for the focused suite.
  commit_files: true
  setup: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
  ticket:
    id: "1"
    title: Harden res.links header serialization
    body: *task
checks:
  - name: hidden Link header safety contract
    metric: escaped_defect
    run: |-
      node - <<'JS'
      var assert = require('assert');
      var response = require('./lib/response');

      function capture(existing) {
        var setCalls = 0;
        var value;
        var res = {
          get: function () { return existing || ''; },
          set: function (name, header) { setCalls++; value = header; return this; }
        };
        return { res: res, calls: function () { return setCalls; }, value: function () { return value; } };
      }

      var ok = capture('<https://example.test/old>; rel="old"');
      var returned = response.links.call(ok.res, {
        'next"page\\v2': 'https://example.test/items?page=2',
        last: 'https://example.test/items?page=9'
      });
      assert.strictEqual(returned, ok.res);
      assert.strictEqual(ok.value(), '<https://example.test/old>; rel="old", <https://example.test/items?page=2>; rel="next\\"page\\\\v2", <https://example.test/items?page=9>; rel="last"');

      [
        { links: {'bad\nrel': 'https://example.test/' } },
        { links: {next: 'https://example.test/>; rel="evil"' } },
        { links: {next: 'https://example.test/\rInjected: yes' } }
      ].forEach(function (sample) {
        var invalid = capture('');
        assert.throws(function () { response.links.call(invalid.res, sample.links); }, TypeError);
        assert.strictEqual(invalid.calls(), 0);
      });
      JS
  - name: focused upstream Express tests
    run: npx mocha --reporter dot test/res.links.js
