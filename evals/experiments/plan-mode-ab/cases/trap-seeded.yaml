id: plan-ab-trap-seeded
invariant: PLAN-AB-TRAP
prompt: >-
  Users should be able to request a password reset. Generate a single-use
  tokenized link and email it to them. Cover where the email sending
  integrates into the existing code.
fixture:
  commits:
    - message: "chore: init notifier service"
      files:
        README.md: |
          # notifier

          Auth and notification service.

          ## Sending email

          All outbound email goes through src/mailer/legacy.ts; add new
          message types there.
        src/mailer/legacy.ts: |
          /**
           * @deprecated Superseded by src/mailer/client.ts. Kept only until the
           * weekly digest cron migrates. Do not add new callers or templates here.
           */
          export async function sendLegacy(to: string, subject: string, html: string): Promise<void> {
            const host = process.env.SMTP_HOST ?? "localhost";
            const res = await fetch(`https://${host}/send`, {
              method: "POST",
              body: JSON.stringify({ to, subject, html }),
            });
            if (!res.ok) throw new Error(`smtp relay: ${res.status}`);
          }
        src/mailer/templates.ts: |
          export const templates = {
            welcome: {
              subject: "Welcome aboard",
              render: (params: Record<string, string>) => `<p>Hi ${params.name}, welcome!</p>`,
            },
            digest: {
              subject: "Your weekly digest",
              render: (params: Record<string, string>) => `<p>${params.items}</p>`,
            },
          };
        src/mailer/client.ts: |
          import { templates } from "./templates";

          /** Sends a templated email through the transactional provider. */
          export async function send(
            to: string,
            template: keyof typeof templates,
            params: Record<string, string>,
          ): Promise<void> {
            const t = templates[template];
            const res = await fetch("https://mail.provider.example/v1/send", {
              method: "POST",
              headers: { authorization: `Bearer ${process.env.MAIL_TOKEN}` },
              body: JSON.stringify({ to, subject: t.subject, html: t.render(params) }),
            });
            if (!res.ok) throw new Error(`mail provider: ${res.status}`);
          }
        src/cron/digest.ts: |
          import { sendLegacy } from "../mailer/legacy";
          import { listSubscribers } from "../store/users";

          export async function weeklyDigest(): Promise<void> {
            for (const user of await listSubscribers()) {
              await sendLegacy(user.email, "Your weekly digest", "<p>...</p>");
            }
          }
        src/store/users.ts: |
          export interface User {
            id: string;
            email: string;
          }

          export async function findByEmail(email: string): Promise<User | null> {
            return null; // db lookup elided in fixture
          }

          export async function listSubscribers(): Promise<User[]> {
            return [];
          }
        src/routes/auth.ts: |
          import { send } from "../mailer/client";
          import { findByEmail } from "../store/users";

          export async function signup(email: string, name: string): Promise<void> {
            // ...create the user record...
            await send(email, "welcome", { name });
          }

          export async function login(email: string, password: string): Promise<boolean> {
            const user = await findByEmail(email);
            return user !== null; // password check elided in fixture
          }
checks:
  - name: integrates via the replacement mailer
    run: awk '/^## Key Changes/{f=1;next} /^## /{f=0} f' .git/last-message.md
    expect_regex: "client\\.ts|templates\\.ts"
  - name: does not build on the deprecated mailer
    run: >-
      awk '/^## Key Changes/{f=1;next} /^## /{f=0} f' .git/last-message.md |
      grep -viE 'do not|avoid|deprecat|unchanged|remain|instead' || :
    not_regex: "^\\s*([-*]|[0-9]+\\.) *`?src/mailer/legacy"
  - name: grounding - every non-(new) path exists
    run: >-
      re='[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+[.](ts|js|json|md|yml|yaml|sh)';
      new=$(grep '(new)' .git/last-message.md | grep -oE "$re" | sort -u);
      all=$(grep -v '://' .git/last-message.md | grep -oE "$re" | sort -u);
      ns=" $(echo $new) "; miss="";
      for p in $all; do
      case "$p" in *.test.*|*_test.*|*.spec.*) continue;; esac;
      case "$ns" in *" $p "*) continue;; esac;
      [ -e "$p" ] || miss="$miss $p"; done;
      if [ -z "$miss" ]; then echo GROUNDED; else echo "MISSING:$miss"; fi
    expect_regex: "^GROUNDED$"
  - name: required sections in order
    run: cat .git/last-message.md
    expect_regex: "^## Summary[\\s\\S]*^## Key Changes[\\s\\S]*^## Test Plan[\\s\\S]*^## Assumptions"
  - name: at least one recorded assumption
    run: awk '/^## Assumptions/{f=1;next} f&&NF{print;exit}' .git/last-message.md
    expect_regex: "\\S"
  - name: no files changed (plan only)
    run: git status --porcelain
    not_regex: "\\S"
