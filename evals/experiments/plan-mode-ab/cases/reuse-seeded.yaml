id: plan-ab-reuse-seeded
invariant: PLAN-AB-REUSE
prompt: >-
  Make the webhook dispatcher resilient to transient endpoint failures:
  failed deliveries should be retried with exponential backoff and a bounded
  number of attempts, giving up cleanly after the last attempt.
fixture:
  commits:
    - message: "chore: init relay service"
      files:
        README.md: |
          # relay

          Receives internal events and delivers them to registered webhook
          endpoints. Background jobs keep the endpoint catalog in sync.
        src/lib/retry.ts: |
          export interface BackoffOptions {
            attempts: number;
            baseMs: number;
          }

          /** Retries fn with exponential backoff: baseMs, 2*baseMs, 4*baseMs, ... */
          export async function withBackoff<T>(fn: () => Promise<T>, opts: BackoffOptions): Promise<T> {
            let lastErr: unknown;
            for (let i = 0; i < opts.attempts; i++) {
              try {
                return await fn();
              } catch (err) {
                lastErr = err;
                await new Promise((r) => setTimeout(r, opts.baseMs * 2 ** i));
              }
            }
            throw lastErr;
          }
        src/jobs/upstream.ts: |
          export interface CatalogItem {
            kind: string;
            url: string;
          }

          export async function fetchUpstream(path: string): Promise<CatalogItem[]> {
            const res = await fetch(`https://catalog.internal${path}`);
            if (!res.ok) throw new Error(`upstream ${path}: ${res.status}`);
            return res.json();
          }
        src/jobs/sync.ts: |
          import { withBackoff } from "../lib/retry";
          import { fetchUpstream } from "./upstream";
          import { register } from "../webhooks/registry";

          export async function syncCatalog(): Promise<void> {
            const items = await withBackoff(() => fetchUpstream("/catalog"), {
              attempts: 5,
              baseMs: 200,
            });
            for (const item of items) register(item.kind, item.url);
          }
        src/webhooks/registry.ts: |
          const byKind = new Map<string, string[]>();

          export function register(kind: string, url: string): void {
            const urls = byKind.get(kind) ?? [];
            if (!urls.includes(url)) urls.push(url);
            byKind.set(kind, urls);
          }

          export function endpoints(kind: string): string[] {
            return byKind.get(kind) ?? [];
          }
        src/webhooks/dispatch.ts: |
          import { endpoints } from "./registry";

          export interface WebhookEvent {
            kind: string;
            payload: unknown;
          }

          export async function dispatch(event: WebhookEvent): Promise<void> {
            for (const url of endpoints(event.kind)) {
              const res = await fetch(url, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(event.payload),
              });
              if (!res.ok) {
                console.error(`dispatch to ${url} failed: ${res.status}`);
              }
            }
          }
checks:
  - name: reuses the planted backoff helper
    run: cat .git/last-message.md
    expect_regex: "withBackoff|lib/retry"
  - name: grounding - every non-(new) path exists
    run: >-
      re='[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+[.](ts|js|json|md|yml|yaml|sh)';
      new=$(grep '(new)' .git/last-message.md | grep -oE "$re" | sort -u);
      all=$(grep -v '://' .git/last-message.md | grep -oE "$re" | sort -u);
      ns=" $(echo $new) "; miss="";
      for p in $all; do
      case "$p" in *.test.*|*_test.*|*.spec.*) continue;; esac;
      case "$ns" in *" $p "*) continue;; esac;
      [ -e "$p" ] || miss="$miss $p"; done;
      if [ -z "$miss" ]; then echo GROUNDED; else echo "MISSING:$miss"; fi
    expect_regex: "^GROUNDED$"
  - name: required sections in order
    run: cat .git/last-message.md
    expect_regex: "^## Summary[\\s\\S]*^## Key Changes[\\s\\S]*^## Test Plan[\\s\\S]*^## Assumptions"
  - name: at least one recorded assumption
    run: awk '/^## Assumptions/{f=1;next} f&&NF{print;exit}' .git/last-message.md
    expect_regex: "\\S"
  - name: no files changed (plan only)
    run: git status --porcelain
    not_regex: "\\S"
