id: plan-ab-multi-subsystem
invariant: PLAN-AB-SPAN
prompt: >-
  Add a request timeout setting for upstream calls. It must be configurable
  in the config file, overridable with a CLI flag, and visible in the
  settings endpoint like the other settings.
fixture:
  commits:
    - message: "chore: init gateway"
      files:
        README.md: |
          # gateway

          Small reverse proxy: forwards requests to a configured upstream,
          exposes health and settings endpoints, configurable via file + CLI.
        src/config/schema.ts: |
          export interface Config {
            port: number;
            upstreamUrl: string;
            logLevel: "info" | "debug";
          }

          export function validate(raw: Record<string, unknown>): Config {
            const port = Number(raw.port ?? 8080);
            const upstreamUrl = String(raw.upstreamUrl ?? "");
            const logLevel = raw.logLevel === "debug" ? "debug" : "info";
            if (!upstreamUrl) throw new Error("config: upstreamUrl is required");
            if (!Number.isInteger(port) || port <= 0) throw new Error("config: invalid port");
            return { port, upstreamUrl, logLevel };
          }
        src/config/load.ts: |
          import { readFileSync } from "node:fs";
          import { validate, type Config } from "./schema";

          export function loadConfig(path: string): Config {
            const raw = JSON.parse(readFileSync(path, "utf8"));
            return validate(raw);
          }
        src/cli/flags.ts: |
          import type { Config } from "../config/schema";

          /** CLI flags win over the config file. */
          export function applyFlags(config: Config, argv: string[]): Config {
            const out = { ...config };
            for (let i = 0; i < argv.length; i++) {
              if (argv[i] === "--port") out.port = Number(argv[++i]);
              if (argv[i] === "--upstream") out.upstreamUrl = argv[++i];
              if (argv[i] === "--log-level" && argv[i + 1] === "debug") out.logLevel = argv[++i] as "debug";
            }
            return out;
          }
        src/server/proxy.ts: |
          import type { Config } from "../config/schema";

          export async function forward(config: Config, path: string, init: RequestInit): Promise<Response> {
            return fetch(`${config.upstreamUrl}${path}`, init);
          }
        src/server/routes.ts: |
          import type { Config } from "../config/schema";
          import { forward } from "./proxy";

          export function handle(config: Config, req: Request): Promise<Response> | Response {
            const url = new URL(req.url);
            if (url.pathname === "/healthz") return new Response("ok");
            if (url.pathname === "/settings") {
              const { port, logLevel } = config;
              return Response.json({ port, logLevel, upstream: new URL(config.upstreamUrl).host });
            }
            return forward(config, url.pathname, { method: req.method, body: req.body });
          }
checks:
  - name: touches the config schema
    run: cat .git/last-message.md
    expect_regex: "schema\\.ts"
  - name: touches the CLI flags
    run: cat .git/last-message.md
    expect_regex: "flags\\.ts"
  - name: touches the settings route
    run: cat .git/last-message.md
    expect_regex: "routes\\.ts"
  - name: grounding - every non-(new) path exists
    run: >-
      re='[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+[.](ts|js|json|md|yml|yaml|sh)';
      new=$(grep '(new)' .git/last-message.md | grep -oE "$re" | sort -u);
      all=$(grep -v '://' .git/last-message.md | grep -oE "$re" | sort -u);
      ns=" $(echo $new) "; miss="";
      for p in $all; do
      case "$p" in *.test.*|*_test.*|*.spec.*) continue;; esac;
      case "$ns" in *" $p "*) continue;; esac;
      [ -e "$p" ] || miss="$miss $p"; done;
      if [ -z "$miss" ]; then echo GROUNDED; else echo "MISSING:$miss"; fi
    expect_regex: "^GROUNDED$"
  - name: required sections in order
    run: cat .git/last-message.md
    expect_regex: "^## Summary[\\s\\S]*^## Key Changes[\\s\\S]*^## Test Plan[\\s\\S]*^## Assumptions"
  - name: at least one recorded assumption
    run: awk '/^## Assumptions/{f=1;next} f&&NF{print;exit}' .git/last-message.md
    expect_regex: "\\S"
  - name: no files changed (plan only)
    run: git status --porcelain
    not_regex: "\\S"
