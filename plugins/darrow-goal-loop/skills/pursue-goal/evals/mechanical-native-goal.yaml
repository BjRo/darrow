id: goal-preflight-mechanical-native-goal
invariant: AGL-P1,AGL-P4,AGL-R1,AGL-L1,AGL-L2,AGL-S3
prompt: >-
  /pursue-goal Alphabetize the three entries in NOTES.md. On Codex, invoke the
  $pursue-goal skill. Acceptance is exact alphabetical order under the existing
  heading, covered completely by bash check.sh. Select and apply the `fast`
  policy profile. Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for NOTES.md changes.
        NOTES.md: |
          # Notes

          - zebra
          - alpha
          - maple
        check.sh: |
          #!/usr/bin/env bash
          printf '%s\n' '# Notes' '' '- alpha' '- maple' '- zebra' >.git/expected-notes
          cmp -s .git/expected-notes NOTES.md
checks:
  - name: deterministic prose transformation is correct
    run: bash check.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: mechanical fast route is selected
    expect_regex: "template\\tmechanical[\\s\\S]*profile\\tfast[\\s\\S]*selected_route\\tcodex\\topenai\\tgpt-5\\.6-terra\\tlow"
  - name: selected route is effective
    expect_regex: "effective_route\\tcodex\\topenai\\tgpt-5\\.6-terra\\tlow[\\s\\S]*route_verified\\ttrue"
  - name: matching fast route uses a zero-child host boundary
    expect_regex: "launch_boundary\\t(?:same_thread|host_api)[\\s\\S]*evaluation_child_invocations\\t0"
  - name: final record reports no human stop
    expect_regex: "evaluation_human_interruptions\\t0"
