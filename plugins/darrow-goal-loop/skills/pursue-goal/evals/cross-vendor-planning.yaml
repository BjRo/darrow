id: goal-loop-cross-vendor-planning
invariant: AGL-R1,AGL-R3,AGL-R5,AGL-X2,AGL-X3,AGL-X4,AGL-X5,AGL-X6,AGL-E1,AGL-E2
prompt: >-
  Explicitly invoke /pursue-goal (the $pursue-goal skill on Codex) to add the approved optional `tag` string field
  to config.schema.json and document it in API.md. Use Claude at deep effort
  for the planner and Codex standard for execution; stop if either pinned route
  is unavailable. The approved compatibility rule is that omitting tag keeps
  all current behavior. Validate with bash check.sh and keep everything local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Schema changes require planning and `bash check.sh`.
        config.schema.json: |
          {"type":"object","properties":{"enabled":{"type":"boolean"}}}
        API.md: |
          # Configuration

          `enabled` is optional.
        check.sh: |
          #!/usr/bin/env bash
          node -e 'const s=require("./config.schema.json"); if(s.properties.tag.type!=="string") process.exit(1)'
          grep -F '`tag`' API.md >/dev/null
checks:
  - name: schema and documentation satisfy the approved plan
    run: bash check.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: pinned planner identity is honest
    expect_regex: "route\\tplanner\\tclaude\\tanthropic\\t"
  - name: pinned execution route is Codex
    expect_regex: "route\\texecutor\\tcodex\\topenai\\t"
  - name: local result is independently verified
    expect_regex: "status\\tverified[\\s\\S]*verification\\trequired\\tpass"
