id: goal-preflight-bounded-native-goal
invariant: AGL-P1,AGL-P2,AGL-P4,AGL-R1,AGL-L1,AGL-L2,AGL-L6,AGL-S3
prompt: >-
  /adaptive-goal Add an exported double(value) function to src/math.js. On Codex,
  invoke the $adaptive-goal skill. Add focused tests for zero and a negative
  number. Acceptance is that double returns exactly two times its numeric input
  and bash test.sh passes. The evaluation harness reports the active route in
  its condition; select and apply the policy route rather than pinning it. Keep
  the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash test.sh` for JavaScript changes.
        package.json: '{"type":"module"}'
        src/math.js: |
          export const identity = (value) => value;
        test/math.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity } from "../src/math.js";
          test("identity", () => assert.equal(identity(-2), -2));
        test.sh: |
          #!/usr/bin/env bash
          node --test test/math.test.js
checks:
  - name: behavior is implemented
    run: >-
      node --input-type=module -e
      "import('./src/math.js').then(({double}) => {
      if (double(0) !== 0 || double(-4) !== -8) process.exit(1) })"
  - name: focused tests are durable
    run: >-
      grep -F 'double(0)' test/math.test.js >/dev/null &&
      grep -F 'double(-' test/math.test.js >/dev/null && bash test.sh >/dev/null
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: preflight record is emitted
    expect_regex: "format\\tdarrow-native-goal-preflight-v4"
  - name: bounded routine route is selected
    expect_regex: "workflow\\timplement-feature[\\s\\S]*risk\\troutine[\\s\\S]*profile\\troutine[\\s\\S]*selected_route\\tcodex\\topenai\\tgpt-5\\.6-terra\\tmedium"
  - name: selected route is effective
    expect_regex: "effective_route\\tcodex\\topenai\\tgpt-5\\.6-terra\\tmedium[\\s\\S]*route_verified\\ttrue"
  - name: differing policy route uses one observable goal runner
    expect_regex: "route_applied_by\\tnative-subagent[\\s\\S]*launch_boundary\\tnative_subagent[\\s\\S]*evaluation_child_invocations\\t1"
  - name: no custom role orchestration remains
    not_regex: "route\\t(planner|executor|verifier|repair)\\t"
  - name: no human stop was needed
    expect_regex: "evaluation_human_interruptions\\t0"
  - name: routine verification gate is reported
    expect_regex: "verification_gate\\troutine"
