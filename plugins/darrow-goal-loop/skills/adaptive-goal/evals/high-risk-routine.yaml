id: goal-preflight-high-risk-routine
invariant: AGL-P1,AGL-P4,AGL-P7,AGL-R1,AGL-L1,AGL-L2,AGL-S3
prompt: >-
  /adaptive-goal Change the exported sessionCookieOptions in auth-config.js so
  sameSite is exactly "strict" instead of "lax". On Codex, invoke the
  $adaptive-goal skill. This is a security boundary where the cost of a mistake
  is high, but the requested implementation is clear, localized, and fully
  specified. Add focused evidence for the new value and preserve the other
  cookie options. Acceptance is that bash test.sh passes. Select and apply the
  policy route rather than pinning it. Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash test.sh` for authentication configuration changes.
        auth-config.js: |
          export const sessionCookieOptions = Object.freeze({
            httpOnly: true,
            secure: true,
            sameSite: "lax",
          });
        auth-config.test.js: |
          import assert from "node:assert/strict";
          import { sessionCookieOptions } from "./auth-config.js";

          assert.equal(sessionCookieOptions.httpOnly, true);
          assert.equal(sessionCookieOptions.secure, true);
          assert.equal(sessionCookieOptions.sameSite, "lax");
        package.json: '{"type":"module"}'
        test.sh: |
          #!/usr/bin/env bash
          node auth-config.test.js
checks:
  - name: cookie behavior is changed and preserved
    run: >-
      node --input-type=module -e
      "import('./auth-config.js').then(({sessionCookieOptions}) => {
      if (sessionCookieOptions.sameSite !== 'strict' ||
      sessionCookieOptions.httpOnly !== true ||
      sessionCookieOptions.secure !== true) process.exit(1) })"
  - name: focused evidence covers the strict value
    run: grep -F '"strict"' auth-config.test.js >/dev/null && bash test.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: high risk uses the routine coding route
    expect_regex: "format\\tdarrow-native-goal-preflight-v4[\\s\\S]*workflow\\tchange-feature[\\s\\S]*risk\\thigh[\\s\\S]*profile\\troutine[\\s\\S]*selected_route\\tcodex\\topenai\\tgpt-5\\.6-terra\\tmedium"
  - name: selected route is effective
    expect_regex: "effective_route\\tcodex\\topenai\\tgpt-5\\.6-terra\\tmedium[\\s\\S]*route_verified\\ttrue"
  - name: high verification gate is reported
    expect_regex: "verification_gate\\thigh"
  - name: no human stop was needed
    expect_regex: "evaluation_human_interruptions\\t0"
