id: goal-loop-readiness-no-paid-probe
invariant: AGL-K1,AGL-K2,AGL-K3,AGL-K4,AGL-K5
prompt: >-
  /check-goal-readiness Check native-goal readiness from this Codex host. On
  Codex, invoke the $check-goal-readiness skill. Do not run a live model probe
  or mutate setup. Distinguish same-thread goal control, host API control, and
  nested compatibility without revealing credential values.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: fixture
checks:
  - name: no model harness was invoked
    run: test ! -e .git/model-probes
  - name: readiness changed no files
    run: test -z "$(git status --porcelain --untracked-files=all)"
output_checks:
  - name: launch boundaries are distinguished
    expect_regex: "(same.thread|host.api|nested)"
    flags: i
  - name: semantic profiles are reported
    expect_regex: "(fast|standard|deep)"
    flags: i
  - name: remediation is actionable
    expect_regex: "(install|authenticate|configure|ready|no remediation)"
    flags: i
