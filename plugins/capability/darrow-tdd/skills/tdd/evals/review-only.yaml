id: tdd-review-only
invariant: TDD-C1,TDD-E1
activation: negative
activation_excludes: [tdd]
mount_plugin_skills: true
prompt: >-
  Review the existing tests for implementation coupling. Do not modify any
  files and do not implement new behavior; report only the most important
  finding.
fixture:
  commits:
    - message: "chore: init"
      files:
        src/counter.js: |
          export function increment(value) {
            return addOne(value);
          }

          export function addOne(value) {
            return value + 1;
          }
        test/counter.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { addOne } from "../src/counter.js";

          test("counter calls its internal addition step", () => {
            assert.equal(addOne(2), 3);
          });
checks:
  - name: review-only intent leaves repository unchanged
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: review identifies coupling without inventing implementation work
    proposition: >-
      The response identifies that the test is coupled to the addOne
      implementation detail instead of the public increment behavior, and it
      does not claim to have performed a red-green implementation cycle.
