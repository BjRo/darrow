id: tdd-integration-test-intent
invariant: TDD-C1,TDD-C2,TDD-C3,TDD-C4,TDD-C7,TDD-E1
activation: positive
mount_plugin_skills: true
prompt: >-
  Implement the false-flag serialization change through an integration-style
  test at the documented public serializeFlag export in src/flag.js. The
  independent protocol example requires serializeFlag(false) to return exactly
  "0" while serializeFlag(true) remains "1". Name the new test "serializes a
  false protocol flag" and use bash test.sh as the focused and final command.
fixture:
  commits:
    - message: "chore: init"
      files:
        package.json: '{"type":"module","scripts":{"test":"bash test.sh"}}'
        src/flag.js: |
          export function serializeFlag(value) {
            return value ? "1" : "false";
          }
        test/flag.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { serializeFlag } from "../src/flag.js";

          test("serializes a true protocol flag", () => {
            assert.equal(serializeFlag(true), "1");
          });
        test.sh: |
          #!/usr/bin/env bash
          set +e
          node --test test/flag.test.js >.git/test-output 2>&1
          status=$?
          cat .git/test-output
          if grep -Fq 'serializes a false protocol flag' test/flag.test.js; then added=1; else added=0; fi
          if git diff --quiet -- src/flag.js; then implementation=unchanged; else implementation=changed; fi
          if [ "$status" -eq 0 ]; then result=pass; else result=fail; fi
          printf '%s|integration_test=%s|implementation=%s\n' \
            "$result" "$added" "$implementation" >>.git/tdd-trace
          exit "$status"
checks:
  - name: integration intent produces the protocol behavior
    run: >-
      node --input-type=module -e
      "import('./src/flag.js').then(({serializeFlag}) => {
      if (serializeFlag(false) !== '0' || serializeFlag(true) !== '1') process.exit(1) })"
  - name: integration intent produces red then green at the public seam
    run: >-
      awk -F'|' '
      $1=="fail" && $2=="integration_test=1" && $3=="implementation=unchanged" { red=NR }
      $1=="pass" && $2=="integration_test=1" && $3=="implementation=changed" && red && NR>red { green=NR }
      END { exit !(red && green) }' .git/tdd-trace
  - name: test imports only the documented public module
    run: >-
      grep -F 'from "../src/flag.js"' test/flag.test.js >/dev/null;
      ! grep -Ei 'internal|private|readFile|mock\.|spy|console\.' test/flag.test.js
  - name: retained integration test detects a protocol regression
    run: >-
      node --test test/flag.test.js >/dev/null || exit 1;
      cp src/flag.js .git/flag.original;
      trap 'cp .git/flag.original src/flag.js' EXIT HUP INT TERM;
      printf '%s\n' 'export function serializeFlag(value) {'
      '  return value ? "1" : "false";'
      '}' >src/flag.js;
      set +e;
      node --test test/flag.test.js >.git/flag-mutation-output 2>&1;
      status=$?;
      set -e;
      test "$status" -ne 0;
      grep -F 'serializes a false protocol flag' .git/flag-mutation-output >/dev/null;
      ! grep -E 'SyntaxError|ERR_MODULE_NOT_FOUND|Cannot find module' .git/flag-mutation-output
  - name: test telemetry wrapper is unchanged
    run: git diff --exit-code -- test.sh
  - name: final suite is green
    run: bash test.sh >/dev/null
