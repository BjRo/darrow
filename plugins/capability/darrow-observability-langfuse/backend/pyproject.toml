[project]
name = "darrow-observability-langfuse"
version = "0.1.0"
description = "Codex rollout reconstruction and Langfuse export backend"
requires-python = ">=3.10,<3.14"
dependencies = [
  "filelock>=3.20,<4",
  "langfuse>=4.0,<5",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "hypothesis>=6.138,<7",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-protobuf>=6.32,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["src/darrow_observability_langfuse"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["B", "C4", "C90", "E4", "E7", "E9", "F", "I", "N", "RUF", "SIM", "UP"]
mccabe.max-complexity = 5

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["darrow_observability_langfuse"]

[tool.coverage.report]
show_missing = true
skip_covered = false
