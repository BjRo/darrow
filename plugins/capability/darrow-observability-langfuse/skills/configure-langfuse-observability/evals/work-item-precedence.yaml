id: langfuse-observability-work-item-precedence
activation: positive
invariant: OLF-P4
mount_plugin_skills: true
prompt: >-
  My branch is feat/issue-45-langfuse, but DARROW_LANGFUSE_WORK_ITEM_ID is set
  to TEAM-7. Which work-item value will the trace contain? Explain the fallback
  for a detached HEAD and do not contact or mutate any tracker.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# sample repository"
checks:
  - name: precedence explanation has no repository effects
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: configured value wins over inferred branch value
    proposition: >-
      The response says the trace contains TEAM-7 because the configured
      DARROW_LANGFUSE_WORK_ITEM_ID takes precedence over the issue-45 value
      inferred from the branch.
  - name: detached head produces no inferred value
    proposition: >-
      The response explains that detached HEAD provides no branch-inferred
      work-item identifier and, when no explicit or configured value exists,
      the trace has no darrow.work_item_id. It does not invent an identifier or
      contact a tracker.
