id: langfuse-observability-unrelated-monitoring
activation: negative
invariant: OLF-P1
mount_plugin_skills: true
prompt: >-
  Add Datadog host CPU metrics to this service. First tell me whether the
  requested repository has enough implementation context.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# empty service shell"
checks:
  - name: unrelated monitoring request stays read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: response does not redirect to Codex Langfuse tracing
    not_regex: "DARROW_LANGFUSE|darrow-observability-langfuse|Codex Stop hook"
    flags: i
semantic_output_checks:
  - name: response identifies missing service context
    proposition: >-
      The response explains that the repository does not contain enough service
      implementation, runtime, deployment, or existing observability context
      to add Datadog host CPU metrics, and requests the missing bounded context
      without redirecting the user to Codex or Langfuse observability.
