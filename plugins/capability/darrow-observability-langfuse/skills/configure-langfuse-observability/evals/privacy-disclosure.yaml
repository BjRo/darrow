id: langfuse-observability-privacy-disclosure
activation: positive
invariant: OLF-P5
mount_plugin_skills: true
prompt: >-
  Before I enable Codex observability, what data can this plugin send outside
  my machine, and what privacy controls are on by default? Do not change files
  or configure anything yet.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# private project"
checks:
  - name: privacy explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: answer distinguishes the two privacy opt-ins
    proposition: >-
      The response says tracing or export defaults off and raw-content capture
      separately defaults off. It makes clear that enabling tracing does not by
      itself enable raw-content capture.
  - name: answer identifies eligible raw content
    proposition: >-
      The response says that opting into raw-content capture can export prompts,
      reasoning, assistant text, and both tool inputs and tool outputs.
  - name: answer states the residual privacy boundary
    proposition: >-
      The response warns that sensitive-data redaction is best effort and that
      exported data may be stored by Langfuse subject to the destination's
      access and retention controls.
