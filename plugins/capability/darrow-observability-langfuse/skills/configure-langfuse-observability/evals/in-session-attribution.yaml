id: langfuse-observability-in-session-attribution
activation: positive
invariant: OLF-P3,OLF-P4
mount_plugin_skills: true
prompt: >-
  I use one Codex conversation for several topics. Without restarting Codex or
  editing configuration, show me how to attribute the current and following
  turns to ISSUE-60, later make a run of turns explicitly unattributed, and
  finally return to automatic branch inference. Do not contact a tracker.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# sample repository"
checks:
  - name: attribution guidance has no repository effects
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: answer gives the exact set directive
    expect_regex: "(?:^|\\n)@darrow\\.attribution set ISSUE-60(?:\\r?\\n|$)"
  - name: answer gives the exact clear directive
    expect_regex: "(?:^|\\n)@darrow\\.attribution clear(?:\\r?\\n|$)"
  - name: answer gives the exact automatic directive
    expect_regex: "(?:^|\\n)@darrow\\.attribution auto(?:\\r?\\n|$)"
  - name: answer preserves the tracker boundary
    not_regex: "(gh|jira|ticket) (issue |api |get |edit |comment |close |create )"
    flags: i
semantic_output_checks:
  - name: answer explains directive scope
    proposition: >-
      A user following the response would understand that the directives are
      persistent mode changes beginning in the prompt that contains them: set
      establishes ISSUE-60 attribution, clear begins an ongoing unattributed
      run, and auto restores ongoing automatic attribution. It is sufficient to
      say that each directive is the first non-empty line of its prompt and to
      describe the clear/restore sequence; the response need not repeat
      "current and subsequent turns" after every directive. Fail this check if
      the response describes any directive as one-turn-only, applies it only to
      later turns, or leaves persistence genuinely ambiguous.
  - name: answer explains session segmentation and correlation
    proposition: >-
      The response explains that every set, clear, or auto directive begins a
      new attribution epoch represented as a native Langfuse session segment,
      while codex.thread_id remains the stable conversation key across those
      segments. Naming epochs and the field without explaining these roles is
      insufficient.
