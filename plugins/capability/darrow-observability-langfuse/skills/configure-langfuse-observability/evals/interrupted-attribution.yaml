id: langfuse-observability-interrupted-attribution
activation: positive
invariant: OLF-P3,OLF-P4
mount_plugin_skills: true
prompt: >-
  Explain how Darrow Langfuse attribution should handle a Codex turn that was
  interrupted before Stop. The branch stayed on feat/issue-45-observability,
  automatic branch inference was active, no attribution directive was used,
  and its provisional snapshot records the same issue-45 attribution source
  and value as the turns before and after it. Also explain what happens if the interrupted
  turn has neither provisional nor final attribution evidence. Keep this
  read-only: do not run a hook or edit configuration.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# sample repository"
checks:
  - name: interruption diagnosis stays read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: matching interrupted attribution preserves the epoch
    proposition: >-
      The fixture establishes matching branch-inferred issue-45 snapshots for
      the interrupted turn and its neighbors. The response uses the prompt-time
      provisional snapshot when Stop is absent and describes a shared epoch and
      native Langfuse session without interruption creating a new epoch. Those
      statements together suffice; it need not restate the supplied snapshot
      equality, repeat issue-45 in each sentence, or separately say "all three
      turns." A conditional explanation of matching snapshots is valid here.
      Fail if it discards provisional evidence, starts a new epoch because of
      interruption, or explicitly excludes the matching interrupted turn.
  - name: answer preserves the conversation correlation key
    proposition: >-
      The response identifies codex.thread_id as a stable conversation-level
      key for finding or correlating turns despite session grouping or an
      ungrouped gap. Calling it the stable conversation key and explaining
      correlation across the gap suffices; no separate sentence about multiple
      session segments is required. Merely naming the field without its role,
      treating it as changing per epoch, or denying cross-group correlation
      fails.
  - name: answer leaves a genuinely unknown turn ungrouped
    proposition: >-
      The response explains that an interrupted turn with neither provisional
      nor final attribution evidence remains ungrouped, is not attached to a
      Langfuse session, and does not create an attribution epoch. Those outcomes
      suffice without a separate sentence forbidding inference from surrounding
      turns. Fail if it instead supplies a work item or epoch from the neighbors
      despite the missing evidence, or contradicts any of those outcomes.
