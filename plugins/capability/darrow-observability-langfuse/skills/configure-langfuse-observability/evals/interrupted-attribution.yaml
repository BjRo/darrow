id: langfuse-observability-interrupted-attribution
activation: positive
invariant: OLF-P3,OLF-P4
mount_plugin_skills: true
prompt: >-
  Explain how Darrow Langfuse attribution should handle a Codex turn that was
  interrupted before Stop. The branch stayed on feat/issue-45-observability,
  no attribution directive was used, and the turns before and after the
  interruption belong to issue-45. Also explain what happens if the interrupted
  turn has neither provisional nor final attribution evidence. Keep this
  read-only: do not run a hook or edit configuration.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# sample repository"
checks:
  - name: interruption diagnosis stays read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: answer uses provisional evidence for an interrupted turn
    expect_regex: "interrupt[\\s\\S]{0,240}(provisional|prompt-time)[\\s\\S]{0,240}(snapshot|attribution|evidence)"
    flags: i
semantic_output_checks:
  - name: matching interrupted attribution preserves the epoch
    proposition: >-
      The response explicitly explains that the interrupted turn's provisional
      issue-45 attribution keeps it in the same attribution epoch and native
      Langfuse session segment as the surrounding issue-45 turns. Merely saying
      that the provisional snapshot governs the interrupted turn, without
      stating the shared epoch or session result, does not satisfy this check.
  - name: answer preserves the conversation correlation key
    proposition: >-
      The response identifies codex.thread_id as the stable conversation key
      used to find or correlate turns across Langfuse session segments and any
      ungrouped gap. Merely naming the field without explaining its
      conversation-level role does not satisfy this check.
  - name: answer leaves a genuinely unknown turn ungrouped
    proposition: >-
      The response explains that an interrupted turn with neither provisional
      nor final attribution evidence remains ungrouped, is not attached to a
      Langfuse session, and does not create an attribution epoch. It must not
      infer attribution for that turn from the surrounding issue-45 turns.
