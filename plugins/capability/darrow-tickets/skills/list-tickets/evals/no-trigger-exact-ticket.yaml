id: list-tickets-no-trigger-exact-ticket
invariant: TM-L1,SE-C9,SE-C10,SE-C11
activation: negative
mount_plugin_skills: true
prompt: Read ticket #21 and show its authoritative body; do not list other tickets.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      mkdir -p "$d"
      echo "$*" >> "$d/calls"
      find_flag() {
        want=$1; shift
        prev=""
        for arg in "$@"; do
          if [ "$prev" = "$want" ]; then printf '%s' "$arg"; return 0; fi
          prev=$arg
        done
        return 1
      }
      if [ "$1" = "api" ]; then
        case "$2" in
          */issues/21/parent) echo "gh: No parent issue found (HTTP 404)" >&2; exit 1 ;;
          */issues/21/dependencies/blocked_by) echo '[[]]'; exit 0 ;;
          *) echo "mock gh: unsupported api call: $*" >&2; exit 1 ;;
        esac
      fi
      case "$1 $2" in
        "repo view") echo '{"url":"https://github.test/o/r"}' ;;
        "issue view")
          json=$(find_flag --json "$@")
          case "$json" in
            number,state,title,url,labels)
              printf '%s\n' '{"number": 21, "state": "OPEN", "title": "Exact ticket", "url": "https://github.test/o/r/issues/21", "labels": [{"name": "bug"}]}'
              ;;
            body) printf '%s\n' '{"body": "EXACT-TICKET-BODY-21\n"}' ;;
            *) echo "mock gh: unsupported --json set: $json" >&2; exit 1 ;;
          esac
          ;;
        *) echo "mock gh: unsupported: $*" >&2; exit 1 ;;
      esac
  setup: |
    git remote add origin https://github.test/o/r.git
checks:
  - name: list operation is not used
    run: test ! -f .git/fixture-gh/calls || ! grep -Eq 'issue list' .git/fixture-gh/calls
  - name: exact-ticket retrieval remains read-only
    run: >-
      test ! -f .git/fixture-gh/calls ||
      ! grep -Eq '(^| )(create|edit|comment|close|reopen|delete|transfer|fork)( |$)|(^| )(-X|--method) (POST|PUT|PATCH|DELETE)( |$)'
      .git/fixture-gh/calls
