id: list-tickets-state-asked
invariant: TM-L1,TM-L2,TM-L3,SE-C9,SE-C10,SE-C11
activation: competition
mount_plugin_skills: true
prompt: List the closed tickets about export.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .git/fixture-gh
    printf 'bug\nenhancement\ndocumentation\n' > .git/fixture-gh/labels
    printf '#8 closed  CSV export drops the header row (bug)\n' > .git/fixture-gh/list
checks:
  - name: authoritative closed-ticket result is relayed without semantic changes
    run: >-
      sed -E 's/^(#[0-9]+ (open|closed))[[:blank:]]+/\1  /; s/[[:blank:]]*$//'
      .git/last-message.md
    expect_exact: |-
      backend: github
      #8 closed  CSV export drops the header row (bug)
      total: 1 (state=closed, search="export")
  - name: closed state passed through
    run: cat .git/fixture-gh/calls
    expect_regex: "issue list --state closed"
  - name: topic filter applied
    run: cat .git/fixture-gh/calls
    expect_regex: "issue list.*export"
    flags: i
  - name: nothing mutated
    run: cat .git/fixture-gh/calls
    not_regex: "(^| )(create|edit|comment|close|reopen|delete|transfer|fork)( |$)|(^| )(-X|--method) (POST|PUT|PATCH|DELETE)( |$)"
