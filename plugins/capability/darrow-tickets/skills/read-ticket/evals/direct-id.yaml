id: read-ticket-direct-id
invariant: TM-R1,TM-R2,TM-R3
activation: positive
mount_plugin_skills: true
prompt: "Read ticket #12 and return the authoritative ticket without changing it."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    uv: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)"
      case " $* " in
        *" darrow-ticket "*) printf '%s\n' "$*" >>"$d/fixture-ticket-cli-calls" ;;
      esac
      real_uv=$(awk '!/fixture-bin/ && !seen {print; seen=1}' "$d/fixture-uv-paths")
      exec "$real_uv" "$@"
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      mkdir -p "$d"
      echo "$*" >> "$d/calls"
      case "$1" in
        issue) printf 'issue view %s %s %s\n' "$3" "$4" "$5" >> "$d/protocol" ;;
        api) printf 'api %s\n' "$2" >> "$d/protocol" ;;
        repo) printf 'repo view\n' >> "$d/protocol" ;;
        *) printf 'unexpected %s\n' "$1" >> "$d/protocol" ;;
      esac
      find_flag() {
        want=$1; shift
        prev=""
        for arg in "$@"; do
          if [ "$prev" = "$want" ]; then printf '%s' "$arg"; return 0; fi
          prev=$arg
        done
        return 1
      }
      if [ "$1" = "api" ]; then
        case "$2" in
          */issues/12/parent) printf '%s\n' '{"number":7,"html_url":"https://github.test/o/r/issues/7"}' ;;
          */issues/12/dependencies/blocked_by) echo '[[{"number":3}]]' ;;
          *) echo "mock gh: unsupported api call: $*" >&2; exit 1 ;;
        esac
        exit 0
      fi
      case "$1 $2" in
        "repo view")
          json=$(find_flag --json "$@")
          if [ "$json" = "url" ]; then echo '{"url":"https://github.test/o/r"}'; else echo '{"hasIssuesEnabled":true}'; fi
          ;;
        "issue view")
          json=$(find_flag --json "$@")
          case "$json" in
            number,state,title,url,labels)
              printf '%s\n' '{"number": 12, "state": "OPEN", "title": "Preserve exact ticket bodies", "url": "https://github.test/o/r/issues/12", "labels": [{"name": "enhancement"}, {"name": "area: tickets"}]}'
              ;;
            body)
              printf '%s\n' '{"body": "## Motivation\n\nCallers need TOKEN-ALPHA verbatim.\n\n## Acceptance criteria\n\n- Preserve TOKEN-BETA exactly.\n"}'
              ;;
            *) echo "mock gh: unsupported --json set: $json" >&2; exit 1 ;;
          esac
          ;;
        *) echo "mock gh: unsupported: $*" >&2; exit 1 ;;
      esac
  setup: |
    which -a uv > .git/fixture-uv-paths
    git remote add origin https://github.test/o/r.git
checks:
  - name: successful CLI output is relayed byte-for-byte
    run: cat .git/last-message.md
    expect_exact: |-
      backend: github
      ticket-token: 12
      #12 open — Preserve exact ticket bodies
      https://github.test/o/r/issues/12
      labels: enhancement, area: tickets
      parent: #7
      depends-on: #3
      ## body
      ## Motivation

      Callers need TOKEN-ALPHA verbatim.

      ## Acceptance criteria

      - Preserve TOKEN-BETA exactly.
  - name: exact ticket metadata and body are returned
    run: cat .git/last-message.md
    expect_regex: "ticket-token: 12[\\s\\S]*#12 open.*Preserve exact ticket bodies[\\s\\S]*https://github.test/o/r/issues/12[\\s\\S]*TOKEN-ALPHA[\\s\\S]*TOKEN-BETA"
  - name: native relations are returned
    run: cat .git/last-message.md
    expect_regex: "parent: #7[\\s\\S]*depends-on: #3"
  - name: bundled CLI owns the one retrieval
    run: cat .git/fixture-ticket-cli-calls
    expect_regex: "darrow-ticket get #?12( --provider github)?$"
  - name: retrieval uses only the bundled read protocol
    run: cat .git/fixture-gh/protocol
    expect_exact: |-
      issue view 12 --json number,state,title,url,labels
      issue view 12 --json body
      api repos/{owner}/{repo}/issues/12/parent
      repo view
      api repos/{owner}/{repo}/issues/12/dependencies/blocked_by
