id: read-ticket-indirect-url
invariant: TM-R1,TM-R3
activation: competition
mount_plugin_skills: true
prompt: >-
  What does https://github.test/o/r/issues/21 ask for? Retrieve that exact
  ticket from the current project and show its authoritative contents.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    bash: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)"
      case "${1:-}" in
        */darrow-tickets/*/bin/ticket)
          printf '%s\n' "$*" >>"$d/fixture-ticket-cli-calls"
          ;;
      esac
      exec /bin/bash "$@"
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      mkdir -p "$d"
      echo "$*" >> "$d/calls"
      case "$1" in
        repo) printf 'repo view %s %s\n' "$3" "$4" >> "$d/protocol" ;;
        issue) printf 'issue view %s %s %s\n' "$3" "$4" "$5" >> "$d/protocol" ;;
        api) printf 'api %s\n' "$2" >> "$d/protocol" ;;
        *) printf 'unexpected %s\n' "$1" >> "$d/protocol" ;;
      esac
      find_flag() {
        want=$1; shift
        prev=""
        for arg in "$@"; do
          if [ "$prev" = "$want" ]; then printf '%s' "$arg"; return 0; fi
          prev=$arg
        done
        return 1
      }
      if [ "$1" = "api" ]; then
        case "$2" in
          */issues/21/parent) echo "gh: No parent issue found (HTTP 404)" >&2; exit 1 ;;
          */issues/21/dependencies/blocked_by) exit 0 ;;
          *) echo "mock gh: unsupported api call: $*" >&2; exit 1 ;;
        esac
      fi
      case "$1 $2" in
        "repo view") echo "https://github.test/o/r" ;;
        "issue view")
          json=$(find_flag --json "$@")
          case "$json" in
            number,state,title,url,labels)
              jq=$(find_flag --jq "$@")
              case "$jq" in
                *ticket-token*) printf 'ticket-token: 21\n' ;;
              esac
              printf '#21 closed — Canonical URL intake\nhttps://github.test/o/r/issues/21\nlabels: (none)\n'
              ;;
            body) printf 'The exact URL ticket body contains URL-TOKEN-21.\n' ;;
            *) echo "mock gh: unsupported --json set: $json" >&2; exit 1 ;;
          esac
          ;;
        *) echo "mock gh: unsupported: $*" >&2; exit 1 ;;
      esac
  setup: |
    git remote add origin https://github.test/o/r.git
checks:
  - name: URL ticket output is relayed byte-for-byte
    run: cat .git/last-message.md
    expect_exact: |-
      backend: github
      ticket-token: 21
      #21 closed — Canonical URL intake
      https://github.test/o/r/issues/21
      labels: (none)
      parent: (none)
      depends-on: (none)
      ## body
      The exact URL ticket body contains URL-TOKEN-21.
  - name: canonical URL is verified against the current project
    run: cat .git/fixture-gh/calls
    expect_regex: "repo view --json url"
  - name: URL resolves to the exact ticket body
    run: cat .git/last-message.md
    expect_regex: "ticket-token: 21[\\s\\S]*#21 closed.*Canonical URL intake[\\s\\S]*URL-TOKEN-21"
  - name: bundled CLI owns the URL retrieval
    run: cat .git/fixture-ticket-cli-calls
    expect_regex: "/bin/ticket get https://github.test/o/r/issues/21$"
  - name: URL retrieval uses only the bundled read protocol
    run: cat .git/fixture-gh/protocol
    expect_exact: |-
      repo view --json url
      issue view 21 --json number,state,title,url,labels
      issue view 21 --json body
      api repos/{owner}/{repo}/issues/21/parent
      api repos/{owner}/{repo}/issues/21/dependencies/blocked_by
