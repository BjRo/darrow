id: update-ticket-comment-only
invariant: TM-U2
activation: competition
mount_plugin_skills: true
prompt: >-
  Add my findings to ticket #12: the root cause is grep -q exiting early
  under pipefail, which SIGPIPEs the writer. The fix is to switch the
  checks to herestrings.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .git/fixture-gh
    printf 'bug\nenhancement\ndocumentation\n' > .git/fixture-gh/labels
    : > .git/fixture-gh/list
    printf 'open' > .git/fixture-gh/issue-12-state
    printf 'ticket list crashes with SIGPIPE on large repos' > .git/fixture-gh/issue-12-title
    printf 'Reported by CI.\n' > .git/fixture-gh/issue-12-body
checks:
  - name: findings landed as a comment
    run: cat .git/fixture-gh/comment-body-12
    expect_regex: "grep -q.*pipefail|pipefail.*grep -q"
  - name: comment preserves the reported symptom and fix
    run: cat .git/fixture-gh/comment-body-12
    expect_regex: "SIGPIPE[\\s\\S]*here-?strings?|here-?strings?[\\s\\S]*SIGPIPE"
    flags: i
  - name: no status change smuggled in
    run: test ! -f .git/fixture-gh/transitions && echo none
    expect_regex: "^none$"
  - name: description untouched
    run: test ! -f .git/fixture-gh/edited-body-12 && echo none
    expect_regex: "^none$"
  - name: comment is the requested tracker mutation
    run: cat .git/fixture-gh/calls
    expect_regex: "^issue comment 12 "
  - name: no other tracker mutation occurs
    run: cat .git/fixture-gh/calls
    not_regex: "(^| )issue (create|edit|close|reopen)( |$)|(^| )api (-X|--method) (POST|PUT|PATCH|DELETE)( |$)"
