id: update-ticket-ambiguous-target
invariant: TM-U1
activation: competition
mount_plugin_skills: true
prompt: Close the login ticket in the issue tracker — that work is done.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .git/fixture-gh
    printf 'bug\nenhancement\ndocumentation\n' > .git/fixture-gh/labels
    printf '#3 open  Login fails with expired token on Safari (bug)\n#5 open  Login button label wrong on signup page (bug)\n' > .git/fixture-gh/list
    printf 'open' > .git/fixture-gh/issue-3-state
    printf 'Login fails with expired token on Safari' > .git/fixture-gh/issue-3-title
    printf 'Details.\n' > .git/fixture-gh/issue-3-body
    printf 'open' > .git/fixture-gh/issue-5-state
    printf 'Login button label wrong on signup page' > .git/fixture-gh/issue-5-title
    printf 'Details.\n' > .git/fixture-gh/issue-5-body
checks:
  - name: nothing closed on an ambiguous reference
    run: test ! -f .git/fixture-gh/transitions && echo none
    expect_regex: "^none$"
  - name: topic candidates are searched before any exact fetch
    run: cat .git/fixture-gh/calls
    expect_regex: "issue list.*--search login"
  - name: ambiguous reference causes no tracker mutation
    run: cat .git/fixture-gh/calls
    not_regex: "(^| )issue (create|edit|comment|close|reopen)( |$)|(^| )api (-X|--method) (POST|PUT|PATCH|DELETE)( |$)"
