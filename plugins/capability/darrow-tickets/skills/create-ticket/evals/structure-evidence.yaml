id: create-ticket-structure-evidence
invariant: TM-C3
activation: competition
mount_plugin_skills: true
prompt: >-
  File a ticket: `bun run sync` crashes with `TypeError: undefined is not a
  function at parseAccounts (sync.ts:42)` on accounts imported from CSV. It
  should finish cleanly and print an import summary.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      UV_PROJECT_ENVIRONMENT="$HOME/.darrow/cache/ticket-fixture-environment" \
        exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .fixture-state/gh
    printf 'bug\nenhancement\ndocumentation\n' > .fixture-state/gh/labels
    : > .fixture-state/gh/list
checks:
  - name: ticket created with a title
    run: cat .fixture-state/gh/created-title
    expect_regex: ".+"
  - name: no trailing period in the title
    run: cat .fixture-state/gh/created-title
    not_regex: "\\.$"
  - name: every required bug section has evidence
    run: >-
      awk '
        /^## Observed$/ { section = "observed"; next }
        /^## Expected$/ { section = "expected"; next }
        /^## Reproduction$/ { section = "reproduction"; next }
        /^## / { section = ""; next }
        NF && section != "" { seen[section] = 1 }
        END {
          exit !(seen["observed"] && seen["expected"] && seen["reproduction"])
        }
      ' .fixture-state/gh/created-body
  - name: error message quoted verbatim
    run: cat .fixture-state/gh/created-body
    expect_regex: "TypeError: undefined is not a function at parseAccounts"
  - name: typed as a bug
    run: cat .fixture-state/gh/created-labels
    expect_regex: "^bug$"
