id: create-ticket-relations-by-request
invariant: TM-C9
activation: competition
mount_plugin_skills: true
prompt: >-
  Create a task ticket under epic #7: wire the CSV export into the nightly
  reporting job. Outcome: the nightly job attaches the CSV to its report.
  Done when the job has run green two nights in a row.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      UV_PROJECT_ENVIRONMENT="$HOME/.darrow/cache/ticket-fixture-environment" \
        exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .fixture-state/gh
    printf 'bug\nenhancement\ntask\n' > .fixture-state/gh/labels
    : > .fixture-state/gh/list
    printf 'open' > .fixture-state/gh/issue-7-state
    printf 'Reporting epic' > .fixture-state/gh/issue-7-title
    printf 'Umbrella for reporting work.\n' > .fixture-state/gh/issue-7-body
checks:
  - name: parent recorded as requested
    run: cat .fixture-state/gh/issue-99-parent
    expect_regex: "^7$"
  - name: no invented dependencies
    run: cat .fixture-state/gh/issue-99-blockedby 2>/dev/null || true
    not_regex: "[0-9]"
  - name: no marker lines smuggled into the body
    run: cat .fixture-state/gh/created-body
    not_regex: "^(parent|depends[- ]?on|blocked[- ]?by)[ \\t]*:"
    flags: i
  - name: typed as a task
    run: cat .fixture-state/gh/created-labels
    expect_regex: "^task$"
  - name: outcome section present
    run: cat .fixture-state/gh/created-body
    expect_regex: "^## Outcome$"
