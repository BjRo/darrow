id: create-ticket-batch-partial-relation
invariant: TM-C9, TM-C10
activation: competition
mount_plugin_skills: true
prompt: >-
  Please create two separate task tickets under umbrella #7 in this request.
  First: add CSV export instructions to the operator guide. Outcome: operators
  can find the export procedure. Done when the guide describes the command and
  output location. Second: add a nightly CSV report check. Outcome: the nightly
  job checks that a CSV report exists. Done when the check fails clearly for a
  missing CSV and passes when one is present. Use #7 as the parent for both.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      UV_PROJECT_ENVIRONMENT="$HOME/.darrow/cache/ticket-fixture-environment" \
        exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .fixture-state/gh
    printf 'task\n' > .fixture-state/gh/labels
    : > .fixture-state/gh/list
    printf 'open' > .fixture-state/gh/issue-7-state
    printf 'Reporting umbrella' > .fixture-state/gh/issue-7-title
    printf '99\n' > .fixture-state/gh/reject-parent-for
checks:
  - name: only the first ticket was created
    run: cat .fixture-state/gh/created-ids
    expect_regex: "^99$"
  - name: the first ticket still exists after relation failure
    run: cat .fixture-state/gh/issue-99-title
    expect_regex: "operator guide|nightly CSV"
  - name: no unsupported second creation attempt
    run: |
      test "$(grep -c '^issue create ' .fixture-state/gh/calls)" -eq 1
  - name: backend refusal is relayed unchanged
    run: cat .git/last-message.md
    expect_regex: "gh: rejected parent write"
semantic_output_checks:
  - name: partial effect and unattempted item are reported
    proposition: >-
      The first creation returned #99, then its requested parent #7 was refused.
      The second requested ticket is the nightly CSV report check. The response
      must identify #99 as created, report its parent as failed or unverified,
      and say the second ticket was not attempted after the failure. Describing
      the refusal and saying execution stopped before creating the second
      ticket is sufficient. Identifying the created ticket by #99 or "the first
      ticket" is valid; its title need not be repeated. The phrase "pending
      mutations" is not required. A response saying nothing was created or
      both tickets were created does not pass. Exact refusal retention is
      assessed separately by a deterministic check.
