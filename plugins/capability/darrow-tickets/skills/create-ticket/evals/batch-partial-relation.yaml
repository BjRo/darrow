id: create-ticket-batch-partial-relation
invariant: TM-C9, TM-C10
activation: competition
mount_plugin_skills: true
prompt: >-
  Please create two separate task tickets under umbrella #7 in this request.
  First: add CSV export instructions to the operator guide. Outcome: operators
  can find the export procedure. Done when the guide describes the command and
  output location. Second: add a nightly CSV report check. Outcome: the nightly
  job checks that a CSV report exists. Done when the check fails clearly for a
  missing CSV and passes when one is present. Use #7 as the parent for both.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .git/fixture-gh
    printf 'task\n' > .git/fixture-gh/labels
    : > .git/fixture-gh/list
    printf 'open' > .git/fixture-gh/issue-7-state
    printf 'Reporting umbrella' > .git/fixture-gh/issue-7-title
    printf '99\n' > .git/fixture-gh/reject-parent-for
checks:
  - name: only the first ticket was created
    run: cat .git/fixture-gh/created-ids
    expect_regex: "^99$"
  - name: the first ticket still exists after relation failure
    run: cat .git/fixture-gh/issue-99-title
    expect_regex: "operator guide|nightly CSV"
  - name: no unsupported second creation attempt
    run: |
      test "$(grep -c '^issue create ' .git/fixture-gh/calls)" -eq 1
semantic_output_checks:
  - name: partial effect and unattempted item are reported
    proposition: >-
      The response identifies #99 as created but says its parent relation
      failed, gives the backend refusal, and identifies the other requested
      ticket as not attempted because pending mutations stopped.
