id: create-ticket-ambiguous-batch
invariant: TM-C1
activation: competition
mount_plugin_skills: true
prompt: >-
  Please file several separate tickets for our reporting improvements. I have
  not decided which outcomes should be separate tickets yet.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .git/fixture-gh
    printf 'bug\nenhancement\ntask\n' > .git/fixture-gh/labels
    : > .git/fixture-gh/list
checks:
  - name: no ticket was created
    run: cat .git/fixture-gh/created-ids 2>/dev/null || true
    not_regex: "[0-9]"
  - name: no tracker mutation before the intended tickets are known
    run: cat .git/fixture-gh/calls 2>/dev/null || true
    not_regex: "(^| )issue (create|edit|comment|close|reopen)( |$)|(^| )api (-X|--method) (POST|PUT|PATCH|DELETE)( |$)"
semantic_output_checks:
  - name: asks for the distinct intended outcomes
    proposition: >-
      The response asks the user to identify the distinct ticket outcomes
      before creating anything, without inventing a ticket breakdown.
