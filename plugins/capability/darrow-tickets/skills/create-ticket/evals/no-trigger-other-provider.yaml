id: create-ticket-no-trigger-other-provider
invariant: TM-P2
activation: negative
mount_plugin_skills: true
activation_excludes:
  - create-ticket
  - read-ticket
  - list-tickets
  - update-ticket
prompt: "Create a Jira bug for the CSV export crash. Observed: exporting an empty report crashes. Expected: an empty CSV downloads. Reproduction: open an empty report and click Export."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# APP


          This project tracks work in Jira.\n"
  bin:
    gh: |
      #!/bin/sh
      printf '%s\n' "$*" >> "$(git rev-parse --show-toplevel)/.fixture-state/gh-calls"
      echo "Unexpected GitHub tracker access" >&2
      exit 1
  setup: |
    git remote add origin https://github.test/o/r.git
checks:
  - name: explicit other tracker does not contact GitHub
    run: test ! -f .fixture-state/gh-calls
semantic_output_checks:
  - name: requested tracker is preserved
    proposition: >-
      Jira is the requested tracker, and this session has no Jira integration.
      The response must not claim that a ticket was created or that a GitHub
      issue fulfills the Jira request. Explaining that Jira is unavailable,
      asking for Jira access, or supplying an unsubmitted draft of the requested
      Jira bug is valid. A draft does not itself imply GitHub use or ticket
      creation. If the response offers GitHub as an alternative, it must make
      that a separate option requiring the user's explicit choice. A response
      that offers no GitHub alternative need not discuss that choice.
