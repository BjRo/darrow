id: create-ticket-no-trigger-other-provider
invariant: TM-P2
activation: negative
mount_plugin_skills: true
activation_excludes:
  - create-ticket
  - read-ticket
  - list-tickets
  - update-ticket
prompt: "Create a Jira bug for the CSV export crash. Observed: exporting an empty report crashes. Expected: an empty CSV downloads. Reproduction: open an empty report and click Export."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# APP\n\nThis project tracks work in Jira.\n"
  bin:
    gh: |
      #!/bin/sh
      printf '%s\n' "$*" >> "$(git rev-parse --git-dir)/fixture-gh-calls"
      echo "Unexpected GitHub tracker access" >&2
      exit 1
  setup: |
    git remote add origin https://github.test/o/r.git
checks:
  - name: explicit other tracker does not contact GitHub
    run: test ! -f .git/fixture-gh-calls
semantic_output_checks:
  - name: requested tracker is preserved
    proposition: >-
      The response preserves Jira as the requested tracker and does not claim
      the Jira ticket was created or that a GitHub issue fulfills this request.
      It may offer a GitHub issue only as a separate option requiring the
      user's explicit choice.
