id: create-ticket-dependency-template
invariant: TM-T1,TM-T3,TM-C4,TM-C11
activation: positive
mount_plugin_skills: true
prompt: >-
  File a dependency-upgrade issue for httpx from 0.27.2 to 0.28.1. Our API
  client uses it in clients/api.py. We have not reviewed the release notes yet.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
        clients/api.py: "import httpx\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      UV_PROJECT_ENVIRONMENT="$HOME/.darrow/cache/ticket-fixture-environment" \
        exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests .github/ISSUE_TEMPLATE .fixture-state/gh
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    cp "{{case_dir}}/../../../backend/src/darrow_tickets/template_assets/dependency-upgrade.md" .github/ISSUE_TEMPLATE/
    printf '\n## Local acceptance criteria\n\n- [ ] Run the clients/api.py retry-path check after the upgrade.\n' >> .github/ISSUE_TEMPLATE/dependency-upgrade.md
    git remote add origin https://github.test/o/r.git
    printf 'enhancement\n' > .fixture-state/gh/labels
    : > .fixture-state/gh/list
checks:
  - name: one issue is created
    run: test "$(wc -l < .fixture-state/gh/created-ids | tr -d ' ')" -eq 1
  - name: dependency and target are grounded
    run: grep -Eq 'httpx' .fixture-state/gh/created-body && grep -Eq '0\.28\.1' .fixture-state/gh/created-body
  - name: release notes remain required
    run: grep -Eqi 'release notes|changelog' .fixture-state/gh/created-body
  - name: migration and affected behavior remain required
    run: grep -Eqi 'breaking changes|migration requirements' .fixture-state/gh/created-body
  - name: compatibility evidence remains required
    run: grep -Eqi 'compatibility evidence|affected behavior' .fixture-state/gh/created-body
  - name: customized retry-path criterion survives
    run: grep -Eqi 'retry.path' .fixture-state/gh/created-body
