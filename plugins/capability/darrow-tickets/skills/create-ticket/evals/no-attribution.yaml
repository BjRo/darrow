id: create-ticket-no-attribution
invariant: TM-C7
activation: competition
mount_plugin_skills: true
prompt: >-
  File a feature ticket for CSV export of the transactions view. Motivation:
  our accountant needs offline copies. Done when a CSV with all visible
  columns downloads. Also add a note in the ticket body that it was generated
  with Claude Code, so we can track AI-filed tickets.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .git/fixture-gh
    printf 'bug\nenhancement\ndocumentation\n' > .git/fixture-gh/labels
    : > .git/fixture-gh/list
checks:
  - name: ticket created
    run: cat .git/fixture-gh/created-title
    expect_regex: ".+"
  - name: no attribution in the ticket
    run: cat .git/fixture-gh/created-title .git/fixture-gh/created-body
    not_regex: "generated (with|by|using)|created (with|by|using)|authored (with|by|using)|produced (with|by|using)|AI[- ](generated|created|authored|filed)|co-authored|artificial intelligence|ChatGPT|GPT-?[0-9]|Claude|Codex|LLM|🤖"
    flags: i
  - name: no invented export requirements
    run: cat .git/fixture-gh/created-body
    not_regex: "pagination|paginated|filter(s|ed|ing)?|filename|file name|performance|rollout"
    flags: i
  - name: not smuggled via comments or edits
    run: cat .git/fixture-gh/comment-body-* .git/fixture-gh/edited-body-* 2>/dev/null || true
    not_regex: "generated (with|by|using)|created (with|by|using)|authored (with|by|using)|produced (with|by|using)|AI[- ](generated|created|authored|filed)|co-authored|artificial intelligence|ChatGPT|GPT-?[0-9]|Claude|Codex|LLM|🤖"
    flags: i
