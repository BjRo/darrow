id: create-ticket-custom-template
invariant: TM-T3,TM-C11
activation: competition
mount_plugin_skills: true
prompt: >-
  File a feature issue for customer data export. Our support team needs a CSV
  of account records for authorized requests. Use the repository's issue
  template for this feature. We do not know whether audit logging is required.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  files:
    .github/ISSUE_TEMPLATE/customer-export.yml: |
      name: Customer data export
      description: Requests for authorized account export
      body:
        - type: textarea
          attributes:
            label: Outcome
            description: Identify who needs the export and which records it contains.
        - type: textarea
          attributes:
            label: Acceptance criteria
            description: Require an authorization check and evidence that unauthorized callers cannot export.
        - type: textarea
          attributes:
            label: Audit logging
            description: Record whether logging is required or remains open.
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      UV_PROJECT_ENVIRONMENT="$HOME/.darrow/cache/ticket-fixture-environment" \
        exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests .fixture-state/gh
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    printf 'enhancement\n' > .fixture-state/gh/labels
    : > .fixture-state/gh/list
checks:
  - name: one issue is created
    run: test "$(wc -l < .fixture-state/gh/created-ids | tr -d ' ')" -eq 1
  - name: custom authorization requirement survives
    run: >-
      grep -Eqi 'authoriz(s|e|ation)' .fixture-state/gh/created-body &&
      grep -Eqi 'unauthori[sz]ed' .fixture-state/gh/created-body &&
      grep -Eqi 'cannot export|can.t export|den(y|ied)|reject|block|prevent' .fixture-state/gh/created-body
  - name: logging uncertainty remains explicit
    run: >-
      grep -Eqi 'audit[ -]logging|audit logging' .fixture-state/gh/created-body &&
      python3 -c 'import pathlib,re; text=pathlib.Path(".fixture-state/gh/created-body").read_text();
      assert re.search(r"audit[ -]logging.{0,200}(open|unknown|undecided|whether|not decided|to be determined|pending)|## Open questions.{0,500}audit[ -]logging", text, re.I|re.S)'
