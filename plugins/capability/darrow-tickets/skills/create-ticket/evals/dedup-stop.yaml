id: create-ticket-dedup-stop
invariant: TM-C1
activation: competition
mount_plugin_skills: true
prompt: >-
  Create a ticket: our ticket list command dies with SIGPIPE when a repo has
  hundreds of open tickets.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .git/fixture-gh
    printf 'bug\nenhancement\ndocumentation\n' > .git/fixture-gh/labels
    printf '#12 open  ticket list crashes with SIGPIPE on repos with many tickets (bug)\n' > .git/fixture-gh/list
    printf 'open' > .git/fixture-gh/issue-12-state
    printf 'ticket list crashes with SIGPIPE on repos with many tickets' > .git/fixture-gh/issue-12-title
    printf 'Reported by CI.\n' > .git/fixture-gh/issue-12-body
checks:
  - name: searched the tracker with focused terms
    run: cat .git/fixture-gh/calls
    expect_regex: "issue list.*--search"
  - name: plausible duplicate causes no tracker mutation
    run: cat .git/fixture-gh/calls
    not_regex: "(^| )issue (create|edit|comment|close|reopen)( |$)|(^| )api (-X|--method) (POST|PUT|PATCH|DELETE)( |$)"
semantic_output_checks:
  - name: plausible duplicate is reported before stopping
    proposition: >-
      The response reports issue #12 and its ticket-list SIGPIPE title as a
      plausible duplicate, briefly explains why it matches the requested
      problem, and makes clear that no new ticket was created.
