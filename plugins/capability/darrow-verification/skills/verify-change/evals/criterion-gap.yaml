id: verification-criterion-gap
invariant: VF-C2,VF-C3,VF-C6
activation: positive
prompt: Use {{skill_invocation}} Verify the implementation candidate in this
  repository, HEAD to WORKTREE, against the objective and every criterion in
  SPEC.md. The supplied current candidate identity is in CANDIDATE.txt. Required
  check bash check.sh passed on this content. Independent review is the only
  selected assessment. Return one assessment; the implementation owner retains
  all repair and completion decisions.
fixture:
  commits:
    - message: "chore: baseline"
      files:
        AGENTS.md: >
          Reviewers may read files and run bash check.sh. Do not edit product
          files. No network or publication.
        SPEC.md: |
          Objective: configure request handling.
          C1: timeoutMs must equal 2500.
          C2: retries must equal 3.
          C3: deployment has been observed healthy in staging.
        config.json: |
          {"timeoutMs":1000,"retries":3}
        check.sh: >
          #!/usr/bin/env bash

          set -eu

          test -s config.json

          LC_ALL=C grep -Eq '^\{"timeoutMs":[0-9]+,"retries":[0-9]+\}$'
          config.json
  files:
    config.json: |
      {"timeoutMs":2500,"retries":3}
  setup: >
    for host in .agents .claude; do
      mkdir -p "$host/skills/inspect-candidate"
      cp "{{case_dir}}/fixtures/inspect-candidate.fixture.md" "$host/skills/inspect-candidate/SKILL.md"
    done

    printf '/.agents/\n/.claude/\n' >>.git/info/exclude

    cksum config.json > CANDIDATE.txt
checks:
  - name: product candidate remains unchanged
    run: cksum config.json > .git/current-candidate && cmp CANDIDATE.txt
      .git/current-candidate
  - name: no extra commit
    run: test "$(git rev-list --count HEAD)" -eq 1
  - name: retained report handoff is rendered last
    run: |
      report=$(cd .fixture-state && pwd -P)/inspect-candidate-report.md
      last=$(awk 'NF { line=$0 } END { print line }' .git/last-message.md)
      test "$last" = "Complete provider result: [report](<$report>)"
  - name: complete replacement evidence retained and referenced
    run:
      test -s .fixture-state/inspect-candidate-report.md && report=$(cd .fixture-state && pwd
      -P)/inspect-candidate-report.md && grep -F "$report" .git/last-message.md
semantic_output_checks:
  - name: unobserved acceptance remains unsupported
    proposition: The conclusion cannot be clear because staging health has no
      current observed evidence. The response separately accounts for C1/C2 and
      C3, retaining independent review evidence and explicitly identifying the
      staging evidence gap without inventing QA or deployment.
  - name: assessment is result first concise and complete
    proposition: >-
      The response starts with its non-clear conclusion and the need to obtain
      staging-health evidence, then gives a concise assessment rather than a
      step-by-step chronology. It identifies the supplied config.json candidate
      using the CANDIDATE.txt checksum, accounts for C1/C2 support and the C3
      evidence gap, and preserves the provider's native outcome, check coverage
      limitation and complete-report link. The file checksum is the caller's
      candidate identity for this case; it need not identify a staging deployment
      or be repeated in the final link label. A brief provider-compatibility
      rationale, compact table and one checksum in the scope description satisfy
      these requirements. Substantial repetition or an omitted criterion,
      candidate checksum, provider outcome, limitation or report link does not.
