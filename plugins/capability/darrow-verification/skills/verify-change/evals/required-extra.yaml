id: verification-required-extra
invariant: VF-C2,VF-C4,VF-C6,VF-C7
activation: positive
prompt: Use {{skill_invocation}} Verify the implementation candidate in this
  repository, HEAD to WORKTREE, against the objective and every criterion in
  SPEC.md. The supplied current candidate identity is in CANDIDATE.txt. Required
  check bash check.sh passed on this content. Independent review is the only
  selected assessment. Return one assessment; the implementation owner retains
  all repair and completion decisions. QA exercise of the changed request
  behavior is also a required selected assessment.
fixture:
  commits:
    - message: "chore: baseline"
      files:
        AGENTS.md: >
          Reviewers may read files and run bash check.sh. Do not edit product
          files. No network or publication.
        SPEC.md: |
          Objective: configure request handling.
          C1: timeoutMs must equal 2500.
          C2: retries must equal 3.
        config.json: |
          {"timeoutMs":1000,"retries":3}
        check.sh: >
          #!/usr/bin/env bash

          set -eu

          test -s config.json

          LC_ALL=C grep -Eq '^\{"timeoutMs":[0-9]+,"retries":[0-9]+\}$'
          config.json
  files:
    config.json: |
      {"timeoutMs":2500,"retries":3}
  setup: >
    for host in .agents .claude; do
      mkdir -p "$host/skills/inspect-candidate"
      cp "{{case_dir}}/fixtures/inspect-candidate.fixture.md" "$host/skills/inspect-candidate/SKILL.md"
    done

    printf '/.agents/\n/.claude/\n' >>.git/info/exclude

    cksum config.json > CANDIDATE.txt
checks:
  - name: product candidate remains unchanged
    run: cksum config.json > .git/current-candidate && cmp CANDIDATE.txt
      .git/current-candidate
  - name: no extra commit
    run: test "$(git rev-list --count HEAD)" -eq 1
  - name: retained report handoff is rendered last
    run: |
      test -e .git/inspect-candidate-report.md || exit 0
      report=$(cd .git && pwd -P)/inspect-candidate-report.md
      last=$(awk 'NF { line=$0 } END { print line }' .git/last-message.md)
      test "$last" = "Complete provider result: [report](<$report>)"
semantic_output_checks:
  - name: selected unsupported requirement cannot disappear
    proposition: The result is blocked because required QA is unsupported or
      unavailable. It does not silently omit that selected requirement, run QA
      itself, or clear verification based only on review.
