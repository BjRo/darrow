id: verification-indirect
candidate_routes:
  codex:
    model: gpt-6.1-sol
    effort: medium
  claude:
    model: claude-sonnet-5-5
    effort: medium
invariant: VF-C1,VF-C2,VF-C3
activation: positive
prompt:
  "The harness reports the observed effective route of this exact active context:
  Codex gpt-6.1-sol/medium on Codex, or Claude claude-sonnet-5-5/medium on Claude. This
  is current owner route evidence, not a desired launch tuple. Use it to coordinate
  inline. Coordinate assurance that the current change meets all its acceptance in
  SPEC.md. Verify the implementation candidate in this repository, HEAD to WORKTREE,
  against the objective and every criterion in SPEC.md. The supplied current candidate
  identity is in CANDIDATE.txt. Required check bash check.sh passed on this content.
  Independent review is the only selected assessment. Return one assessment; the
  implementation owner retains all repair and completion decisions. On Claude, the
  harness provides Bash for authorized private artifact I/O and no dedicated Write tool.
  Retaining complete reader JSON in the returned private run is authorized. Actual path
  or access-control denials still block. The compatible provider public reference on
  Claude is .claude/skills/inspect-candidate/SKILL.md."
fixture:
  commits:
    - message: "chore: baseline"
      files:
        AGENTS.md: >
          Reviewers may read files and run bash check.sh. Do not edit product files. No
          network or publication.
        SPEC.md: |
          Objective: configure request handling.
          C1: timeoutMs must equal 2500.
          C2: retries must equal 3.
        config.json: |
          {"timeoutMs":1000,"retries":3}
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          test -s config.json
          LC_ALL=C grep -Eq '^\{"timeoutMs":[0-9]+,"retries":[0-9]+\}$' config.json
  files:
    config.json: |
      {"timeoutMs":2500,"retries":3}
  setup: >
    for host in .agents .claude; do
      mkdir -p "$host/skills/inspect-candidate"
      cp "{{case_dir}}/fixtures/inspect-candidate.fixture.md" "$host/skills/inspect-candidate/SKILL.md"
    done

    printf '/.agents/\n/.claude/\n' >>.git/info/exclude

    cksum config.json > CANDIDATE.txt
checks:
  - name: product candidate remains unchanged
    run: cksum config.json > .git/current-candidate && cmp CANDIDATE.txt
      .git/current-candidate
  - name: no extra commit
    run: test "$(git rev-list --count HEAD)" -eq 1
  - name: complete replacement evidence retained
    run: test -s .fixture-state/inspect-candidate-report.md
output_checks:
  - name: retained report handoff is rendered last
    expect_regex: "(?:^|\\n)Complete provider result:
      \\[report\\]\\(</[^\\r\\n<>]+/\\.fixture-state/inspect-candidate-report\\.md>\\)[
      \\t\\r\\n]*(?![\\s\\S])"
semantic_output_checks:
  - name: clear current evidence
    proposition:
      The response reports a clear current-candidate assessment with supported
      conclusions for C1 and C2 and independent review provenance.
transcript_checks:
  - name: v2 inline placement and completed independent readers
    assessment_readers:
      placement: inline
      axes:
        - standards
        - spec
      model: gpt-6.1-sol
      effort: xhigh
      claude:
        agent: general-purpose
