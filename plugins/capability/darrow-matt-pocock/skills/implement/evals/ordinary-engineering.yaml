id: implement-ordinary-engineering-nonactivation
invariant: IMP-C2,IMP-C4
activation: negative
activation_excludes:
  - implement
  - adaptive-goal
additional_plugins:
  - plugins/orchestration/darrow-adaptive-goal
goal_report: forbidden
goal_route_checks: false
native_goal: forbidden
prompt: >-
  Add an exported triple(value) function to src/math.js and a focused test for a
  negative number. Acceptance is that bash test.sh passes; run that command to
  verify it. Keep the change local and do not commit.
fixture:
  commits:
    - message: "chore: init"
      files:
        package.json: '{"type":"module"}'
        src/math.js: |
          export const identity = (value) => value;
        test/math.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity } from "../src/math.js";
          test("identity", () => assert.equal(identity(-2), -2));
        test.sh: |
          #!/usr/bin/env bash
          node --test test/math.test.js
checks:
  - name: ordinary request is implemented directly
    run: >-
      node --input-type=module -e "import('./src/math.js').then(({triple}) => { if
      (triple(-4) !== -12) process.exit(1) })" && bash test.sh
  - name: no commit occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
