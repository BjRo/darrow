id: create-pr-template-fill
activation: positive
mount_plugin_skills: true
prompt: Open a PR for the preferences migration.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
        src/preferences.ts: "export function migrate(store: Storage) { return store.getItem(\"legacy-preferences\"); }\n"
        .github/PULL_REQUEST_TEMPLATE.md: |
          <!-- Explain the motivation before the mechanics. Link the ticket. -->
            ## Why

            ## What Changed

            ## Testing
          <!-- How was this verified? -->
  bin:
    gh: |
      #!/bin/sh
      d="$(git rev-parse --show-toplevel)/.fixture-state/gh"
      case "$1 $2" in
        "pr list")
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-created" ]; then
            tip=$(git rev-parse HEAD)
            base=$(cat "$d/base")
            draft=false; [ ! -f "$d/draft" ] || draft=true
            printf '1\thttps://github.com/fixture/repo/pull/1\tOPEN\t%s\t%s\t%s\t%s\tfalse\n' "$(cat "$d/head")" "$tip" "$base" "$draft"
            rm -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-created"
            exit 0
          fi
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-fail" ]; then
            echo "HTTP 502: bad gateway" >&2
            exit 1
          fi
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-existing" ]; then
            cat "$(git rev-parse --show-toplevel)/.fixture-state/gh-existing"
          fi
          ;;
        "pr create")
          for argument in "$@"; do
            case "$argument" in
              --help|-h)
                printf 'Usage: gh pr create [flags]\n'
                exit 0
                ;;
            esac
          done
          mkdir -p "$d"
          shift 2
          while [ $# -gt 0 ]; do
            case "$1" in
              --title) printf '%s' "$2" > "$d/title"; shift 2 ;;
              --body) printf '%s' "$2" > "$d/body"; shift 2 ;;
              --body-file) cp "$2" "$d/body"; shift 2 ;;
              --base) printf '%s' "$2" > "$d/base"; shift 2 ;;
              --head) printf '%s' "$2" > "$d/head"; shift 2 ;;
              --draft) : > "$d/draft"; shift ;;
              *) shift ;;
            esac
          done
          echo "https://github.com/fixture/repo/pull/1"
          : > "$(git rev-parse --show-toplevel)/.fixture-state/gh-created"
          ;;
        "repo view")
          printf '%s\n' fixture/repo
          ;;
        *)
          echo "mock gh: unsupported: $*" >&2
          exit 1
          ;;
      esac
  setup: |
    git init -q --bare .fixture-state/remote.git
    git --git-dir=.fixture-state/remote.git symbolic-ref HEAD refs/heads/main
    git remote add origin "$PWD/.fixture-state/remote.git"
    git push -qu origin main
    git remote set-head origin main
    git switch -qc feat/DAR-123-preferences-migration
    printf 'export function migrate(store: Storage) { store.removeItem("legacy-preferences"); }\n' > src/preferences.ts
    git add src/preferences.ts
    git commit -qm "feat: retire the legacy preferences format"
    cat > preferences.test.ts <<'EOF'
    import { migrate } from "./src/preferences";
    test("migration removes legacy preferences", () => {
      localStorage.setItem("legacy-preferences", "compact");
      migrate(localStorage);
      expect(localStorage.getItem("legacy-preferences")).toBeNull();
    });
    EOF
    git add preferences.test.ts
    git commit -qm "test: cover preferences migration"
checks:
  - name: PR created
    run: test -f .fixture-state/gh/body && echo created
    expect_regex: "^created$"
  - name: template headings kept verbatim
    run: cat .fixture-state/gh/body
    expect_regex: "^  ## Why$[\\s\\S]*^  ## What Changed$[\\s\\S]*^  ## Testing$"
  - name: no template comments left in the body
    run: grep -c '<!--' .fixture-state/gh/body || true
    expect_regex: "^0$"
  - name: Why section filled with the motivation
    run: >-
      awk '/^  ## Why$/{f=1;next} /^  ## /{f=0} f'
      .fixture-state/gh/body
    expect_regex: "(migration|legacy|preferences|format)"
    flags: i
  - name: Testing section filled
    run: >-
      awk '/^  ## Testing$/{f=1;next} /^  ## /{f=0} f'
      .fixture-state/gh/body
    expect_regex: "[A-Za-z]"
  - name: ticket referenced verbatim
    run: cat .fixture-state/gh/body
    expect_regex: "DAR-123"
  - name: template replaces default presentation headings
    run: grep -Ec '^## (Summary|Evidence|Merge Danger)$' .fixture-state/gh/body || true
    expect_exact: "0"
  - name: diff sketch opens the change section
    run: cat .fixture-state/gh/body
    expect_regex: '^  ## What Changed\n\s*```diff\b'
  - name: rollback and blast radius labels
    run: cat .fixture-state/gh/body
    expect_regex: '\*\*Rollback[\s\S]*One-way door[\s\S]*\*\*Blast radius'
semantic_artifact:
  path: .fixture-state/gh/body
  checks:
    - name: evidence limits survive the template
      proposition: >-
        The Testing section distinguishes committed migration coverage from
        observed results. No test execution or before/after observation was
        supplied, so it does not claim passing tests or a measured comparison.
    - name: the sketch and merge danger match the migration
      proposition: >-
        The opening diff sketch shows the migration changing from reading the
        legacy preferences key to deleting it. The merge danger notes identify
        users with stored legacy preferences and explain that reverting code
        cannot restore preferences that have already been deleted.
