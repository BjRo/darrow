id: create-pr-dup-stop
invariant: GW-P6
activation: positive
mount_plugin_skills: true
prompt: Open a PR for this branch.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
        src/auth.ts: "export function login() { return false; }\n"
  bin:
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      case "$1 $2" in
        "pr list")
          if [ -f "$(git rev-parse --git-dir)/fixture-gh-fail" ]; then
            echo "HTTP 502: bad gateway" >&2
            exit 1
          fi
          if [ -f "$(git rev-parse --git-dir)/fixture-gh-existing" ]; then
            cat "$(git rev-parse --git-dir)/fixture-gh-existing"
          fi
          ;;
        "pr create")
          mkdir -p "$d"
          shift 2
          while [ $# -gt 0 ]; do
            case "$1" in
              --title) printf '%s' "$2" > "$d/title"; shift 2 ;;
              --body) printf '%s' "$2" > "$d/body"; shift 2 ;;
              --base) printf '%s' "$2" > "$d/base"; shift 2 ;;
              --head) printf '%s' "$2" > "$d/head"; shift 2 ;;
              --draft) : > "$d/draft"; shift ;;
              *) shift ;;
            esac
          done
          echo "https://github.com/fixture/repo/pull/1"
          ;;
        *)
          echo "mock gh: unsupported: $*" >&2
          exit 1
          ;;
      esac
  setup: |
    git init -q --bare .git/remote.git
    git remote add origin "$PWD/.git/remote.git"
    git push -qu origin main
    git remote set-head origin main
    git switch -qc fix/session-expiry
    printf 'export function login() { return true; }\n' > src/auth.ts
    git add src/auth.ts
    git commit -qm "fix: renew session before expiry"
    printf '#42\tfix: renew session before expiry\tfix/session-expiry\n' > .git/fixture-gh-existing
checks:
  - name: no second PR created
    run: test ! -f .git/fixture-gh/title && echo none
    expect_regex: "^none$"
  - name: branch not pushed
    run: git -C .git/remote.git for-each-ref refs/heads | wc -l
    expect_regex: "^\\s*1$"
  - name: still on the branch
    run: git rev-parse --abbrev-ref HEAD
    expect_regex: "^fix/session-expiry$"
