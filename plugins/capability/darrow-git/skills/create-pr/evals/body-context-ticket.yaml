id: create-pr-body-context-ticket
invariant: GW-P2
activation: positive
mount_plugin_skills: true
prompt: Open a PR for the retry work.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
        src/http.ts: "export async function get(url: string) { return fetch(url); }\n"
  bin:
    gh: |
      #!/bin/sh
      d="$(git rev-parse --show-toplevel)/.fixture-state/gh"
      case "$1 $2" in
        "pr list")
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-created" ]; then
            tip=$(git rev-parse HEAD)
            base=$(cat "$d/base")
            draft=false; [ ! -f "$d/draft" ] || draft=true
            printf '1\thttps://github.com/fixture/repo/pull/1\tOPEN\t%s\t%s\t%s\t%s\tfalse\n' "$(cat "$d/head")" "$tip" "$base" "$draft"
            rm -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-created"
            exit 0
          fi
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-fail" ]; then
            echo "HTTP 502: bad gateway" >&2
            exit 1
          fi
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-existing" ]; then
            cat "$(git rev-parse --show-toplevel)/.fixture-state/gh-existing"
          fi
          ;;
        "pr create")
          for argument in "$@"; do
            case "$argument" in
              --help|-h)
                printf 'Usage: gh pr create [flags]\n'
                exit 0
                ;;
            esac
          done
          mkdir -p "$d"
          shift 2
          while [ $# -gt 0 ]; do
            case "$1" in
              --title) printf '%s' "$2" > "$d/title"; shift 2 ;;
              --body) printf '%s' "$2" > "$d/body"; shift 2 ;;
              --body-file) cp "$2" "$d/body"; shift 2 ;;
              --base) printf '%s' "$2" > "$d/base"; shift 2 ;;
              --head) printf '%s' "$2" > "$d/head"; shift 2 ;;
              --draft) : > "$d/draft"; shift ;;
              *) shift ;;
            esac
          done
          echo "https://github.com/fixture/repo/pull/1"
          : > "$(git rev-parse --show-toplevel)/.fixture-state/gh-created"
          ;;
        "repo view")
          printf '%s\n' fixture/repo
          ;;
        *)
          echo "mock gh: unsupported: $*" >&2
          exit 1
          ;;
      esac
  setup: |
    git init -q --bare .fixture-state/remote.git
    git --git-dir=.fixture-state/remote.git symbolic-ref HEAD refs/heads/main
    git remote add origin "$PWD/.fixture-state/remote.git"
    git push -qu origin main
    git remote set-head origin main
    git switch -qc feat/DAR-123-retry-logic
    printf 'export async function get(url: string, tries = 3) { for (let i = 0; i < tries; i++) { try { return await fetch(url); } catch (e) { await new Promise(r => setTimeout(r, 2 ** i * 100)); } } throw new Error("gave up"); }\n' > src/http.ts
    git add src/http.ts
    git commit -qm "feat: add retry with exponential backoff to http client"
    printf 'import { get } from "../src/http";\ntest("retries", async () => { await expect(get("x", 1)).rejects.toThrow(); });\n' > http.test.ts
    git add http.test.ts
    git commit -qm "test: cover retry exhaustion and backoff timing"
checks:
  - name: PR created
    run: test -f .fixture-state/gh/body && echo created
    expect_regex: "^created$"
  - name: ticket referenced verbatim
    run: cat .fixture-state/gh/body
    expect_regex: "DAR-123"
semantic_artifact:
  path: .fixture-state/gh/body
  checks:
    - name: body explains the motivation and solution
      proposition: >-
        The PR body gives a reason for the retry/backoff change, such as
        handling transient HTTP failures or helping requests recover, and
        describes the change at a high level, such as adding retries or
        exponential backoff. The relevant meaning may be shared across the
        whole body without separate paragraphs or repeated terms.
