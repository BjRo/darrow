id: create-pr-title-conventional
invariant: GW-P1
activation: positive
mount_plugin_skills: true
prompt: Open a PR for this fix.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
        src/parser.ts: "export function parse(raw: string) { return JSON.parse(raw); }\n"
  bin:
    gh: |
      #!/bin/sh
      d="$(git rev-parse --show-toplevel)/.fixture-state/gh"
      case "$1 $2" in
        "pr list")
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-created" ]; then
            tip=$(git rev-parse HEAD)
            base=$(cat "$d/base")
            draft=false; [ ! -f "$d/draft" ] || draft=true
            printf '1\thttps://github.com/fixture/repo/pull/1\tOPEN\t%s\t%s\t%s\t%s\tfalse\n' "$(cat "$d/head")" "$tip" "$base" "$draft"
            rm -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-created"
            exit 0
          fi
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-fail" ]; then
            echo "HTTP 502: bad gateway" >&2
            exit 1
          fi
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-existing" ]; then
            cat "$(git rev-parse --show-toplevel)/.fixture-state/gh-existing"
          fi
          ;;
        "pr create")
          for argument in "$@"; do
            case "$argument" in
              --help|-h)
                printf 'Usage: gh pr create [flags]\n'
                exit 0
                ;;
            esac
          done
          mkdir -p "$d"
          shift 2
          while [ $# -gt 0 ]; do
            case "$1" in
              --title) printf '%s' "$2" > "$d/title"; shift 2 ;;
              --body) printf '%s' "$2" > "$d/body"; shift 2 ;;
              --body-file) cp "$2" "$d/body"; shift 2 ;;
              --base) printf '%s' "$2" > "$d/base"; shift 2 ;;
              --head) printf '%s' "$2" > "$d/head"; shift 2 ;;
              --draft) : > "$d/draft"; shift ;;
              *) shift ;;
            esac
          done
          echo "https://github.com/fixture/repo/pull/1"
          : > "$(git rev-parse --show-toplevel)/.fixture-state/gh-created"
          ;;
        "repo view")
          printf '%s\n' fixture/repo
          ;;
        *)
          echo "mock gh: unsupported: $*" >&2
          exit 1
          ;;
      esac
  setup: |
    git init -q --bare .fixture-state/remote.git
    git --git-dir=.fixture-state/remote.git symbolic-ref HEAD refs/heads/main
    git remote add origin "$PWD/.fixture-state/remote.git"
    git push -qu origin main
    git remote set-head origin main
    git switch -qc fix/empty-config-crash
    printf 'export function parse(raw: string) { if (!raw.trim()) return {}; return JSON.parse(raw); }\n' > src/parser.ts
    git add src/parser.ts
    git commit -qm "fix: guard config parser against empty files"
    printf 'import { parse } from "../src/parser";\ntest("empty", () => expect(parse("")).toEqual({}));\n' > parser.test.ts
    git add parser.test.ts
    git commit -qm "test: cover empty and whitespace-only configs"
checks:
  - name: PR created
    run: test -f .fixture-state/gh/title && echo created
    expect_regex: "^created$"
  - name: title is a conventional subject
    run: cat .fixture-state/gh/title
    expect_regex: "^fix(\\([^)]+\\))?!?: \\S"
  - name: title names the work
    run: cat .fixture-state/gh/title
    expect_regex: "(config|empty|pars|crash)"
    flags: i
  - name: title within 72 chars
    run: test "$(wc -c < .fixture-state/gh/title)" -le 72 && echo ok
    expect_regex: "^ok$"
  - name: no trailing period
    run: cat .fixture-state/gh/title
    not_regex: "\\.$"
output_checks:
  - name: successful creation links the canonical PR
    expect_regex: "https://github.com/fixture/repo/pull/1"
  - name: success does not paste the machine publication record
    not_regex: 'intended-commit:[\s\S]*remote-commit:[\s\S]*pr-commit:'
