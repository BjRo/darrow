id: create-pr-base-user-named
invariant: GW-P4
activation: positive
mount_plugin_skills: true
prompt: Open a PR for the rate limit work against develop, not main.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      d="$(git rev-parse --show-toplevel)/.fixture-state/gh"
      case "$1 $2" in
        "pr list")
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-created" ]; then
            tip=$(git rev-parse HEAD)
            base=$(cat "$d/base")
            draft=false; [ ! -f "$d/draft" ] || draft=true
            printf '1\thttps://github.com/fixture/repo/pull/1\tOPEN\t%s\t%s\t%s\t%s\tfalse\n' "$(cat "$d/head")" "$tip" "$base" "$draft"
            rm -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-created"
            exit 0
          fi
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-fail" ]; then
            echo "HTTP 502: bad gateway" >&2
            exit 1
          fi
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-existing" ]; then
            cat "$(git rev-parse --show-toplevel)/.fixture-state/gh-existing"
          fi
          ;;
        "pr create")
          mkdir -p "$d"
          shift 2
          while [ $# -gt 0 ]; do
            case "$1" in
              --title) printf '%s' "$2" > "$d/title"; shift 2 ;;
              --body) printf '%s' "$2" > "$d/body"; shift 2 ;;
              --body-file) cp "$2" "$d/body"; shift 2 ;;
              --base) printf '%s' "$2" > "$d/base"; shift 2 ;;
              --head) printf '%s' "$2" > "$d/head"; shift 2 ;;
              --draft) : > "$d/draft"; shift ;;
              *) shift ;;
            esac
          done
          echo "https://github.com/fixture/repo/pull/1"
          : > "$(git rev-parse --show-toplevel)/.fixture-state/gh-created"
          ;;
        "repo view")
          printf '%s\n' fixture/repo
          ;;
        *)
          echo "mock gh: unsupported: $*" >&2
          exit 1
          ;;
      esac
  setup: |
    git init -q --bare .fixture-state/remote.git
    git --git-dir=.fixture-state/remote.git symbolic-ref HEAD refs/heads/main
    git remote add origin "$PWD/.fixture-state/remote.git"
    git push -qu origin main
    git remote set-head origin main
    git branch -q develop main
    git push -q origin develop
    git switch -qc feat/api-rate-limits develop
    mkdir -p src
    printf 'export const requestsPerMinute = 100;\n' > src/limits.ts
    git add src/limits.ts
    git commit -qm "feat: add per-client api rate limits"
    git push -q origin HEAD:refs/heads/main
checks:
  - name: PR created
    run: test -f .fixture-state/gh/title && echo created
    expect_regex: "^created$"
  - name: user-named base used
    run: cat .fixture-state/gh/base
    expect_regex: "^develop$"
  - name: intended feature published
    run: test "$(git rev-parse HEAD)" = "$(git -C .fixture-state/remote.git rev-parse refs/heads/feat/api-rate-limits)" && echo published
    expect_regex: "^published$"
