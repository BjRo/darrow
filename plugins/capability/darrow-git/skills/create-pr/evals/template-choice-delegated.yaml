id: create-pr-template-choice-delegated
invariant: GW-P8
activation: positive
mount_plugin_skills: true
prompt: >-
  Open a PR for the retry work. The repository has multiple PR templates; pick
  whichever one seems best and do not ask me another question.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
        .gitignore: "eval-pr-body.md\n"
        src/http.ts: "export async function get(url: string) { return fetch(url); }\n"
        .github/PULL_REQUEST_TEMPLATE/feature.md: |
          ## User Value

          ## Behavior
        .github/PULL_REQUEST_TEMPLATE/bugfix.md: |
          <!-- Explain the failure and correction. -->
          ## Failure

          ## Correction

          ## Testing
  bin:
    gh: |
      #!/bin/sh
      d="$(git rev-parse --show-toplevel)/.fixture-state/gh"
      case "$1 $2" in
        "pr list")
          if [ -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-created" ]; then
            tip=$(git rev-parse HEAD)
            base=$(cat "$d/base")
            draft=false; [ ! -f "$d/draft" ] || draft=true
            printf '1\thttps://github.com/fixture/repo/pull/1\tOPEN\t%s\t%s\t%s\t%s\tfalse\n' "$(cat "$d/head")" "$tip" "$base" "$draft"
            rm -f "$(git rev-parse --show-toplevel)/.fixture-state/gh-created"
            exit 0
          fi
          ;;
        "pr create")
          for argument in "$@"; do
            case "$argument" in
              --help|-h)
                printf 'Usage: gh pr create [flags]\n'
                exit 0
                ;;
            esac
          done
          mkdir -p "$d"
          shift 2
          while [ $# -gt 0 ]; do
            case "$1" in
              --title) printf '%s' "$2" > "$d/title"; shift 2 ;;
              --body) printf '%s' "$2" > "$d/body"; shift 2 ;;
              --body-file) cp "$2" "$d/body"; shift 2 ;;
              --base) printf '%s' "$2" > "$d/base"; shift 2 ;;
              --head) printf '%s' "$2" > "$d/head"; shift 2 ;;
              --draft) : > "$d/draft"; shift ;;
              *) shift ;;
            esac
          done
          cp "$d/body" "$(git rev-parse --show-toplevel)/eval-pr-body.md"
          echo "https://github.com/fixture/repo/pull/1"
          : > "$(git rev-parse --show-toplevel)/.fixture-state/gh-created"
          ;;
        "repo view")
          printf '%s\n' fixture/repo
          ;;
        *)
          echo "mock gh: unsupported: $*" >&2
          exit 1
          ;;
      esac
  setup: |
    git init -q --bare .fixture-state/remote.git
    git --git-dir=.fixture-state/remote.git symbolic-ref HEAD refs/heads/main
    git remote add origin "$PWD/.fixture-state/remote.git"
    git push -qu origin main
    git remote set-head origin main
    git switch -qc fix/DAR-123-timeout-retry
    printf 'retry with backoff\n' > retry.txt
    git add retry.txt
    git commit -qm "fix: retry timed out requests with backoff"
    printf 'retry exhaustion test\n' > retry.test.txt
    git add retry.test.txt
    git commit -qm "test: cover retry exhaustion"
checks:
  - name: PR created
    run: test -f .fixture-state/gh/body && echo created
    expect_exact: created
  - name: selected bugfix template headings kept verbatim
    run: cat .fixture-state/gh/body
    expect_regex: "^## Failure$[\\s\\S]*^## Correction$[\\s\\S]*^## Testing$"
  - name: unselected feature template was not used
    run: grep -c '^## User Value$' .fixture-state/gh/body || true
    expect_exact: "0"
  - name: template comments removed
    run: grep -c '<!--' .fixture-state/gh/body || true
    expect_exact: "0"
semantic_artifact:
  path: eval-pr-body.md
  checks:
    - name: bugfix template sections explain the branch
      proposition: >-
        The Failure section explains the request timeout or retry problem,
        the Correction section explains retry with backoff, and the Testing
        section describes the branch's added retry test coverage or transparently
        reports verification limits. "Added coverage for retry exhaustion" is
        a valid description of the committed test in this branch; it need not
        repeat "committed", name the test file, or add a stock disclaimer.
        Each section has meaningful branch-specific content rather than N/A,
        generic filler, or a repeated keyword.
semantic_output_checks:
  - name: delegated template choice is disclosed
    proposition: >-
      The response names bugfix.md as the chosen PR template and gives a brief
      reason linked to this branch's problem or correction, without claiming
      that the user named that filename. The reason may refer to any one of
      the timeout problem, retry fix, or backoff correction; it need not repeat
      the other details or any prescribed keyword. Both "fits the retry fix"
      and "the branch fixes timed out request behavior" explain the choice in
      context. Merely naming the template without a branch-related reason, or
      referring only to unnamed bug-fix sections, is insufficient.
