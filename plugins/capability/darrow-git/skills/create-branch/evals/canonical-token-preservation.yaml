id: create-branch-canonical-token-preservation
invariant: GW-B1
activation: positive
mount_plugin_skills: true
prompt: >-
  Create a new branch to fix incorrect ticket identifier normalization. Derive
  the complete branch name from that work and use the active ticket provider's
  canonical token issue-64 exactly as supplied.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
checks:
  - name: canonical token is the one leading slug token
    run: git rev-parse --abbrev-ref HEAD
    expect_regex: "^fix/issue-64-[a-z0-9]+(-[a-z0-9]+)*$"
  - name: canonical token occurs once
    run: git rev-parse --abbrev-ref HEAD | grep -oF issue-64 | wc -l | tr -d ' '
    expect_regex: "^1$"
