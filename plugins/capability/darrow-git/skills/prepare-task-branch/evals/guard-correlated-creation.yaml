id: prepare-task-branch-guard-correlated-creation
invariant: GW-TB8
activation: positive
mount_plugin_skills: true
expect_head_change: false
prompt: >-
  Prepare the exact task branch feat/issue-84-new-suffix for canonical ticket
  identifier issue-84 in this checkout. Preserve existing work and do not make a worktree.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
  setup: |
    set -eu
    : "${DARROW_EVAL_MOUNT_EXCLUDES:?expected prepared mount exclusions}"
    state=.git/eval-checks/branch-guard
    mkdir -p "$state"
    git branch fix/issue-84-original
    git branch docs/issue-84-notes
    git branch fix/issue-840-similar
    printf 'user draft\n' > draft.txt
    git show-ref > "$state/refs"
    git worktree list --porcelain > "$state/worktrees"
    git status --porcelain > "$state/status"
    cp .git/info/exclude "$state/exclude"
    printf '%s' "$DARROW_EVAL_MOUNT_EXCLUDES" > "$state/mount-excludes.json"
checks:
  - name: checkout remains unchanged
    run: git branch --show-current
    expect_exact: main
  - name: all refs and tips remain unchanged
    run: git show-ref | diff .git/eval-checks/branch-guard/refs -
    expect_exit: 0
  - name: worktrees remain unchanged
    run: git worktree list --porcelain | diff .git/eval-checks/branch-guard/worktrees -
    expect_exit: 0
  - name: dirty work and ignore configuration remain unchanged
    run: |
      set -eu
      git status --porcelain | diff .git/eval-checks/branch-guard/status -
      test "$(cat draft.txt)" = 'user draft'
      python3 - <<'PY'
      from collections import Counter
      import json
      from pathlib import Path

      state = Path('.git/eval-checks/branch-guard')
      baseline = (state / 'exclude').read_bytes()
      actual = Path('.git/info/exclude').read_bytes()
      paths = json.loads((state / 'mount-excludes.json').read_text())
      assert isinstance(paths, list) and all(isinstance(path, str) for path in paths)
      assert len(paths) == len(set(paths)), 'duplicate declared mount exclusion'
      assert actual.startswith(baseline), 'original ignore configuration changed'
      special = set('\\*?[]#! ')
      expected = [
          '/' + ''.join('\\' + char if char in special else char for char in path)
          for path in paths
      ]
      added = [line for line in actual[len(baseline):].decode().splitlines() if line]
      assert Counter(added) == Counter(expected), 'unexpected or missing mount exclusion'
      PY
      test ! -e .worktrees
    expect_exit: 0
semantic_output_checks:
  - name: refuses duplicate creation and relays complete exact choices
    proposition: >-
      The response reports that the requested preparation was refused because
      correlated local branches already exist and identifies both
      docs/issue-84-notes and fix/issue-84-original as the available candidates.
      A contextual refusal with the helper's error is sufficient; it need not
      repeat the requested branch name or explicitly narrate stopping.
      It does not select a replacement, treat fix/issue-840-similar as a
      correlated candidate, or claim to have prepared any branch.
