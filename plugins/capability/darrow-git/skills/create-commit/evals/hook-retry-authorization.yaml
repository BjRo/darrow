id: create-commit-hook-retry-authorization
invariant: GW-C8
activation: positive
mount_plugin_skills: true
expect_head_change: true
prompt: The commit hook already failed for my staged correction. I corrected src/a.ts only in the working tree, and I explicitly authorize refreshing that staged path and retrying the commit. Do not include notes.txt.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
        src/a.ts: "export const a = 0;\n"
  files:
    src/a.ts: "export const a = 2;\n"
    notes.txt: "unrelated scratch notes\n"
  staged:
    - src/a.ts
  hooks:
    pre-commit: "#!/bin/sh\ngit show :src/a.ts | grep -qx 'export const a = 2;'\n"
  setup: |
    printf 'export const a = 1;\n' > src/a.ts
    git add src/a.ts
    printf 'export const a = 2;\n' > src/a.ts
checks:
  - name: exactly one corrected commit
    run: git rev-list --count HEAD
    expect_regex: "^2$"
  - name: corrected staged path committed
    run: git show HEAD:src/a.ts
    expect_regex: "export const a = 2"
  - name: unrelated work remains excluded
    run: git status --short
    expect_regex: "\\?\\? notes\\.txt"
