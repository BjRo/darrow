id: readiness-ready-concise-request
invariant: IRG-C3,IRG-C9,IRG-C10,IRG-E1,IRG-E2,IRG-E10,SE-C9,SE-C10,SE-C11,SE-C14
activation: positive
mount_plugin_skills: true
prompt: >-
  Assess whether this request is ready for implementation. The authoritative
  request is docs/request.md. Return the implementation-readiness result; do
  not implement it.
fixture:
  commits:
    - message: "chore: init"
      files:
        docs/request.md: |
          # Request

          Add `normalizeEmail(value)` to the public module in `src/email.js`.
          It must trim only surrounding U+0009, U+000A, U+000C, U+000D, and
          U+0020 characters, then lowercase the result using JavaScript's
          locale-independent `toLowerCase()`. Existing behavior is absent.
          Acceptance is the examples
          `" Alice@EXAMPLE.com " -> "alice@example.com"` and `"A@B.C" ->
          "a@b.c"`. Add those assertions to `test/email.test.js` and exercise
          them with `bash test.sh` without changing other APIs.
        src/email.js: "export const identity = (value) => value;\n"
        package.json: |
          {"type":"module"}
        test/email.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity } from "../src/email.js";

          test("existing identity export", () => {
            assert.equal(identity("Value"), "Value");
          });
        test.sh: |
          #!/usr/bin/env bash
          node --test test/email.test.js
checks:
  - name: readiness assessment is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: public verdict is ready
    run: grep -Ei 'verdict.{0,80}ready' .git/last-message.md
  - name: readiness assessment preserves repository refs
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git for-each-ref --format='%(refname)' refs/heads | wc -l | tr -d ' ')" -eq 1 &&
      test -z "$(git remote)"
output_checks:
  - name: one readiness report owns the complete response
    expect_regex: "(?<![\\s\\S])## Implementation readiness[\\s\\S]*^### Findings$[\\s\\S]*\\S\\n?$(?![\\s\\S])"
    not_regex: "^## Implementation readiness$[\\s\\S]*^## Implementation readiness$|^\\*\\*Verdict:\\*\\* `[a-z-]+`$[\\s\\S]*^\\*\\*Verdict:\\*\\* `[a-z-]+`$"
  - name: default result uses the human-readable report
    expect_regex: "^## Implementation readiness$"
  - name: concise observable request is ready
    expect_regex: "^\\*\\*Verdict:\\*\\* `ready`$"
  - name: ready report preserves basis quality bar and empty findings
    expect_regex: "^### Required next action$[\\s\\S]*^- \\*\\*Type:\\*\\* `none`$[\\s\\S]*^- \\*\\*Description:\\*\\* \\S[^\\n]*$[\\s\\S]*^### Basis$[\\s\\S]*^- \\*\\*Source:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Authority:\\*\\* `(authoritative|repository|supporting)`$[\\s\\S]*^  - \\*\\*Status:\\*\\* `(available|missing|contradictory)`$[\\s\\S]*^  - \\*\\*Summary:\\*\\* \\S[^\\n]*$[\\s\\S]*^### Quality bar$[\\s\\S]*^- \\*\\*Criterion:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Oracle:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Verification:\\*\\* \\S[^\\n]*$[\\s\\S]*^### Findings$\\n\\nNone\\.$"
  - name: default result does not claim the JSON representation
    not_regex: '"format"\s*:\s*"darrow-implementation-readiness-v1"'
semantic_output_checks:
  - name: quality bar binds the independent oracles and verification
    proposition: >-
      Taken together, the Oracle fields in the Quality bar preserve both exact
      input/output mappings and tie each mapping to its criterion:
      `" Alice@EXAMPLE.com "` produces `"alice@example.com"`, and `"A@B.C"`
      produces `"a@b.c"`. At least one corresponding Verification field
      includes running `bash test.sh`; it may also require adding assertions or
      inspecting the implementation.
  - name: report is result first concise and complete
    proposition: >-
      The response puts the ready verdict and its next action before detailed
      basis, quality-bar, and findings evidence. It uses direct and familiar
      language without repeated conclusions or process narration, while
      preserving every required readiness field and the exact observable
      examples and verification command.
