id: readiness-goal-contract-stop-with-record
invariant: IRG-C8,IRG-E1,IRG-E6,IRG-E9,SE-C9,SE-C10,SE-C11
activation: positive
mount_plugin_skills: true
prompt: >-
  Execute this bounded goal contract. Before any mutation, use an available
  implementation-readiness capability on docs/request.md. Continue only on
  ready; otherwise stop and preserve the complete readiness result. The outer
  goal contract also requires the final record
  `outer_goal_status<TAB>stopped|complete` on every terminal path. Authorized
  after ready: edit policy.js. Not authorized: invent policy, commit, push, or
  omit either result contract. Do not request a machine-readable format.
fixture:
  commits:
    - message: "chore: init"
      files:
        docs/request.md: |
          # Retry policy

          Use either fixed-delay or exponential retries. Both are acceptable,
          but no policy has been selected.
        policy.js: "export const retry = 'none';\n"
checks:
  - name: non-ready outer goal causes no mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: complete semantic readiness result is preserved
    run: >-
      awk '/^outer_goal_status/{exit} {print}' .git/last-message.md >.git/readiness-document.txt &&
      grep -Ei '^#{1,3}[[:space:]]+Implementation readiness' .git/readiness-document.txt >/dev/null &&
      grep -Ei 'verdict.{0,80}needs-decision' .git/readiness-document.txt >/dev/null &&
      grep -Ei 'basis' .git/readiness-document.txt >/dev/null &&
      grep -Ei 'quality bar' .git/readiness-document.txt >/dev/null &&
      grep -Ei 'findings' .git/readiness-document.txt >/dev/null &&
      grep -Ei 'required next action' .git/readiness-document.txt >/dev/null &&
      grep -Ei 'type.{0,80}decision' .git/readiness-document.txt >/dev/null &&
      ! grep -Eq '"format"[[:space:]]*:[[:space:]]*"darrow-implementation-readiness-v1"' .git/readiness-document.txt
  - name: outer completion record is also preserved
    run: grep -F "outer_goal_status$(printf '\t')stopped" .git/last-message.md
  - name: non-ready outer goal preserves repository refs
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git for-each-ref --format='%(refname)' refs/heads | wc -l | tr -d ' ')" -eq 1 &&
      test -z "$(git remote)"
output_checks:
  - name: composed result uses the human-readable report
    expect_regex: "^## Implementation readiness$"
  - name: result contains the decision verdict and outer record
    expect_regex: "^\\*\\*Verdict:\\*\\* `needs-decision`$[\\s\\S]*^`?outer_goal_status\\tstopped`?$"
  - name: result preserves typed basis fields
    expect_regex: "^### Basis$[\\s\\S]*^- \\*\\*Source:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Authority:\\*\\* `(authoritative|repository|supporting)`$[\\s\\S]*^  - \\*\\*Status:\\*\\* `(available|missing|contradictory)`$[\\s\\S]*^  - \\*\\*Summary:\\*\\* \\S[^\\n]*$[\\s\\S]*^### Quality bar$"
  - name: composed quality bar is explicitly empty or contains typed items
    expect_regex: "^### Quality bar$\\n\\n(?:None\\.|- \\*\\*Criterion:\\*\\* \\S[^\\n]*\\n  - \\*\\*Oracle:\\*\\* \\S[^\\n]*\\n  - \\*\\*Verification:\\*\\* \\S[^\\n]*(?:\\n\\n- \\*\\*Criterion:\\*\\* \\S[^\\n]*\\n  - \\*\\*Oracle:\\*\\* \\S[^\\n]*\\n  - \\*\\*Verification:\\*\\* \\S[^\\n]*)*)\\n\\n### Findings$"
  - name: result preserves typed finding fields
    expect_regex: "^### Findings$[\\s\\S]*^- \\*\\*Type:\\*\\* `(missing-information|unresolved-decision|contradiction|dependency|permission|quality-bar-gap)`$[\\s\\S]*^  - \\*\\*Summary:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Evidence:\\*\\*$[\\s\\S]*^    - \\S[^\\n]*$"
  - name: complete readiness result precedes the outer record
    expect_regex: "^### Required next action$[\\s\\S]*^- \\*\\*Type:\\*\\* `decision`$[\\s\\S]*^- \\*\\*Description:\\*\\* \\S[^\\n]*$[\\s\\S]*^### Basis$[\\s\\S]*^### Findings$[\\s\\S]*^`?outer_goal_status\\tstopped`?\\n?$"
  - name: composition alone does not select JSON
    not_regex: '"format"\s*:\s*"darrow-implementation-readiness-v1"'
