id: readiness-json-explicit-ready
invariant: IRG-C3,IRG-C9,IRG-E1,IRG-E2,IRG-E9,SE-C9,SE-C10,SE-C11,SE-C14
activation: positive
mount_plugin_skills: true
prompt: >-
  Is this ready for implementation? Replace the user-facing phrase "Master
  account" with "Primary account" in README.md only. It is complete when the
  old phrase no longer appears in that file, the new phrase appears once, and
  `bash check.sh` passes. There is no ticket or implementation plan. This
  result will be consumed by CI automation, so return the
  darrow-implementation-readiness-v1 JSON representation as exactly one raw
  JSON object without a code fence or surrounding prose. Assess readiness only;
  do not make the edit.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: |
          # Accounts

          Configure the Master account before inviting members.
        check.sh: |
          #!/usr/bin/env bash
          ! grep -F 'Master account' README.md >/dev/null &&
            test "$(grep -Fc 'Primary account' README.md)" -eq 1
checks:
  - name: explicit JSON assessment is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: explicit JSON assessment preserves repository refs
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git for-each-ref --format='%(refname)' refs/heads | wc -l | tr -d ' ')" -eq 1 &&
      test -z "$(git remote)"
output_checks:
  - name: explicit machine result is one raw schema-valid object
    valid_json: true
    schema: ./evals/result.schema.json
  - name: explicit machine request retains the ready verdict
    json_path: /verdict
    expect_json: ready
  - name: explicit machine request has no next action
    json_path: /required_next_action/type
    expect_json: none
semantic_output_checks:
  - name: authoritative JSON carries the concrete ready evidence
    proposition: >-
      The JSON object identifies the user's requested phrase replacement as
      available authoritative basis, uses README.md and check.sh as relevant
      repository evidence, has no readiness findings, and its quality bar uses
      absence of "Master account" plus exactly one "Primary account" as the
      oracle and `bash check.sh` as the verification method.
