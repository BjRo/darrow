id: readiness-no-trigger-planning
invariant: IRG-C1,IRG-E1,SE-C9,SE-C10,SE-C11
activation: negative
mount_plugin_skills: true
prompt: >-
  Draft a concise implementation plan for adding configurable request timeouts
  to this service. Identify the public seam, likely work areas, and verification
  strategy. Do not modify the repository.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: |
          # Service

          Requests currently use a fixed timeout from `src/config.js`.
        src/config.js: "export const DEFAULT_TIMEOUT_MS = 1000;\n"
checks:
  - name: planning intent causes no repository mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: response addresses the requested planning dimensions
    run: >-
      grep -Ei 'public|interface|seam' .git/last-message.md >/dev/null &&
      grep -Ei 'config|timeout' .git/last-message.md >/dev/null &&
      grep -Ei 'verify|test|check' .git/last-message.md >/dev/null
output_checks:
  - name: planning intent does not become a readiness verdict
    not_regex: "(^|\\n)#{1,3}\\s+Implementation readiness|darrow-implementation-readiness-v1|needs-discovery|needs-decision"
    flags: i
