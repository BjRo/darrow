id: readiness-needs-discovery
invariant: IRG-C4,IRG-E1,IRG-E2,SE-C9,SE-C10,SE-C11,SE-C14
activation: positive
mount_plugin_skills: true
prompt: >-
  Can engineering safely start the work in docs/request.md without inventing
  important details? Use the request and repository evidence to answer. Do not
  plan or implement the change.
fixture:
  commits:
    - message: "chore: init"
      files:
        docs/request.md: |
          # Import performance

          Make customer imports at least 50% faster without changing results.
          Follow the repository performance policy. The improvement must be
          demonstrated before release.
        docs/performance-policy.md: |
          # Performance discovery policy

          Before implementation, use the sanitized production row counts in
          samples/import-row-counts.txt to select the median-size workload and
          capture the current median of 20 runs with the available
          `bash benchmark.sh` harness. A separate performance-discovery run
          must record that baseline before the implementation goal begins.
          This establishes the representative workload and baseline; it is an
          evidence-gathering task and requires no product choice. Preserve
          output by comparing result hashes.
        samples/import-row-counts.txt: |
          100
          500
          1000
        benchmark.sh: |
          #!/usr/bin/env bash
          set -eu
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { performance } from "node:perf_hooks";
            import { importCustomers } from "./src/import.js";
            const rows = Array.from({length: 500}, (_, id) => ({id}));
            const samples = [];
            let result = [];
            for (let run = 0; run < 20; run += 1) {
              const start = performance.now();
              result = importCustomers(rows);
              samples.push(performance.now() - start);
            }
            samples.sort((a, b) => a - b);
            const hash = createHash("sha256")
              .update(JSON.stringify(result)).digest("hex");
            console.log(`median_ms=${samples[10]} output_hash=${hash}`);'
        package.json: |
          {"type":"module"}
        src/import.js: |
          export function importCustomers(rows) {
            return rows.map((row) => ({ ...row, imported: true }));
          }
checks:
  - name: discovery verdict causes no repository mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: public verdict needs discovery
    run: grep -Ei 'verdict.{0,80}needs-discovery' .git/last-message.md
  - name: discovery verdict preserves repository refs
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git for-each-ref --format='%(refname)' refs/heads | wc -l | tr -d ' ')" -eq 1 &&
      test -z "$(git remote)"
output_checks:
  - name: one readiness report owns the complete response
    expect_regex: "(?<![\\s\\S])## Implementation readiness[\\s\\S]*^### Findings$[\\s\\S]*\\S\\s*$(?![\\s\\S])"
    not_regex: "^## Implementation readiness$[\\s\\S]*^## Implementation readiness$|^\\*\\*Verdict:\\*\\* `[a-z-]+`$[\\s\\S]*^\\*\\*Verdict:\\*\\* `[a-z-]+`$"
  - name: default result uses the human-readable report
    expect_regex: "^## Implementation readiness$"
  - name: missing benchmark facts need discovery
    expect_regex: "^\\*\\*Verdict:\\*\\* `needs-discovery`$"
  - name: next action is bounded discovery
    expect_regex: "^### Required next action$[\\s\\S]*^- \\*\\*Type:\\*\\* `discovery`$[\\s\\S]*^- \\*\\*Description:\\*\\* \\S[^\\n]*$\\n\\n### Basis$"
  - name: default result preserves typed basis and finding fields
    expect_regex: "^### Basis$[\\s\\S]*^- \\*\\*Source:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Authority:\\*\\* `(authoritative|repository|supporting)`$[\\s\\S]*^  - \\*\\*Status:\\*\\* `(available|missing|contradictory)`$[\\s\\S]*^  - \\*\\*Summary:\\*\\* \\S[^\\n]*$[\\s\\S]*^### Quality bar$[\\s\\S]*^### Findings$[\\s\\S]*^- \\*\\*Type:\\*\\* `(missing-information|unresolved-decision|contradiction|dependency|permission|quality-bar-gap)`$[\\s\\S]*^  - \\*\\*Summary:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Evidence:\\*\\*$[\\s\\S]*^    - \\S[^\\n]*$"
  - name: quality bar is explicitly empty or contains typed items
    expect_regex: "^### Quality bar$\\n\\n(?:None\\.|- \\*\\*Criterion:\\*\\* \\S[^\\n]*\\n  - \\*\\*Oracle:\\*\\* \\S[^\\n]*\\n  - \\*\\*Verification:\\*\\* \\S[^\\n]*(?:\\n\\n?- \\*\\*Criterion:\\*\\* \\S[^\\n]*\\n  - \\*\\*Oracle:\\*\\* \\S[^\\n]*\\n  - \\*\\*Verification:\\*\\* \\S[^\\n]*)*)\\n\\n### Findings$"
  - name: default result does not claim the JSON representation
    not_regex: '"format"\s*:\s*"darrow-implementation-readiness-v1"'
semantic_output_checks:
  - name: benchmark evidence is the first readiness action
    proposition: >-
      The response says implementation must wait for a bounded discovery run
      that selects the representative workload and records the current
      benchmark baseline while preserving result equivalence; it does not turn
      that evidence-gathering step into a product-policy decision.
