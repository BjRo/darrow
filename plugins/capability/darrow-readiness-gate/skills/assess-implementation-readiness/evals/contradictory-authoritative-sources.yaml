id: readiness-contradictory-authoritative-sources
invariant: IRG-C2,IRG-E1,IRG-E2,SE-C9,SE-C10,SE-C11,SE-C14
activation: positive
mount_plugin_skills: true
prompt: >-
  Assess whether docs/request.md is ready for implementation using the named
  authoritative policies. Return the implementation-readiness result without
  choosing between conflicting requirements or implementing the change.
fixture:
  commits:
    - message: "chore: init"
      files:
        docs/request.md: |
          # Account export expiry

          Implement expiry for generated account-export archives. Both
          docs/security-policy.md and docs/support-policy.md are authoritative
          for this behavior, neither has precedence, and no policy owner or
          other permitted source can reconcile them before next month's
          governance review.
        docs/security-policy.md: |
          # Security policy

          Generated account-export archives must be permanently deleted 24
          hours after creation.
        docs/support-policy.md: |
          # Support policy

          Generated account-export archives must remain downloadable for 30
          days after creation.
        src/exports.js: "export function expiresAt() {}\n"
checks:
  - name: contradictory authority causes no repository mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: contradictory authority blocks implementation
    run: grep -Ei 'verdict.{0,80}blocked' .git/last-message.md
  - name: contradictory authority preserves repository refs
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git for-each-ref --format='%(refname)' refs/heads | wc -l | tr -d ' ')" -eq 1 &&
      test -z "$(git remote)"
output_checks:
  - name: one readiness report owns the complete response
    expect_regex: "(?<![\\s\\S])## Implementation readiness[\\s\\S]*^### Findings$[\\s\\S]*\\S\\n?$(?![\\s\\S])"
    not_regex: "^## Implementation readiness$[\\s\\S]*^## Implementation readiness$|^\\*\\*Verdict:\\*\\* `[a-z-]+`$[\\s\\S]*^\\*\\*Verdict:\\*\\* `[a-z-]+`$"
  - name: contradictory authoritative inputs are blocked
    expect_regex: "^\\*\\*Verdict:\\*\\* `blocked`$"
  - name: reconciliation is the required unblock action
    expect_regex: "^### Required next action$[\\s\\S]*^- \\*\\*Type:\\*\\* `unblock`$[\\s\\S]*^- \\*\\*Description:\\*\\* \\S[^\\n]*$\\n\\n### Basis$"
  - name: default result preserves typed basis and finding fields
    expect_regex: "^### Basis$[\\s\\S]*^- \\*\\*Source:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Authority:\\*\\* `(authoritative|repository|supporting)`$[\\s\\S]*^  - \\*\\*Status:\\*\\* `(available|missing|contradictory)`$[\\s\\S]*^  - \\*\\*Summary:\\*\\* \\S[^\\n]*$[\\s\\S]*^### Quality bar$[\\s\\S]*^### Findings$[\\s\\S]*^- \\*\\*Type:\\*\\* `contradiction`$[\\s\\S]*^  - \\*\\*Summary:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Evidence:\\*\\*$[\\s\\S]*^    - \\S[^\\n]*$"
  - name: quality bar is explicitly empty or contains typed items
    expect_regex: "^### Quality bar$\\n\\n(?:None\\.|- \\*\\*Criterion:\\*\\* \\S[^\\n]*\\n  - \\*\\*Oracle:\\*\\* \\S[^\\n]*\\n  - \\*\\*Verification:\\*\\* \\S[^\\n]*(?:\\n\\n- \\*\\*Criterion:\\*\\* \\S[^\\n]*\\n  - \\*\\*Oracle:\\*\\* \\S[^\\n]*\\n  - \\*\\*Verification:\\*\\* \\S[^\\n]*)*)\\n\\n### Findings$"
  - name: default result does not claim the JSON representation
    not_regex: '"format"\s*:\s*"darrow-implementation-readiness-v1"'
semantic_output_checks:
  - name: conflicting authority is preserved without invention
    proposition: >-
      The response preserves both authoritative requirements—permanent deletion
      after 24 hours and download availability for 30 days—does not choose or
      invent precedence between them, and asks for authoritative reconciliation
      or precedence before implementation can start.
