id: readiness-ready-without-plan
invariant: IRG-C6,IRG-E1,IRG-E4,SE-C9,SE-C10,SE-C11,SE-C14
activation: positive
mount_plugin_skills: true
prompt: >-
  Is this ready for implementation? Replace the user-facing phrase "Master
  account" with "Primary account" in README.md only. It is complete when the
  old phrase no longer appears in that file, the new phrase appears once, and
  `bash check.sh` passes. There is no ticket or implementation plan. Assess
  readiness only; do not make the edit.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: |
          # Accounts

          Configure the Master account before inviting members.
        check.sh: |
          #!/usr/bin/env bash
          ! grep -F 'Master account' README.md >/dev/null &&
            test "$(grep -Fc 'Primary account' README.md)" -eq 1
checks:
  - name: proportional assessment remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: public verdict is ready without planning ceremony
    run: grep -Ei 'verdict.{0,80}ready' .git/last-message.md
  - name: proportional assessment preserves repository refs
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git for-each-ref --format='%(refname)' refs/heads | wc -l | tr -d ' ')" -eq 1 &&
      test -z "$(git remote)"
output_checks:
  - name: one readiness report owns the complete response
    expect_regex: "(?<![\\s\\S])## Implementation readiness[\\s\\S]*^- \\*\\*Description:\\*\\* \\S[^\\n]*\\n?$(?![\\s\\S])"
    not_regex: "^## Implementation readiness$[\\s\\S]*^## Implementation readiness$|^\\*\\*Verdict:\\*\\* `[a-z-]+`$[\\s\\S]*^\\*\\*Verdict:\\*\\* `[a-z-]+`$"
  - name: default result uses the human-readable report
    expect_regex: "^## Implementation readiness$"
  - name: exact mechanical request is ready without formal planning
    expect_regex: "^\\*\\*Verdict:\\*\\* `ready`$"
  - name: ready report preserves basis quality bar and empty findings
    expect_regex: "^### Basis$[\\s\\S]*^- \\*\\*Source:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Authority:\\*\\* `(authoritative|repository|supporting)`$[\\s\\S]*^  - \\*\\*Status:\\*\\* `(available|missing|contradictory)`$[\\s\\S]*^  - \\*\\*Summary:\\*\\* \\S[^\\n]*$[\\s\\S]*^### Quality bar$[\\s\\S]*^- \\*\\*Criterion:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Oracle:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Verification:\\*\\* \\S[^\\n]*$[\\s\\S]*^### Findings$\\n\\nNone\\.$[\\s\\S]*^### Required next action$[\\s\\S]*^- \\*\\*Type:\\*\\* `none`$[\\s\\S]*^- \\*\\*Description:\\*\\* \\S[^\\n]*$"
  - name: default result does not claim the JSON representation
    not_regex: '"format"\s*:\s*"darrow-implementation-readiness-v1"'
semantic_output_checks:
  - name: bounded mechanical work needs no planning ceremony
    proposition: >-
      The response accepts the request as ready from its exact file scope,
      phrase-replacement oracle, and feasible check, without treating the lack
      of a ticket, implementation plan, or predetermined implementation steps
      as a readiness blocker.
