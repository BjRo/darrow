id: readiness-goal-contract-continue
invariant: IRG-C8,IRG-E1,IRG-E6,SE-C9,SE-C10,SE-C11
activation: positive
mount_plugin_skills: true
prompt: >-
  Execute this bounded goal contract. Outcome: config.json uses a 2500 ms
  timeout. Before any repository mutation, use an available
  implementation-readiness capability. Continue only if its verdict is ready;
  otherwise stop and report its result. Acceptance: `timeoutMs` equals 2500
  and `bash check.sh` passes. Authorized effects after a ready verdict: edit
  config.json. Not authorized: commits, pushes, pull requests, or unrelated
  edits. On completion, report the exact phrase `implementation readiness:
  ready` and the quality bar used.
fixture:
  commits:
    - message: "chore: init"
      files:
        config.json: '{"timeoutMs":1000}\n'
        check.sh: |
          #!/usr/bin/env bash
          grep -Eq '"timeoutMs"[[:space:]]*:[[:space:]]*2500' config.json
checks:
  - name: ready composed goal continues to its authorized outcome
    run: bash check.sh
  - name: composed goal changes only the authorized file
    run: test "$(git status --porcelain --untracked-files=all | awk '{print $2}')" = config.json
  - name: composed goal does not commit
    run: test "$(git rev-list --count HEAD)" -eq 1
  - name: composed completion reports the ready gate
    run: grep -Ei 'readiness.{0,160}ready|ready.{0,160}readiness' .git/last-message.md
output_checks:
  - name: completion reports a ready gate
    expect_regex: "implementation readiness: ready[\\s\\S]+quality bar"
    flags: i
