id: principle-exhaust-the-design-space-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-exhaust-the-design-space for the concrete decision in decision.md.
  Give a concise recommendation within its existing authority. Do not edit files or
  execute another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          A consequential new interaction has no clear precedent. There are three
          structurally different designs and one uncertain caller assumption. Full
          alternative implementations would be expensive, and the owner forbids
          delegation. What comparison is proportionate?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Compare two or three structural alternatives using proportionate sketches,
      types, examples or a small experiment to resolve the caller assumption. Require
      neither complete implementations nor extra agents or specific models.
native_goal: forbidden
