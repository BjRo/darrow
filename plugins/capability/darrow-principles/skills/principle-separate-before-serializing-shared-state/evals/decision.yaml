id: principle-separate-before-serializing-shared-state-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-separate-before-serializing-shared-state for the concrete decision
  in decision.md. Give a concise recommendation within its existing authority. Do not edit
  files or execute another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          Two independent workers mutate one shared scratch object, but their intermediate
          results need no sharing. Should a global lock be the first design change?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Separate independent worker ownership and state before introducing a global
      lock or serialization; retain coordination only for genuinely required sharing and
      guarantees.
native_goal: forbidden
