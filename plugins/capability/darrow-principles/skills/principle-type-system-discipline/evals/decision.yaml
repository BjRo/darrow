id: principle-type-system-discipline-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-type-system-discipline for the concrete decision in decision.md.
  Give a concise recommendation within its existing authority. Do not edit files or
  execute another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          A renderer receives either a successful numeric result or an error message.
          There is no nominal-ID confusion or generic relationship, and input originates
          at an untrusted boundary. Recommend a signature approach.
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Use a simple discriminated union with separate success and error variants,
      avoiding mixed invalid fields and unnecessary branding or generics. Preserve
      necessary runtime validation of untrusted input.
native_goal: forbidden
