id: principles-first-matrix-missing-skill
activation: positive
mount_plugin_skills: true
invariant: PF-R6,PF-AC7
expect_head_change: false
prompt: Use a principles-first approach to compare request.md. Do not edit files.
fixture:
  commits:
    - message: "chore: init"
      files:
        request.md: >
          Design A requires a central registry runtime in every plugin. Design B passes an
          optional approach through a public handoff; plugins remain independently
          installable.
        .darrow/principles.md: |
          # Principles routing

          | ID | Trigger | Reference |
          | --- | --- | --- |
          | unavailable | Comparing plugin designs | skill:principle-unavailable-fixture |
          | available | Comparing plugin designs | custom-principles/local.md |
        .darrow/custom-principles/local.md: >
          # Local independence


          Prefer Design B, which uses an optional public handoff and avoids a shared
          runtime dependency. Explain the maintenance consequence. Include the exact
          receipt available-guidance-pine to identify this local guidance.
checks:
  - name: applying guidance changes no tracked or user files
    run: test -z "$(git status --porcelain)"
native_goal: forbidden
output_checks:
  - name: available guidance still applies
    expect_regex: available-guidance-pine
semantic_output_checks:
  - name: missing valid skill is notice and continue
    proposition:
      Briefly identify principle-unavailable-fixture as unavailable guidance and
      continue with available guidance and judgment, without claiming the missing skill
      was applied or requiring restoration before continuing.
