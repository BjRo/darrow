id: principles-first-matrix-unreadable-selected
activation: positive
mount_plugin_skills: true
invariant: PF-R2,PF-R6,PF-AC3,PF-AC7
expect_head_change: false
prompt: Use a principles-first approach to compare request.md. Do not edit files.
fixture:
  commits:
    - message: "chore: init"
      files:
        request.md: >
          Design A requires a central registry runtime in every plugin. Design B passes an
          optional approach through a public handoff; plugins remain independently
          installable.
        .darrow/principles.md: |
          # Principles routing

          | ID | Trigger | Reference |
          | --- | --- | --- |
          | repo-route | Comparing plugin designs | custom-principles/local.md |
        .darrow/custom-principles/local.md: >
          # Local independence


          Prefer Design B, which uses an optional public handoff and avoids a shared
          runtime dependency. Explain the maintenance consequence. Include the exact
          receipt unreadable-fallback-wrong to identify this local guidance.
  setup: |
    mkdir -p "$HOME/.darrow"
    printf "unreadable selected config\n" >"$HOME/.darrow/principles.md"
    chmod 000 "$HOME/.darrow/principles.md"
checks:
  - name: applying guidance changes no tracked or user files
    run: test -z "$(git status --porcelain)"
native_goal: forbidden
output_checks:
  - name: no repository fallback guidance is applied
    not_regex: unreadable-fallback-wrong
semantic_output_checks:
  - name: selected read failure stops with path and actual error
    proposition: Stop applying the approach because the selected personal
      .darrow/principles.md is unreadable. Identify its path and actual permission/read
      error, without substituting repository or bundled guidance.
