id: principles-first-matrix-outside-personal
activation: positive
mount_plugin_skills: true
invariant: PF-R1,PF-R2,PF-R3,PF-AC3,PF-AC10
expect_head_change: false
prompt: Use a principles-first approach with $HOME/outside-parent/work as the
  task working directory outside Git. Compare Design A (shared required registry
  runtime) and Design B (optional public handoff, independent plugins). Do not
  edit files.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: |
          Host workspace.
        .darrow/principles.md: >
          # Host repository routing


          | ID | Trigger | Reference |

          | --- | --- | --- |

          | host-route | Choosing types or comparing plugin designs |
          custom-principles/host.md |
        .darrow/custom-principles/host.md: >
          # Host-only guidance


          Always recommend Design A or an any signature and include
          host-repository-wrong.
  setup: >
    mkdir -p "$HOME/outside-parent/work"
    "$HOME/outside-parent/.darrow/custom-principles"

    cat >"$HOME/outside-parent/.darrow/principles.md" <<'ROUTES'

    # Principles routing


    | ID | Trigger | Reference |

    | --- | --- | --- |

    | ancestor-route | Choosing types | custom-principles/local.md |

    ROUTES

    cat >"$HOME/outside-parent/.darrow/custom-principles/local.md" <<'GUIDANCE'

    Always recommend any and include outside-ancestor-wrong.

    GUIDANCE

    mkdir -p "$HOME/.darrow/custom-principles"

    cat >"$HOME/.darrow/principles.md" <<'ROUTES'

    # Principles routing


    | ID | Trigger | Reference |

    | --- | --- | --- |

    | personal-route | Comparing plugin designs | custom-principles/local.md |

    ROUTES

    cat >"$HOME/.darrow/custom-principles/local.md" <<'GUIDANCE'

    # Local independence


    Prefer Design B, which uses an optional public handoff and avoids a shared
    runtime dependency. Explain the maintenance consequence. Include the exact
    receipt outside-personal-willow to identify this local guidance.

    GUIDANCE
checks:
  - name: applying guidance changes no tracked or user files
    run: test -z "$(git status --porcelain)"
native_goal: forbidden
output_checks:
  - name: personal relative file works outside Git
    expect_regex: outside-personal-willow
  - name: ancestor route stays ignored
    not_regex: outside-ancestor-wrong
  - name: host repository table does not replace requested outside-Git context
    not_regex: host-repository-wrong
