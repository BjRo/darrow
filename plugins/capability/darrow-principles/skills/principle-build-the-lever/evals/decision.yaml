id: principle-build-the-lever-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-build-the-lever for the concrete decision in decision.md. Give a
  concise recommendation within its existing authority. Do not edit files or execute
  another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          An authorized rename touches many repetitive call sites. An existing codemod
          fits, but its output has not been checked. Should a new generic migration
          framework be built before the rename?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Prefer the fitting existing deterministic codemod, validate representative
      output before wider use, and avoid a new framework whose maintenance is not
      justified by this task.
native_goal: forbidden
