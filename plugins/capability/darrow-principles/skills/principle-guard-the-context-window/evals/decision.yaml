id: principle-guard-the-context-window-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-guard-the-context-window for the concrete decision in decision.md.
  Give a concise recommendation within its existing authority. Do not edit files or
  execute another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          A defect investigation has a large log and one known failing request ID. The
          host and owner allow no delegation. How should context be gathered for the next
          decision?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Use narrow searches and bounded reads around the failing request, retain
      material constraints, decisions and evidence references, and continue without
      requiring delegation.
native_goal: forbidden
