id: principle-migrate-callers-then-delete-legacy-apis-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-migrate-callers-then-delete-legacy-apis for the concrete decision in
  decision.md. Give a concise recommendation within its existing authority. Do not edit
  files or execute another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          A private internal helper has no external or forwarding compatibility
          obligation. Every caller, test, example and document can migrate in this change.
          When can it be removed?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Migrate all internal callers, tests, examples and documentation, then remove
      the old helper and verify the originally intended entrypoints; do not retain a
      compatibility layer with no obligation.
native_goal: forbidden
