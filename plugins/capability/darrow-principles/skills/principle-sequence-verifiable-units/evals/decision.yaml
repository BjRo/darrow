id: principle-sequence-verifiable-units-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-sequence-verifiable-units for the concrete decision in decision.md.
  Give a concise recommendation within its existing authority. Do not edit files or
  execute another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          A dependent three-step migration has agreed checks after each coherent unit. A
          red/green test is expected to fail inside the first unit. No Git effects are
          authorized. How should work advance?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Establish a baseline, finish and check the first coherent unit before
      dependent work, allowing the agreed internal red phase but requiring the unit checks
      before advancing. Grant no commit, rebase or publication authority.
native_goal: forbidden
