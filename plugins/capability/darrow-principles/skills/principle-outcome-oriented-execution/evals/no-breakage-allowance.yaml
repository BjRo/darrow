id: principle-outcome-oriented-execution-no-breakage-allowance
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-outcome-oriented-execution for decision.md. Give advice only; do not
  edit files.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          An internal migration is authorized, but no temporary breakage phase was agreed.
          The documented public command must keep working. May it remain broken after this
          unit merely because the final rewrite will eventually replace it?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Preserve the required public command behavior because no breakage allowance
      exists. A future final rewrite does not authorize leaving required behavior broken
      or bypassing the current unit checks.
native_goal: forbidden
