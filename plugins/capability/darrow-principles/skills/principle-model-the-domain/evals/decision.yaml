id: principle-model-the-domain-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-model-the-domain for the concrete decision in decision.md. Give a
  concise recommendation within its existing authority. Do not edit files or execute
  another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          Every handler repeats assumptions that a job is either pending with no result,
          succeeded with a result, or failed with an error. What structure should replace
          scattered checks?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Represent the valid job states and their associated fields in a suitable
      domain structure so callers do not reconstruct those rules from scattered branches,
      without a general framework.
native_goal: forbidden
