id: principle-test-behavior-not-implementation-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-test-behavior-not-implementation for the concrete decision in
  decision.md. Give a concise recommendation within its existing authority. Do not edit
  files or execute another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          A public formatter promises normalized output. One proposed test asserts its
          private helper order; another supplies independent input and expected output
          from acceptance. Which test survives implementation changes?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Choose the public input/output contract test with an independent expected
      result, rather than private helper order or recomputing the production algorithm.
native_goal: forbidden
