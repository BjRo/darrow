id: principle-fix-root-causes-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-fix-root-causes for the concrete decision in decision.md. Give a
  concise recommendation within its existing authority. Do not edit files or execute
  another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          A UI guard hides an unexpected empty ID produced by an upstream parser. Empty
          IDs are invalid at that producer boundary, unlike a legitimate absent optional
          ID elsewhere. The related parser cases are in scope. What should be
          investigated?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Reproduce and trace the first invalid empty ID to its producer rather than
      only hiding it in the UI. Distinguish legitimate optional absence, check related
      in-scope cases, and report or seek a decision for any needed scope expansion.
native_goal: forbidden
