id: principle-minimize-reader-load-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-minimize-reader-load for the concrete decision in decision.md. Give
  a concise recommendation within its existing authority. Do not edit files or execute
  another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          A scoped configuration refactor requires maintainers to trace four wrappers and
          remember which hidden global flag the fourth wrapper sets. What should improve?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Make the relevant configuration relationship and state visible with less
      needless indirection and remembered hidden state, while preserving meaningful domain
      structure.
native_goal: forbidden
