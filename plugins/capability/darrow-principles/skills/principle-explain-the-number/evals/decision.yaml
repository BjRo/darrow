id: principle-explain-the-number-decision
activation: positive
mount_plugin_skills: true
invariant: PF-R8,PF-AC9
expect_head_change: false
prompt:
  Use principle-explain-the-number for the concrete decision in decision.md. Give a
  concise recommendation within its existing authority. Do not edit files or execute
  another implementation attempt.
fixture:
  commits:
    - message: "chore: init"
      files:
        decision.md: >
          A proposed 20% performance claim compares a warm candidate run to a cold
          baseline run, without confirming that the candidate processed the full fixture.
          What evidence is needed before using the number?
checks:
  - name: advice preserves task authority
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: decision follows the accepted principle within its limits
    proposition:
      Define the metric and decision, confirm the intended workload ran, compare
      equivalent conditions, account for variation and retain supporting evidence before
      accepting the performance claim. Require no particular tool or fixed trial count.
native_goal: forbidden
