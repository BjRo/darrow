id: explain-visually-file-responsibility
invariant: VE-C2,VE-C3,VE-C5,VE-C7
activation: positive
mount_plugin_skills: true
prompt: Map where command parsing, session state, and API transport live in this
  repository. Use a shallow responsibility view with source anchors, not a prose
  tour, and leave the repository unchanged.
fixture:
  commits:
    - message: "chore: init"
      files:
        src/commands/parse.ts: |
          export const parseCommand = (input: string) => input.trim().split(/\s+/)
        src/sessions/store.ts: |
          export class SessionStore { private sessions = new Map() }
        src/transport/client.ts: |
          export const sendRequest = (request: Request) => fetch(request)
        src/index.ts: |
          export { parseCommand } from "./commands/parse"
          export { SessionStore } from "./sessions/store"
          export { sendRequest } from "./transport/client"
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: responsibility tree includes commands
    expect_regex: ^[ \t]*(?:\|--|`--|├|└).*commands[/\\]
  - name: responsibility tree includes sessions
    expect_regex: ^[ \t]*(?:\|--|`--|├|└).*sessions[/\\]
  - name: responsibility tree includes transport
    expect_regex: ^[ \t]*(?:\|--|`--|├|└).*transport[/\\]
  - name: responsibility labels remain visible
    expect_regex: pars(e|ing)|session state|API|request
    flags: i
  - name: response has a source directory root
    expect_regex: ^src[/\\]$
  - name: response stays compact
    not_regex: ^(?:[^\r\n]*\r?\n){22}[^\r\n]+
