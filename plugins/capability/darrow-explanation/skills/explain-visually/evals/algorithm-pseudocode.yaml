id: explain-visually-algorithm-pseudocode
invariant: VE-C2,VE-C3,VE-C5,VE-C7
activation: positive
mount_plugin_skills: true
prompt: Explain nextDelay as compact pseudocode. Preserve invalid-attempt
  handling, the exponential cap, and the jitter range. Do not modify files and
  do not restate the TypeScript line by line.
fixture:
  commits:
    - message: "chore: init"
      files:
        src/retry.ts: |
          const BASE_MS = 100
          const MAX_MS = 30_000

          // random returns a uniformly distributed number in [0, 1).
          export function nextDelay(attempt: number, random: () => number): number {
            if (attempt < 1) throw new Error("attempt must be positive")
            const capped = Math.min(BASE_MS * 2 ** (attempt - 1), MAX_MS)
            return Math.floor(capped / 2 + random() * capped / 2)
          }
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: pseudocode preserves the material algorithm
    proposition:
      The response presents compact pseudocode for nextDelay that rejects
      an invalid attempt below one, applies exponential growth capped at 30,000
      milliseconds, and returns an integer delay randomized within the upper
      half of the capped delay. It does not merely transliterate the TypeScript
      source line by line.
output_checks:
  - name: response is pseudocode
    expect_regex: if|return
    flags: i
  - name: response stays compact
    not_regex: ^(?:[^\r\n]*\r?\n){24}[^\r\n]+
  - name: unrelated collaborators are not invented
    not_regex: database|queue|network|cache|normal distribution
    flags: i
