id: explain-visually-implicit-visual-explanation
activation: positive
mount_plugin_skills: true
prompt: >-
  Could you explain visually what happens when submitJob runs in this
  repository? Keep the answer inline and leave files unchanged.
fixture:
  commits:
    - message: "chore: init"
      files:
        src/jobs.ts: |
          export function submitJob(job: Job): string {
            const checked = validateJob(job)
            const id = storeJob(checked)
            enqueueJob(id)
            return id
          }

          function validateJob(job: Job): Job {
            if (!job.kind) throw new Error("kind is required")
            return job
          }

          function storeJob(job: Job): string {
            return database.jobs.insert(job)
          }

          function enqueueJob(id: string): void {
            queue.publish({ type: "job.ready", id })
          }
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: response names the observed entrypoint and source
    expect_regex: submitJob[\s\S]*jobs\.ts|jobs\.ts[\s\S]*submitJob
semantic_output_checks:
  - name: response is a grounded inline visual
    proposition:
      The response shows a compact inline call-flow visual for submitJob in
      src/jobs.ts. It preserves validation before storage before queue publication.
      validateJob rejects a missing job.kind, storeJob calls database.jobs.insert,
      enqueueJob calls queue.publish with job.ready, and submitJob returns the stored
      id. Validation failure stops storage and publication. It does not invent other
      collaborators or claim to create an artifact.
