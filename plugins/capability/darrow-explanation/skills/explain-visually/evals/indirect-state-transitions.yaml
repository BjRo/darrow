id: explain-visually-indirect-state-transitions
invariant: VE-C1,VE-C2,VE-C3,VE-C5,VE-C6,VE-C7
activation: positive
mount_plugin_skills: true
prompt: >-
  This worker lifecycle is too much prose. Show me the state transitions
  compactly. Preserve the retry condition, do not add undocumented states, and
  do not modify or create files.
fixture:
  commits:
    - message: "chore: init"
      files:
        docs/worker-lifecycle.md: |
          A new job starts queued. Claiming a queued job makes it running.
          Completing a running job makes it succeeded. A terminal error makes
          it failed. A retryable error returns a running job to queued only
          while attempts remain; otherwise the job becomes failed.
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: documented states and transition condition remain visible
    run: >-
      grep -Ei 'queued' .git/last-message.md >/dev/null;
      grep -Ei 'running' .git/last-message.md >/dev/null;
      grep -Ei 'succeeded' .git/last-message.md >/dev/null;
      grep -Ei 'failed' .git/last-message.md >/dev/null
  - name: undocumented states are absent
    run: '! grep -Ei "cancelled|canceled|dead[- ]letter|paused" .git/last-message.md'
semantic_output_checks:
  - name: compact state view preserves the retry frontier
    proposition: >-
      The response uses a compact state-oriented view preserving normal
      progression from queued through running to succeeded, and running becoming
      failed on a terminal error or exhausted retry attempts. Ordinary progress
      arrows need not repeat the claiming and completion event names.
      A running job returns to queued only for a retryable error while attempts
      remain. It preserves that condition rather than allowing an unconditional
      retry. Equivalent representations and wording such as attempts left are
      valid; physical-line counts do not define compactness.
