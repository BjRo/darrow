id: explain-visually-indirect-state-transitions
invariant: VE-C1,VE-C2,VE-C3,VE-C5,VE-C6,VE-C7
activation: positive
mount_plugin_skills: true
prompt: This worker lifecycle is too much prose. Show me the state transitions
  compactly. Preserve the retry condition, do not add undocumented states, and
  do not modify or create files.
fixture:
  commits:
    - message: "chore: init"
      files:
        docs/worker-lifecycle.md: |
          A new job starts queued. Claiming a queued job makes it running.
          Completing a running job makes it succeeded. A terminal error makes
          it failed. A retryable error returns a running job to queued only
          while attempts remain; otherwise the job becomes failed.
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: "documented state or condition: queued"
    expect_regex: queued
    flags: i
  - name: "documented state or condition: running"
    expect_regex: running
    flags: i
  - name: "documented state or condition: succeeded"
    expect_regex: succeeded
    flags: i
  - name: "documented state or condition: failed"
    expect_regex: failed
    flags: i
  - name: "documented state or condition: attempts? remain|remaining attempts?"
    expect_regex: attempts? remain|remaining attempts?
    flags: i
  - name: response uses a state-oriented visual shape
    expect_regex: ->|-->|─+>|→|stateDiagram|\|[ \t]*(From|State|Event)
  - name: response stays compact
    not_regex: ^(?:[^\r\n]*\r?\n){28}[^\r\n]+
  - name: undocumented states are absent
    not_regex: cancelled|canceled|dead[- ]letter|paused
    flags: i
