id: explain-visually-incomplete-subject
invariant: VE-C1,VE-C3,VE-C7
activation: positive
mount_plugin_skills: true
prompt: "{{skill_invocation}} Show me."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: |
          # Unrelated inventory service
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: response asks for the missing subject
    expect_regex: what|which|subject|topic
    flags: i
  - name: response stays compact
    not_regex: ^(?:[^\r\n]*\r?\n){8}[^\r\n]+
  - name: unrelated repository topic is not selected
    not_regex: inventory service
    flags: i
