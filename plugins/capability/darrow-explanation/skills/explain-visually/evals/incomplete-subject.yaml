id: explain-visually-incomplete-subject
invariant: VE-C1,VE-C3,VE-C7
activation: positive
mount_plugin_skills: true
prompt: "{{skill_invocation}} Show me."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Unrelated inventory service\n"
checks:
  - name: incomplete request is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: unrelated repository topic is not selected
    run: '! grep -Ei "inventory service" .git/last-message.md'
semantic_output_checks:
  - name: response asks compactly for the missing subject
    proposition: >-
      The response asks the user what they want shown, rather than selecting
      or explaining a topic itself. One compact clarification request is
      sufficient. It need not repeat technical or visual vocabulary from the
      skill context, and no fixed physical-line count applies.
