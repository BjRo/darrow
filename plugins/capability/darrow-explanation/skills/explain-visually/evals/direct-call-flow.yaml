id: explain-visually-direct-call-flow
invariant: VE-C1,VE-C2,VE-C3,VE-C4,VE-C5,VE-C7,VE-C8,VE-E9
activation: positive
mount_plugin_skills: true
prompt: >-
  Use {{skill_invocation}} to show the observed runtime call flow when submitJob is
  called. Inspect the repository, keep only calls that matter to this path,
  include useful source anchors, and do not modify or create files.
fixture:
  commits:
    - message: "chore: init"
      files:
        src/jobs.ts: |
          export function submitJob(job: Job): string {
            const checked = validateJob(job)
            const id = storeJob(checked)
            enqueueJob(id)
            return id
          }

          function validateJob(job: Job): Job {
            if (!job.kind) throw new Error("kind is required")
            return job
          }

          function storeJob(job: Job): string {
            return database.jobs.insert(job)
          }

          function enqueueJob(id: string): void {
            queue.publish({ type: "job.ready", id })
          }
        src/admin.ts: |
          export function authorizeAdmin(user: User): void {
            if (!user.admin) throw new Error("forbidden")
          }
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: call flow contains the observed call names
    run: >-
      grep -F 'submitJob' .git/last-message.md >/dev/null;
      grep -F 'validateJob' .git/last-message.md >/dev/null;
      grep -F 'storeJob' .git/last-message.md >/dev/null;
      grep -F 'enqueueJob' .git/last-message.md >/dev/null
  - name: response uses a compact visual shape
    run: grep -Eq -- '->|-->|─+>|├|└|│|→|^[[:space:]][[:space:]]+[[:alnum:]_<]' .git/last-message.md
  - name: observed source is anchored
    run: grep -Ei 'observed|current|src/jobs\.ts' .git/last-message.md
  - name: unrelated callable is not invented into the path
    run: >-
      if grep -F 'authorizeAdmin' .git/last-message.md >/dev/null; then
        grep -Ei 'exclude|not|nothing|unrelated' .git/last-message.md >/dev/null;
      fi
semantic_output_checks:
  - name: visual explanation is concise clear and complete
    proposition: >-
      The response leads with the observed call-flow answer, uses direct and
      familiar language, and remains compact and understandable without rich
      rendering. It preserves a useful source anchor and observed evidence
      status, and shows validation before storage before queue publication,
      with validation failure stopping the path before storage or publication.
      An isolated short recap or brief framing is nonblocking. Extended
      inspection narration, long repeated walkthroughs, or redundant views that
      materially bury the answer fail the clarity requirement.
