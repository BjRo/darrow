id: explain-visually-direct-call-flow
invariant: VE-C1,VE-C2,VE-C3,VE-C4,VE-C5,VE-C7
activation: positive
mount_plugin_skills: true
prompt: Use {{skill_invocation}} to show the observed runtime call flow when
  submitJob is called. Inspect the repository, keep only calls that matter to
  this path, include useful source anchors, and do not modify or create files.
fixture:
  commits:
    - message: "chore: init"
      files:
        src/jobs.ts: |
          export function submitJob(job: Job): string {
            const checked = validateJob(job)
            const id = storeJob(checked)
            enqueueJob(id)
            return id
          }

          function validateJob(job: Job): Job {
            if (!job.kind) throw new Error("kind is required")
            return job
          }

          function storeJob(job: Job): string {
            return database.jobs.insert(job)
          }

          function enqueueJob(id: string): void {
            queue.publish({ type: "job.ready", id })
          }
        src/admin.ts: |
          export function authorizeAdmin(user: User): void {
            if (!user.admin) throw new Error("forbidden")
          }
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: unrelated callable is not invented into the path
    proposition: The response does not present authorizeAdmin as part of the
      submitJob call path. An explicit statement that it is unrelated is
      allowed.
output_checks:
  - name: call flow contains the observed path in order
    expect_regex: submitJob[^\r\n]*\r?\n[\s\S]*?validateJob[^\r\n]*\r?\n[\s\S]*?storeJob[^\r\n]*\r?\n[\s\S]*?enqueueJob
  - name: response uses a compact visual shape
    expect_regex: ->|-->|─+>|├|└|│|→|^[ \t]{2,}[\w<]
  - name: response stays compact
    not_regex: ^(?:[^\r\n]*\r?\n){24}[^\r\n]+
  - name: observed source is anchored
    expect_regex: observed|current|src[/\\]jobs\.ts
    flags: i
