id: explain-visually-structural-diff
invariant: VE-C2,VE-C3,VE-C4,VE-C5,VE-C7
activation: positive
mount_plugin_skills: true
prompt: >-
  Use {{skill_invocation}} to show the accepted transport refactor as a compact
  structural diff from the current file layout to the target layout. Do not
  implement it and do not dump full source files.
fixture:
  commits:
    - message: "chore: init"
      files:
        src/commands/index.ts: "export const parse = () => {}\n"
        src/sessions/index.ts: "export const load = () => {}\n"
        src/transport.ts: "export const send = () => {}\n"
        docs/accepted-refactor.md: |
          The accepted target replaces src/transport.ts with a transport
          directory. transport/client.ts owns request construction and
          transport/stream.ts owns event streaming. Commands and sessions stay
          where they are.
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: target is visibly proposed rather than current
    run: grep -Ei 'proposed|target|accepted refactor' .git/last-message.md
  - name: structural diff contains removal and additions
    run: >-
      grep -Eq '^-.*transport\.ts|^-.*transport\.ts' .git/last-message.md;
      grep -Eq '^\+.*transport/' .git/last-message.md;
      grep -F 'client.ts' .git/last-message.md >/dev/null;
      grep -F 'stream.ts' .git/last-message.md >/dev/null
  - name: response stays structural and compact
    run: "! grep -F 'export const' .git/last-message.md"
semantic_output_checks:
  - name: compact structural diff preserves the accepted target
    proposition: >-
      The response uses a compact structural diff that distinguishes the
      accepted target from the current layout. It visibly marks removal of
      src/transport.ts and addition of transport/client.ts for request
      construction and transport/stream.ts for event streaming. It does not move
      or change commands and sessions; those unchanged areas may be omitted.
      Each added file is visibly marked as an
      addition; a plus-prefixed file line in a nested tree counts. It does not
      invent current exports or behavior. Layout labels such as "current
      transport entry" are valid; only concrete unsupported exports, calls,
      or internal behavior violate grounding. The current source files contain:
      src/transport.ts has `export const send = () => {}`;
      src/commands/index.ts has `export const parse = () => {}`;
      src/sessions/index.ts has `export const load = () => {}`.
      These source facts constrain optional claims, not required response content.
      Describing current exports or behavior is not required,
      and acknowledging that a stub does not establish internal responsibilities
      is valid. It does not dump implementation source or claim the refactor
      has already been implemented. Equivalent nested diff layouts are valid;
      physical-line counts do not define compactness.
