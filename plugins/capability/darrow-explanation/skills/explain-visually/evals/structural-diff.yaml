id: explain-visually-structural-diff
invariant: VE-C2,VE-C3,VE-C4,VE-C5,VE-C7
activation: positive
mount_plugin_skills: true
prompt: >-
  Use {{skill_invocation}} to show the accepted transport refactor as a compact
  structural diff from the current file layout to the target layout. Do not
  implement it and do not dump full source files.
fixture:
  commits:
    - message: "chore: init"
      files:
        src/commands/index.ts: "export const parse = () => {}\n"
        src/sessions/index.ts: "export const load = () => {}\n"
        src/transport.ts: "export const send = () => {}\n"
        docs/accepted-refactor.md: |
          The accepted target replaces src/transport.ts with a transport
          directory. transport/client.ts owns request construction and
          transport/stream.ts owns event streaming. Commands and sessions stay
          where they are.
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: target is visibly proposed rather than current
    run: grep -Ei 'proposed|target|accepted refactor' .git/last-message.md
  - name: structural diff contains removal and additions
    run: >-
      grep -Eq '^-.*transport\.ts|^-.*transport\.ts' .git/last-message.md;
      grep -Eq '^\+.*transport/' .git/last-message.md;
      grep -F 'client.ts' .git/last-message.md >/dev/null;
      grep -F 'stream.ts' .git/last-message.md >/dev/null
  - name: response stays structural and compact
    run: >-
      ! grep -F 'export const' .git/last-message.md;
      test "$(wc -l <.git/last-message.md | tr -d ' ')" -le 24
