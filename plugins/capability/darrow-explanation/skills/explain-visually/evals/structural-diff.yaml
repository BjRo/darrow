id: explain-visually-structural-diff
invariant: VE-C2,VE-C3,VE-C4,VE-C5,VE-C7
activation: positive
mount_plugin_skills: true
prompt: Use {{skill_invocation}} to show the accepted transport refactor as a
  compact structural diff from the current file layout to the target layout. Do
  not implement it and do not dump full source files.
fixture:
  commits:
    - message: "chore: init"
      files:
        src/commands/index.ts: |
          export const parse = () => {}
        src/sessions/index.ts: |
          export const load = () => {}
        src/transport.ts: |
          export const send = () => {}
        docs/accepted-refactor.md: |
          The accepted target replaces src/transport.ts with a transport
          directory. transport/client.ts owns request construction and
          transport/stream.ts owns event streaming. Commands and sessions stay
          where they are.
checks:
  - name: explanation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: target is visibly proposed rather than current
    expect_regex: proposed|target|accepted refactor
    flags: i
  - name: removed entry carries its own marker
    expect_regex: ^-.*transport\.ts
  - name: added directory carries its own marker
    expect_regex: ^\+.*transport[/\\]
  - name: client remains visible
    expect_regex: client\.ts
  - name: stream remains visible
    expect_regex: stream\.ts
  - name: response stays structural
    not_regex: export const
  - name: response stays compact
    not_regex: ^(?:[^\r\n]*\r?\n){24}[^\r\n]+
