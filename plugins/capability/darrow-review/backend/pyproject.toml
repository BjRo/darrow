[project]
name = "darrow-review"
version = "0.7.2"
description = "Contained read-only review mechanics for Darrow"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.scripts]
review-scope = "darrow_review.cli:review_scope"
review-result = "darrow_review.cli:review_result"
review-report = "darrow_review.cli:review_report"
review-check = "darrow_review.cli:review_check"
review-route = "darrow_review.cli:review_route"
review-claude-verify = "darrow_review.cli:review_claude_verify"
claude-provider = "darrow_review.cli:claude_provider"

[dependency-groups]
dev = [
    "coverage[toml]>=7.10,<8",
    "hypothesis>=6.138,<7",
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["src/darrow_review"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "C90", "E4", "E7", "E9", "F", "I", "N", "RUF", "SIM", "UP"]
mccabe.max-complexity = 5

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["darrow_review"]

[tool.coverage.report]
show_missing = true
skip_covered = false
