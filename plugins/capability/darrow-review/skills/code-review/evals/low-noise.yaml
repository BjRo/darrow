id: code-review-low-noise
activation: positive
invariant: CR-E5,CR-C6,CR-C7
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Review my uncommitted changes against this originating requirement: add an admin health handler that repeats the local two-line auth guard and returns status 204. Run `bash format-check.sh` as the formatting check. Report only."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Accepted local design

          Endpoint modules intentionally duplicate the two-line auth guard so each
          deployment unit stays independent. Do not centralize that guard.

          Formatting is settled only by `bash format-check.sh`; reviewers do not
          restate formatter output as prose findings.
        src/user-health.js: |
          export function userHealth(token) {
            if (!token) return 401;
            if (token !== "ok") return 403;
            return 204;
          }
        format-check.sh: |
          #!/usr/bin/env bash
          echo 'src/admin-health.js:1 needs formatting'
          exit 1
  files:
    src/admin-health.js: |
      export function adminHealth(token) {
        if (!token) return 401;
        if (token !== "ok") return 403;
        return 204;
      }
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
    git status --porcelain --untracked-files=all >.git/status-before
checks:
  - name: human response excludes machine JSON
    run: python3 .git/eval-checks/review/tests/evals/assert_records.py
      .git/last-message.md human-response
  - name: review remains read-only despite failed check
    run: git status --porcelain --untracked-files=all >.git/status-after; cmp
      .git/status-before .git/status-after
  - name: canonical JSON is retained beneath the review scope artifact
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/result.py; test -n "$tool"
      && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/result.py}" review-result validate "$record"
    expect_regex: "^valid: darrow-review-result-v3$"
  - name: failed formatter remains check evidence without prose findings
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1; python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" has
      standards pass && python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" has spec
      pass && python3 .git/eval-checks/review/tests/evals/assert_records.py
      "$record" has verdict fail && python3 -c 'import json,sys;
      record=json.load(open(sys.argv[1])); assert any(check["command"]=="bash
      format-check.sh" and check["applicability"]=="applicable" and
      check["status"]=="fail" for check in record["checks"])' "$record" &&
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record"
      lacks-key findings
  - name: retained Markdown preserves every canonical rendered line
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/report.py; test -n "$tool"
      || exit 1; expected=.git/expected-review.md; uv run --quiet --frozen
      --no-dev --project "${tool%/src/darrow_review/report.py}" review-report
      render "$record" >"$expected" && awk 'NF' "$expected"
      >.git/expected-review-normalized.md && awk 'NF' "$(dirname
      "$record")/review.md" >.git/actual-review-normalized.md && cmp
      .git/expected-review-normalized.md .git/actual-review-normalized.md
semantic_output_checks:
  - name: review outcome and issues are understandable inline
    proposition: >-
      The response communicates an overall failed review gate, the failed
      formatting check, and a favorable code assessment. Saying the review
      found no code findings or the handler fulfills the requirement conveys
      that assessment. The canonical artifact checks separately verify both
      passing axis statuses; do not require repeated
      reader attribution, literal Standards or Spec labels, or an additional
      causal sentence in the response. A favorable code assessment is consistent
      with a failed gate because the formatter failed. The local two-line auth
      guard duplication is accepted. Reject an overall pass, omission of the
      failed check or favorable code assessment, an unavailable reader assessment,
      a separate model finding duplicating the formatting failure, or a demand
      to centralize the auth guard. Silence about the guard is sufficient.
