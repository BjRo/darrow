id: code-review-placement-inline
required_plugin_hook: darrow-review
activation: positive
invariant: CR-C9,CR-C21,CR-E2,CR-E4,CR-E7,CR-E8,CR-E14,CR-E15,CR-E17,CR-E18
prompt:
  "{{skill_invocation}} The harness reports this exact active owner on Codex
  gpt-6.1-sol/medium or Claude claude-sonnet-5-5/medium according to the active host.
  This observed route evidence selects inline coordination.1-sol/medium. Preserve the
  configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the
  existing Review state configuration. Review my uncommitted changes against this
  originating requirement: parseAge must return null for non-numeric input. Run `bash
  test.sh` to verify the implementation as part of this review. Do not repair the code.
  On Claude, the harness provides Bash for authorized private artifact I/O and no
  dedicated Write tool. Retaining complete reader JSON in the returned private run is
  authorized. Actual path or access-control denials still block."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Library standards

          Library modules must never write to console output.
          Run `bash test.sh` for JavaScript changes.
        src/age.js: |
          export function parseAge(value) {
            const parsed = Number(value);
            return Number.isNaN(parsed) ? null : parsed;
          }
        test.sh: >
          #!/usr/bin/env bash

          node -e 'import("./src/age.js").then(({parseAge}) => { if (parseAge("42") !==
          42) process.exit(1) })'
  files:
    src/age.js: |
      export function parseAge(value) {
        console.log("parsing", value);
        return Number(value);
      }
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
    git status --porcelain --untracked-files=all >.git/status-before
output_checks:
  - name: human response excludes machine JSON
    review_format: human
checks:
  - name: each finding retains guidance from its originating reader
    run: >
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate
      Review artifact grant is required}"

      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n 1)

      test -n "$record" || exit 1

      python3 .git/eval-checks/review/tests/evals/assert_guidance.py "$record" finding
  - name: review is read-only
    run: git status --porcelain --untracked-files=all >.git/status-after; cmp
      .git/status-before .git/status-after
  - name: canonical JSON is retained beneath the review scope artifact
    run:
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate
      Review artifact grant is required}" && record=$(find
      "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*'
      -name result.json -type f | sort | tail -n '1'); test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/result.py; test -n "$tool" && uv
      run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}"
      review-result validate "$record"
    expect_regex: "^valid: darrow-review-result-v3$"
  - name: canonical Markdown handoff is materialized beside the JSON
    run:
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate
      Review artifact grant is required}" && record=$(find
      "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*'
      -name result.json -type f | sort | tail -n '1'); test -n "$record" || exit 1;
      report=$(dirname "$record")/review.md;
      tool=.git/eval-checks/review/src/darrow_review/report.py; test -r "$report" &&
      test -s "$report" && test -n "$tool" && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/report.py}" review-report render "$record"
      >.git/expected-review.md && cmp .git/expected-review.md "$report"
  - name: both configured independent reviewer routes are observed
    run:
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate
      Review artifact grant is required}" && python3
      .git/eval-checks/review/tests/evals/eval_routes.py --host "$(cat
      .git/fixture-host)" --profile default --axes standards spec
semantic_output_checks:
  - name: both blocking defects are understandable inline
    proposition:
      "The response reports a failed review and explains both blocking issues:
      parseAge writes console output although library standards prohibit it, and
      nonnumeric input produces NaN although the originating requirement calls for null.
      Both issues must be understandable in the response. Stating these actual and
      required behaviors conveys the corrections; separate repair, rationale,
      advisory-label, or test sentences are not required. Naming Number is not required.
      Any implementation advice must be consistent with returning numbers for numeric
      input and keeping the library silent. Reject a missing issue, a false pass or
      nonblocking characterization, the wrong required behavior, or contradictory
      advice."
harnesses:
  - codex
  - claude
candidate_routes:
  codex:
    model: gpt-6.1-sol
    effort: medium
  claude:
    model: claude-sonnet-5-5
    effort: medium
transcript_checks:
  - name: v2 assessment placement and completed independent readers
    assessment_readers:
      placement: inline
      axes:
        - standards
        - spec
      model: gpt-6.1-sol
      effort: xhigh
      claude:
        agent: darrow-review:review-reader-claude-opus-5-5-xhigh
        model: claude-opus-5-5
        effort: xhigh
