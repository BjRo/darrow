id: code-review-merge-base-branch
invariant: CR-E1,CR-E3
prompt: >-
  Review the current feature branch against main. Use the branch merge base and
  do not review changes that exist only on main. There is no product spec.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  setup: |
    git checkout -qb feature
    printf 'feature\n' >feature.txt
    git add feature.txt
    git commit -qm 'feat: feature side'
    git checkout -q main
    printf 'main\n' >main-only.txt
    git add main-only.txt
    git commit -qm 'feat: main side'
    git checkout -q feature
checks:
  - name: branch review remains read-only
    run: test -z "$(git status --porcelain --untracked-files=all)"
  - name: canonical TSV is retained beneath the review scope artifact
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name '*.tsv' -type f | sed -n '1p');
      test -n "$record" && if [ -x .agents/bin/review-result ]; then tool=.agents/bin/review-result;
      else tool=.claude/bin/review-result; fi; && bash "$tool" validate "$record"
    expect_regex: "^valid: darrow-review-result-v1$"
  - name: default response does not duplicate canonical TSV
    run: "! grep -F 'format	darrow-review-result-v1' .git/last-message.md"
output_checks:
  - name: default Markdown carries the verdict, axis statuses, and complete findings
    expect_regex: '^# Code review — (PASS|FAIL|BLOCKED)\n\n\*\*Verdict:\*\* (pass|fail|blocked) · \*\*Findings:\*\* [0-9]+ \(.*\)[\s\S]*## Findings[\s\S]*(### [0-9]+\. (CRITICAL|HIGH|MEDIUM|LOW) — (BLOCKING|ADVISORY) \(Standards|Spec\)[\s\S]*\*\*Location:\*\*[\s\S]*\*\*Source:\*\*[\s\S]*\*\*Evidence:\*\*|No findings\.)'
    flags: i
  - name: default Markdown carries compact check applicability status and evidence
    expect_regex: '## Checks[\s\S]*\*\*(PASS|FAIL|BLOCKED|NOT_APPLICABLE)\*\* \((applicable|not_applicable)\) — <code>[^<]+</code>: .+'
    flags: i
  - name: default Markdown carries risks next action scope and axis sources
    expect_regex: '## Risks[\s\S]*## Next action[\s\S]*## Scope[\s\S]*\*\*Base:\*\*[\s\S]*\*\*Target:\*\*[\s\S]*\*\*Changed files:\*\*[\s\S]*## Sources[\s\S]*\*\*Standards \((pass|fail|blocked)\):\*\*[\s\S]*\*\*Spec \((pass|fail|blocked|not_available)\):\*\*'
    flags: i
  - name: generic heading-only summaries cannot satisfy the default contract
    not_regex: '^# Code review — (PASS|FAIL|BLOCKED)\n\n[^#]{0,240}$'
  - name: default review does not expose raw TSV
    not_regex: '^format\tdarrow-review-result-v1$'
