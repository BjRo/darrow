id: code-review-fix-verification-regression-scope
activation: positive
invariant: CR-C9,CR-C17,CR-C18,CR-C20,CR-E13,CR-E15
prompt: >-
  Verify my uncommitted repair against the prior code-review findings in
  `.git/verification-input`, limited to those findings and direct repair
  consequences. Use `bash check.sh` as current check evidence and remain
  read-only. Do not widen this into another comprehensive review.
fixture:
  commits:
    - message: "chore: base"
      files:
        AGENTS.md: "# Repository instructions\n"
        package.json: |
          { "type": "module" }
        src/math.js: |
          export const multiplier = 2;
          export const scale = (value) => value * multiplier;
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          node -e 'import("./src/math.js").then(({multiplier, scale}) => {
            if (multiplier !== 2) {
              console.error(`multiplier: expected 2, got ${multiplier}`);
              process.exit(1);
            }
            const actual = scale(-2);
            if (actual !== -4) {
              console.error(`scale(-2): expected -4, got ${actual}`);
              process.exit(1);
            }
          })'
    - message: "feat: introduce wrong multiplier"
      files:
        src/math.js: |
          export const multiplier = 1;
          export const scale = (value) => value * multiplier;
  files:
    src/math.js: |
      export const multiplier = 2;
      export const scale = (value) => Math.abs(value * multiplier);
      // TODO: consider renaming scale someday
  setup: |
    set -eu
    backend=$(cd "{{case_dir}}/../../../backend" && pwd -P)
    prior_output=$(uv run --quiet --frozen --no-dev --project "$backend" review-scope prepare --repo "$PWD" --base HEAD^ --target HEAD)
    prior_manifest=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; key=sys.argv[1]; print(next(row[1] for row in json.load(sys.stdin) if row[0] == key))' manifest)
    original_target=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; key=sys.argv[1]; print(next(row[1] for row in json.load(sys.stdin) if row[0] == key))' target)
    {
      printf 'original_target\t%s\n' "$original_target"
      printf 'prior_target\t%s\n' "$original_target"
      printf 'prior_manifest\t%s\n' "$prior_manifest"
      printf 'previous_verification\tnone\tnone\n'
      printf 'original_finding\tspec:1:%s\tspec\t1\thigh\tblocking\tsrc/math.js:1\trequirement: multiplier must be 2\tmultiplier was 1\n' "$original_target"
      printf 'attempted\tspec:1:%s\n' "$original_target"
    } | python3 "{{case_dir}}/../../../backend/tests/evals/assemble_fixture.py" >.git/verification-input
    printf '%s\n' "$backend" >.git/review-backend
    git status --porcelain --untracked-files=all >.git/status-before
    git hash-object src/math.js >.git/math-before
    mkdir -p .git/eval-checks/review/tests/evals && cp "{{case_dir}}/../../../backend/tests/evals/emit_rows.py" .git/eval-checks/review/tests/evals/
checks:
  - name: new repair regression carries verifier-authored guidance
    run: |
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1)
      test -n "$record" || exit 1
      artifact_dir=$(dirname "$record")
      awk -F '\t' 'BEGIN { OFS="\t" }
        $1 == "regression" { n++; if (NF != 13 || $12 == "" || $13 == "") bad=1; print $3,$6,$9,$10,$11,$12,$13 }
        END { exit !(n && !bad) }' <(python3 .git/eval-checks/review/tests/evals/emit_rows.py "$record") >.git/aggregate-regression-guidance || exit 1
      : >.git/reader-regression-guidance
      for file in "$artifact_dir"/*; do
        test -f "$file" || continue
        if test "$(sed -n 1p <(python3 .git/eval-checks/review/tests/evals/emit_rows.py "$file"))" = "$(printf 'format\tdarrow-review-fix-axis-v2')"; then
          awk -F '\t' 'BEGIN { OFS="\t" }
            $1 == "regression" { print $2,$3,$4,$5,$6,$7,$8 }' <(python3 .git/eval-checks/review/tests/evals/emit_rows.py "$file") >>.git/reader-regression-guidance
        fi
      done
      while IFS= read -r finding; do
        grep -Fx -- "$finding" .git/reader-regression-guidance >/dev/null || exit 1
      done <.git/aggregate-regression-guidance
  - name: regression verification remains read only
    run: >-
      git status --porcelain --untracked-files=all >.git/status-after &&
      cmp .git/status-before .git/status-after &&
      git hash-object src/math.js >.git/math-after &&
      cmp .git/math-before .git/math-after
  - name: direct regression enters the closed convergence set
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1) &&
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n '1') &&
      test -n "$tool" &&
      test -n "$record" && uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate-verification "$record" &&
      awk -F '\t' '$1 == "check" && $2 == "bash check.sh" && $3 == "applicable" &&
      $4 == "fail" && $5 ~ /scale\(-2\)/ { found=1 } END { exit found ? 0 : 1 }' <(python3 .git/eval-checks/review/tests/evals/emit_rows.py "$record") &&
      original_target=$(python3 -c 'import json; print(next(row[1] for row in json.load(open(".git/verification-input")) if row[0] == "original_target"))') &&
      awk -F '\t' -v cause="spec:1:$original_target" '$1 == "regression" && $2 == "regression:1:" cause && $3 == cause && $4 == 1 { found=1 } END { exit found ? 0 : 1 }' <(python3 .git/eval-checks/review/tests/evals/emit_rows.py "$record") &&
      grep -F 'outcome	continue' <(python3 .git/eval-checks/review/tests/evals/emit_rows.py "$record") >/dev/null
  - name: unrelated observation is excluded
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1) &&
      ! grep -F 'renaming scale' <(python3 .git/eval-checks/review/tests/evals/emit_rows.py "$record") >/dev/null
  - name: final response is the complete rendered verification report
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1) &&
      test -n "$record" &&
      report=$(dirname "$record")/verification.md &&
      test -r "$report" && test -s "$report" &&
      tool=$(find .git -path '*/backend/src/darrow_review/report.py' -type f | sort | tail -n 1) &&
      test -n "$tool" &&
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/report.py}" review-report render-verification "$record" >.git/expected-verification.md &&
      awk 'NF' .git/expected-verification.md >.git/expected-verification-normalized.md &&
      awk 'NF' "$report" >.git/retained-verification-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-verification-normalized.md &&
      cmp .git/expected-verification-normalized.md .git/retained-verification-normalized.md &&
      cmp .git/expected-verification-normalized.md .git/actual-verification-normalized.md
semantic_output_checks:
  - name: regression guidance targets the repair-caused sign loss
    proposition: >-
      The report explains that Math.abs introduced by the repair removes the
      sign from negative results, suggests an advisory bounded repair that
      preserves multiplier 2 and signed scaling, gives the reason, and
      identifies a negative-input regression test or behavior such as scale(-2)
      returning -4. It does not turn the unrelated naming TODO into a finding.
