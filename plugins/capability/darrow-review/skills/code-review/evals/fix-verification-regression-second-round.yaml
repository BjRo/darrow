id: code-review-fix-verification-regression-second-round
activation: positive
invariant: CR-C17,CR-C18,CR-C19,CR-C20,CR-E13
prompt: >-
  First run `fixture-review-input` to initialize the fixture's prior evidence
  in your private Review state.
  Verify only the carried repair-caused regression from the prior code review
  recorded in `.fixture-state/verification-input`. This is a follow-up repair
  verification, not a comprehensive review. Use `bash check.sh` as current check
  evidence and remain read-only.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          MODE must be good and RESULT must be ok. Run `bash check.sh`.
        config.env: |
          MODE=bad
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'MODE=good' config.env >/dev/null
          grep -Fx 'RESULT=ok' config.env >/dev/null
    - message: "fix: repair mode and introduce missing result regression"
      files:
        config.env: |
          MODE=good
  files:
    config.env: |
      MODE=good
      RESULT=ok
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
    mkdir -p .git/fixture-bin
    cp "{{case_dir}}/fixtures/initialize-second-round-input.sh" .git/fixture-bin/fixture-review-input
    chmod +x .git/fixture-bin/fixture-review-input
    set -eu
    backend=$(cd "{{case_dir}}/../../../backend" && pwd -P)
    uv run --quiet --no-project "$backend/scripts/run_locked.py" python -m darrow_review.eval_fixture seed-second --repo "$PWD" --template "{{case_dir}}/fixtures/second-round-verification.fixture.json"
    git hash-object config.env >.git/config-before
    git status --porcelain --untracked-files=all >.git/status-before
    printf '%s\n' "$backend" >.git/review-backend
checks:
  - name: human response excludes machine JSON
    run: python3 .git/eval-checks/review/tests/evals/assert_records.py
      .git/last-message.md human-response
  - name: second verification remains read only
    run: >-
      git hash-object config.env >.git/config-after && cmp .git/config-before
      .git/config-after && git status --porcelain --untracked-files=all
      >.git/status-after && cmp .git/status-before .git/status-after
  - name: carried regression keeps its stable identity and resolves
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      tool=.git/eval-checks/review/src/darrow_review/result.py && test -n
      "$tool" && regression_key=$(python3 -c 'import json;
      print(json.load(open(".fixture-state/verification-input"))["regression_key"])') &&
      previous_path=$(python3 -c 'import json;
      print(json.load(open(".fixture-state/verification-input"))["previous_verification"]["path"])')
      && previous_relative=${previous_path#"$PWD"/} && record=$(find
      "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' ! -path "$previous_relative" -name verification.json
      -type f -print) && test -n "$record" && test "$record" != "$previous_path"
      && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/result.py}" review-result validate-verification
      "$record" && python3 -c 'import json,sys;
      record=json.load(open(sys.argv[1])); assert any(item["key"]==sys.argv[2]
      and item["status"]=="resolved" and item["progress"]=="resolved" for item
      in record["regressions"])' "$record" "$regression_key" && python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" has
      outcome clear
  - name: verification binds the previous artifact
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      previous_path=$(python3 -c 'import json;
      print(json.load(open(".fixture-state/verification-input"))["previous_verification"]["path"])')
      && previous_relative=${previous_path#"$PWD"/} && record=$(find
      "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' ! -path "$previous_relative" -name verification.json
      -type f -print) && python3 -c 'import json,sys;
      expected=json.load(open(sys.argv[1]))["previous_verification"];
      actual=json.load(open(sys.argv[2]))["previous_verification"]; assert
      expected==actual' .fixture-state/verification-input "$record"
  - name: retained verification report preserves the complete canonical evidence
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      previous_path=$(python3 -c 'import json;
      print(json.load(open(".fixture-state/verification-input"))["previous_verification"]["path"])')
      && previous_relative=${previous_path#"$PWD"/} && record=$(find
      "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' ! -path "$previous_relative" -name verification.json
      -type f -print) && test -n "$record" && report=$(dirname
      "$record")/verification.md && test -r "$report" && test -s "$report" &&
      tool=.git/eval-checks/review/src/darrow_review/report.py && test -n
      "$tool" && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/report.py}" review-report render-verification
      "$record" >.git/expected-verification.md && awk 'NF'
      .git/expected-verification.md >.git/expected-verification-normalized.md &&
      awk 'NF' "$report" >.git/retained-verification-normalized.md && cmp
      .git/expected-verification-normalized.md
      .git/retained-verification-normalized.md
semantic_output_checks:
  - name: review outcome and issues are understandable inline
    proposition: >-
      The response reports clear fix verification: the carried RESULT regression
      is resolved because RESULT is ok while MODE remains good, and current
      checks pass. It explains this inline without requiring the user to open a
      report.
