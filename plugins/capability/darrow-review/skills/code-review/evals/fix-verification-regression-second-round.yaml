id: code-review-fix-verification-regression-second-round
activation: positive
invariant: CR-C17,CR-C18,CR-C19,CR-C20,CR-E13
prompt: >-
  Verify only the carried repair-caused regression from the prior code review
  recorded in `.git/verification-input`. This is a follow-up repair
  verification, not a comprehensive review. Use `bash check.sh` as current
  check evidence and remain read-only.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          MODE must be good and RESULT must be ok. Run `bash check.sh`.
        config.env: |
          MODE=bad
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'MODE=good' config.env >/dev/null
          grep -Fx 'RESULT=ok' config.env >/dev/null
  files:
    config.env: |
      MODE=good
      RESULT=ok
  setup: |
    set -eu
    backend=$(cd "{{case_dir}}/../../../backend" && pwd -P)
    cp config.env .git/current-config
    printf 'MODE=good\n' >config.env
    prior_output=$(uv run --quiet --frozen --no-dev --project "$backend" review-scope prepare --repo "$PWD" --base HEAD --target WORKTREE)
    prior_manifest=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' manifest)
    prior_target=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' target)
    prior_verification=$(dirname "$prior_manifest")/verification.json
    original_target=ORIGINAL-TARGET-SECOND-ROUND
    original_key=standards:1:$original_target
    regression_key=regression:1:$original_key
    python3 - "$original_target" "$prior_target" "$original_key" "$regression_key" "$PWD" <<'PY' >"$prior_verification"
    import json, sys
    original, prior, original_key, regression_key, repo = sys.argv[1:]
    json.dump({
        "format": "darrow-review-verification-v3",
        "original_target": original,
        "prior_target": original,
        "current_target": prior,
        "previous_verification": {"checksum": "none", "path": "none"},
        "original_findings": [{
            "key": original_key, "axis": "standards", "order": "1",
            "severity": "high", "disposition": "blocking",
            "location": "config.env:1", "source": f"{repo}/AGENTS.md",
            "evidence": "MODE was bad",
        }],
        "attempts": [{
            "key": original_key, "status": "resolved",
            "progress": "resolved", "evidence": "MODE is good",
        }],
        "regressions": [{
            "key": regression_key, "caused_by": original_key, "order": "1",
            "axis": "standards", "severity": "high",
            "status": "unresolved", "progress": "progressing",
            "location": "config.env:2", "source": f"{repo}/AGENTS.md",
            "evidence": "RESULT is missing after the repair",
        }],
        "checks": [{
            "command": "bash check.sh", "applicability": "applicable",
            "status": "fail", "evidence": "RESULT is missing",
        }],
        "outcome": "continue",
        "next_action": "repair the carried regression",
    }, sys.stdout)
    PY
    uv run --quiet --frozen --no-dev --project "$backend" review-result validate-verification "$prior_verification"
    prior_hash=$(git hash-object --no-filters "$prior_verification")
    python3 - "$original_target" "$prior_target" "$prior_manifest" "$prior_hash" "$prior_verification" "$original_key" "$regression_key" <<'PY' >.git/verification-input
    import json, sys
    original, prior, manifest, prior_hash, verification, original_key, regression_key = sys.argv[1:]
    json.dump({
        "original_target": original,
        "prior_target": prior,
        "prior_manifest": manifest,
        "previous_verification": {"checksum": prior_hash, "path": verification},
        "original_key": original_key,
        "regression_key": regression_key,
    }, sys.stdout)
    PY
    cp .git/current-config config.env
    git hash-object config.env >.git/config-before
    git status --porcelain --untracked-files=all >.git/status-before
    printf '%s\n' "$backend" >.git/review-backend
    mkdir -p .git/eval-checks/review/tests/evals && cp "{{case_dir}}/../../../backend/tests/evals/assert_records.py" .git/eval-checks/review/tests/evals/
checks:
  - name: second verification remains read only
    run: >-
      git hash-object config.env >.git/config-after &&
      cmp .git/config-before .git/config-after &&
      git status --porcelain --untracked-files=all >.git/status-after &&
      cmp .git/status-before .git/status-after
  - name: carried regression keeps its stable identity and resolves
    run: >-
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n '1') &&
      test -n "$tool" &&
      regression_key=$(python3 -c 'import json; print(json.load(open(".git/verification-input"))["regression_key"])') &&
      previous_path=$(python3 -c 'import json; print(json.load(open(".git/verification-input"))["previous_verification"]["path"])') &&
      previous_relative=${previous_path#"$PWD"/} &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' ! -path "$previous_relative" -name verification.json -type f -print) &&
      test -n "$record" && test "$record" != "$previous_path" &&
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate-verification "$record" &&
      python3 -c 'import json,sys; record=json.load(open(sys.argv[1])); assert any(item["key"]==sys.argv[2] and item["status"]=="resolved" and item["progress"]=="resolved" for item in record["regressions"])' "$record" "$regression_key" &&
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record" has outcome clear
  - name: verification binds the previous artifact
    run: >-
      previous_path=$(python3 -c 'import json; print(json.load(open(".git/verification-input"))["previous_verification"]["path"])') &&
      previous_relative=${previous_path#"$PWD"/} &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' ! -path "$previous_relative" -name verification.json -type f -print) &&
      python3 -c 'import json,sys; expected=json.load(open(sys.argv[1]))["previous_verification"]; actual=json.load(open(sys.argv[2]))["previous_verification"]; assert expected==actual' .git/verification-input "$record"
  - name: final response is the complete rendered verification report
    run: >-
      previous_path=$(python3 -c 'import json; print(json.load(open(".git/verification-input"))["previous_verification"]["path"])') &&
      previous_relative=${previous_path#"$PWD"/} &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' ! -path "$previous_relative" -name verification.json -type f -print) &&
      test -n "$record" &&
      report=$(dirname "$record")/verification.md &&
      test -r "$report" && test -s "$report" &&
      tool=$(find .git -path '*/backend/src/darrow_review/report.py' -type f | sort | tail -n 1) &&
      test -n "$tool" &&
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/report.py}" review-report render-verification "$record" >.git/expected-verification.md &&
      awk 'NF' .git/expected-verification.md >.git/expected-verification-normalized.md &&
      awk 'NF' "$report" >.git/retained-verification-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-verification-normalized.md &&
      cmp .git/expected-verification-normalized.md .git/retained-verification-normalized.md &&
      cmp .git/expected-verification-normalized.md .git/actual-verification-normalized.md
