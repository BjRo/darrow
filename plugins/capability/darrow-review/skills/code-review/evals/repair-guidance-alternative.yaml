id: code-review-guidance-alternative
required_plugin_hook: darrow-review
activation: positive
invariant: CR-C9,CR-C18,CR-C19,CR-E15,CR-E18,CR-E19
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Use {{skill_invocation}} to verify my uncommitted repair against the original review and binding records in .fixture-state/verification-input. The originating requirement is in requirements.md. Remain read-only and report the fix-verification outcome."
fixture:
  commits:
    - message: "chore: base"
      files:
        AGENTS.md: |
          # Repository instructions

          Review JavaScript against the supplied originating requirement.
        requirements.md: |
          formatName must trim leading and trailing whitespace from a string
          and return exactly Anonymous when the trimmed string is empty.
        src/name.js: |
          export function formatName(value) {
            return value;
          }
    - message: "feat: trim name"
      files:
        src/name.js: |
          export function formatName(value) {
            return value.trim();
          }
  files:
    src/name.js: |
      export function formatName(value) {
        const result = value.replace(/^\s+|\s+$/g, "");
        if (result.length === 0) return "Anonymous";
        return result;
      }
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
    cp "{{case_dir}}/fixtures/name-trim-review.fixture.json" .git/fixture-name-trim-template.json
    set -eu
    backend=$(cd "{{case_dir}}/../../../backend" && pwd -P)
    prior_output=$(uv run --quiet --no-project "$backend/scripts/run_locked.py" review-scope prepare --repo "$PWD" --base HEAD^ --target HEAD)
    prior_manifest=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' manifest)
    original_target=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' target)
    original_result=$(dirname "$prior_manifest")/result.json
    scope_json=$(uv run --quiet --no-project "$backend/scripts/run_locked.py" review-result scope-records "$prior_manifest")
    python3 - "$PWD" "$scope_json" <<'PY' >"$original_result"
    import json, sys
    repo, scope_json = sys.argv[1:]
    json.dump({
        "format": "darrow-review-result-v3",
        **json.loads(scope_json),
        "standards": "pass",
        "standards_sources": [f"{repo}/AGENTS.md"],
        "spec": "fail",
        "spec_source": f"{repo}/requirements.md",
        "findings": [{
            "axis": "spec", "severity": "high", "disposition": "blocking",
            "location": f"{repo}/src/name.js:2",
            "source": f"{repo}/requirements.md",
            "evidence": "Direct trim returns an empty string for whitespace-only input instead of Anonymous",
            "repair_guidance": "Advisory: store value.trim() in a local variable and return the variable or Anonymous; this supplies the missing fallback while preserving trimming",
            "resolution_evidence": "Whitespace-only and empty input return Anonymous; padded Ada returns Ada",
        }],
        "checks": [{
            "command": "none", "applicability": "not_applicable",
            "status": "not_applicable", "evidence": "No configured command",
        }],
        "verdict": "fail",
        "risks": ["none"],
        "next_action": "return findings",
    }, sys.stdout)
    PY
    finding_json=$(uv run --quiet --no-project "$backend/scripts/run_locked.py" review-result original-findings "$original_result")
    python3 - "$original_target" "$prior_manifest" "$original_result" "$finding_json" <<'PY' >.git/verification-input
    import json, sys
    target, manifest, result, finding_json = sys.argv[1:]
    json.dump({
        "original_target": target,
        "prior_target": target,
        "prior_manifest": manifest,
        "original_result": result,
        "previous_verification": {"checksum": "none", "path": "none"},
        "original_findings": json.loads(finding_json)["original_findings"],
        "attempted": [f"spec:1:{target}"],
    }, sys.stdout)
    PY
    mkdir -p .fixture-state
    cp .git/verification-input .fixture-state/verification-input
    git hash-object src/name.js >.git/before
checks:
  - name: human response excludes machine JSON
    run: python3 .git/eval-checks/review/tests/evals/assert_records.py
      .git/last-message.md human-response
  - name: alternative implementation resolves the original finding
    run: |
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}"
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1)
      original=$(python3 -c 'import json; print(json.load(open(".fixture-state/verification-input"))["original_result"])')
      tool=.git/eval-checks/review/src/darrow_review/result.py
      test -n "$record" && test -n "$tool" && uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate-original "$original" "$record" || exit 1
      python3 -c 'import json,sys; record=json.load(open(sys.argv[1])); assert record["outcome"]=="clear" and any(item["status"]=="resolved" for item in record["attempts"])' "$record"
  - name: repair remains read only
    run: git hash-object src/name.js >.git/after && cmp .git/before .git/after
semantic_output_checks:
  - name: resolution depends on behavior rather than suggested syntax
    proposition: >-
      The report resolves the original empty-name fallback finding using the
      current implementation's behavior. It does not demand trim() or a
      particular local variable or boolean fallback merely because the original
      advisory suggested them. Saying the repair trims whitespace describes
      behavior and does not imply a trim() call. Repeating the original advice
      or explicitly contrasting it with the current repair is not required; the
      saved artifact is checked separately for preservation of that history. The
      response must not falsely claim the repair uses trim() or the suggested
      boolean fallback, and it must preserve the required Anonymous result for
      empty or whitespace-only input.
      Trimming nonempty names and returning Anonymous for empty trimmed input
      are compatible requirements. A report that explicitly confirms both
      behaviors satisfies this criterion; saying that required trimming is
      preserved does not contradict the stated Anonymous fallback.
