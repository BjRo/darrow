id: code-review-presentation-machine-v1
required_plugin_hook: darrow-review
activation: positive
invariant: CR-C15,CR-E12,CR-E18
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Review my uncommitted changes and return only the raw darrow-review-result-v3 machine format. Do not repair the change."
fixture:
  commits:
    - message: "chore: init"
      files:
        src/value.js: "export const VALUE = 1;\n"
  files:
    src/value.js: "export const VALUE = 2;\n"
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
output_checks:
  - name: explicit machine response preserves the retained canonical record
    review_format: machine
    canonical_check: canonical review record validates and is captured
checks:
  - name: canonical review record validates and is captured
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      uv run --quiet --frozen --no-dev --project .git/eval-checks/review
      review-result validate "$record" >/dev/null &&
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record" canonical
    expect_regex: '^\{'
