id: code-review-presentation-machine-v1
activation: positive
invariant: CR-C15,CR-E12
prompt: >-
  Review my uncommitted changes and return only the raw darrow-review-result-v3
  machine format. Do not repair the change.
fixture:
  commits:
    - message: "chore: init"
      files:
        src/value.js: "export const VALUE = 1;\n"
  files:
    src/value.js: "export const VALUE = 2;\n"
checks:
  - name: requested raw record validates
    run: >-
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate .git/last-message.md
    expect_regex: "^valid: darrow-review-result-v3$"
  - name: explicit machine response preserves the retained canonical record
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      awk '1' "$record" >.git/expected-review.json &&
      awk '1' .git/last-message.md >.git/actual-review.json &&
      cmp .git/expected-review.json .git/actual-review.json
