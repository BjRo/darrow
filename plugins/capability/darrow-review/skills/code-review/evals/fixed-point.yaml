id: code-review-fixed-point
activation: positive
invariant: CR-E1,CR-C2
prompt: >-
  Review the committed change from HEAD~1 to HEAD. There is no originating
  product spec. Report only.
fixture:
  commits:
    - message: "chore: init"
      files:
        before.txt: "before\n"
    - message: "feat: add after"
      files:
        after.txt: "after\n"
checks:
  - name: fixed-point review remains clean
    run: test -z "$(git status --porcelain --untracked-files=all)"
  - name: canonical TSV is retained beneath the review scope artifact
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/bin/review-result' -type f | sort | tail -n '1');
      test -n "$tool" && bash "$tool" validate "$record"
    expect_regex: "^valid: darrow-review-result-v1$"
  - name: review is pinned to the requested fixed points
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      base=$(git rev-parse HEAD~1) && target=$(git rev-parse HEAD) &&
      grep -F "base	$base" "$record" >/dev/null &&
      grep -F "target	$target" "$record" >/dev/null &&
      grep -F 'spec	not_available' "$record" >/dev/null &&
      awk -F '\t' '$1 == "changed_file" { count++; if ($2 ~ /\/after[.]txt$/) found = 1 }
      END { exit !(count == 1 && found) }' "$record"
  - name: default response does not duplicate canonical TSV
    run: "! grep -F 'format	darrow-review-result-v1' .git/last-message.md"
  - name: final response preserves every canonical rendered line
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/bin/review-report' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      expected=.git/expected-review.md;
      bash "$tool" render "$record" >"$expected" &&
      awk 'NF' "$expected" >.git/expected-review-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-review-normalized.md &&
      cmp .git/expected-review-normalized.md .git/actual-review-normalized.md
