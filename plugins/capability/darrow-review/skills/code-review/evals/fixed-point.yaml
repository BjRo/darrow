id: code-review-fixed-point
activation: positive
invariant: CR-E1,CR-C2
prompt: >-
  Review the committed change from HEAD~1 to HEAD. There is no originating
  product spec. Report only.
fixture:
  commits:
    - message: "chore: init"
      files:
        before.txt: "before\n"
    - message: "feat: add after"
      files:
        after.txt: "after\n"
  setup: |
    mkdir -p .git/eval-checks/review/tests/evals && cp "{{case_dir}}/../../../backend/tests/evals/assert_records.py" .git/eval-checks/review/tests/evals/
checks:
  - name: fixed-point review remains clean
    run: test -z "$(git status --porcelain --untracked-files=all)"
  - name: canonical JSON is retained beneath the review scope artifact
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n '1');
      test -n "$tool" && uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate "$record"
    expect_regex: "^valid: darrow-review-result-v2$"
  - name: review is pinned to the requested fixed points
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      base=$(git rev-parse HEAD~1) && target=$(git rev-parse HEAD) &&
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record" has "base" "$base" &&
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record" has "target" "$target" &&
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record" has spec not_available &&
      python3 -c 'import json,sys; files=[row[1] for row in json.load(open(sys.argv[1])) if row[0]=="changed_file"]; assert len(files)==1 and files[0].endswith("/after.txt")' "$record"
  - name: default response does not duplicate canonical JSON
    run: "! grep -F 'format	darrow-review-result-v2' .git/last-message.md"
  - name: final response preserves every canonical rendered line
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/backend/src/darrow_review/report.py' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      expected=.git/expected-review.md;
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/report.py}" review-report render "$record" >"$expected" &&
      awk 'NF' "$expected" >.git/expected-review-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-review-normalized.md &&
      cmp .git/expected-review-normalized.md .git/actual-review-normalized.md
