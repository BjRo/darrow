id: code-review-value-comparison
required_plugin_hook: darrow-review
activation: positive
invariant: CR-E8,CR-E18
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Review my uncommitted changes against this originating requirement: the public parsePort function must accept decimal integer strings from 1 through 65535 and return null for every other input. Run `bash test.sh` to verify the implementation as part of this review. The repository deliberately keeps this small boundary parser inline; do not request an abstraction. Report only."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Local design and checks

          Small boundary parsers stay inline; speculative parser abstractions are forbidden.
          Run `bash test.sh` for JavaScript changes.
        src/port.js: |
          export function parsePort(value) {
            return Number(value);
          }
        test.sh: |
          #!/usr/bin/env bash
          node -e 'import("./src/port.js").then(({parsePort}) => { if (parsePort("80") !== 80) process.exit(1) })'
  files:
    src/port.js: |
      export function parsePort(value) {
        const port = Number.parseInt(value, 10);
        return port >= 1 && port <= 65535 ? port : null;
      }
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
    git status --porcelain --untracked-files=all >.git/status-before
output_checks:
  - name: human response excludes machine JSON
    review_format: human
checks:
  - name: seeded trailing-character defect is detected
    metric: defect_detection
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1; python3 -c 'import json,re,sys;
      record=json.load(open(sys.argv[1])); assert any(item["axis"]=="spec" and
      item["disposition"]=="blocking" and
      re.search(r"12x|parseint|trailing|integer|string",item["evidence"],re.I)
      for item in record["findings"])' "$record"
  - name: no seeded defect escapes
    metric: escaped_defect
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1; python3 -c 'import json,re,sys;
      record=json.load(open(sys.argv[1])); assert any(item["axis"]=="spec" and
      item["disposition"]=="blocking" and
      re.search(r"12x|parseint|trailing|integer|string",item["evidence"],re.I)
      for item in record["findings"])' "$record"
  - name: accepted inline design does not create a false positive
    metric: false_positive
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1; python3 -c 'import json,re,sys;
      record=json.load(open(sys.argv[1])); assert not
      any(re.search(r"abstract|inline|generalit",item["evidence"],re.I) for item
      in record["findings"])' "$record"
  - name: comparative review remains read-only
    run: |
      git status --porcelain --untracked-files=all >.git/status-after
      diff -u .git/status-before .git/status-after
  - name: canonical JSON is retained beneath the review scope artifact
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      tool=.git/eval-checks/review/src/darrow_review/result.py; test -n "$tool"
      || exit 1; record=$(find
      "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/result.py}" review-result validate "$record"
    expect_regex: "^valid: darrow-review-result-v3$"
  - name:
      canonical result preserves the seeded Spec defect without a design false
      positive
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1; python3 -c 'import json,re,sys;
      record=json.load(open(sys.argv[1])); assert record["spec"]=="fail" and
      record["verdict"]=="fail" and any(item["axis"]=="spec" and
      item["disposition"]=="blocking" and re.search(r"12x|parseint|trailing","
      ".join(item.values()),re.I) for item in record["findings"]) and not
      any(item["axis"]=="standards" for item in record["findings"])' "$record"
  - name: canonical Markdown handoff is materialized beside the JSON
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1; report=$(dirname "$record")/review.md;
      tool=.git/eval-checks/review/src/darrow_review/report.py; test -r
      "$report" && test -s "$report" && test -n "$tool" && uv run --quiet
      --frozen --no-dev --project "${tool%/src/darrow_review/report.py}"
      review-report render "$record" >.git/expected-review.md && cmp
      .git/expected-review.md "$report"
semantic_output_checks:
  - name: review outcome and issues are understandable inline
    proposition: >-
      The response identifies that parsePort wrongly accepts a decimal prefix
      followed by trailing characters, contrary to the requirement to accept
      only decimal integer strings from 1 through 65535. Explaining the trailing
      character defect and the need to validate the complete input is sufficient;
      the response need not repeat the already supplied bounds or affirm the
      accepted inline design. Reject advice to introduce an abstraction, accept
      trailing junk, change the required bounds, or an omitted defect.
