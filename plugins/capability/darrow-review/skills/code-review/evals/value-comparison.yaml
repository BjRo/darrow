id: code-review-value-comparison
activation: positive
invariant: CR-E8
prompt: >-
  Review my uncommitted changes against this originating requirement: the
  public parsePort function must accept decimal integer strings from 1 through
  65535 and return null for every other input. The repository deliberately
  keeps this small boundary parser inline; do not request an abstraction.
  Report only.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Local design and checks

          Small boundary parsers stay inline; speculative parser abstractions are forbidden.
          Run `bash test.sh` for JavaScript changes.
        src/port.js: |
          export function parsePort(value) {
            return Number(value);
          }
        test.sh: |
          #!/usr/bin/env bash
          node -e 'import("./src/port.js").then(({parsePort}) => { if (parsePort("80") !== 80) process.exit(1) })'
  files:
    src/port.js: |
      export function parsePort(value) {
        const port = Number.parseInt(value, 10);
        return port >= 1 && port <= 65535 ? port : null;
      }
  setup: git status --porcelain --untracked-files=all >.git/status-before
checks:
  - name: seeded trailing-character defect is detected
    metric: defect_detection
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      awk -F '\t' '$1 == "finding" && $2 == "spec" && $4 == "blocking" &&
      tolower($7) ~ /(12x|parseint|trailing|integer|string)/ { found = 1 }
      END { exit !found }' "$record"
  - name: no seeded defect escapes
    metric: escaped_defect
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      awk -F '\t' '$1 == "finding" && $2 == "spec" && $4 == "blocking" &&
      tolower($7) ~ /(12x|parseint|trailing|integer|string)/ { found = 1 }
      END { exit !found }' "$record"
  - name: accepted inline design does not create a false positive
    metric: false_positive
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      awk -F '\t' '$1 == "finding" &&
      tolower($7) ~ /(abstract|inline|generalit)/ { false_positive = 1 }
      END { exit false_positive }' "$record"
  - name: comparative review remains read-only
    run: git status --porcelain --untracked-files=all >.git/status-after; cmp .git/status-before .git/status-after
  - name: canonical TSV is retained beneath the review scope artifact
    run: >-
      tool=$(find .git -path '*/bin/review-result' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" && bash "$tool" validate "$record"
    expect_regex: "^valid: darrow-review-result-v1$"
  - name: canonical result preserves the seeded Spec defect without a design false positive
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      awk -F '\t' '$1 == "spec" && $2 == "fail" { spec_fail = 1 }
      $1 == "verdict" && $2 == "fail" { verdict_fail = 1 }
      $1 == "finding" && $2 == "spec" && $4 == "blocking" &&
      tolower($0) ~ /(12x|parseint|trailing)/ { found = 1 }
      $1 == "finding" && $2 == "standards" { standards = 1 }
      END { exit !(spec_fail && verdict_fail && found && !standards) }' "$record"
  - name: canonical Markdown handoff is materialized beside the TSV
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      report=$(dirname "$record")/review.md;
      tool=$(find .git -path '*/bin/review-report' -type f | sort | tail -n '1');
      test -r "$report" && test -s "$report" && test -n "$tool" &&
      bash "$tool" render "$record" >.git/expected-review.md &&
      cmp .git/expected-review.md "$report"
  - name: default response does not expose canonical TSV
    run: "! grep -F 'format\tdarrow-review-result-v1' .git/last-message.md"
  - name: final response preserves every canonical rendered line
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/bin/review-report' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      bash "$tool" render "$record" >.git/expected-review.md &&
      awk 'NF' .git/expected-review.md >.git/expected-review-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-review-normalized.md &&
      cmp .git/expected-review-normalized.md .git/actual-review-normalized.md
