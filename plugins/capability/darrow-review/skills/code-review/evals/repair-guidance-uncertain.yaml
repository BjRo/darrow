id: code-review-guidance-uncertain
required_plugin_hook: darrow-review
activation: positive
invariant: CR-C9,CR-E15,CR-E18
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Use {{skill_invocation}} to review the uncommitted migration against requirements.md. Report only and keep the change read-only."
fixture:
  commits:
    - message: "chore: old transport"
      files:
        AGENTS.md: |
          # Repository instructions

          Use the originating requirements for transport changes.
        requirements.md: |
          Requests must carry a tenant-specific signature before transmission.
          This migration must replace legacyTransport with vendorTransport.
          The legacy dependency has been removed and cannot be restored.
          The vendor transport only transmits the supplied bytes; it does not
          sign payloads. Its separate signing SDK and tenant-key integration
          contract have not been delivered. No supported SDK API or key-store
          protocol is available in this repository.
        src/send.js: |
          export function send(payload, tenant, legacyTransport) {
            return legacyTransport.signAndSend(payload, tenant);
          }
  files:
    src/send.js: |
      export function send(payload, tenant, vendorTransport) {
        return vendorTransport.send(payload);
      }
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
    git hash-object src/send.js >.git/before
output_checks:
  - name: human response excludes machine JSON
    review_format: human
checks:
  - name: supported signing finding survives uncertainty
    run: |
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}"
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n 1)
      test -n "$record" || exit 1
      tool=.git/eval-checks/review/src/darrow_review/result.py
      test -n "$tool" && uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate "$record" || exit 1
      python3 -c 'import json,sys; record=json.load(open(sys.argv[1])); assert any(item["axis"]=="spec" and item["disposition"]=="blocking" and item["repair_guidance"] and item["resolution_evidence"] for item in record["findings"])' "$record"
  - name: review does not implement its advice
    run: git hash-object src/send.js >.git/after && cmp .git/before .git/after
semantic_output_checks:
  - name: supported defect remains actionable without invented repair details
    proposition: >-
      The report retains a blocking finding that unsigned payload transmission
      violates the tenant-specific signature requirement, explaining that the
      new send path bypasses signing. It explicitly limits repair advice because
      the vendor signing and tenant-key contracts are unavailable, without
      inventing a supported SDK method or prescribing restoration of the removed
      legacy dependency. Saying that sends must be rejected until the supported
      signing SDK and tenant-key contract arrive expresses that limitation.
      Suggested implementation choices must remain advisory rather than become
      new requirements. The tenant-specific signature requirement, the ban on
      restoring the removed dependency, and observable proof conditions may be
      stated directly without an advisory label. A Resolution evidence section
      may request signed requests for two tenants or demonstrate that signing
      failure prevents sending; that verifies the supplied contract rather than
      prescribing an implementation. Reject an invented supported API, a new
      mandatory implementation choice, or continued unsigned transmission.
  - name: proposed verification is observable within the stated contract limits
    proposition: >-
      The fixture requires tenant-specific signatures before transmission. The
      vendor transport does not sign, and its signing SDK and tenant-key
      contract are unavailable. The report conveys an observable resolution
      condition: signed transmission with tenant isolation once a supported
      integration is available, or preventing unsigned transmission while
      signing is unavailable. Either condition is sufficient; do not require
      both. A concrete proposal to check tenant signatures and prevent unsigned
      payloads from reaching the transport after the supported integration
      arrives qualifies without repeating the current defect, which the other
      criterion assesses. Alternatively, identifying the current unsigned send, the
      signature requirement, and the need to prevent transmission until the
      supported signing integration arrives is sufficient. A separate test
      proposal, a test name, or the word verification is not required. Merely
      naming a signing problem or advising generic testing is insufficient.
      Do not accept continued unsigned transmission as resolution. Read the
      report as a whole. A preceding
      explanation that the SDK and tenant-key contracts are missing and must
      arrive before integration also qualifies the later proposed verification;
      it need not repeat that condition for each test. Proposing future
      verification does not claim that the SDK exists or that those tests have
      already run. The report must not falsely claim completed verification
      using an unavailable signing integration.
