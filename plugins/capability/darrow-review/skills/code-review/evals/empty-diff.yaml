id: code-review-empty-diff
required_plugin_hook: darrow-review
activation: positive
invariant: CR-E3,CR-C2,CR-C15,CR-E12,CR-E18
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Review my uncommitted changes. Report only and do not make a change just to create something to review."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Clean fixture\n"
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
output_checks:
  - name: human response excludes machine JSON
    review_format: human
checks:
  - name: clean repository remains clean
    run: test -z "$(git status --porcelain --untracked-files=all)"
  - name: canonical JSON is retained beneath the review scope artifact
    run: >-
      record=$(find "${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/result.py; test -n "$tool"
      && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/result.py}" review-result validate "$record"
    expect_regex: "^valid: darrow-review-result-v3$"
  - name: empty scope blocks without changed files or findings
    run: >-
      record=$(find "${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1; python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" has
      standards blocked && python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" has spec
      not_available && python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" has
      verdict blocked && python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" contains
      'declared review scope is empty' && python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" lacks-key
      changed_files && python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" lacks-key
      findings
  - name: retained Markdown preserves every canonical rendered line
    run: >-
      record=$(find "${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/report.py; test -n "$tool"
      || exit 1; expected=.git/expected-review.md; uv run --quiet --frozen
      --no-dev --project "${tool%/src/darrow_review/report.py}" review-report
      render "$record" >"$expected" && awk 'NF' "$expected"
      >.git/expected-review-normalized.md && awk 'NF' "$(dirname
      "$record")/review.md" >.git/actual-review-normalized.md && cmp
      .git/expected-review-normalized.md .git/actual-review-normalized.md
semantic_output_checks:
  - name: review outcome and issues are understandable inline
    proposition: >-
      The response explains that the uncommitted scope is empty and there are
      no changes to review. It may state that there are no findings; that alone
      is not a claim of passing independent assurance. Reject a response that
      claims an independent passing review, approval, or clearance of the empty
      scope, or reports findings against invented changes.
transcript_checks:
  - name: terminal scope failure invokes no reviewer
    not_regex: '"tool":"spawn_agent"|"type":"darrow.codex_native_spawn"|"name":"Agent"'
