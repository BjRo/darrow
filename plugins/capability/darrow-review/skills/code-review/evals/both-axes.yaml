id: code-review-both-axes
activation: positive
invariant: CR-E2,CR-E4,CR-E7,CR-E8
prompt: >-
  Review my uncommitted changes against this originating requirement:
  parseAge must return null for non-numeric input. Do not repair the code.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Library standards

          Library modules must never write to console output.
          Run `bash test.sh` for JavaScript changes.
        src/age.js: |
          export function parseAge(value) {
            return Number(value);
          }
        test.sh: |
          #!/usr/bin/env bash
          node -e 'import("./src/age.js").then(({parseAge}) => { if (parseAge("42") !== 42) process.exit(1) })'
  files:
    src/age.js: |
      export function parseAge(value) {
        console.log("parsing", value);
        return Number(value);
      }
  setup: git status --porcelain --untracked-files=all >.git/status-before
checks:
  - name: review is read-only
    run: git status --porcelain --untracked-files=all >.git/status-after; cmp .git/status-before .git/status-after
  - name: canonical TSV is retained beneath the review scope artifact
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/bin/review-result' -type f | sort | tail -n '1');
      test -n "$tool" && bash "$tool" validate "$record"
    expect_regex: "^valid: darrow-review-result-v1$"
  - name: default response does not duplicate canonical TSV
    run: "! grep -F 'format	darrow-review-result-v1' .git/last-message.md"
  - name: final response matches the canonical Markdown renderer
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/bin/review-report' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      expected=.git/expected-review.md;
      bash "$tool" render "$record" >"$expected" &&
      awk '1' "$expected" >.git/expected-review-normalized.md &&
      awk '1' .git/last-message.md >.git/actual-review-normalized.md &&
      cmp .git/expected-review-normalized.md .git/actual-review-normalized.md
