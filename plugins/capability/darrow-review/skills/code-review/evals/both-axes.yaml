id: code-review-both-axes
activation: positive
invariant: CR-C9,CR-E2,CR-E4,CR-E7,CR-E8,CR-E15
prompt: >-
  Review my uncommitted changes against this originating requirement:
  parseAge must return null for non-numeric input. Do not repair the code.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Library standards

          Library modules must never write to console output.
          Run `bash test.sh` for JavaScript changes.
        src/age.js: |
          export function parseAge(value) {
            return Number(value);
          }
        test.sh: |
          #!/usr/bin/env bash
          node -e 'import("./src/age.js").then(({parseAge}) => { if (parseAge("42") !== 42) process.exit(1) })'
  files:
    src/age.js: |
      export function parseAge(value) {
        console.log("parsing", value);
        return Number(value);
      }
  setup: |
    git status --porcelain --untracked-files=all >.git/status-before
    mkdir -p .git/eval-checks/review/tests/evals && cp "{{case_dir}}/../../../backend/tests/evals/assert_records.py" .git/eval-checks/review/tests/evals/
    cp "{{case_dir}}/../../../backend/tests/evals/assert_guidance.py" .git/eval-checks/review/tests/evals/
checks:
  - name: each finding retains guidance from its originating reader
    run: |
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n 1)
      test -n "$record" || exit 1
      python3 .git/eval-checks/review/tests/evals/assert_guidance.py "$record" finding
  - name: review is read-only
    run: git status --porcelain --untracked-files=all >.git/status-after; cmp .git/status-before .git/status-after
  - name: canonical JSON is retained beneath the review scope artifact
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n '1');
      test -n "$tool" && uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate "$record"
    expect_regex: "^valid: darrow-review-result-v2$"
  - name: default response does not duplicate canonical JSON
    run: "! grep -F 'format	darrow-review-result-v2' .git/last-message.md"
  - name: canonical Markdown handoff is materialized beside the JSON
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      report=$(dirname "$record")/review.md;
      tool=$(find .git -path '*/backend/src/darrow_review/report.py' -type f | sort | tail -n '1');
      test -r "$report" && test -s "$report" && test -n "$tool" &&
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/report.py}" review-report render "$record" >.git/expected-review.md &&
      cmp .git/expected-review.md "$report"
  - name: final response preserves every canonical rendered line
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/backend/src/darrow_review/report.py' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      expected=.git/expected-review.md;
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/report.py}" review-report render "$record" >"$expected" &&
      awk 'NF' "$expected" >.git/expected-review-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-review-normalized.md &&
      cmp .git/expected-review-normalized.md .git/actual-review-normalized.md
semantic_output_checks:
  - name: both defects transfer usable advisory repair reasoning
    proposition: >-
      The report identifies console output as violating library standards and
      explains that Number of a nonnumeric input returns NaN rather than the
      required null. For each defect it supplies a bounded suggested repair,
      why that approach addresses the cause, relevant constraints (silence for
      the library and preserving numeric conversion), and observable behavior
      or a regression test demonstrating resolution. Suggested implementation
      is explicitly advisory, separate from the required behavior.
