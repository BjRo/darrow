id: code-review-fix-verification-progress-advisory
activation: positive
invariant: CR-C17,CR-C18,CR-C19,CR-E13
prompt: >-
  Verify my uncommitted repair against only the prior code-review findings in
  `.git/verification-input`. Use `bash check.sh` as current check evidence.
  Remain read-only and do not widen this into another comprehensive review.
fixture:
  commits:
    - message: "chore: base"
      files:
        AGENTS.md: |
          # Repository instructions

          Legacy comments should be removed when safely in scope.
        src/value.js: |
          export const value = 2;
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Eq 'value = [12];' src/value.js
    - message: "feat: introduce invalid value"
      files:
        src/value.js: |
          export const value = "invalid";
          // legacy
  files:
    src/value.js: |
      export const value = 1;
      // legacy
  setup: |
    set -eu
    backend=$(cd "{{case_dir}}/../../../backend" && pwd -P)
    prior_output=$(uv run --quiet --frozen --no-dev --project "$backend" review-scope prepare --repo "$PWD" --base HEAD^ --target HEAD)
    prior_manifest=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; key=sys.argv[1]; print(next(row[1] for row in json.load(sys.stdin) if row[0] == key))' manifest)
    original_target=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; key=sys.argv[1]; print(next(row[1] for row in json.load(sys.stdin) if row[0] == key))' target)
    python3 - "$original_target" "$prior_manifest" "$PWD" <<'PY' >.git/verification-input
    import json, sys
    target, manifest, repo = sys.argv[1:]
    rows = [
        ["original_target", target],
        ["prior_target", target],
        ["prior_manifest", manifest],
        ["previous_verification", "none", "none"],
        ["original_finding", f"spec:1:{target}", "spec", "1", "high", "blocking", "src/value.js:1", "requirement: value must be numeric and at least 2", "value was non-numeric"],
        ["original_finding", f"standards:2:{target}", "standards", "2", "low", "advisory", "src/value.js:2", f"{repo}/AGENTS.md", "the legacy comment remained"],
        ["attempted", f"spec:1:{target}"],
        ["attempted", f"standards:2:{target}"],
    ]
    json.dump(rows, sys.stdout)
    PY
    printf '%s\n' "$backend" >.git/review-backend
    git status --porcelain --untracked-files=all >.git/status-before
    git hash-object src/value.js >.git/value-before
    mkdir -p .git/eval-checks/review/tests/evals && cp "{{case_dir}}/../../../backend/tests/evals/assert_records.py" .git/eval-checks/review/tests/evals/
checks:
  - name: progress verification remains read only
    run: >-
      git status --porcelain --untracked-files=all >.git/status-after &&
      cmp .git/status-before .git/status-after &&
      git hash-object src/value.js >.git/value-after &&
      cmp .git/value-before .git/value-after
  - name: progressing blocker keeps convergence open
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1) &&
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n '1') &&
      test -n "$tool" &&
      test -n "$record" && uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate-verification "$record" &&
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record" has outcome continue &&
      original_target=$(python3 -c 'import json; print(next(row[1] for row in json.load(open(".git/verification-input")) if row[0] == "original_target"))') &&
      python3 -c 'import json,sys; rows=json.load(open(sys.argv[1])); assert any(row[:4]==["attempt",sys.argv[2],"unresolved","progressing"] for row in rows)' "$record" "spec:1:$original_target"
  - name: unresolved advisory does not become a blocker
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1) &&
      original_target=$(python3 -c 'import json; print(next(row[1] for row in json.load(open(".git/verification-input")) if row[0] == "original_target"))') &&
      python3 -c 'import json,sys; rows=json.load(open(sys.argv[1])); assert any(row[:4]==["attempt",sys.argv[2],"unresolved","unchanged"] for row in rows)' "$record" "standards:2:$original_target"
  - name: final response is the complete rendered verification report
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1) &&
      test -n "$record" &&
      report=$(dirname "$record")/verification.md &&
      test -r "$report" && test -s "$report" &&
      tool=$(find .git -path '*/backend/src/darrow_review/report.py' -type f | sort | tail -n 1) &&
      test -n "$tool" &&
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/report.py}" review-report render-verification "$record" >.git/expected-verification.md &&
      awk 'NF' .git/expected-verification.md >.git/expected-verification-normalized.md &&
      awk 'NF' "$report" >.git/retained-verification-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-verification-normalized.md &&
      cmp .git/expected-verification-normalized.md .git/retained-verification-normalized.md &&
      cmp .git/expected-verification-normalized.md .git/actual-verification-normalized.md
