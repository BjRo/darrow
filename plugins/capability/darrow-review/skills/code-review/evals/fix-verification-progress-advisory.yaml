id: code-review-fix-verification-progress-advisory
required_plugin_hook: darrow-review
activation: positive
invariant: CR-C17,CR-C18,CR-C19,CR-C21,CR-E13,CR-E14,CR-E18,CR-E19
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Verify my uncommitted repair against only the prior code-review findings in `.fixture-state/verification-input`. Use `bash check.sh` as current check evidence. Remain read-only and do not widen this into another comprehensive review."
fixture:
  commits:
    - message: "chore: base"
      files:
        AGENTS.md: |
          # Repository instructions

          Legacy comments should be removed when safely in scope.
        src/value.js: |
          export const value = 2;
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Eq 'value = [12];' src/value.js
    - message: "feat: introduce invalid value"
      files:
        src/value.js: |
          export const value = "invalid";
          // legacy
  files:
    src/value.js: |
      export const value = 1;
      // legacy
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
    set -eu
    backend=$(cd "{{case_dir}}/../../../backend" && pwd -P)
    prior_output=$(uv run --quiet --no-project "$backend/scripts/run_locked.py" review-scope prepare --repo "$PWD" --base HEAD^ --target HEAD)
    prior_manifest=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' manifest)
    original_target=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' target)
    python3 - "$original_target" "$prior_manifest" "$PWD" <<'PY' >.git/verification-input
    import json, sys
    target, manifest, repo = sys.argv[1:]
    json.dump({
        "original_target": target,
        "prior_target": target,
        "prior_manifest": manifest,
        "previous_verification": {"checksum": "none", "path": "none"},
        "original_findings": [
            {"key": f"spec:1:{target}", "axis": "spec", "order": "1", "severity": "high", "disposition": "blocking", "location": "src/value.js:1", "source": "requirement: value must be numeric and at least 2", "evidence": "value was non-numeric", "repair_guidance": "Advisory: export a numeric value of at least 2 to satisfy both required constraints", "resolution_evidence": "value is numeric and value >= 2"},
            {"key": f"standards:2:{target}", "axis": "standards", "order": "2", "severity": "low", "disposition": "advisory", "location": "src/value.js:2", "source": f"{repo}/AGENTS.md", "evidence": "the legacy comment remained", "repair_guidance": "Advisory: remove the obsolete comment when safely in scope, preserving the export", "resolution_evidence": "the comment is absent and the value export remains"},
        ],
        "attempted": [f"spec:1:{target}", f"standards:2:{target}"],
    }, sys.stdout)
    PY
    mkdir -p .fixture-state
    cp .git/verification-input .fixture-state/verification-input
    git status --porcelain --untracked-files=all >.git/status-before
    git hash-object src/value.js >.git/value-before
output_checks:
  - name: human response excludes machine JSON
    review_format: human
checks:
  - name: progress verification remains read only
    run: >-
      git status --porcelain --untracked-files=all >.git/status-after && diff -u
      .git/status-before .git/status-after && git hash-object src/value.js
      >.git/value-after && cmp .git/value-before .git/value-after
  - name: only the two configured independent verifiers are launched
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      python3 .git/eval-checks/review/tests/evals/eval_routes.py --host "$(cat
      .git/fixture-host)" --profile default --axes standards spec --record-kind verification
  - name: progressing blocker keeps convergence open
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1)
      && tool=.git/eval-checks/review/src/darrow_review/result.py && test -n
      "$tool" && test -n "$record" && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/result.py}" review-result validate-verification
      "$record" && python3 .git/eval-checks/review/tests/evals/assert_records.py
      "$record" has outcome continue && original_target=$(python3 -c 'import
      json;
      print(json.load(open(".git/verification-input"))["original_target"])') &&
      python3 -c 'import json,sys; record=json.load(open(sys.argv[1])); assert
      any(item["key"]==sys.argv[2] and item["status"]=="unresolved" and
      item["progress"]=="progressing" for item in record["attempts"])' "$record"
      "spec:1:$original_target"
  - name: unresolved advisory does not become a blocker
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1)
      && original_target=$(python3 -c 'import json;
      print(json.load(open(".git/verification-input"))["original_target"])') &&
      python3 -c 'import json,sys; record=json.load(open(sys.argv[1])); assert
      any(item["key"]==sys.argv[2] and item["status"]=="unresolved" and
      item["progress"]=="unchanged" for item in record["attempts"])' "$record"
      "standards:2:$original_target"
  - name: retained verification report preserves the complete canonical evidence
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1)
      && test -n "$record" && report=$(dirname "$record")/verification.md &&
      test -r "$report" && test -s "$report" &&
      tool=.git/eval-checks/review/src/darrow_review/report.py && test -n
      "$tool" && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/report.py}" review-report render-verification
      "$record" >.git/expected-verification.md && awk 'NF'
      .git/expected-verification.md >.git/expected-verification-normalized.md &&
      awk 'NF' "$report" >.git/retained-verification-normalized.md && cmp
      .git/expected-verification-normalized.md
      .git/retained-verification-normalized.md
semantic_output_checks:
  - name: review outcome and issues are understandable inline
    proposition: >-
      The response explains that value 1 still violates the required minimum of
      2, so verification must continue or further repair is needed. It
      identifies the remaining comment as advisory and does not claim that the
      comment blocks completion. The value blocker and comment advisory are
      distinct findings. A label such as "Advisory, unchanged" identifies the
      comment as nonblocking; another finding labelled blocking and unresolved
      does not change that disposition. Suggested removal or a resolution
      condition for the advisory is allowed without making it a completion gate.
      Reject an explicit claim that the comment itself blocks completion, even
      if it is also labelled advisory. Repeating the original nonnumeric value or
      defining the word advisory is not required.
