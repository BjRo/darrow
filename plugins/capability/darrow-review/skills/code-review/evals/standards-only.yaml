id: code-review-standards-only
required_plugin_hook: darrow-review
activation: positive
invariant: CR-E1,CR-E2,CR-E4,CR-C21,CR-E14,CR-E18
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Review my uncommitted changes. Report only; do not modify any files. There is no originating product specification for this cleanup."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository standards

          Public string helpers must reject non-string input before calling string methods.
        src/name.js: |
          export function normalizeName(value) {
            if (typeof value !== "string") return "";
            return value.trim();
          }
  files:
    src/name.js: |
      export function normalizeName(value) {
        return value.trim();
      }
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
    git status --porcelain --untracked-files=all >.git/status-before
checks:
  - name: human response excludes machine JSON
    run: python3 .git/eval-checks/review/tests/evals/assert_records.py
      .git/last-message.md human-response
  - name: review preserves the complete working tree
    run: |
      git status --porcelain --untracked-files=all >.git/status-after
      diff -u .git/status-before .git/status-after
  - name: review creates no commit
    run: test "$(git rev-list --all --reflog --count)" -eq 1
  - name: canonical JSON is retained beneath the review scope artifact
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/result.py; test -n "$tool"
      || exit 1; uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/result.py}" review-result validate "$record"
    expect_regex: "^valid: darrow-review-result-v3$"
  - name: only the standards reader retains exact default route evidence
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      python3 .git/eval-checks/review/tests/evals/eval_routes.py --host "$(cat
      .git/fixture-host)" --profile default --axes standards
  - name: retained Markdown preserves every canonical rendered line
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/report.py; test -n "$tool"
      || exit 1; expected=.git/expected-review.md; uv run --quiet --frozen
      --no-dev --project "${tool%/src/darrow_review/report.py}" review-report
      render "$record" >"$expected" && awk 'NF' "$expected"
      >.git/expected-review-normalized.md && awk 'NF' "$(dirname
      "$record")/review.md" >.git/actual-review-normalized.md && cmp
      .git/expected-review-normalized.md .git/actual-review-normalized.md
semantic_output_checks:
  - name: review outcome and issues are understandable inline
    proposition: >-
      The response identifies a repository-standards violation in normalizeName:
      calling trim without rejecting non-string input can throw and violates the
      documented input guard requirement. It describes the issue inline and
      makes clear that the non-string guard is required before trim. Contrasting
      the missing guard and resulting throw with that requirement conveys the
      correction; a separate imperative to restore it is not required. Reject
      approval of the unguarded implementation or a missing concrete defect.
