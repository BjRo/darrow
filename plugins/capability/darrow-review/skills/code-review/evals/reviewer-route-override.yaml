id: code-review-reviewer-route-override
activation: positive
invariant: CR-C4,CR-C21,CR-P8,CR-E14
prompt: >-
  Explicitly use {{skill_invocation}} to review my uncommitted
  changes against this originating requirement:
  exported mode must equal "safe". Do not repair the code.
fixture:
  commits:
    - message: "chore: init"
      files:
        .darrow/config.json: |
          {
            "routes": [
              {"host":"codex","profile":"routine","harness":"codex","provider":"openai","model":"gpt-5.6-terra","effort":"medium","fallbackModel":"none","fallbackEffort":"none"}
            ],
            "reviewers": [
              {"host":"codex","harness":"codex","provider":"openai","model":"gpt-5.5","effort":"xhigh"},
              {"host":"claude","harness":"claude","provider":"anthropic","model":"claude-sonnet-5","effort":"high"}
            ]
          }
        src/config.js: |
          export const mode = "legacy";
  files:
    src/config.js: |
      export const mode = "unsafe";
  setup: |
    mkdir -p .git/eval-checks/review/tests/evals
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/eval-checks/review/
    cp -R "{{case_dir}}/../../../backend/src" .git/eval-checks/review/
    cp "{{case_dir}}/../../../backend/tests/evals/eval_routes.py" .git/eval-checks/review/tests/evals/
checks:
  - name: repository reviewer policy is retained with the pinned scope
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name reviewer-route.tsv -type f | sort | tail -n '1');
      test -n "$record" && grep -F 'route_source	repository' "$record" >/dev/null
  - name: configured host route is selected without inheritance
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name reviewer-route.tsv -type f | sort | tail -n '1');
      test -n "$record" && case "$DARROW_EVAL_HARNESS" in
      codex) grep -F 'selected_route	codex	openai	gpt-5.5	xhigh' "$record" >/dev/null ;;
      claude) grep -F 'selected_route	claude	anthropic	claude-sonnet-5	high' "$record" >/dev/null ;;
      *) exit 2 ;; esac
  - name: both isolated axes retain exact route application evidence
    run: >-
      uv run --quiet --frozen --no-dev --project .git/eval-checks/review
      python .git/eval-checks/review/tests/evals/eval_routes.py
      --host "$DARROW_EVAL_HARNESS" --profile override --axes standards spec
  - name: review remains read-only
    run: test "$(git status --porcelain --untracked-files=all)" = ' M src/config.js'
  - name: canonical TSV is retained beneath the review scope artifact
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n '1');
      test -n "$tool" && uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate "$record"
    expect_regex: "^valid: darrow-review-result-v1$"
  - name: default response does not duplicate canonical TSV
    run: "! grep -F 'format	darrow-review-result-v1' .git/last-message.md"
  - name: final response preserves every canonical rendered line
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/backend/src/darrow_review/report.py' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      expected=.git/expected-review.md;
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/report.py}" review-report render "$record" >"$expected" &&
      awk 'NF' "$expected" >.git/expected-review-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-review-normalized.md &&
      cmp .git/expected-review-normalized.md .git/actual-review-normalized.md
