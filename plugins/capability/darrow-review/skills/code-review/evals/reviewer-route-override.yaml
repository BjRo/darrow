id: code-review-reviewer-route-override
activation: positive
invariant: CR-C4,CR-C21,CR-P8,CR-E14
prompt: >-
  Explicitly use {{skill_invocation}} to review my uncommitted changes against
  this originating requirement: exported mode must equal "safe". Do not repair
  the code.
fixture:
  commits:
    - message: "chore: init"
      files:
        .darrow/config.json: |
          {
            "routes": [
              {"host":"codex","profile":"routine","harness":"codex","provider":"openai","model":"gpt-5.6-terra","effort":"medium","fallbackModel":"none","fallbackEffort":"none"}
            ],
            "reviewers": [
              {"host":"codex","harness":"codex","provider":"openai","model":"gpt-5.6-sol","effort":"xhigh"},
              {"host":"claude","harness":"claude","provider":"anthropic","model":"claude-sonnet-5-5","effort":"high"}
            ]
          }
        src/config.js: |
          export const mode = "legacy";
  files:
    src/config.js: |
      export const mode = "unsafe";
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
checks:
  - name: human response excludes machine JSON
    run: python3 .git/eval-checks/review/tests/evals/assert_records.py
      .git/last-message.md human-response
  - name: repository reviewer policy is retained with the pinned scope
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name reviewer-route.json -type f | sort | tail -n
      '1'); test -n "$record" && python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" has
      route_source repository
  - name: configured host route is selected without inheritance
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name reviewer-route.json -type f | sort | tail -n
      '1'); test -n "$record" && case "$(cat .git/fixture-host)" in codex)
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record"
      has selected_route codex openai gpt-5.6-sol xhigh ;; claude) python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" has
      selected_route claude anthropic claude-sonnet-5-5 high ;; *) exit 2 ;;
      esac
  - name: both isolated axes retain exact route application evidence
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      python3 .git/eval-checks/review/tests/evals/eval_routes.py --host "$(cat
      .git/fixture-host)" --profile override --axes standards spec
  - name: review remains read-only
    run: test "$(git status --porcelain --untracked-files=all)" = ' M src/config.js'
  - name: canonical JSON is retained beneath the review scope artifact
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/result.py; test -n "$tool"
      && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/result.py}" review-result validate "$record"
    expect_regex: "^valid: darrow-review-result-v3$"
  - name: retained Markdown preserves every canonical rendered line
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/report.py; test -n "$tool"
      || exit 1; expected=.git/expected-review.md; uv run --quiet --frozen
      --no-dev --project "${tool%/src/darrow_review/report.py}" review-report
      render "$record" >"$expected" && awk 'NF' "$expected"
      >.git/expected-review-normalized.md && awk 'NF' "$(dirname
      "$record")/review.md" >.git/actual-review-normalized.md && cmp
      .git/expected-review-normalized.md .git/actual-review-normalized.md
semantic_output_checks:
  - name: review outcome and issues are understandable inline
    proposition: >-
      The response identifies the blocking requirement violation in
      src/config.js: exported mode is unsafe although the request requires safe.
      It explains that issue inline and makes the required safe value clear. For
      this direct wrong-value defect, saying that mode is unsafe but must equal
      safe conveys both the correction and its resolution condition; a separate
      recommendation or test sentence is not required. Reject an unspecified
      mismatch, a wrong required value, a nonblocking characterization, or
      advice that contradicts the safe requirement.
