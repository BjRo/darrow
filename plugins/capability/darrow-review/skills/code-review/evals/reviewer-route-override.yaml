id: code-review-reviewer-route-override
invariant: CR-C4,CR-C21,CR-P8,CR-E14
prompt: >-
  Explicitly use the installed $code-review skill to review my uncommitted
  changes against this originating requirement:
  exported mode must equal "safe". Do not repair the code.
fixture:
  commits:
    - message: "chore: init"
      files:
        .darrow/config.json: |
          {
            "routes": [
              {"host":"codex","profile":"routine","harness":"codex","provider":"openai","model":"gpt-5.6-terra","effort":"medium","fallbackModel":"none","fallbackEffort":"none"}
            ],
            "reviewers": [
              {"host":"codex","harness":"codex","provider":"openai","model":"gpt-5.5","effort":"xhigh"},
              {"host":"claude","harness":"claude","provider":"anthropic","model":"claude-sonnet-5","effort":"high"}
            ]
          }
        src/config.js: |
          export const mode = "legacy";
  files:
    src/config.js: |
      export const mode = "unsafe";
checks:
  - name: repository reviewer policy is retained with the pinned scope
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name reviewer-route.tsv -type f | sort | tail -n '1');
      test -n "$record" && grep -F 'route_source	repository' "$record" >/dev/null
  - name: configured host route is selected without inheritance
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name reviewer-route.tsv -type f | sort | tail -n '1');
      test -n "$record" && case "$DARROW_EVAL_HARNESS" in
      codex) grep -F 'selected_route	codex	openai	gpt-5.5	xhigh' "$record" >/dev/null ;;
      claude) grep -F 'selected_route	claude	anthropic	claude-sonnet-5	high' "$record" >/dev/null ;;
      *) exit 2 ;; esac
  - name: both isolated axes retain exact route application evidence
    run: >-
      selection=$(find .git -path '*/darrow-review.*/*' -name reviewer-route.tsv -type f | sort | tail -n '1');
      test -n "$selection" || exit 1; artifact_dir=$(dirname "$selection");
      case "$DARROW_EVAL_HARNESS" in
      codex) host=codex; provider=openai; model=gpt-5.5; effort=xhigh ;;
      claude) host=claude; provider=anthropic; model=claude-sonnet-5; effort=high ;;
      *) exit 2 ;; esac;
      case "$DARROW_EVAL_HARNESS" in codex)
      test "$(grep -F '"tool":"spawn_agent"' .git/retained-harness.jsonl |
      grep -F '"status":"in_progress"' | grep -c .)" -eq 2 || exit 1;
      awk 'index($0, "\"tool\":\"spawn_agent\"") &&
      !index($0, "\"status\":\"in_progress\"") &&
      !index($0, "\"status\":\"completed\"") { failed = 1 }
      END { exit failed }' .git/retained-harness.jsonl || exit 1 ;;
      claude) test "$(grep -F '"type":"darrow.review_agent_launch"'
      .git/retained-harness.jsonl | grep -c .)" -eq 2 || exit 1 ;; esac;
      for axis in standards spec; do record="$artifact_dir/$axis-route.tsv";
      test -f "$record" || exit 1;
      awk -F '\t' -v a="$axis"
      '$1 == "axis" && $2 == a { found = 1 } END { exit !found }' "$record" || exit 1;
      agent=$(awk -F '\t' '$1 == "agent_id" { print $2 }' "$record");
      test -n "$agent" || exit 1;
      case "$axis" in standards) standards_agent=$agent ;; spec) spec_agent=$agent ;; esac;
      case "$DARROW_EVAL_HARNESS" in codex) route_field=requested_route; proof_field=route_bound ;;
      claude) route_field=observed_route; proof_field=route_bound ;; esac;
      awk -F '\t' -v f="$route_field" -v h="$host" -v p="$provider" -v m="$model" -v e="$effort"
      '$1 == f && $2 == h && $3 == p && $4 == m && $5 == e { found = 1 }
      END { exit !found }' "$record" || exit 1;
      awk -F '\t' -v f="$proof_field" '$1 == f && $2 == "true" { found = 1 }
      END { exit !found }' "$record" || exit 1;
      if test "$DARROW_EVAL_HARNESS" = codex; then
      native=$(grep -F '"tool":"spawn_agent"' .git/retained-harness.jsonl |
      grep -F '"status":"in_progress"' | grep -F "\"$agent\"" |
      grep -F "\"model\":\"$model\"" | grep -F "\"reasoning_effort\":\"$effort\"") || exit 1;
      case "$native" in *'"fork_turns":"none"'*) ;; *) exit 1 ;; esac;
      case "$native" in *"- review_axis: $axis"*) ;; *) exit 1 ;; esac; fi; done;
      test "$standards_agent" != "$spec_agent" || exit 1;
      case "$DARROW_EVAL_HARNESS" in codex)
      awk -v s="$standards_agent" -v p="$spec_agent"
      'index($0, "\"type\":\"item.started\"") && index($0, "\"tool\":\"spawn_agent\"") {
      if (index($0, "\"" s "\"")) standards_start = NR;
      if (index($0, "\"" p "\"")) spec_start = NR }
      !first_wait && index($0, "\"tool\":\"wait") { first_wait = NR }
      END { exit !(standards_start && spec_start && first_wait &&
      standards_start < first_wait && spec_start < first_wait) }'
      .git/retained-harness.jsonl || exit 1 ;; claude)
      subagent="darrow-review:review-reader-$model-$effort";
      awk 'index($0, "\"name\":\"Agent\"") {
      value = $0; agents += gsub("\"name\":\"Agent\"", "", value) }
      END { exit agents != 2 }' .git/retained-harness.jsonl || exit 1;
      awk -v a="$subagent"
      'index($0, "\"name\":\"Agent\"") &&
      index($0, "- review_axis: standards") && index($0, "- review_axis: spec") {
      value = $0; agents = gsub("\"name\":\"Agent\"", "", value);
      value = $0; types = gsub("\"subagent_type\":\"" a "\"", "", value);
      if (agents == 2 && types == 2) found = 1 }
      END { exit !found }' .git/retained-harness.jsonl || exit 1 ;; esac;
      if test "$DARROW_EVAL_HARNESS" = claude; then for axis in standards spec;
      do observed="$artifact_dir/$axis-observed-route.tsv"; test -f "$observed" || exit 1;
      application="$artifact_dir/$axis-route.tsv";
      grep -F -x 'provider_evidence	current-host-environment-default'
      "$observed" >/dev/null || exit 1;
      grep -F -x 'provider_evidence	current-host-environment-default'
      "$application" >/dev/null || exit 1;
      test "$(awk -F '\t' '$1 == "agent_id" { print $2 }' "$application")" =
      "$(awk -F '\t' '$1 == "agent_id" { print $2 }' "$observed")" || exit 1;
      awk -F '\t' -v m="$model" -v e="$effort"
      '$1 == "observed_route" && $2 == "claude" && $3 == "anthropic" && $4 == m && $5 == e { found = 1 }
      END { exit !found }' "$observed" || exit 1;
      subagent="darrow-review:review-reader-$model-$effort";
      launch=$(grep -F '"type":"darrow.review_agent_launch"' .git/retained-harness.jsonl |
      grep -F "\"agent_id\":\"$agent\"" | grep -F "\"review_axis\":\"$axis\"" |
      grep -F "\"subagent_type\":\"$subagent\"") || exit 1;
      test "$(printf '%s\n' "$launch" | grep -c .)" -eq 1 || exit 1;
      batch=$(printf '%s\n' "$launch" | sed -E 's/.*"batch":([0-9]+).*/\1/');
      case "$axis" in standards) standards_batch=$batch ;; spec) spec_batch=$batch ;; esac;
      done; test "$standards_batch" = "$spec_batch" || exit 1; fi
  - name: review remains read-only
    run: test "$(git status --porcelain --untracked-files=all)" = ' M src/config.js'
output_checks:
  - name: review returns the complete human protocol
    expect_regex: '^# Code review — FAIL[\s\S]*## Findings[\s\S]*## Checks[\s\S]*## Scope[\s\S]*## Sources'
    flags: i
