id: code-review-goal-contract-pass
required_plugin_hook: darrow-review
activation: positive
invariant: CR-C13,CR-C14,CR-E9,CR-E11,CR-E18
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Execute this bounded goal contract. The candidate change is already present in the working tree. Before declaring the goal complete, use the available capability matching this intent: independently review the exact current code change against the originating requirement and repository standards. Require its normal review report. A response with no blocking findings returns control to this goal; blocking findings or unavailable review stop it. After and only after a clear review, run `bash mark-complete.sh`. Originating requirement: exported RATE_LIMIT must equal 2. Run `bash check.sh` to verify acceptance. Not authorized: product edits, commits, pushes, pull requests, or any publication action. At the end, report the final goal outcome and the independent-review outcome."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash check.sh` for JavaScript changes.
        src/rate.js: "export const RATE_LIMIT = 1;\n"
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'export const RATE_LIMIT = 2;' src/rate.js >/dev/null
        mark-complete.sh: |
          #!/usr/bin/env bash
          set -eu
          record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n 1)
          test -n "$record"
          python3 - "$record" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              record = json.load(source)
          assert record["verdict"] == "pass"
          PY
          printf '%s\n' complete >.fixture-state/goal-complete
  files:
    src/rate.js: "export const RATE_LIMIT = 2;\n"
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
output_checks:
  - name: human response excludes machine JSON
    review_format: human
checks:
  - name: passing review returns control to the enclosing goal
    run: test "$(cat .fixture-state/goal-complete)" = complete
  - name: candidate content remains unchanged
    run: bash check.sh
  - name: composed review pins one target
    run:
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" && test "$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -maxdepth
      3 -name scope.json -path '*/darrow-review.*/*' | wc -l | tr -d ' ')" -ge 1
  - name: composed review creates no commit
    run: test "$(git rev-list --count HEAD)" -eq 1
  - name: composed review artifact is canonical and returns control
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/result.py; test -n "$tool"
      || exit 1; uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/result.py}" review-result validate "$record" &&
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record"
      has verdict pass && python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" lacks-key
      findings
    expect_regex: "^valid: darrow-review-result-v3$"
semantic_output_checks:
  - name: enclosing goal reports completion
    proposition: The response says the bounded goal completed successfully.
  - name: completion reports the independent review outcome
    proposition: >-
      The response says the independent review passed or found no blocking
      findings.
