id: code-review-reviewer-route-unavailable
activation: positive
invariant: CR-C4,CR-C10,CR-C21,CR-E7,CR-E14
prompt: >-
  Explicitly use {{skill_invocation}} to review my uncommitted
  changes against this originating requirement: exported mode must equal
  "safe". The native host reports that the selected configured reviewer route
  is unavailable for this run. Do not repair the code, inherit another reviewer
  route, retry with a fallback, or substitute another model.
fixture:
  commits:
    - message: "chore: init"
      files:
        .darrow/config.json: |
          {
            "reviewers": [
              {"host":"codex","harness":"codex","provider":"openai","model":"gpt-5.5","effort":"xhigh"},
              {"host":"claude","harness":"claude","provider":"anthropic","model":"claude-sonnet-5","effort":"high"}
            ]
          }
        src/config.js: |
          export const mode = "legacy";
  files:
    src/config.js: |
      export const mode = "unsafe";
  setup: |
    mkdir -p .git/eval-checks/review/tests/evals && cp "{{case_dir}}/../../../backend/tests/evals/assert_records.py" .git/eval-checks/review/tests/evals/
checks:
  - name: unavailable repository policy is retained without fallback
    run: >-
      selection=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name reviewer-route.json -type f | sort | tail -n '1');
      test -n "$selection" && case "$DARROW_EVAL_HARNESS" in
      codex) python3 .git/eval-checks/review/tests/evals/assert_records.py "$selection" has selected_route codex openai gpt-5.5 xhigh ;;
      claude) python3 .git/eval-checks/review/tests/evals/assert_records.py "$selection" has selected_route claude anthropic claude-sonnet-5 high ;;
      *) exit 2 ;; esac
  - name: no reader accepts inherited or substituted route evidence
    run: >-
      selection=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name reviewer-route.json -type f | sort | tail -n '1');
      test -n "$selection" || exit 1; artifact_dir=$(dirname "$selection");
      for axis in standards spec; do record="$artifact_dir/$axis-route.json";
      if test -e "$record"; then
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record" lacks route_verified true || exit 1;
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record" lacks route_bound true || exit 1; fi; done
  - name: unavailable route retains zero native reader launch attempts
    run: >-
      case "$DARROW_EVAL_HARNESS" in codex)
      awk 'index($0, "\"tool\":\"spawn_agent\"") ||
      index($0, "\"type\":\"darrow.codex_native_spawn\"") { found = 1 }
      END { exit found }' .git/retained-harness.jsonl ;;
      claude) awk 'index($0, "\"name\":\"Agent\"") ||
      index($0, "\"type\":\"darrow.review_agent_launch\"") { found = 1 }
      END { exit found }' .git/retained-harness.jsonl ;;
      *) exit 2 ;; esac
  - name: blocked aggregate remains canonical and read only
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate "$record" &&
      python3 .git/eval-checks/review/tests/evals/assert_records.py "$record" has verdict blocked &&
      test "$(git status --porcelain --untracked-files=all)" = ' M src/config.js'
    expect_regex: "^valid: darrow-review-result-v3$"
  - name: default response does not duplicate canonical JSON
    run: "! grep -F 'format	darrow-review-result-v3' .git/last-message.md"
  - name: final response preserves every canonical rendered line
    run: >-
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/backend/src/darrow_review/report.py' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      expected=.git/expected-review.md;
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/report.py}" review-report render "$record" >"$expected" &&
      awk 'NF' "$expected" >.git/expected-review-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-review-normalized.md &&
      cmp .git/expected-review-normalized.md .git/actual-review-normalized.md
