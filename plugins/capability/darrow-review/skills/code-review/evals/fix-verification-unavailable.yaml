id: code-review-fix-verification-unavailable
required_plugin_hook: darrow-review
activation: positive
invariant: CR-C17,CR-C18,CR-C20,CR-E13,CR-E18,CR-E19
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Verify my uncommitted repair against the prior code-review findings recorded in `.fixture-state/verification-input`. Run the repository's prescribed checks and report whether the repair is verified or what evidence is missing. Remain read-only, and do not widen this into another comprehensive review."
fixture:
  commits:
    - message: "chore: base"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash external-check.sh` for endpoint changes.
        endpoint.txt: "https://example.invalid/v2\n"
        external-check.sh: |
          #!/usr/bin/env bash
          printf 'required external verifier is unavailable\n' >&2
          exit 127
    - message: "feat: introduce stale endpoint"
      files:
        endpoint.txt: "https://example.invalid/v1\n"
  files:
    endpoint.txt: "https://example.invalid/v2\n"
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
    set -eu
    backend=$(cd "{{case_dir}}/../../../backend" && pwd -P)
    prior_output=$(uv run --quiet --no-project "$backend/scripts/run_locked.py" review-scope prepare --repo "$PWD" --base HEAD^ --target HEAD)
    prior_manifest=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' manifest)
    original_target=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' target)
    python3 - "$original_target" "$prior_manifest" "$PWD" <<'PY' >.git/verification-input
    import json, sys
    target, manifest, repo = sys.argv[1:]
    json.dump({
        "original_target": target,
        "prior_target": target,
        "prior_manifest": manifest,
        "previous_verification": {"checksum": "none", "path": "none"},
        "original_findings": [{
            "key": f"standards:1:{target}", "axis": "standards", "order": "1",
            "severity": "high", "disposition": "blocking",
            "location": "endpoint.txt:1", "source": f"{repo}/AGENTS.md",
            "evidence": "endpoint remained on v1",
            "repair_guidance": "Advisory: restore the endpoint to v2 while preserving its representation",
            "resolution_evidence": "endpoint.txt contains https://example.invalid/v2 and the external check succeeds",
        }],
        "attempted": [f"standards:1:{target}"],
    }, sys.stdout)
    PY
    mkdir -p .fixture-state
    cp .git/verification-input .fixture-state/verification-input
    git status --porcelain --untracked-files=all >.git/status-before
    git hash-object endpoint.txt >.git/endpoint-before
checks:
  - name: human response excludes machine JSON
    run: python3 .git/eval-checks/review/tests/evals/assert_records.py
      .git/last-message.md human-response
  - name: unavailable verification remains read only
    run: >-
      git hash-object endpoint.txt >.git/endpoint-after && cmp
      .git/endpoint-before .git/endpoint-after && git status --porcelain
      --untracked-files=all >.git/status-after && cmp .git/status-before
      .git/status-after
  - name: unavailable evidence produces a valid blocked artifact
    run: |
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}"
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1)
      tool=.git/eval-checks/review/src/darrow_review/result.py
      test -n "$tool" && test -n "$record" || exit 1
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate-verification "$record" || exit 1
      python3 - "$record" <<'PY'
      import json, pathlib, sys
      path = pathlib.Path(sys.argv[1])
      record = json.loads(path.read_text())
      checks = [item for item in record['checks'] if item['command'] == 'bash external-check.sh' and item['applicability'] == 'applicable' and item['status'] == 'blocked']
      assert len(checks) == 1
      assert any(
          (capture := json.loads(file.read_text()))['format'] == 'darrow-review-check-v3' and checks[0] in capture['checks']
          for file in path.parent.glob('check-*.json')
      )
      assert not record.get('regressions')
      assert record['outcome'] == 'blocked'
      PY
  - name: retained verification report preserves the complete canonical evidence
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1)
      && test -n "$record" && report=$(dirname "$record")/verification.md &&
      test -r "$report" && test -s "$report" &&
      tool=.git/eval-checks/review/src/darrow_review/report.py && test -n
      "$tool" && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/report.py}" review-report render-verification
      "$record" >.git/expected-verification.md && awk 'NF'
      .git/expected-verification.md >.git/expected-verification-normalized.md &&
      awk 'NF' "$report" >.git/retained-verification-normalized.md && cmp
      .git/expected-verification-normalized.md
      .git/retained-verification-normalized.md
semantic_output_checks:
  - name: review outcome and issues are understandable inline
    proposition: >-
      The response reports blocked fix verification because the required
      external check cannot run. It explains inline that changing the endpoint
      to v2 does not establish completion without successful external
      verification.
