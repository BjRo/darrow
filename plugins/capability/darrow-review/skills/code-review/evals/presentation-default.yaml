id: code-review-presentation-default
activation: positive
invariant: CR-C15,CR-C16,CR-E12
prompt: >-
  Review my uncommitted changes against this originating requirement: token
  values must be positive integers. Report only; do not request machine format.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Review standard

          Changed token code must not call console.log.
        src/token.js: |
          export function parseToken(value) {
            return Number(value);
          }
  files:
    src/token.js: |
      export function parseToken(value) {
        console.log("<token> & `debug`", value);
        return Number(value);
      }
checks:
  - name: raw TSV stays beneath the review artifact
    run: test "$(find .git -path '*/darrow-review.*/*' -name '*.tsv' | wc -l | tr -d ' ')" -ge 1
  - name: canonical TSV is valid
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/bin/review-result' -type f | sort | tail -n '1');
      test -n "$tool" && bash "$tool" validate "$record"
    expect_regex: "^valid: darrow-review-result-v1$"
  - name: human response does not duplicate raw TSV
    run: "! grep -F 'format	darrow-review-result-v1' .git/last-message.md"
  - name: human response renders values as ordinary Markdown text
    run: >-
      ! grep -F '<code>' .git/last-message.md &&
      ! grep -F '</code>' .git/last-message.md &&
      ! grep -F '`' .git/last-message.md &&
      ! grep -E '\[[^][]+\]\([^)]*\)' .git/last-message.md &&
      esc=$(printf '\033]8;') && ! grep -F "$esc" .git/last-message.md
  - name: final response preserves every canonical rendered line
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=$(find .git -path '*/bin/review-report' -type f | sort | tail -n '1');
      test -n "$tool" || exit 1;
      expected=.git/expected-review.md;
      bash "$tool" render "$record" >"$expected" &&
      awk 'NF' "$expected" >.git/expected-review-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-review-normalized.md &&
      cmp .git/expected-review-normalized.md .git/actual-review-normalized.md
