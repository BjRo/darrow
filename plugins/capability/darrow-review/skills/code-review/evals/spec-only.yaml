id: code-review-spec-only
required_plugin_hook: darrow-review
activation: positive
invariant: CR-E2,CR-E4,CR-E7,CR-E8,CR-E14,CR-E18
prompt: 'Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Review my uncommitted changes against this originating requirement: formatName must trim outer whitespace and return exactly "Anonymous" when the trimmed name is empty. Run `bash test.sh` to verify the implementation as part of this review. Report only and do not modify files.'
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Checks

          Run `bash test.sh` for changed JavaScript.
        src/name.js: |
          export function formatName(value) {
            return value.trim() || "Anonymous";
          }
        test.sh: |
          #!/usr/bin/env bash
          node -e 'import("./src/name.js").then(({formatName}) => { if (formatName("Ada") !== "Ada") process.exit(1) })'
  files:
    src/name.js: |
      export function formatName(value) {
        return value.trim();
      }
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
    git status --porcelain --untracked-files=all >.git/status-before
output_checks:
  - name: human response excludes machine JSON
    review_format: human
checks:
  - name: review is read-only
    run: git status --porcelain --untracked-files=all >.git/status-after; cmp
      .git/status-before .git/status-after
  - name: canonical JSON is retained beneath the review scope artifact
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/result.py; test -n "$tool"
      && uv run --quiet --frozen --no-dev --project
      "${tool%/src/darrow_review/result.py}" review-result validate "$record"
    expect_regex: "^valid: darrow-review-result-v3$"
  - name: only Spec blocks for the seeded requirement defect
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1; python3 -c 'import json,sys;
      record=json.load(open(sys.argv[1])); assert record["standards"]=="pass"
      and record["spec"]==record["verdict"]=="fail"; assert
      any(finding["axis"]=="spec" and finding["disposition"]=="blocking" for
      finding in record["findings"]); assert not
      any(finding["axis"]=="standards" and finding["disposition"]=="blocking"
      for finding in record["findings"])' "$record"
  - name: native reviewers use both configured independent axis routes
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      python3 .git/eval-checks/review/tests/evals/eval_routes.py --host "$(cat
      .git/fixture-host)" --profile default --axes standards spec
  - name: retained Markdown preserves every canonical rendered line
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path
      '*/darrow-review.*/*' -name result.json -type f | sort | tail -n '1');
      test -n "$record" || exit 1;
      tool=.git/eval-checks/review/src/darrow_review/report.py; test -n "$tool"
      || exit 1; expected=.git/expected-review.md; uv run --quiet --frozen
      --no-dev --project "${tool%/src/darrow_review/report.py}" review-report
      render "$record" >"$expected" && awk 'NF' "$expected"
      >.git/expected-review-normalized.md && awk 'NF' "$(dirname
      "$record")/review.md" >.git/actual-review-normalized.md && cmp
      .git/expected-review-normalized.md .git/actual-review-normalized.md
semantic_output_checks:
  - name: seeded empty-name defect is detected and traced to the requirement
    proposition: >-
      The review identifies that formatName returns an empty string for an empty
      or whitespace-only input after trimming, violating the originating
      requirement to return exactly Anonymous when the trimmed name is empty. It
      makes clear that the change needs repair because of this defect. Saying
      the implementation does not meet this requirement is sufficient; a
      literal failed-review verdict is not required. A fail verdict tied
      to this sole defect establishes its blocking effect; literal Spec or
      blocking labels are optional. Contrasting the empty string with the
      required Anonymous value restates and traces the inline requirement;
      repeating an "originating request" citation label is not required. A
      blocked or passing report, generic claim of a specification mismatch, or
      unrelated finding without this defect does not satisfy the check. Assess
      the finding's diagnosis of current code. Repair guidance and resolution
      evidence describe the desired behavior after repair; they do not claim
      that the current code already implements that behavior.
