id: code-review-guidance-unresolved
activation: positive
invariant: CR-C9,CR-C18,CR-C19,CR-E15
prompt: >-
  Use {{skill_invocation}} to verify my uncommitted repair against the original
  review and binding records in .git/verification-input. The originating
  requirement is in requirements.md. Remain read-only and report the
  fix-verification outcome.
fixture:
  commits:
    - message: "chore: base"
      files:
        AGENTS.md: |
          # Repository instructions

          Review JavaScript against the supplied originating requirement.
        requirements.md: |
          formatName must trim leading and trailing whitespace from a string
          and return exactly Anonymous when the trimmed string is empty.
        src/name.js: |
          export function formatName(value) {
            return value;
          }
    - message: "feat: trim name"
      files:
        src/name.js: |
          export function formatName(value) {
            return value.trim();
          }
  files:
    src/name.js: |
      export function formatName(value) {
        const result = value.trim();
        if (value.length === 0) return "Anonymous";
        return result;
      }
  setup: |
    set -eu
    backend=$(cd "{{case_dir}}/../../../backend" && pwd -P)
    prior_output=$(uv run --quiet --frozen --no-dev --project "$backend" review-scope prepare --repo "$PWD" --base HEAD^ --target HEAD)
    prior_manifest=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; key=sys.argv[1]; print(next(row[1] for row in json.load(sys.stdin) if row[0] == key))' manifest)
    original_target=$(printf '%s' "$prior_output" | python3 -c 'import json,sys; key=sys.argv[1]; print(next(row[1] for row in json.load(sys.stdin) if row[0] == key))' target)
    original_result=$(dirname "$prior_manifest")/result.json
    scope_rows=$(uv run --quiet --frozen --no-dev --project "$backend" review-result scope-records "$prior_manifest")
    python3 - "$PWD" "$scope_rows" <<'PY' >"$original_result"
    import json, sys
    repo, scope_json = sys.argv[1:]
    rows = [
        ["format", "darrow-review-result-v2"],
        *json.loads(scope_json),
        ["standards", "pass"],
        ["standards_source", f"{repo}/AGENTS.md"],
        ["spec", "fail"],
        ["spec_source", f"{repo}/requirements.md"],
        ["finding", "spec", "high", "blocking", f"{repo}/src/name.js:2", f"{repo}/requirements.md", "Direct trim returns an empty string for whitespace-only input instead of Anonymous", "Advisory: store value.trim() in a local variable and return the variable or Anonymous; this supplies the missing fallback while preserving trimming", "Whitespace-only and empty input return Anonymous; padded Ada returns Ada"],
        ["check", "none", "not_applicable", "not_applicable", "No configured command"],
        ["verdict", "fail"],
        ["risk", "none"],
        ["next_action", "return findings"],
    ]
    json.dump(rows, sys.stdout)
    PY
    finding_rows=$(uv run --quiet --frozen --no-dev --project "$backend" review-result original-findings "$original_result")
    python3 - "$original_target" "$prior_manifest" "$original_result" "$finding_rows" <<'PY' >.git/verification-input
    import json, sys
    target, manifest, result, finding_json = sys.argv[1:]
    rows = [
        ["original_target", target],
        ["prior_target", target],
        ["prior_manifest", manifest],
        ["original_result", result],
        ["previous_verification", "none", "none"],
        *json.loads(finding_json),
        ["attempted", f"spec:1:{target}"],
    ]
    json.dump(rows, sys.stdout)
    PY
    git hash-object src/name.js >.git/before
checks:
  - name: following the advice does not excuse a remaining required case
    run: |
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1)
      original=$(python3 -c 'import json; print(next(row[1] for row in json.load(open(".git/verification-input")) if row[0] == "original_result"))')
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n 1)
      test -n "$record" && test -n "$tool" && uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate-original "$original" "$record" || exit 1
      python3 -c 'import json,sys; rows=json.load(open(sys.argv[1])); assert any(row in rows for row in (["outcome","continue"],["outcome","no_progress"])) and any(row[0]=="attempt" and row[2]=="unresolved" for row in rows)' "$record"
  - name: repair remains read only
    run: git hash-object src/name.js >.git/after && cmp .git/before .git/after
semantic_output_checks:
  - name: remaining whitespace defect controls the outcome
    proposition: >-
      The report keeps the original finding unresolved because whitespace-only
      strings still return an empty string instead of Anonymous: the code
      checks the original input length rather than the trimmed result. Using
      trim and a local variable as suggested does not establish resolution.
