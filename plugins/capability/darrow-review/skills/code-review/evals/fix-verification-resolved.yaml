id: code-review-fix-verification-resolved
activation: positive
invariant: CR-C13,CR-C14,CR-C17,CR-C18,CR-C21,CR-E12,CR-E13,CR-E14
prompt: >-
  Verify whether my uncommitted repair resolved the prior code-review findings
  recorded in `.git/verification-input`. Use `bash check.sh` as current check
  evidence. Remain read-only and do not widen this into another comprehensive
  review.
fixture:
  commits:
    - message: "chore: base"
      files:
        AGENTS.md: |
          # Repository instructions

          DEBUG must remain false. Run `bash check.sh` for config changes.
        src/config.js: |
          export const DEBUG = false;
          export const TIMEOUT_MS = 2500;
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'export const DEBUG = false;' src/config.js >/dev/null
          grep -Fx 'export const TIMEOUT_MS = 2500;' src/config.js >/dev/null
          ! grep -F 'LEGACY' src/config.js >/dev/null
    - message: "feat: introduce broken config"
      files:
        src/config.js: |
          export const DEBUG = true;
          export const TIMEOUT_MS = 1000;
          export const LEGACY = true;
  files:
    src/config.js: |
      export const DEBUG = false;
      export const TIMEOUT_MS = 2500;
  setup: |
    tool_dir=$(cd "{{case_dir}}/../../../bin" && pwd -P)
    prior_output=$(bash "$tool_dir/review-scope" prepare --repo "$PWD" --base HEAD^ --target HEAD)
    prior_manifest=$(printf '%s\n' "$prior_output" | awk -F '\t' '$1 == "manifest" { print $2 }')
    original_target=$(printf '%s\n' "$prior_output" | awk -F '\t' '$1 == "target" { print $2 }')
    {
      printf 'original_target\t%s\n' "$original_target"
      printf 'prior_target\t%s\n' "$original_target"
      printf 'prior_manifest\t%s\n' "$prior_manifest"
      printf 'previous_verification\tnone\tnone\n'
      printf 'original_finding\tstandards:1:%s\tstandards\t1\thigh\tblocking\tsrc/config.js:1\t%s/AGENTS.md\tDEBUG remained enabled\n' "$original_target" "$PWD"
      printf 'original_finding\tspec:2:%s\tspec\t2\thigh\tblocking\tsrc/config.js:2\trequirement: TIMEOUT_MS must be 2500\tTIMEOUT_MS was 1000\n' "$original_target"
      printf 'original_finding\tspec:3:%s\tspec\t3\tlow\tadvisory\tsrc/config.js:3\tmaintenance note\tLEGACY was retained\n' "$original_target"
      printf 'attempted\tstandards:1:%s\n' "$original_target"
      printf 'attempted\tspec:2:%s\n' "$original_target"
      printf 'attempted\tspec:3:%s\n' "$original_target"
    } >.git/verification-input
    git status --porcelain --untracked-files=all >.git/status-before
    git hash-object src/config.js >.git/config-before
    printf '%s\n' "$tool_dir/review-result" >.git/review-result-tool
checks:
  - name: verification preserves the repair bytes
    run: git hash-object src/config.js >.git/config-after; cmp .git/config-before .git/config-after
  - name: verification remains read only
    run: git status --porcelain --untracked-files=all >.git/status-after; cmp .git/status-before .git/status-after
  - name: current verification scope remains in the requested repository
    run: >-
      verification=$(find .git -path '*/darrow-review.*/*' -name verification.tsv -type f | sort | tail -n 1) &&
      test -n "$verification" &&
      artifact_dir=$(cd "$(dirname "$verification")" && pwd -P) &&
      manifest=$artifact_dir/scope.tsv &&
      test -r "$manifest" &&
      expected_repo=$(pwd -P) &&
      git_dir=$(git rev-parse --absolute-git-dir) &&
      git_dir=$(cd "$git_dir" && pwd -P) &&
      test "$(awk -F '\t' '$1 == "repository" { print $2 }' "$manifest")" = "$expected_repo" &&
      case "$manifest" in "$git_dir"/*) ;; *) exit 1 ;; esac
  - name: additive verification artifact validates and clears
    run: >-
      record=$(find .git -path '*/darrow-review.*/*' -name verification.tsv -type f | sort | tail -n 1) &&
      tool=$(find .git -path '*/bin/review-result' -type f | sort | tail -n '1') &&
      test -n "$tool" &&
      test -n "$record" && bash "$tool" validate-verification "$record" &&
      grep -F 'outcome	clear' "$record" >/dev/null &&
      test "$(grep -c '^attempt.*resolved.*resolved' "$record")" -eq 3
  - name: both fix verifiers retain exact default route evidence
    run: >-
      selection=$(find .git -path '*/darrow-review.*/*' -name reviewer-route.tsv -type f | sort | tail -n '1');
      test -n "$selection" || exit 1; artifact_dir=$(dirname "$selection");
      case "$DARROW_EVAL_HARNESS" in
      codex) host=codex; provider=openai; model=gpt-5.6-sol; effort=xhigh ;;
      claude) host=claude; provider=anthropic; model=claude-opus-5; effort=xhigh ;;
      *) exit 2 ;; esac;
      case "$DARROW_EVAL_HARNESS" in codex)
      test "$(grep -F '"type":"darrow.codex_native_spawn"'
      .git/retained-harness.jsonl | grep -c .)" -eq 2 || exit 1;
      ! grep -F '"type":"darrow.codex_native_spawn"' .git/retained-harness.jsonl |
      grep -v -F '"status":"accepted"' >/dev/null || exit 1 ;;
      claude) test "$(grep -F '"type":"darrow.review_agent_launch"'
      .git/retained-harness.jsonl | grep -c .)" -eq 2 || exit 1 ;; esac;
      for axis in standards spec; do record="$artifact_dir/$axis-route.tsv";
      test -f "$record" || exit 1;
      awk -F '\t' -v a="$axis"
      '$1 == "axis" && $2 == a { found = 1 } END { exit !found }' "$record" || exit 1;
      agent=$(awk -F '\t' '$1 == "agent_id" { print $2 }' "$record");
      test -n "$agent" || exit 1;
      case "$axis" in standards) standards_agent=$agent ;; spec) spec_agent=$agent ;; esac;
      case "$DARROW_EVAL_HARNESS" in codex) route_field=requested_route; proof_field=route_bound ;;
      claude) route_field=observed_route; proof_field=route_bound ;; esac;
      awk -F '\t' -v f="$route_field" -v h="$host" -v p="$provider" -v m="$model" -v e="$effort"
      '$1 == f && $2 == h && $3 == p && $4 == m && $5 == e { found = 1 }
      END { exit !found }' "$record" || exit 1;
      awk -F '\t' -v f="$proof_field" '$1 == f && $2 == "true" { found = 1 }
      END { exit !found }' "$record" || exit 1;
      if test "$DARROW_EVAL_HARNESS" = codex; then
      native=$(grep -F '"type":"darrow.codex_native_spawn"' .git/retained-harness.jsonl |
      grep -F '"status":"accepted"' | grep -F "\"agent_ref\":\"$agent\"" |
      grep -F "\"model\":\"$model\"" | grep -F "\"reasoning_effort\":\"$effort\"") || exit 1;
      case "$native" in *'"fork_turns":"none"'*) ;; *) exit 1 ;; esac;
      case "$native" in *"\"review_axis\":\"$axis\""*) ;; *) exit 1 ;; esac; fi; done;
      test "$standards_agent" != "$spec_agent" || exit 1;
      case "$DARROW_EVAL_HARNESS" in codex)
      awk -v s="$standards_agent" -v p="$spec_agent"
      'index($0, "\"type\":\"darrow.codex_native_spawn\"") {
      value = $0; sub(/^.*"accepted_ordinal":/, "", value); sub(/[^0-9].*$/, "", value);
      if (index($0, "\"agent_ref\":\"" s "\"")) standards_accept = value + 0;
      if (index($0, "\"agent_ref\":\"" p "\"")) spec_accept = value + 0 }
      index($0, "\"type\":\"darrow.codex_native_wait\"") {
      value = $0; sub(/^.*"ordinal":/, "", value); sub(/[^0-9].*$/, "", value);
      if (!first_wait || value + 0 < first_wait) first_wait = value + 0 }
      END { exit !(standards_accept && spec_accept && first_wait &&
      standards_accept < first_wait && spec_accept < first_wait) }'
      .git/retained-harness.jsonl || exit 1 ;; claude)
      subagent="darrow-review:review-reader-$model-$effort";
      awk 'index($0, "\"name\":\"Agent\"") {
      value = $0; agents += gsub("\"name\":\"Agent\"", "", value) }
      END { exit agents != 2 }' .git/retained-harness.jsonl || exit 1;
      awk -v a="$subagent"
      'index($0, "\"name\":\"Agent\"") &&
      index($0, "- review_axis: standards") && index($0, "- review_axis: spec") {
      value = $0; agents = gsub("\"name\":\"Agent\"", "", value);
      value = $0; types = gsub("\"subagent_type\":\"" a "\"", "", value);
      if (agents == 2 && types == 2) found = 1 }
      END { exit !found }' .git/retained-harness.jsonl || exit 1 ;; esac;
      if test "$DARROW_EVAL_HARNESS" = claude; then for axis in standards spec;
      do observed="$artifact_dir/$axis-observed-route.tsv"; test -f "$observed" || exit 1;
      application="$artifact_dir/$axis-route.tsv";
      grep -F -x 'provider_evidence	current-host-environment-default'
      "$observed" >/dev/null || exit 1;
      grep -F -x 'provider_evidence	current-host-environment-default'
      "$application" >/dev/null || exit 1;
      test "$(awk -F '\t' '$1 == "agent_id" { print $2 }' "$application")" =
      "$(awk -F '\t' '$1 == "agent_id" { print $2 }' "$observed")" || exit 1;
      awk -F '\t' -v m="$model" -v e="$effort"
      '$1 == "observed_route" && $2 == "claude" && $3 == "anthropic" && $4 == m && $5 == e { found = 1 }
      END { exit !found }' "$observed" || exit 1;
      subagent="darrow-review:review-reader-$model-$effort";
      launch=$(grep -F '"type":"darrow.review_agent_launch"' .git/retained-harness.jsonl |
      grep -F "\"agent_id\":\"$agent\"" | grep -F "\"review_axis\":\"$axis\"" |
      grep -F "\"subagent_type\":\"$subagent\"") || exit 1;
      test "$(printf '%s\n' "$launch" | grep -c .)" -eq 1 || exit 1;
      batch=$(printf '%s\n' "$launch" | sed -E 's/.*"batch":([0-9]+).*/\1/');
      case "$axis" in standards) standards_batch=$batch ;; spec) spec_batch=$batch ;; esac;
      done; test "$standards_batch" = "$spec_batch" || exit 1; fi
  - name: final response is the complete rendered verification report
    run: >-
      report=$(find .git -path '*/darrow-review.*/*' -name verification.md -type f | sort | tail -n 1) &&
      test -n "$report" &&
      awk 'NF' "$report" >.git/expected-verification-normalized.md &&
      awk 'NF' .git/last-message.md >.git/actual-verification-normalized.md &&
      cmp .git/expected-verification-normalized.md .git/actual-verification-normalized.md
  - name: verification response renders values as ordinary Markdown text
    run: >-
      ! grep -F '<code>' .git/last-message.md &&
      ! grep -F '</code>' .git/last-message.md &&
      ! grep -F '`' .git/last-message.md &&
      ! grep -E '\[[^][]+\]\([^)]*\)' .git/last-message.md &&
      esc=$(printf '\033]8;') && ! grep -F "$esc" .git/last-message.md
