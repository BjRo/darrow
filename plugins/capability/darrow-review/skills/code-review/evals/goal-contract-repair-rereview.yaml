id: code-review-goal-contract-repair-verification
activation: positive
invariant: CR-C9,CR-C13,CR-C14,CR-C17,CR-C18,CR-E9,CR-E10,CR-E11,CR-E13,CR-E15
prompt: >-
  Execute this bounded goal contract. The candidate change is already present
  and must receive independent review before any repair or completion. Use the
  available capability matching this intent: independently review the exact
  current code change against the originating requirement and repository
  standards. Use its normal review report. With no blocking findings, return
  control to this goal. With blocking findings, repair only those findings
  under the existing authorization below, rerun invalidated checks, and
  independently verify only the attempted findings and their direct repair
  consequences against the changed target fingerprint. If verification is
  unavailable or inconclusive, stop. After and only after clear exact-target
  verification, run `bash mark-complete.sh`. Originating
  requirement: exported TIMEOUT_MS must equal 2500 and RETRY_COUNT must remain
  3.
  Acceptance: `bash check.sh` passes. Authorized repair: edit src/config.js
  only. Not authorized: commits, pushes, pull requests, or other publication.
  At the end, report the final goal outcome, the initial independent-review
  outcome, and the fix-verification outcome.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash check.sh` for JavaScript changes.
        src/config.js: |
          export const TIMEOUT_MS = 1000;
          export const RETRY_COUNT = 3;
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'export const TIMEOUT_MS = 2500;' src/config.js >/dev/null
          grep -Fx 'export const RETRY_COUNT = 3;' src/config.js >/dev/null
        mark-complete.sh: |
          #!/usr/bin/env bash
          set -eu
          git_dir=$(git rev-parse --git-dir)
          record=$(find "$git_dir" -path '*/darrow-review.*/*' -name verification.tsv -type f | sort | tail -n 1)
          test -n "$record"
          grep -F 'outcome	clear' "$record" >/dev/null
          printf '%s\n' complete >"$git_dir/goal-complete"
  files:
    src/config.js: |
      export const TIMEOUT_MS = 2500;
      export const RETRY_COUNT = 0;
  setup: |
    set -eu
    backend=$(cd "{{case_dir}}/../../../backend" && pwd -P)
    printf '%s\n' "$backend" >.git/review-backend
checks:
  - name: original guidance survives the real review and repair chain
    run: |
      record=$(find .git -path '*/darrow-review.*/*' -name verification.tsv -type f | sort | tail -n 1)
      original=$(find .git -path '*/darrow-review.*/*' -name result.tsv -type f | sort | tail -n 1)
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n 1)
      test -n "$record" && test -n "$original" && test -n "$tool" || exit 1
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate-original "$original" "$record" || exit 1
      awk -F '\t' '$1 == "original_finding" { n++; if (NF != 11 || $10 == "" || $11 == "") bad=1 }
        END { exit !(n && !bad) }' "$record"
  - name: authorized repair reaches the originating requirement
    run: bash check.sh
  - name: clear fix verification returns control to the enclosing goal
    run: test "$(cat .git/goal-complete)" = complete
  - name: repair causes an initial scope and a fix-verification scope
    run: test "$(find .git -maxdepth 2 -name scope.tsv -path '*/darrow-review.*/*' | wc -l | tr -d ' ')" -ge 2
  - name: fix verification uses a new target fingerprint
    run: >-
      find .git -maxdepth 2 -name scope.tsv -path '*/darrow-review.*/*' -exec
      awk -F '\t' '$1 == "target" { print $2 }' {} + | sort -u >.git/review-targets &&
      test "$(wc -l <.git/review-targets | tr -d ' ')" -ge 2
  - name: additive verification artifact validates beside the repaired scope
    run: >-
      record=$(find .git -maxdepth 2 -name verification.tsv -path '*/darrow-review.*/*' | sort | tail -n 1) &&
      tool=$(find .git -path '*/backend/src/darrow_review/result.py' -type f | sort | tail -n '1') &&
      test -n "$tool" &&
      test -n "$record" && uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate-verification "$record" &&
      grep -F 'outcome	clear' "$record" >/dev/null &&
      grep -F 'RETRY_COUNT = 3' "$(dirname "$record")/diff.patch" >/dev/null
  - name: composed repair creates no commit
    run: test "$(git rev-list --count HEAD)" -eq 1
  - name: default response does not expose raw verification TSV
    run: "! grep -F 'format	darrow-review-verification-v1' .git/last-message.md"
semantic_output_checks:
  - name: enclosing goal reports completion
    proposition: The response says the bounded goal completed successfully.
  - name: completion reports the initial independent review outcome
    proposition: >-
      The response says the initial independent review found a blocking
      RETRY_COUNT or retry-count problem before the repair.
  - name: completion reports clear fix verification
    proposition: >-
      The response says independent fix verification cleared or passed the
      repaired change.
