id: code-review-goal-contract-repair-verification
required_plugin_hook: darrow-review
activation: positive
invariant: CR-C9,CR-C13,CR-C14,CR-C17,CR-C18,CR-E9,CR-E10,CR-E11,CR-E13,CR-E15,CR-E18
prompt: "Preserve the configured DARROW_REVIEW_STATE_DIR, DARROW_CACHE_DIR, and UV_CACHE_DIR paths; use the existing Review state configuration. Execute this bounded goal contract. The candidate change is already present and must receive independent review before any repair or completion. Use the available capability matching this intent: independently review the exact current code change against the originating requirement and repository standards. Use its normal review report. With no blocking findings, return control to this goal. With blocking findings, repair only those findings under the existing authorization below, rerun invalidated checks, and independently verify only the attempted findings and their direct repair consequences against the changed target fingerprint. If verification is unavailable or inconclusive, stop. After and only after clear exact-target verification, run `bash mark-complete.sh`. Originating requirement: exported TIMEOUT_MS must equal 2500 and RETRY_COUNT must remain 3. Run `bash check.sh` to verify acceptance. Authorized repair: edit src/config.js only. Not authorized: commits, pushes, pull requests, or other publication. At the end, report the final goal outcome, the initial independent-review outcome, and the fix-verification outcome."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash check.sh` for JavaScript changes.
        src/config.js: |
          export const TIMEOUT_MS = 1000;
          export const RETRY_COUNT = 3;
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'export const TIMEOUT_MS = 2500;' src/config.js >/dev/null
          grep -Fx 'export const RETRY_COUNT = 3;' src/config.js >/dev/null
        mark-complete.sh: |
          #!/usr/bin/env bash
          set -eu
          record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1)
          test -n "$record"
          python3 - "$record" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              record = json.load(source)
          assert record["outcome"] == "clear"
          PY
          printf '%s\n' complete >.fixture-state/goal-complete
  files:
    src/config.js: |
      export const TIMEOUT_MS = 2500;
      export const RETRY_COUNT = 0;
  setup: |
    bash "{{case_dir}}/fixtures/prepare-grading.sh" "{{case_dir}}"
output_checks:
  - name: human response excludes machine JSON
    review_format: human
checks:
  - name: original guidance survives the real review and repair chain
    run: |
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}"
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name verification.json -type f | sort | tail -n 1)
      original=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -path '*/darrow-review.*/*' -name result.json -type f | sort | tail -n 1)
      tool=.git/eval-checks/review/src/darrow_review/result.py
      test -n "$record" && test -n "$original" && test -n "$tool" || exit 1
      uv run --quiet --frozen --no-dev --project "${tool%/src/darrow_review/result.py}" review-result validate-original "$original" "$record" || exit 1
      python3 -c 'import json,sys; findings=json.load(open(sys.argv[1]))["original_findings"]; assert findings and all(row["repair_guidance"] and row["resolution_evidence"] for row in findings)' "$record"
  - name: authorized repair reaches the originating requirement
    run: bash check.sh
  - name: clear fix verification returns control to the enclosing goal
    run: test "$(cat .fixture-state/goal-complete)" = complete
  - name: repair causes an initial scope and a fix-verification scope
    run:
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" && test "$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -maxdepth
      3 -name scope.json -path '*/darrow-review.*/*' | wc -l | tr -d ' ')" -ge 2
  - name: fix verification uses a new target fingerprint
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}" -maxdepth 3 -name
      scope.json -path '*/darrow-review.*/*' -exec python3
      .git/eval-checks/review/tests/evals/assert_records.py {} value target \; |
      sort -u >.git/review-targets && test "$(wc -l <.git/review-targets | tr -d
      ' ')" -ge 2
  - name: additive verification artifact validates beside the repaired scope
    run: >-
      export DARROW_REVIEW_STATE_DIR="${SEVRO_CANDIDATE_ARTIFACT_REVIEWS:?Candidate Review artifact grant is required}" &&
      record=$(find "${DARROW_REVIEW_STATE_DIR:-$HOME/.darrow/reviews}"
      -maxdepth 3 -name verification.json -path '*/darrow-review.*/*' | sort |
      tail -n 1) && tool=.git/eval-checks/review/src/darrow_review/result.py &&
      test -n "$tool" && test -n "$record" && uv run --quiet --frozen --no-dev
      --project "${tool%/src/darrow_review/result.py}" review-result
      validate-verification "$record" && python3
      .git/eval-checks/review/tests/evals/assert_records.py "$record" has
      outcome clear && grep -F 'RETRY_COUNT = 3' "$(dirname
      "$record")/diff.patch" >/dev/null
  - name: composed repair creates no commit
    run: test "$(git rev-list --count HEAD)" -eq 1
semantic_output_checks:
  - name: enclosing goal reports completion
    proposition: The response says the bounded goal completed successfully.
  - name: completion reports the initial independent review outcome
    proposition: >-
      The response says the initial independent review found a blocking problem
      before the repair. Naming that problem again is not required.
  - name: completion reports clear fix verification
    proposition: >-
      The response says independent fix verification cleared or passed the
      repaired change.
