[project]
name = "darrow-tickets-github"
version = "0.4.0"
description = "GitHub Issues facade for Darrow ticket skills"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.scripts]
darrow-ticket = "darrow_tickets_github.cli:entrypoint"
darrow-tickets-claude-context = "darrow_tickets_github.claude_context:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "hypothesis>=6.138,<7",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["src/darrow_tickets_github"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "C90", "E4", "E7", "E9", "F", "I", "N", "RUF", "SIM", "UP"]
mccabe.max-complexity = 5

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["darrow_tickets_github"]

[tool.coverage.report]
show_missing = true
skip_covered = false
