id: read-ticket-conversation-bound-reference
invariant: TM-R1,TM-R2,TM-R3
activation: competition
mount_plugin_skills: true
prompt: >-
  Remember this context for my next request: the deployment ticket is #12. Do
  not retrieve it yet; reply only READY.
follow_up_prompt: >-
  What does the deployment ticket ask for? Return its authoritative contents
  without changing anything.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    bash: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)"
      case "${1:-}" in
        */darrow-tickets-github/bin/ticket|*/darrow-tickets-github/*/bin/ticket|*/.git/eval-plugin/bin/ticket|*/.git/eval-plugin/*/bin/ticket)
          printf '%s\n' "$*" >>"$d/fixture-ticket-cli-calls"
          ;;
      esac
      exec /bin/bash "$@"
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      mkdir -p "$d"
      echo "$*" >>"$d/calls"
      case "$1" in
        issue) printf 'issue view %s %s %s\n' "$3" "$4" "$5" >>"$d/protocol" ;;
        api) printf 'api %s\n' "$2" >>"$d/protocol" ;;
        *) printf 'unexpected %s\n' "$1" >>"$d/protocol" ;;
      esac
      find_flag() {
        want=$1; shift
        prev=""
        for arg in "$@"; do
          if [ "$prev" = "$want" ]; then printf '%s' "$arg"; return 0; fi
          prev=$arg
        done
        return 1
      }
      if [ "$1" = "api" ]; then
        case "$2" in
          */issues/12/parent) echo "gh: No parent issue found (HTTP 404)" >&2; exit 1 ;;
          */issues/12/dependencies/blocked_by) exit 0 ;;
          *) echo "mock gh: unsupported api call: $*" >&2; exit 1 ;;
        esac
      fi
      case "$1 $2" in
        "issue view")
          json=$(find_flag --json "$@")
          case "$json" in
            number,state,title,url,labels)
              jq=$(find_flag --jq "$@")
              case "$jq" in
                *ticket-token*) printf 'ticket-token: #12\n' ;;
              esac
              printf '#12 open — Deploy safely\n'
              printf 'https://github.test/o/r/issues/12\n'
              printf 'labels: deployment\n'
              ;;
            body) printf 'Preserve CONVERSATION-TOKEN-12 exactly.\n' ;;
            *) echo "mock gh: unsupported --json set: $json" >&2; exit 1 ;;
          esac
          ;;
        *) echo "mock gh: unsupported: $*" >&2; exit 1 ;;
      esac
  setup: |
    git remote add origin https://github.test/o/r.git
checks:
  - name: conversation-bound ticket output is relayed byte-for-byte
    run: cat .git/last-message.md
    expect_exact: |-
      backend: github
      ticket-token: #12
      #12 open — Deploy safely
      https://github.test/o/r/issues/12
      labels: deployment
      parent: (none)
      depends-on: (none)
      ## body
      Preserve CONVERSATION-TOKEN-12 exactly.
  - name: bundled CLI resolves the bound reference exactly once
    run: cat .git/fixture-ticket-cli-calls
    expect_regex: "^.*?/bin/ticket get #?12$"
  - name: conversation-bound retrieval uses only the read protocol
    run: cat .git/fixture-gh/protocol
    expect_exact: |-
      issue view 12 --json number,state,title,url,labels
      issue view 12 --json body
      api repos/{owner}/{repo}/issues/12/parent
      api repos/{owner}/{repo}/issues/12/dependencies/blocked_by
