id: read-ticket-foreign-parent
invariant: TM-3,TM-R2,TM-R4
activation: positive
mount_plugin_skills: true
prompt: "Read ticket #12 and return the authoritative tracker result without changing anything."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    bash: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)"
      case "${1:-}" in
        */darrow-tickets-github/bin/ticket|*/darrow-tickets-github/*/bin/ticket|*/.git/eval-plugin/bin/ticket|*/.git/eval-plugin/*/bin/ticket)
          printf '%s\n' "$*" >>"$d/fixture-ticket-cli-calls"
          ;;
      esac
      exec /bin/bash "$@"
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      mkdir -p "$d"
      echo "$*" >>"$d/calls"
      case "$1 $2" in
        "repo view") printf 'https://github.test/o/r\n' ;;
        "issue view")
          case "$*" in
            *"--json number,state,title,url,labels"*)
              printf 'ticket-token: 12\n#12 open — Child issue\nhttps://github.test/o/r/issues/12\nlabels: (none)\n'
              ;;
            *"--json body"*) printf 'PARTIAL-BODY-MUST-NOT-LEAK\n' ;;
            *) echo "mock gh: unsupported issue view: $*" >&2; exit 1 ;;
          esac
          ;;
        "api repos/{owner}/{repo}/issues/12/parent")
          case "$*" in
            *html_url*) printf '7\thttps://github.test/other/repo/issues/7\n' ;;
            *) echo 7 ;;
          esac
          ;;
        *) echo "mock gh: unsupported: $*" >&2; exit 1 ;;
      esac
  setup: |
    git remote add origin https://github.test/o/r.git
checks:
  - name: unsupported qualified parent is relayed exactly
    run: cat .git/last-message.md
    expect_exact: "error: ticket #12 has unsupported foreign parent: https://github.test/other/repo/issues/7 — cross-repository parent relations are not supported"
  - name: bundled CLI owns the failed retrieval
    run: cat .git/fixture-ticket-cli-calls
    expect_regex: "/bin/ticket get #?12$"
  - name: read stops without fallback or mutation
    run: cat .git/fixture-gh/calls
    not_regex: "issue (list|edit|comment|close|reopen)|-X (POST|DELETE)|issues/7/|blocked_by"
  - name: partial ticket and local parent do not leak
    run: cat .git/last-message.md
    not_regex: "PARTIAL-BODY-MUST-NOT-LEAK|backend: github|parent: #7"
