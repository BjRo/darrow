id: update-ticket-close-transition
invariant: TM-U4
activation: competition
mount_plugin_skills: true
prompt: "Close ticket #12."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      mkdir -p "$d"
      echo "$*" >> "$d/calls"
      find_flag() {
        want=$1; shift
        prev=""
        for a in "$@"; do
          if [ "$prev" = "$want" ]; then printf '%s' "$a"; return 0; fi
          prev=$a
        done
        return 1
      }
      if [ "$1" = "api" ]; then
        shift
        method=GET; endpoint=""; f_issue=""; f_sub=""
        while [ $# -gt 0 ]; do
          case "$1" in
            -X) method=$2; shift 2 ;;
            --paginate|--slurp) shift ;;
            -F)
              case "$2" in
                issue_id=*) f_issue=${2#issue_id=} ;;
                sub_issue_id=*) f_sub=${2#sub_issue_id=} ;;
              esac
              shift 2 ;;
            *) endpoint=$1; shift ;;
          esac
        done
        n=${endpoint##*/issues/}; n=${n%%/*}
        suffix=${endpoint#*/issues/"$n"}
        case "$method $suffix" in
          "GET ")
            if [ ! -f "$d/issue-$n-state" ]; then
              echo "gh: Not Found (HTTP 404)" >&2
              exit 1
            fi
            printf '{"id":%s}\n' $((10000 + n))
            ;;
          "GET /parent")
            if [ -f "$d/issue-$n-parent" ]; then
              printf '{"number":%s,"html_url":"https://github.test/o/r/issues/%s"}\n' "$(cat "$d/issue-$n-parent")" "$(cat "$d/issue-$n-parent")"
            else
              echo "gh: No parent issue found (HTTP 404)" >&2
              exit 1
            fi
            ;;
          "GET /dependencies/blocked_by")
            python3 -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(json.dumps([[{"number":int(n)} for n in p.read_text().splitlines()]] if p.exists() else [[]]))' "$d/issue-$n-blockedby"
            ;;
          "POST /dependencies/blocked_by")
            echo $((f_issue - 10000)) >> "$d/issue-$n-blockedby"
            ;;
          "DELETE /dependencies/blocked_by/"*)
            dep=$(( ${suffix##*/} - 10000 ))
            grep -vx -- "$dep" "$d/issue-$n-blockedby" > "$d/issue-$n-blockedby.new" 2>/dev/null || :
            mv "$d/issue-$n-blockedby.new" "$d/issue-$n-blockedby"
            ;;
          "POST /sub_issues")
            echo "$n" > "$d/issue-$((f_sub - 10000))-parent"
            ;;
          "DELETE /sub_issue")
            rm -f "$d/issue-$((f_sub - 10000))-parent"
            ;;
          *)
            echo "mock gh: unsupported api call: $method $endpoint" >&2
            exit 1
            ;;
        esac
        exit 0
      fi
      case "$1 $2" in
        "repo view")
          printf '{"hasIssuesEnabled":true}\n'
          ;;
        "label list")
          python3 -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(json.dumps([{"name":n} for n in p.read_text().splitlines()] if p.exists() else []))' "$d/labels"
          ;;
        "issue list")
          python3 -c 'import json,pathlib,re,sys; p=pathlib.Path(sys.argv[1]); rows=[]
      for line in p.read_text().splitlines() if p.exists() else []:
          m=re.fullmatch(r"#([0-9]+) (open|closed)  (.*?)(?: \((.*)\))?", line)
          assert m, line
          rows.append({"number":int(m[1]),"state":m[2].upper(),"title":m[3],"labels":[{"name":n} for n in m[4].split(", ")] if m[4] else []})
      print(json.dumps(rows))' "$d/list"
          ;;
        "issue view")
          id=$3
          if [ ! -f "$d/issue-$id-state" ]; then
            echo "GraphQL: Could not resolve to an Issue with the number of $id." >&2
            exit 1
          fi
          json=$(find_flag --json "$@")
          python3 - "$d" "$id" "$json" <<'PY'
      import json, pathlib, sys
      directory, number, fields = sys.argv[1:]
      def read(field):
          path = pathlib.Path(directory) / f"issue-{number}-{field}"
          return path.read_text() if path.exists() else ""
      record = {"number": int(number), "state": read("state").upper(),
                "title": read("title"), "body": read("body"),
                "url": f"https://github.test/o/r/issues/{number}",
                "labels": [{"name": name} for name in read("labels").splitlines()]}
      print(json.dumps({field: record[field] for field in fields.split(",")}))
      PY
          ;;
        "issue create")
          if bf=$(find_flag --body-file "$@"); then cp "$bf" "$d/created-body"; fi
          if tl=$(find_flag --title "$@"); then printf '%s' "$tl" > "$d/created-title"; fi
          : > "$d/created-labels"
          prev=""
          for a in "$@"; do
            if [ "$prev" = "--label" ]; then echo "$a" >> "$d/created-labels"; fi
            prev=$a
          done
          printf 'open' > "$d/issue-99-state"
          if [ -f "$d/created-title" ]; then cp "$d/created-title" "$d/issue-99-title"; fi
          if [ -f "$d/created-body" ]; then cp "$d/created-body" "$d/issue-99-body"; fi
          echo "https://github.test/o/r/issues/99"
          ;;
        "issue comment")
          if bf=$(find_flag --body-file "$@"); then cp "$bf" "$d/comment-body-$3"; fi
          echo "https://github.test/o/r/issues/$3#issuecomment-1"
          ;;
        "issue edit")
          if bf=$(find_flag --body-file "$@"); then
            cp "$bf" "$d/edited-body-$3"
            cp "$bf" "$d/issue-$3-body"
          fi
          ;;
        "issue close"|"issue reopen")
          echo "$2 $3" >> "$d/transitions"
          ;;
        *)
          echo "mock gh: unsupported: $*" >&2
          exit 1
          ;;
      esac
  setup: |
    git remote add origin https://github.test/o/r.git
    mkdir -p .git/fixture-gh
    printf 'bug\nenhancement\ndocumentation\n' > .git/fixture-gh/labels
    : > .git/fixture-gh/list
    printf 'open' > .git/fixture-gh/issue-12-state
    printf 'Fix SIGPIPE in ticket list' > .git/fixture-gh/issue-12-title
    printf 'Details.\n' > .git/fixture-gh/issue-12-body
checks:
  - name: ticket closed
    run: cat .git/fixture-gh/transitions
    expect_regex: "^close 12$"
  - name: target verified before mutating
    run: >-
      awk '
        /^issue view 12 / && !verified { verified = NR }
        /^issue close 12( |$)/ { closed = NR; close_count++ }
        END { exit !(verified && closed && verified < closed && close_count == 1) }
      ' .git/fixture-gh/calls
  - name: no comment smuggled in
    run: test ! -f .git/fixture-gh/comment-body-12 && echo none
    expect_regex: "^none$"
