id: update-ticket-close-transition
invariant: TM-U4
activation: competition
mount_plugin_skills: true
prompt: "Close ticket #12."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      backend="$(git rev-parse --absolute-git-dir)/tickets-fixture"
      exec uv run --quiet --frozen --no-dev --project "$backend" python "$backend/tests/eval_gh.py" "$@"
  setup: |
    mkdir -p .git/tickets-fixture/tests
    cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/tickets-fixture/
    cp -R "{{case_dir}}/../../../backend/src" .git/tickets-fixture/
    cp "{{case_dir}}/../../../backend/tests/eval_gh.py" .git/tickets-fixture/tests/
    git remote add origin https://github.test/o/r.git
    mkdir -p .git/fixture-gh
    printf 'bug\nenhancement\ndocumentation\n' > .git/fixture-gh/labels
    : > .git/fixture-gh/list
    printf 'open' > .git/fixture-gh/issue-12-state
    printf 'Fix SIGPIPE in ticket list' > .git/fixture-gh/issue-12-title
    printf 'Details.\n' > .git/fixture-gh/issue-12-body
checks:
  - name: ticket closed
    run: cat .git/fixture-gh/transitions
    expect_regex: "^close 12$"
  - name: target verified before mutating
    run: >-
      awk '
        /^issue view 12 / && !verified { verified = NR }
        /^issue close 12( |$)/ { closed = NR; close_count++ }
        END { exit !(verified && closed && verified < closed && close_count == 1) }
      ' .git/fixture-gh/calls
  - name: no comment smuggled in
    run: test ! -f .git/fixture-gh/comment-body-12 && echo none
    expect_regex: "^none$"
