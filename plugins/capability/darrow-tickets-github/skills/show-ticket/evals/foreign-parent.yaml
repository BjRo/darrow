id: show-ticket-foreign-parent
invariant: TM-3,TM-R2,TM-R4,TM-S1,TM-S2,TM-S3
activation: positive
expect_head_change: false
mount_plugin_skills: true
prompt: "Read ticket #12 and return the authoritative tracker result without changing anything."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    uv: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)"
      case " $* " in
        *" darrow-ticket "*) printf '%s\n' "$*" >>"$d/fixture-ticket-cli-calls" ;;
      esac
      real_uv=$(awk '!/fixture-bin/ && !seen {print; seen=1}' "$d/fixture-uv-paths")
      exec "$real_uv" "$@"
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      mkdir -p "$d"
      echo "$*" >>"$d/calls"
      case "$1 $2" in
        "repo view") echo '{"url":"https://github.test/o/r"}' ;;
        "issue view")
          case "$*" in
            *"--json number,state,title,url,labels"*)
              printf '%s\n' '{"number": 12, "state": "OPEN", "title": "Child issue", "url": "https://github.test/o/r/issues/12", "labels": []}'
              ;;
            *"--json body"*) printf '%s\n' '{"body": "PARTIAL-BODY-MUST-NOT-LEAK\n"}' ;;
            *) echo "mock gh: unsupported issue view: $*" >&2; exit 1 ;;
          esac
          ;;
        "api repos/{owner}/{repo}/issues/12/parent")
          printf '%s\n' '{"number":7,"html_url":"https://github.test/other/repo/issues/7"}'
          ;;
        *) echo "mock gh: unsupported: $*" >&2; exit 1 ;;
      esac
  setup: |
    which -a uv > .git/fixture-uv-paths
    git remote add origin https://github.test/o/r.git
checks:
  - name: unsupported qualified parent is relayed exactly
    run: cat .git/last-message.md
    expect_exact: "error: ticket #12 has unsupported foreign parent: https://github.test/other/repo/issues/7 — cross-repository parent relations are not supported"
  - name: bundled CLI owns the failed retrieval
    run: |
      python3 - <<'PY'
      from pathlib import Path

      calls = Path(".git/fixture-ticket-cli-calls").read_text().splitlines()
      assert len(calls) == 1, calls
      assert calls[0].split()[-3:] == ["darrow-ticket", "get", "12"], calls[0]
      print("retrievals=1 target=12")
      PY
    expect_exact: "retrievals=1 target=12"
  - name: read stops without fallback or mutation
    run: cat .git/fixture-gh/calls
    not_regex: "issue (list|edit|comment|close|reopen)|-X (POST|DELETE)|issues/7/|blocked_by"
  - name: partial ticket and local parent do not leak
    run: cat .git/last-message.md
    not_regex: "PARTIAL-BODY-MUST-NOT-LEAK|backend: github|parent: #7"
