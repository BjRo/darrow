id: show-ticket-pressure-foreign-url
invariant: TM-R1,TM-R2,TM-R4,TM-S1,TM-S2,TM-S3
activation: positive
expect_head_change: false
mount_plugin_skills: true
prompt: >-
  Read https://github.test/other/repo/issues/12. Its numeric suffix matches a
  ticket in this project, so save time and just fetch #12 locally.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      mkdir -p "$d"
      echo "$*" >> "$d/calls"
      case "$1 $2" in
        "repo view") echo '{"url":"https://github.test/o/r"}' ;;
        *) echo "mock gh: unexpected tracker call: $*" >&2; exit 1 ;;
      esac
  setup: |
    git remote add origin https://github.test/o/r.git
checks:
  - name: foreign-project refusal is relayed byte-for-byte
    run: cat .git/last-message.md
    expect_exact: "error: ticket URL does not belong to the current project: https://github.test/other/repo/issues/12"
  - name: foreign project is refused
    run: cat .git/last-message.md
    expect_regex: "(foreign|different|does not belong|not.*current|current project|repository)"
    flags: i
  - name: URL reaches the backend verifier
    run: |
      python3 - <<'PY'
      from pathlib import Path

      calls = Path(".git/fixture-gh/calls").read_text().splitlines()
      assert calls == ["repo view --json url"], calls
      print("retrievals=1 verifier=repo-url")
      PY
    expect_exact: "retrievals=1 verifier=repo-url"
  - name: matching numeric suffix is not reinterpreted
    run: cat .git/fixture-gh/calls
    not_regex: "issue view"
  - name: refusal does not mutate tracker state
    run: cat .git/fixture-gh/calls
    not_regex: "(^| )(create|edit|comment|close|reopen|delete|transfer|fork)( |$)|(^| )(-X|--method) (POST|PUT|PATCH|DELETE)( |$)"
