id: show-ticket-silent-relation-failure
invariant: TM-R2,TM-R4,TM-S1,TM-S2,TM-S3
activation: positive
expect_head_change: false
mount_plugin_skills: true
prompt: "Read ticket #32 and return the authoritative tracker response without changing anything."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
  bin:
    uv: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)"
      case " $* " in
        *" darrow-ticket "*) printf '%s\n' "$*" >>"$d/fixture-ticket-cli-calls" ;;
      esac
      real_uv=$(awk '!/fixture-bin/ && !seen {print; seen=1}' "$d/fixture-uv-paths")
      exec "$real_uv" "$@"
    gh: |
      #!/bin/sh
      d="$(git rev-parse --git-dir)/fixture-gh"
      mkdir -p "$d"
      echo "$*" >>"$d/calls"
      case "$1" in
        issue) printf 'issue view %s %s %s\n' "$3" "$4" "$5" >>"$d/protocol" ;;
        api) printf 'api %s\n' "$2" >>"$d/protocol" ;;
        *) printf 'unexpected %s\n' "$1" >>"$d/protocol" ;;
      esac
      case "$1 $2" in
        "issue view")
          case "$*" in
            *"--json number,state,title,url,labels"*)
              printf '%s\n' '{"number": 32, "state": "OPEN", "title": "Silent relation failure", "url": "https://github.test/o/r/issues/32", "labels": [{"name": "bug"}]}'
              ;;
            *"--json body"*) printf '%s\n' '{"body": "SILENT-PARTIAL-BODY-MUST-NOT-LEAK\n"}' ;;
            *) echo "mock gh: unsupported issue view: $*" >&2; exit 1 ;;
          esac
          ;;
        "api repos/{owner}/{repo}/issues/32/parent") exit 1 ;;
        *) echo "mock gh: unsupported: $*" >&2; exit 1 ;;
      esac
  setup: |
    which -a uv > .git/fixture-uv-paths
    git remote add origin https://github.test/o/r.git
checks:
  - name: silent backend failure gets an honest diagnostic
    run: cat .git/last-message.md
    expect_exact: "error: GitHub backend command failed with exit 1 and no diagnostic"
  - name: bundled CLI owns the silent failed retrieval
    run: |
      python3 - <<'PY'
      from pathlib import Path

      calls = Path(".git/fixture-ticket-cli-calls").read_text().splitlines()
      assert len(calls) == 1, calls
      assert calls[0].split()[-3:] == ["darrow-ticket", "get", "32"], calls[0]
      print("retrievals=1 target=32")
      PY
    expect_exact: "retrievals=1 target=32"
  - name: silent failure stops without partial ticket output or later calls
    run: cat .git/fixture-gh/protocol
    expect_exact: |-
      issue view 32 --json number,state,title,url,labels
      issue view 32 --json body
      api repos/{owner}/{repo}/issues/32/parent
  - name: silent failure partial ticket output does not leak
    run: cat .git/last-message.md
    not_regex: "SILENT-PARTIAL-BODY-MUST-NOT-LEAK"
