id: plan-implementation-direct-unknowns
invariant: PI-C1,PI-C2,DG-C2,DG-C3,DG-C4,DC-C1,SE-C9,SE-C10,SE-C11
activation: competition
activation_sequence: [plan-implementation, grilling]
mount_plugin_skills: true
prompt: >-
  Help me plan the implementation of configurable request timeouts. Inspect the
  repository instead of asking me for technical facts. Discuss material
  unknowns with recommendations before producing the plan. We have not decided
  whether configuration is process-wide or per request; the compatibility
  strategy depends on that choice. Do not modify files or create tickets.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# HTTP client library\n"
        src/client.js: |
          import { DEFAULT_TIMEOUT_MS } from "./config.js";
          export async function request(url) {
            return fetch(url, { signal: AbortSignal.timeout(DEFAULT_TIMEOUT_MS) });
          }
        src/config.js: "export const DEFAULT_TIMEOUT_MS = 1000;\n"
        test/client.test.js: "// Public request behavior tests live here.\n"
checks:
  - name: planning conversation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: configuration scope is the sole current frontier
    proposition: >-
      The response asks exactly one numbered current-frontier question choosing
      between process-wide and per-request timeout configuration. It gives one
      concrete recommendation for exactly one of those choices with prospective
      scope-level rationale, without combining them or treating the current
      implementation, migration convenience, or compatibility as authority for
      the choice.
  - name: dependent timeout choices remain deferred
    proposition: >-
      The response does not ask or select dependent timeout choices. It visibly
      defers at least the public configuration mechanism or interface and the
      compatibility or migration strategy, plus another relevant dependent
      category such as default or precedence behavior, validation, timeout
      semantics, or verification. It says the frontier will be recomputed after
      the user's scope answer and stops without an implementation plan,
      implementation slices, or a promise to draft the plan immediately after
      that one answer.
  - name: repository facts inform the timeout frontier
    proposition: >-
      The response states at least one concrete inspected implementation fact
      relevant to timeout configuration, such as request currently applying a
      fixed exported 1000 ms default or the existing tests not defining a
      public configuration contract. Formatting 1000 as 1,000 is equivalent;
      merely asking the scope question without repository evidence fails.
