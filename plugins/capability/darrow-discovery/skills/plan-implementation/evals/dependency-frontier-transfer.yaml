id: plan-implementation-dependency-frontier-transfer
invariant: PI-C1,PI-C2,DG-C2,DG-C3,DG-C4,DC-C1,SE-C9,SE-C10,SE-C11
activation: competition
activation_sequence: [plan-implementation, grilling]
mount_plugin_skills: true
prompt: >-
  Help me produce an implementation plan for tenant-aware audit-log storage.
  Inspect the repository for the current implementation. We have not decided
  whether storage should use one shared archive or tenant-isolated stores;
  encryption-key ownership, partition format, and migration strategy depend on
  that choice. Discuss the material unknowns with recommendations before
  producing the implementation plan. Do not modify files or create tickets.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Multi-tenant service\n"
        src/audit-store.js: |
          const auditEvents = [];
          export function appendAuditEvent(tenantId, event) {
            auditEvents.push({ tenantId, event });
          }
          export function readAuditEvents() {
            return [...auditEvents];
          }
        test/audit-store.test.js: "// Audit storage behavior tests live here.\n"
checks:
  - name: planning conversation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: unresolved storage choices do not become a plan
    run: |
      message=.git/last-message.md
      if grep -Ei "^[*_#> -]{0,12}(Final[[:space:]]+)?Implementation plan|^[*_#> -]{0,12}(Step|Slice|Phase)[[:space:]]+[0-9]+|Here (is|'s) (the )?(final )?implementation plan" "$message" >/dev/null; then
        cat "$message"
        exit 1
      fi
      printf 'premature_plan_markers=0\n'
    expect_exact: "premature_plan_markers=0"
semantic_output_checks:
  - name: repository absence is not promoted to greenfield authority
    proposition: >-
      The response does not infer from sparse or missing implementation that
      compatibility and migration obligations are absent, that no callers or
      existing data need preservation, or that those obligations are already
      settled. A claim such as "nothing to preserve for compatibility" based
      only on the in-memory implementation fails. Describing the lack of
      durable storage, or using "greenfield" while still leaving preservation
      obligations unresolved, does not by itself fail this check.
  - name: storage isolation is the sole frontier root
    proposition: >-
      The response asks exactly one current-frontier question: whether durable
      audit storage should use one shared archive or tenant-isolated stores. It
      gives one concrete advisory recommendation selecting exactly one of those
      roots, does not ask or answer encryption-key ownership, partition format,
      or migration strategy, explicitly defers all three, and says the
      frontier will be recomputed after the user's answer.
  - name: repository facts inform the frontier
    proposition: >-
      The response uses at least one accurate, relevant inspected fact about
      the audit-store implementation, such as the shared in-memory event array,
      tenant-tagged entries, or the reader returning all tenants' events.
      It does not ask the user to discover those available repository facts.
