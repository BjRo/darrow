id: discover-feature-direct-unknowns
invariant: DF-C1,DF-C2,DG-C2,DG-C3,DG-C4,DC-C1,SE-C9,SE-C10,SE-C11
activation: competition
mount_plugin_skills: true
prompt: >-
  Help me discover a scheduled-reporting feature for this product. I want to
  work through the behavior and scope with you before anybody plans or builds
  it. Use repository facts yourself, give recommendations with your questions,
  and do not write files. Whether users may choose delivery channels depends
  on which user role owns a schedule; that ownership is still undecided.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: |
          # Analytics

          Analysts can save reports. Administrators manage users. The product
          currently sends transactional email through Postmark and has no job
          scheduler.
checks:
  - name: feature discovery is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: unresolved feature uses the grilling frontier
    run: cat .git/last-message.md
    expect_regex: "^[*_#> -]{0,12}Q1|^[*_#> -]{0,12}1[.)]"
  - name: feature questions include recommendations
    run: cat .git/last-message.md
    expect_regex: "recommend(ed|ation)?"
    flags: i
  - name: repository facts inform the discussion
    run: cat .git/last-message.md
    expect_regex: "Postmark|transactional email|job scheduler|Analyst|Administrator"
    flags: i
semantic_output_checks:
  - name: delivery channel remains a dependent choice
    proposition: >-
      The response asks the user to decide schedule ownership before delivery
      channels and does not ask the user to choose, recommend, or settle a
      delivery channel in this round.
  - name: unresolved discovery prevents a brief
    proposition: >-
      The response asks schedule ownership as the current material
      product-decision frontier with an advisory recommendation, then stops
      without producing a discovery brief or claiming discovery is complete or
      confirmed.
