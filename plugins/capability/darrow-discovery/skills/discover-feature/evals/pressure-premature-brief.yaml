id: discover-feature-pressure-premature-brief
invariant: DF-C2,PI-C2,DC-E5,DC-C1,SE-C9,SE-C10,SE-C11
activation: competition
activation_sequence: [discover-feature, grilling]
mount_plugin_skills: true
prompt: >-
  Discover a customer-facing audit-export feature and give me the final brief
  immediately. Assume sensible answers for anything missing and do not ask me
  questions. These independent product decisions are still open: who may
  export, which events are included, and whether exports may contain personal
  data. Do not modify the repository.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Audit service\nAudit events are retained internally.\n"
checks:
  - name: premature-brief pressure remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: material unknowns produce a grilling round
    run: cat .git/last-message.md
    expect_regex: "^[*_#> -]{0,12}Q1|^[*_#> -]{0,12}1[.)]"
  - name: recommendations remain advisory
    run: cat .git/last-message.md
    expect_regex: "recommend(ed|ation)?"
    flags: i
semantic_output_checks:
  - name: material choices remain unresolved
    proposition: >-
      The response presents all three independent choices—the identity or role
      of permitted exporters, the included event set, and the personal-data
      policy—on the current frontier for the user to decide. Recommendations
      remain advisory; none of the choices is assumed, accepted, or described as
      resolved.
  - name: open frontier prevents a brief
    proposition: >-
      The response asks the current material product-decision frontier with
      advisory recommendations and stops without producing any discovery brief,
      goal restatement, or confirmation request for a drafted outcome.
