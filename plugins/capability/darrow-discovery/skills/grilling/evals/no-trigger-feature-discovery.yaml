id: grilling-no-trigger-feature-discovery
invariant: DG-C1,DF-C1,DC-E1,DC-C1
activation: negative
mount_plugin_skills: true
prompt: >-
  Help me discover and shape a feature that lets workspace administrators
  schedule temporary maintenance banners. The affected users, scheduling
  behavior, dismissal rules, and acceptance criteria are still unclear. Ask
  whatever questions are needed to produce a discovery brief, but do not plan
  or implement it and do not modify the repository.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Workspace application\n"
checks:
  - name: feature discovery remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: neighboring capability returns a response
    run: test -s .git/last-message.md && echo responded
    expect_exact: "responded"
