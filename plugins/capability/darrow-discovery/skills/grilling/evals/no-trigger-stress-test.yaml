id: grilling-no-trigger-stress-test
invariant: DG-C1,DC-E1,DC-C1
activation: negative
mount_plugin_skills: true
prompt: >-
  Stress-test my thinking relentlessly before I commit to this API design. The
  proposal is a public bulk-delete endpoint, but its authorization behavior,
  partial-failure semantics, and maximum batch size are unsettled. Challenge
  me in decision rounds and do not modify the repository.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Bulk API\n"
checks:
  - name: generic stress-test remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: neighboring behavior returns a response
    run: test -s .git/last-message.md && echo responded
    expect_exact: "responded"
