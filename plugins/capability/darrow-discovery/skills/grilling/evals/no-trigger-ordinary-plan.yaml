id: grilling-no-trigger-ordinary-plan
invariant: DG-C1,DC-E1,DC-C1,SE-C9,SE-C10,SE-C11
activation: negative
mount_plugin_skills: true
prompt: >-
  Draft a concise implementation plan for adding configurable request timeouts
  to this service. Identify the public seam, likely work areas, and verification
  strategy. Do not modify the repository and do not interview me.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\nRequests use a fixed timeout.\n"
        src/config.js: "export const DEFAULT_TIMEOUT_MS = 1000;\n"
checks:
  - name: ordinary planning remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: neighboring capability returns a response
    run: test -s .git/last-message.md && echo responded
    expect_exact: "responded"
