id: grilling-indirect-stress-test
invariant: DG-C1,DG-C4,DC-C1
activation: competition
mount_plugin_skills: true
prompt: >-
  Stress-test my thinking relentlessly before I commit to this API design. The
  proposal is a public bulk-delete endpoint, but its authorization behavior,
  partial-failure semantics, and maximum batch size are unsettled. Challenge
  me in decision rounds and do not modify the repository.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Bulk API\n"
checks:
  - name: indirect grilling remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: indirect intent receives a valid current frontier
    proposition: >-
      The response asks at least one concrete current decision question about
      the bulk-delete API, pairs every numbered question with a substantive
      recommendation and rationale, and stops without assuming the user's
      answers or prematurely selecting dependent downstream choices.
