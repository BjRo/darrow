id: grilling-direct-frontier
invariant: DG-C1,DG-C2,DG-C3,DG-C4,DC-C1,DC-C2,DC-E9,SE-C9,SE-C10,SE-C11
activation: positive
prompt: >-
  {{skill_invocation}} Grill my policy decision for customer-managed offsite backups. Be relentless
  and work toward shared understanding, but do not discover or plan a new
  feature and do not implement or write anything. Use the repository for facts
  instead of asking me to look them up. We have settled the meaning of
  customer-managed backups and the other policy boundaries. The current open
  root is whether backups may leave the EU. The transfer-provider decision
  depends on that answer and remains undecided.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: |
          # Ledger Service

          The service stores customer ledgers in PostgreSQL 16 and runs only in
          AWS eu-central-1. It has database snapshots but no offsite backup.
        docs/policy.md: |
          # Data policy

          Customer data may leave the EU only after an explicit product
          decision and legal approval.
checks:
  - name: grilling is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: repository facts are used rather than delegated
    run: cat .git/last-message.md
    expect_regex: "PostgreSQL|eu-central-1|EU"
  - name: response does not claim agreement or completion
    run: cat .git/last-message.md
    not_regex: "shared understanding (is|has been) (complete|reached|confirmed)|we (have|now have) agreed|final (design|decision)"
    flags: i
semantic_output_checks:
  - name: every frontier question has one real recommendation
    proposition: >-
      The response asks one or more numbered current-frontier decision
      questions, and every numbered question has exactly one substantive
      advisory recommendation with rationale. No numbered question lacks a
      recommendation or uses an empty, unknown, not-applicable, or refusal
      placeholder instead of recommending a concrete answer.
  - name: provider selection remains behind the EU boundary
    proposition: >-
      The response treats whether backups may leave the EU as a current
      prerequisite decision and does not ask or select the dependent transfer
      provider yet. It leaves provider selection visibly deferred and stops
      without claiming that the user accepted an answer or advancing into the
      dependent branch. An advisory recommendation for one EU-boundary option
      is required behavior and does not count as assuming the user's answer.
  - name: frontier is concise clear and complete
    proposition: >-
      The response leads with the current decision, uses direct and familiar
      language, and avoids repeated background or narration of the agent's
      process. It still preserves the repository facts, recommendation
      rationale, EU safety boundary, deferred dependency, and the user's
      decision authority.
