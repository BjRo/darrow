id: work-through-decisions-natural-grilling
invariant: DG-C1,DF-C1,PI-C1,DC-E1,DC-C1
activation: positive
prompt: >-
  Grill me on this personal decision: should I take meeting notes on paper or
  digitally? Ask rigorous questions with recommendations, but do not modify
  the repository.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Unrelated repository\n"
checks:
  - name: natural-language grilling remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: personal decision uses standalone grilling
    proposition: >-
      The response advances the user's paper-versus-digital meeting-notes
      decision through at least one concrete question with an advisory
      recommendation and rationale, then ends the current round without
      assuming the user's answer or advancing dependent decisions. A brief
      statement about what depends on the answer is allowed. It need not
      label the topic a personal decision, ask for the medium before its
      prerequisites, or announce that it is waiting. Asking which note-taking
      goal matters most with a recommended priority is a valid prerequisite
      round. Unrelated topics, a feature brief, or an implementation plan fail.
