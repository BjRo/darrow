id: work-through-decisions-natural-grilling
invariant: DG-C1,DF-C1,PI-C1,DC-E1,DC-C1
activation: positive
prompt: >-
  Grill me on this personal decision: should I take meeting notes on paper or
  digitally? Ask rigorous questions with recommendations, but do not modify
  the repository.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Unrelated repository\n"
checks:
  - name: natural-language grilling remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: personal decision uses standalone grilling
    proposition: >-
      The response treats paper versus digital notes as a personal decision,
      asks at least one concrete decision question with an advisory
      recommendation and rationale, and waits for the user's answer. It does
      not produce a feature brief or implementation plan.
