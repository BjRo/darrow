id: work-through-decisions-stress-test
invariant: DG-C1,DF-C1,PI-C1,DC-E1,DC-C1
activation: positive
prompt: >-
  Stress-test my thinking relentlessly before I commit to this API design. The
  proposal is a public bulk-delete endpoint, but its authorization behavior,
  partial-failure semantics, and maximum batch size are unsettled. Challenge
  me in decision rounds and do not modify the repository.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Bulk API\n"
checks:
  - name: generic stress-test remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: API subject uses standalone grilling
    proposition: >-
      The response asks one or more concrete design questions about the
      proposed bulk-delete endpoint with advisory recommendations and rationale.
      Authorization behavior or maximum batch size are relevant subjects.
      The subject may be apparent from references to records, deletions, or
      the endpoint; an explicit bulk-delete or stress-test label is not
      required. Generic advice without a recommended question, or questions
      about an unrelated subject, fail.
  - name: stress-test round stops for user decisions
    proposition: >-
      After its questions and recommendations, the response ends the turn
      without assuming the user's answers, advancing into dependent decisions,
      claiming confirmation, or producing a feature brief or implementation
      plan. A statement deferring later decisions is allowed. The end of the
      response establishes stopping; no announcement of waiting, round mode,
      or absence of a brief or plan is required.
