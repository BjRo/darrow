id: plan-implementation-migration-root
invariant: PI-C1,PI-C2,DG-C2,DG-C3,DG-C4,DC-P4,DC-C1
activation: positive
prompt: >-
  Help me plan the migration from the legacy client API to its replacement.
  Inspect the repository. We have not decided whether the migration approach
  should be gradual or immediate. The rollout schedule and verification
  approach depend on that choice. Discuss the unresolved choices with
  recommendations before producing the plan. Do not modify files or create
  tickets.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: |
          # Client API migration
          The replacement API serves the same client operations.
          There are 40 independently deployed client applications.
          Both APIs may operate during the transition.
        src/client.js: |
          export async function request(url) {
            return fetch("/legacy" + url);
          }
checks:
  - name: migration planning remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: migration approach is the current root
    proposition: >-
      The response asks one numbered current-frontier question choosing between gradual
      and immediate migration and gives a concrete advisory recommendation
      with reasoning about that migration choice. It uses an inspected fact,
      such as independently deployed clients, coexistence of the APIs, or the
      current legacy endpoint.
  - name: migration children remain unresolved
    proposition: >-
      The response names the rollout schedule and verification approach only
      as deferred decisions. Nowhere in the response, including option
      explanations or recommendations, does it ask, propose, or select answers
      to those decisions. Recommending a sunset deadline or proposing canary
      verification fails even when it is advisory or accompanied by a deferral.
      Discussing migration-level coordination or exposure trade-offs without
      proposing a rollout schedule or verification mechanism is allowed.
  - name: migration answer only unblocks the next frontier
    proposition: >-
      The response states that the frontier will be recomputed after the user's
      answer and stops without implementation slices, a final migration plan,
      or a promise to produce the rollout or verification plan immediately
      after that one answer.
