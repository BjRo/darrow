id: discover-feature-complete-brief
invariant: DF-C1,DF-C2,DG-C5,DC-C1,DC-C2,DC-E9,SE-C9,SE-C10,SE-C11
activation: positive
prompt: >-
  Produce the draft discovery brief from these settled feature decisions. The
  feature lets workspace administrators schedule an existing saved report for
  weekly Monday 09:00 delivery in the workspace timezone. The scheduling
  administrator selects one or more recipients; every verified workspace
  member is eligible, and delivery uses email. Any workspace administrator may
  view, pause, resume, or delete any schedule. The administrator who creates a
  schedule owns it for failure notifications. Pausing or deleting a schedule
  cancels its queued but unsent deliveries; resuming affects future scheduled
  deliveries only. Generation failures retry once
  after five minutes and then email that owning administrator. CSV is the only
  format. Historical backfill, external recipients, custom cron schedules, and
  new report authoring are out of scope. Acceptance will be observed through
  the public scheduling API and a fake-clock integration test covering
  delivery, pause and resume, the five-minute retry plus notification, and
  deletion. These are my final choices; include the one-sentence restatement
  for confirmation. Do not write files or produce an implementation plan.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Analytics\nSaved reports already exist.\n"
checks:
  - name: discovery brief remains conversational
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: brief preserves the settled outcome and behavior
    proposition: >-
      The response presents a discovery brief in which workspace administrators
      schedule an existing saved report for Monday at 09:00 in the workspace
      timezone, choose verified workspace members as email recipients, can
      pause or delete schedules, use CSV only, and receive an owner email after
      one failed-generation retry five minutes later. Every administrator can
      manage every schedule, every verified member is recipient-eligible, and
      the schedule creator owns failure notifications. Pausing or deleting
      cancels queued but unsent deliveries, and resuming applies only to future
      scheduled deliveries. Treat wording that
      recipient selection is from verified workspace members, or that eligible
      recipients are verified workspace members, as preserving the recipient
      boundary; the exact quantifier "every" is not required. Describing CSV as
      the fixed report format preserves the format boundary without the word
      "only". Presenting CSV as a default or one selectable option, or allowing
      another format, does not preserve CSV-only behavior.
  - name: brief preserves the settled non-goals
    proposition: >-
      The response keeps historical backfill, external recipients, custom cron
      schedules, and new report authoring explicitly out of scope.
  - name: brief contains observable acceptance and verification
    proposition: >-
      The response gives observable acceptance through the public scheduling
      API and a fake-clock integration test covering delivery, pause and
      resume, the five-minute retry plus owner notification, and deletion.
      A fake-clock acceptance scenario or verification description counts as
      the integration test; that exact phrase is not required.
  - name: brief retains the discovery confirmation boundary
    proposition: >-
      The response provides a concise outcome restatement for the user to
      confirm or correct and does not turn the discovery brief into an
      implementation plan.
  - name: brief leads with the outcome and states evidence directly
    proposition: >-
      The brief leads with the feature outcome, uses direct and familiar
      language, and remains easy to scan. Material evidence and its source
      remain clear. Extended narration of searches, tool calls, or inspection
      steps that distracts from or delays the brief fails this check; a brief
      process aside is a minor style issue and must not fail it.
      Attributing a fact to the repository README or a choice to the user is
      evidence provenance, not process narration.
  - name: brief avoids redundant decision recaps
    proposition: >-
      The brief avoids duplicated whole decision, constraint, or non-goal
      lists and substantial redundant recaps. Acceptance
      criteria may reuse settled behavior to describe observable effects, and
      the final goal restatement may summarize the outcome. Isolated repetition
      of a single constraint is a minor style issue and must not fail this
      check. Duplicated lists and substantial recaps still fail.
