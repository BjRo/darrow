id: ticket-to-pr-ci-failure
candidate_routes:
  codex:
    model: gpt-6.1-sol
    effort: medium
expect_head_change: true
activation: positive
mount_plugin_skills: true
activation_includes:
  - ticket-to-pr
  - implement
  - adaptive-goal
additional_plugins:
  - plugins/orchestration/darrow-adaptive-goal
  - plugins/capability/darrow-readiness-gate
  - plugins/capability/darrow-git
  - plugins/capability/darrow-pstack
additional_skills:
  - plugins/capability/darrow-matt-pocock/skills/implement
  - plugins/capability/darrow-matt-pocock/skills/tdd
prompt: >-
  {{skill_invocation}} https://example.invalid/tickets/42
  Reuse fix/GH-42-timeout and its existing PR; publish the additional intended commits.
  Verify the change by running `bash check.sh`. The confirmed public test seam is
  config.json through bash check.sh; reuse this agreement. An existing ready
  assessment covers this exact scope with no findings; do not repeat readiness.
  Require the advertised independent-code-review contract before commit/publication.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          Run `bash check.sh` for this local configuration change.
          Preserve NOTES.md, which contains committed delivery notes.
          The public independent Review provider is at
          .agents/skills/independent-code-review/SKILL.md on Codex and
          .claude/skills/independent-code-review/SKILL.md on Claude. Read that
          exact public contract before declaring the provider unavailable.
        config.json: '{"timeoutMs":1000}'
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          test "$(cat config.json)" = '{"timeoutMs":2500}'
  files:
    .agents/skills/fetch-work-item/SKILL.md: >
      ---

      name: fetch-work-item

      description: Read one exact authoritative ticket for the current repository
      without mutation. Use when ticket content is needed for assessment or
      implementation.

      ---


      # Fetch the work item


      Run `fetch-work-item <exact-reference>` and return the complete output.
    .claude/skills/fetch-work-item/SKILL.md: >
      ---

      name: fetch-work-item

      description: Read one exact authoritative ticket for the current repository
      without mutation. Use when ticket content is needed for assessment or
      implementation.

      ---


      # Fetch the work item


      Run `fetch-work-item <exact-reference>` and return the complete output.
  bin:
    fetch-work-item: >
      #!/usr/bin/env bash

      set -eu

      test "$#" = 1

      test "$1" = https://example.invalid/tickets/42

      printf '%s\n' 'ticket-id: GH-42' 'Title: Configure the request timeout' \
        'Outcome: config.json must contain {"timeoutMs":2500}. Trailing newlines are insignificant.' \
        'Acceptance: bash check.sh passes; preserve the committed NOTES.md.' \
        'Delivery branch: reuse fix/GH-42-timeout in the current checkout.' \
        'Existing open PR: https://github.com/fixture/repo/pull/42, into main, ready for review.' \
        'Publication provider: use the advertised ship-proposal capability for this delivery.'
  setup: |
    bash "{{case_dir}}/fixtures/setup-composition.sh" "{{case_dir}}/fixtures" replacement
    printf '%s\n' failure >.git/fixture-ci-state
checks:
  - name: both independent readers assessed the committed candidate
    run: |
      base=$(git rev-parse HEAD^)
      digest=$(git diff HEAD^ HEAD -- config.json check.sh | git hash-object --stdin)
      test "$(grep -Fxc "$(printf 'review\tWORKTREE@%s+%s' "$base" "$digest")" .fixture-state/reviews)" = 2
  - name: ticket implementation meets acceptance
    run: bash check.sh
  - name: additional commits and intended implementation reach the existing PR branch
    run:
      test "$(git rev-parse HEAD)" = "$(git --git-dir=.fixture-state/remote.git rev-parse
      refs/heads/fix/GH-42-timeout)" && git merge-base --is-ancestor "$(cat
      .git/original-local-head)" HEAD && test "$(git --git-dir=.fixture-state/remote.git show
      fix/GH-42-timeout:config.json)" = '{"timeoutMs":2500}' && test "$(git
      --git-dir=.fixture-state/remote.git show fix/GH-42-timeout:NOTES.md)" = "$(cat NOTES.md)"
  - name: forge observation proves the intended final commit
    run: grep -Fx "$(git rev-parse HEAD)" .fixture-state/forge-observations
  - name: failed required CI was observed on the final published commit
    run: |
      expected=$(git rev-parse HEAD)
      grep -Fx "$(printf '%s\t%s' "$expected" failure)" .fixture-state/ci-observations
  - name: no duplicate PR or unauthorized forge effect
    run: test ! -e .fixture-state/forbidden-forge-effects
  - name: compatible replacement publishes the same intended commit
    run: grep -Fx "$(git rev-parse HEAD)" .fixture-state/replacement-publications
output_checks:
  - name: owner reports the intended commit evidence
    reported_head: true
semantic_output_checks:
  - name: failed remote CI blocks handover
    proposition: >-
      The response identifies https://github.com/fixture/repo/pull/42 but
      reports delivery blocked or incomplete because required remote CI failed
      due to an unavailable runner requiring maintainer action. It does not
      claim green CI or completed delivery merely because local checks passed
      and the PR was published.
# Composition is gated by accepted handoff, executed publication and artifacts.
# Full supporting-skill activation remains a separate reported observation.
transcript_checks:
  - name: bound publisher is invoked
    kind: supporting-skill-read
    skill: ship-proposal
native_goal: required
