id: ticket-to-pr-worktree-context
invariant: TPR-C2,TPR-C4,TPR-C5,TPR-E2,TPR-E4
goal_report: forbidden
expect_head_change: false
prompt: >-
  Use {{skill_invocation}} to deliver the authoritative ticket whose active
  provider supplies canonical token DAR-123 and exact branch
  `fix/DAR-123-attribution`. I explicitly request a linked worktree. Use the
  available readiness and adaptive capabilities, but honor any deliberate
  blocker they return.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
  setup: >-
    bash "{{case_dir}}/fixtures/install-worktree-context.sh" "$PWD"
    "{{case_dir}}/fixtures"
checks:
  - name: caller checkout stays on main
    run: git branch --show-current
    expect_exact: "main"
  - name: readiness runs from attributed worktree
    run: test "$(cat .git/ticket-to-pr-worktree-readiness-root)" = "$PWD/.worktrees/fix/DAR-123-attribution"
  - name: adaptive delivery runs from attributed worktree
    run: test "$(cat .git/ticket-to-pr-worktree-adaptive-root)" = "$PWD/.worktrees/fix/DAR-123-attribution"
  - name: ticket branch is active in linked worktree
    run: git -C .worktrees/fix/DAR-123-attribution branch --show-current
    expect_exact: "fix/DAR-123-attribution"
output_checks:
  - name: relays deliberate downstream blocker
    expect_regex: "fixture-context-stop"
