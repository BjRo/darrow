id: ticket-to-pr-composition-replacement-claude
candidate_routes:
  claude:
    model: claude-sonnet-5-5
    effort: medium
invariant: TPR-C3,TPR-C4,TPR-C6,TPR-C7,TPR-C9,LC-C1,LC-C3,LC-C4,GW-P9
expect_head_change: true
adaptive_goal_composition: true
activation: positive
mount_plugin_skills: true
activation_includes:
  - ticket-to-pr
  - implement
  - adaptive-goal
additional_plugins:
  - plugins/orchestration/darrow-adaptive-goal
  - plugins/capability/darrow-readiness-gate
  - plugins/capability/darrow-git
  - plugins/capability/darrow-pstack
additional_skills:
  - plugins/capability/darrow-matt-pocock/skills/implement
  - plugins/capability/darrow-matt-pocock/skills/tdd
prompt: "{{skill_invocation}} https://example.invalid/tickets/42 Reuse
  fix/GH-42-timeout and its existing PR; publish the additional intended
  commits. Verify the change by running `bash check.sh`. The confirmed public
  test seam is config.json through bash check.sh; reuse this agreement. An
  existing ready assessment covers this exact scope with no findings; do not
  repeat readiness. Require the advertised independent-code-review contract
  before commit/publication. The bound approved-work implementation provider is
  darrow-matt-pocock:implement. This explicit delivery invocation authorizes
  invoking that public provider in this same thread, preserving its
  explicit-only boundary."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          Run `bash check.sh` for this local configuration change.
          Preserve NOTES.md, which contains committed delivery notes.
          The public independent Review provider is at
          .agents/skills/independent-code-review/SKILL.md on Codex and
          .claude/skills/independent-code-review/SKILL.md on Claude. Read that
          exact public contract before declaring the provider unavailable.
        config.json: '{"timeoutMs":1000}'
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          test "$(cat config.json)" = '{"timeoutMs":2500}'
        CLAUDE.md: >
          Read AGENTS.md. Public fixture providers:
          .claude/skills/fetch-work-item/SKILL.md,
          .claude/skills/ship-proposal/SKILL.md,
          .claude/skills/observe-ci/SKILL.md and
          .claude/skills/independent-code-review/SKILL.md. Read the exact
          supplied public contracts before treating those providers as missing.
  files:
    .agents/skills/fetch-work-item/SKILL.md: >
      ---

      name: fetch-work-item

      description: Read one exact authoritative ticket for the current
      repository without mutation. Use when ticket content is needed for
      assessment or implementation.

      ---


      # Fetch the work item


      Run `fetch-work-item <exact-reference>` and return the complete output.
    .claude/skills/fetch-work-item/SKILL.md: >
      ---

      name: fetch-work-item

      description: Read one exact authoritative ticket for the current
      repository without mutation. Use when ticket content is needed for
      assessment or implementation.

      ---


      # Fetch the work item


      Run `fetch-work-item <exact-reference>` and return the complete output.
  bin:
    fetch-work-item: >
      #!/usr/bin/env bash

      set -eu

      test "$#" = 1

      test "$1" = https://example.invalid/tickets/42

      printf '%s\n' 'ticket-id: GH-42' 'Title: Configure the request timeout' \
        'Outcome: config.json must contain {"timeoutMs":2500}. Trailing newlines are insignificant.' \
        'Acceptance: bash check.sh passes; preserve the committed NOTES.md.' \
        'Delivery branch: reuse fix/GH-42-timeout in the current checkout.' \
        'Existing open PR: https://github.com/fixture/repo/pull/42, into main, ready for review.' \
        'Publication provider: use the advertised ship-proposal capability for this delivery.'
  setup:
    bash "{{case_dir}}/fixtures/setup-composition.sh" "{{case_dir}}/fixtures"
    replacement
checks:
  - name: both independent readers assessed the committed candidate
    run: >
      base=$(git rev-parse HEAD^)

      digest=$(git diff HEAD^ HEAD -- config.json check.sh | git hash-object
      --stdin)

      test "$(grep -Fxc "$(printf 'review\tWORKTREE@%s+%s' "$base" "$digest")"
      .fixture-state/reviews)" = 2
  - name: ticket implementation meets acceptance
    run: bash check.sh
  - name: additional commits and intended implementation reach the existing PR branch
    run:
      test "$(git rev-parse HEAD)" = "$(git --git-dir=.fixture-state/remote.git
      rev-parse refs/heads/fix/GH-42-timeout)" && git merge-base --is-ancestor
      "$(cat .git/original-local-head)" HEAD && test "$(git
      --git-dir=.fixture-state/remote.git show fix/GH-42-timeout:config.json)" =
      '{"timeoutMs":2500}' && test "$(git --git-dir=.fixture-state/remote.git
      show fix/GH-42-timeout:NOTES.md)" = "$(cat NOTES.md)"
  - name: forge observation proves the intended final commit
    run: grep -Fx "$(git rev-parse HEAD)" .fixture-state/forge-observations
  - name: required CI was observed on the final published commit
    run: >
      expected=$(git rev-parse HEAD)

      grep -Fx "$(printf '%s\t%s' "$expected" success)"
      .fixture-state/ci-observations
  - name: no duplicate PR or unauthorized forge effect
    run: test ! -e .fixture-state/forbidden-forge-effects
  - name: compatible replacement publishes the same intended commit
    run: grep -Fx "$(git rev-parse HEAD)" .fixture-state/replacement-publications
output_checks:
  - name: owner reports the intended commit evidence
    reported_head: true
semantic_output_checks:
  - name: owner completion and existing URL are relayed
    proposition:
      The response unambiguously reports that delivery is complete and
      includes the exact pull request URL
      https://github.com/fixture/repo/pull/42. It does not present the result as
      blocked, incomplete, or still requiring delivery action. A completed
      publication with the verified intended commit, passing checks, and the PR
      ready for review communicates completed delivery; a separate fixed
      completion phrase is not required. Evaluate the whole response. A plan to
      publish, remaining implementation, or unresolved verification does not
      satisfy completion.
native_goal: required
harnesses:
  - claude
follow_up_prompt: /goal Continue the already prepared Ticket-to-PR delivery
  through implement and its one Adaptive Goal owner in this original session.
  Preserve the approved scope, inherited ready assessment, confirmed
  config.json/bash check.sh test seam and all first-turn provider bindings. Set
  timeoutMs to 2500 and preserve NOTES.md. Commit through the bound Git workflow
  only after current checks, acceptance accounting and independent Review clear.
  Publish without force to the existing fix/GH-42-timeout branch and exact PR
  https://github.com/fixture/repo/pull/42 through ship-proposal. Complete only
  with required CI green on that exact published commit; report its URL and
  commit. Preserve every original exclusion and do not start another owner or
  reinvoke Ticket-to-PR.
