id: ticket-to-pr-readiness-decisions
invariant: TPR-C2,TPR-C3
goal_report: forbidden
prompt: >-
  Use $ticket-to-pr for ticket #42. The available implementation-readiness
  capability returns needs-decision because the default branch is not selected.
