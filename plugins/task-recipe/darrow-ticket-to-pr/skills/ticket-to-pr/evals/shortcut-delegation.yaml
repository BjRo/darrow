id: ticket-to-pr-shortcut-delegation
activation: positive
mount_plugin_skills: true
activation_sequence:
  - ticket-to-pr
  - adaptive-goal
invariant: TPR-C1,TPR-C2,TPR-C3,TPR-C4,TPR-C6,TPR-C7,TPR-C8,TPR-C9,TPR-P1,TPR-P2,TPR-P3
goal_report: forbidden
expect_head_change: false
prompt: >-
  {{skill_invocation}} https://example.invalid/tickets/42
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
  files:
    .claude/skills/adaptive-goal/SKILL.md: &adaptive_goal |
      ---
      name: adaptive-goal
      description: Provide adaptive-goal orchestration in the original main thread, owning preflight and one native goal for a bounded recipe-delegated delivery. Accept its preserved delivery authority envelope.
      ---

      # Fixture adaptive goal

      Accept the delegation only when it preserves the exact ticket URL and asks
      the main delivery coordinator to read and arrange implementation of that ticket in the current repository on a
      new ticket branch, verify the result, create intended commits, push without
      force, and create or reuse exactly one pull request. It must forbid merge,
      deployment, release, ticket mutation, destructive Git operations, and
      unrelated changes. It must also say that, only when the ticket or
      verification contract requires reviewer-facing evidence, the same
      explicit recipe authority permits at most one candidate-bound operation
      against the exact current-repository PR and intended verified commit,
      while excluding generic comments, another PR and automatic recovery.

      Record the complete delegated request without adding requirements or
      recovering missing details from the original user message. Replace the
      placeholder with that request as one quoted argument:

      ```sh
      record-ticket-to-pr-delegation https://example.invalid/tickets/42 '<complete delegated request>'
      ```

      Then return exactly:

      ```text
      Status: blocked
      Reason: fixture-delegation-observed
      ```
    .agents/skills/adaptive-goal/SKILL.md: *adaptive_goal
  bin:
    record-ticket-to-pr-delegation: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 2
      test "$1" = https://example.invalid/tickets/42
      printf '%s\n' "$1" >>.fixture-state/ticket-to-pr-delegations
      printf '%s\n' "$2" >.fixture-state/delegated-request.md
checks:
  - name: recipe delegates the exact shortcut once
    run: >-
      test "$(wc -l <.fixture-state/ticket-to-pr-delegations | tr -d ' ')" -eq 1 &&
      test "$(cat .fixture-state/ticket-to-pr-delegations)" =
      https://example.invalid/tickets/42
  - name: recipe parent performs no delivery mutation
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git rev-list --count HEAD)" -eq 1 &&
      git diff --exit-code -- README.md
semantic_artifact:
  path: .fixture-state/delegated-request.md
  checks:
    - name: shortcut supplies branch TDD and final green CI defaults
      proposition: >-
        The delegated request requires implementing ticket
        https://example.invalid/tickets/42 on a new branch using TDD
        (test-driven development), opening or reusing one pull request, and
        completing only after required CI checks pass on its final commit.
        It does not require creating a worktree when the caller has not asked
        for one. Local verification alone is insufficient to meet the stated
        completion condition.
output_checks:
  - name: recipe relays the adaptive result
    expect_regex: "fixture-delegation-observed"
transcript_checks:
  - name: supporting adaptive-goal skill use is observed
    expect_regex: '(?:"name":"Skill"[^\n]*adaptive-goal|"type":"darrow.skill_read_probe"[^\n]*"skill":"adaptive-goal"[^\n]*"status":"completed")'
  - name: recipe does not pre-run adaptive-owned capabilities
    not_regex: '(?:"name":"Skill"[^\n]*(?:read-ticket|assess-implementation-readiness|prepare-task-branch)|"type":"darrow.skill_read_probe"[^\n]*"skill":"(?:read-ticket|assess-implementation-readiness|prepare-task-branch)")'
