id: ticket-to-pr-publication-reuse
invariant: TPR-C6,TPR-C7,TPR-C8
prompt: >-
  Use $ticket-to-pr to deliver ticket #42. A current-content-verified open PR
  is unambiguously correlated with this ticket and branch; reuse it rather than
  creating a second pull request.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
checks: []
output_checks:
  - name: reports reuse without duplication
    expect_regex: "reus|existing|correlated"
