id: ticket-to-pr-no-remote-publication-blocker
invariant: TPR-C8
goal_report: forbidden
expect_head_change: null
prompt: >-
  Use {{skill_invocation}} to deliver ready ticket #42. The repository has no
  Git remote. Do not invent one; report the exact publication blocker.
fixture:
  commits:
    - message: "chore: init"
      files:
        greeting.txt: "old\n"
checks: []
output_checks:
  - name: reports the exact no-remote publication blocker
    expect_regex: "no[_ -]?(configured )?git[_ -]?remote|no configured remotes|no remotes|remote.*not configured|cannot.*push.*remote"
    flags: i
