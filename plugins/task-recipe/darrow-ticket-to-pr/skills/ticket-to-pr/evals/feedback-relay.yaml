id: ticket-to-pr-feedback-relay
invariant: TPR-C2,TPR-C3,TPR-C4,TPR-C5,TPR-C6,TPR-C7,TPR-P2
expect_head_change: true
adaptive_goal_composition: true
activation: positive
mount_plugin_skills: true
activation_sequence:
  - ticket-to-pr
  - adaptive-goal
additional_plugins:
  - plugins/orchestration/darrow-goal-loop
prompt: "{{skill_invocation}} https://example.invalid/tickets/42"
follow_up_prompt: "Use the strict migration policy. Approval reference: cobalt-7391."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash test.sh` for migration behavior changes. The engineering
          owner must run `decisionctl discover` before editing production code.
          Only that command's runtime output establishes whether feedback is
          required and what question must be answered. Any question it returns
          is product-owned and must be answered by the user through the parent
          thread. After the answer, the same owner must run
          `decisionctl acknowledge migration-policy <exact-answer>` before
          editing production code.
        package.json: '{"type":"module"}'
        src/migration.js: |
          export const identity = (value) => value;
        test/migration.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity, migrationMode } from "../src/migration.js";

          test("identity", () => assert.equal(identity("v"), "v"));
          test("uses a supported migration mode", () => {
            assert.ok(["strict", "compatible"].includes(migrationMode()));
          });
        test.sh: |
          #!/usr/bin/env bash
          node --test test/migration.test.js
  files:
    .claude/skills/read-ticket/SKILL.md: &read_ticket |
      ---
      name: read-ticket
      description: Read the exact fixture ticket by URL without mutation. Use whenever the active delivery needs that authoritative ticket.
      ---

      # Read the fixture ticket

      Run `fixture-read-ticket <exact-url>` once per requested read and return
      its complete output.
    .agents/skills/read-ticket/SKILL.md: *read_ticket
    .claude/skills/assess-implementation-readiness/SKILL.md: &readiness |
      ---
      name: assess-implementation-readiness
      description: Assess the exact fixture ticket before implementation and return its ready quality bar without mutation.
      ---

      # Assess fixture readiness

      Run `fixture-readiness https://example.invalid/tickets/42` exactly once
      and return its complete output byte-for-byte.
    .agents/skills/assess-implementation-readiness/SKILL.md: *readiness
    .claude/skills/prepare-task-branch/SKILL.md: &prepare_branch |
      ---
      name: prepare-task-branch
      description: Prepare the exact new branch for fixture ticket DAR-42 while preserving local work.
      ---

      # Prepare the fixture branch

      Run `fixture-prepare-branch DAR-42` exactly once and return its output.
    .agents/skills/prepare-task-branch/SKILL.md: *prepare_branch
    .claude/skills/create-commit/SKILL.md: &create_commit |
      ---
      name: create-commit
      description: Create exactly one Conventional Commit for the ready fixture change after verification.
      ---

      # Commit the fixture change

      Run `fixture-create-commit` exactly once after `bash test.sh` passes.
    .agents/skills/create-commit/SKILL.md: *create_commit
    .claude/skills/create-pr/SKILL.md: &create_pr |
      ---
      name: create-pr
      description: Push the current fixture branch without force and create exactly one pull request for its committed change.
      ---

      # Publish the fixture change

      Run `fixture-create-pr` exactly once after the intended commit exists and
      return its complete output.
    .agents/skills/create-pr/SKILL.md: *create_pr
  bin:
    fixture-read-ticket: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "$1" = https://example.invalid/tickets/42
      printf '%s\n' "$1" >>.git/read-ticket-invocations
      printf '%s\n' \
        'ticket-token: DAR-42' \
        'ticket: https://example.invalid/tickets/42' \
        'outcome: Export migrationMode() from src/migration.js using the policy selected through the repository decision process.' \
        'scope: Add a pure string selector used only by the tests in this repository. There are no external callers, data conversions, persisted-format changes, deployments, or migration execution in this task.' \
        'acceptance: bash test.sh passes.'
    fixture-readiness: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "$1" = https://example.invalid/tickets/42
      test ! -e .git/readiness-invocations
      printf '%s\n' "$1" >>.git/readiness-invocations
      printf '%s\n' \
        '## Implementation readiness' \
        '' \
        '**Verdict:** `ready`' \
        '' \
        '### Quality bar' \
        '' \
        '- `bash test.sh` passes.' \
        '' \
        '### Findings' \
        '' \
        'None.' \
        '' \
        '### Required next action' \
        '' \
        'None; ready for implementation.'
    fixture-prepare-branch: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "$1" = DAR-42
      git switch -c fix/DAR-42-migration
      printf '%s\n' fix/DAR-42-migration >>.git/branch-invocations
      printf '%s\n' 'branch: fix/DAR-42-migration'
    decisionctl: |
      #!/usr/bin/env bash
      set -eu
      trace=.git/ticket-feedback-trace
      state=.git/ticket-feedback-state
      case "${1-}" in
        discover)
          test "$#" -eq 1
          test ! -e "$state"
          git hash-object src/migration.js >"$state"
          printf 'discover\tmigration-policy\t%s\n' "$(cat "$state")" >>"$trace"
          printf '%s\n' \
            'feedback_required' \
            'id: migration-policy' \
            'question: Which migration policy should this product use: strict or compatible? Include the approval reference in your reply.'
          ;;
        acknowledge)
          test "$#" -eq 3
          test "$2" = migration-policy
          if test "$3" != 'Use the strict migration policy. Approval reference: cobalt-7391.'; then
            printf '%s\n' 'Acknowledgement rejected: supply the complete user reply, including its approval reference, as one argument. No production mutation is authorized until acknowledgement succeeds.' >&2
            exit 1
          fi
          test -s "$state"
          test "$(git hash-object src/migration.js)" = "$(cat "$state")"
          printf 'acknowledge\tmigration-policy\t%s\t%s\n' \
            "$3" "$(git hash-object src/migration.js)" >>"$trace"
          ;;
        *) exit 64 ;;
      esac
    fixture-create-commit: |
      #!/usr/bin/env bash
      set -eu
      bash test.sh
      git add -- src/migration.js
      git commit -m 'feat(migration): select strict policy'
      printf '%s\n' "$(git rev-parse HEAD)" >>.git/commit-invocations
    fixture-create-pr: |
      #!/usr/bin/env bash
      set -eu
      test "$(git branch --show-current)" = fix/DAR-42-migration
      git diff --quiet
      git diff --cached --quiet
      git push -u origin fix/DAR-42-migration
      test ! -e .git/pull-requests
      printf '%s\t%s\n' \
        fix/DAR-42-migration https://example.invalid/pull/42 \
        >.git/pull-requests
      printf '%s\n' 'https://example.invalid/pull/42'
  setup: |
    git init --bare .git/fixture-remote.git >/dev/null
    git remote add origin "$PWD/.git/fixture-remote.git"
checks:
  - name: same owner implements the explicit decision
    run: >-
      bash test.sh &&
      node --input-type=module -e 'import { identity, migrationMode } from "./src/migration.js"; import assert from "node:assert/strict"; assert.equal(identity("v"), "v"); assert.equal(migrationMode(), "strict")'
  - name: user answer is acknowledged before production mutation
    run: |
      awk -F '\t' '
        NR == 1 && $1 == "discover" && $2 == "migration-policy" {
          before = $3; next
        }
        NR == 2 && $1 == "acknowledge" && $2 == "migration-policy" &&
          $3 == "Use the strict migration policy. Approval reference: cobalt-7391." && $4 == before {
          ok = 1
        }
        END { exit ok && NR == 2 ? 0 : 1 }
      ' .git/ticket-feedback-trace
  - name: delivery prepares the exact ticket branch once
    run: |
      cat .git/branch-invocations
      test "$(cat .git/branch-invocations)" = fix/DAR-42-migration
  - name: delivery remains on the exact ticket branch
    run: |
      branch=$(git branch --show-current)
      printf 'current branch: %s\n' "$branch"
      test "$branch" = fix/DAR-42-migration
  - name: delivery invokes the bound commit capability once
    run: |
      count=$(wc -l <.git/commit-invocations | tr -d ' ')
      printf 'commit invocations: %s\n' "$count"
      test "$count" -eq 1
  - name: delivery creates one intended commit
    run: |
      count=$(git rev-list --count HEAD)
      printf 'history count including baseline: %s\n' "$count"
      test "$count" -eq 2
  - name: delivery commits the implementation and only scoped verification changes
    run: |
      changes=$(git diff-tree --no-commit-id --name-only -r HEAD)
      printf 'committed paths:\n%s\n' "$changes"
      implementation=false
      while IFS= read -r path; do
        case "$path" in
          src/migration.js) implementation=true ;;
          test/*|test.sh) ;;
          *) exit 1 ;;
        esac
      done <<< "$changes"
      test "$implementation" = true
  - name: exact current branch is published once
    run: >-
      test "$(wc -l <.git/pull-requests | tr -d ' ')" -eq 1 &&
      test "$(cut -f1 .git/pull-requests)" = fix/DAR-42-migration &&
      test "$(cut -f2 .git/pull-requests)" = https://example.invalid/pull/42 &&
      test "$(git --git-dir=.git/fixture-remote.git rev-parse refs/heads/fix/DAR-42-migration)" = "$(git rev-parse HEAD)"
  - name: readiness and authoritative ticket capabilities were used
    run: >-
      test "$(wc -l <.git/readiness-invocations | tr -d ' ')" -eq 1 &&
      test "$(wc -l <.git/read-ticket-invocations | tr -d ' ')" -ge 1
output_checks:
  - name: completion identifies the one pull request
    expect_regex: "https://example\\.invalid/pull/42"
semantic_output_checks:
  - name: completed delivery is reported
    proposition: >-
      The response unambiguously reports that the ticket implementation and
      pull-request publication are finished. It does not present delivery as
      blocked, incomplete, or still requiring action before publication.
transcript_checks:
  # Codex encrypts native message arguments. The exact fixture acknowledgement
  # above proves preservation at the owner; null transport equality is unknown.
  - name: observable plaintext feedback is not rewritten
    not_regex: '"type":"darrow.codex_native_feedback"[^\n]*"message_representation":"plaintext"[^\n]*"message_matches_expected":false'
  - name: worktree remains unchanged until the user answers
    expect_regex: '"type":"darrow.eval.follow_up_turn"[^\n]*"pre_feedback_worktree_unchanged":true'
  - name: one owner is retained across the main-thread answer
    expect_regex: '(?:"type":"darrow.human_feedback_relay"[^\n]*"same_owner":true[\s\S]*"type":"darrow.goal_agent_resumption"[^\n]*"status":"completed"[^\n]*"same_owner":true|"type":"darrow.codex_native_feedback"[^\n]*"tool":"(?:followup_task|send_message)"[^\n]*"same_owner":true[^\n]*"after_follow_up":true[^\n]*"response_observed":true)'
  - name: no second owner is launched
    not_regex: '(?:"type":"darrow.parent_spawn_after_goal"|"tool":"spawn_agent"[^\n]*"status":"completed"[^\n]*[\s\S]*"tool":"spawn_agent"[^\n]*"status":"completed")'
  - name: later answer does not reinvoke the recipe
    not_regex: '"type":"darrow.eval.follow_up_turn"[\s\S]*(?:"name":"Skill"[^\n]*ticket-to-pr|"type":"darrow.skill_read_probe"[^\n]*"skill":"ticket-to-pr")'
