id: ticket-to-pr-feedback-relay
invariant: TPR-C2,TPR-C3,TPR-C4,TPR-C5,TPR-C6,TPR-C7,TPR-C9,TPR-P2
expect_head_change: true
adaptive_goal_composition: true
activation: positive
mount_plugin_skills: true
activation_sequence:
  - ticket-to-pr
  - adaptive-goal
additional_plugins:
  - plugins/orchestration/darrow-adaptive-goal
  - plugins/capability/darrow-tdd
prompt: >-
  {{skill_invocation}} https://example.invalid/tickets/42
  Verify the change by running `bash test.sh`.
follow_up_prompt: "Use the strict migration policy. Approval reference: cobalt-7391."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash test.sh` for migration behavior changes. The main delivery
          coordinator must run `decisionctl discover` before editing production code.
          Only that command's runtime output establishes whether feedback is
          required and what question must be answered. Any question it returns
          is product-owned and must be answered by the user through the main
          thread. After the answer, that coordinator must run
          `decisionctl acknowledge migration-policy <exact-answer>` before
          editing production code.
        package.json: '{"type":"module"}'
        src/migration.js: |
          export const identity = (value) => value;
        test/migration.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity, migrationMode } from "../src/migration.js";

          test("identity", () => assert.equal(identity("v"), "v"));
          test("uses a supported migration mode", () => {
            assert.ok(["strict", "compatible"].includes(migrationMode()));
          });
        test.sh: |
          #!/usr/bin/env bash
          node --test test/migration.test.js
  files:
    .claude/skills/read-ticket/SKILL.md: &read_ticket |
      ---
      name: read-ticket
      description: Read the exact fixture ticket by URL without mutation. Use whenever the active delivery needs that authoritative ticket.
      ---

      # Read the fixture ticket

      Run `fixture-read-ticket <exact-url>` once per requested read and return
      its complete output.
    .agents/skills/read-ticket/SKILL.md: *read_ticket
    .claude/skills/assess-implementation-readiness/SKILL.md: &readiness |
      ---
      name: assess-implementation-readiness
      description: Assess the exact fixture ticket before implementation and return its ready quality bar without mutation.
      ---

      # Assess fixture readiness

      Run `fixture-readiness https://example.invalid/tickets/42` exactly once
      and return its complete output byte-for-byte.
    .agents/skills/assess-implementation-readiness/SKILL.md: *readiness
    .claude/skills/prepare-task-branch/SKILL.md: &prepare_branch |
      ---
      name: prepare-task-branch
      description: Discover local branches for exact ticket ID DAR-42 read-only, or prepare a caller-selected exact branch while preserving local work.
      ---

      # Prepare the fixture branch

      For read-only ticket-ID discovery, run `fixture-discover-branches DAR-42` and
      return the complete list. For exact preparation, run
      `fixture-prepare-branch '<selected branch>'` once after the coordinator
      selected that complete ticket-linked name. Preserve that choice.
      Never prepare a branch during discovery.
    .agents/skills/prepare-task-branch/SKILL.md: *prepare_branch
    .claude/skills/create-commit/SKILL.md: &create_commit |
      ---
      name: create-commit
      description: Create exactly one Conventional Commit for the ready fixture change after verification.
      ---

      # Commit the fixture change

      Run `fixture-create-commit` exactly once after `bash test.sh` passes.
    .agents/skills/create-commit/SKILL.md: *create_commit
    .claude/skills/create-pr/SKILL.md: &create_pr |
      ---
      name: create-pr
      description: Push the current fixture branch without force and create exactly one pull request for its committed change.
      ---

      # Publish the fixture change

      Run `fixture-create-pr` exactly once after the intended commit exists and
      return its complete output.
    .agents/skills/create-pr/SKILL.md: *create_pr
  bin:
    fixture-read-ticket: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "$1" = https://example.invalid/tickets/42
      printf '%s\n' "$1" >>.fixture-state/read-ticket-invocations
      printf '%s\n' \
        'ticket-id: DAR-42' \
        'ticket: https://example.invalid/tickets/42' \
        'outcome: Export migrationMode() from src/migration.js using the policy selected through the repository decision process.' \
        'scope: Add a pure string selector used only by the tests in this repository. There are no external callers, data conversions, persisted-format changes, deployments, or migration execution in this task.' \
        'acceptance: bash test.sh passes.'
    fixture-readiness: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "$1" = https://example.invalid/tickets/42
      printf '%s\n' "$1" >>.fixture-state/readiness-invocations
      printf '%s\n' \
        '## Implementation readiness' \
        '' \
        '**Verdict:** `ready`' \
        '' \
        '### Quality bar' \
        '' \
        '- `bash test.sh` passes.' \
        '' \
        '### Findings' \
        '' \
        'None.' \
        '' \
        '### Required next action' \
        '' \
        'None; ready for implementation.'
    fixture-discover-branches: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "$1" = DAR-42
      printf '%s\n' 'ticket-id: DAR-42' 'Matching local branches (complete list):'
      branches=$(git for-each-ref --format='%(refname:short)' refs/heads)
      while IFS= read -r branch; do
        case "$branch" in */DAR-42|*/DAR-42-*) printf '%s\n' "$branch" ;; esac
      done <<< "$branches"
      printf '%s\n' 'End of matching branches.'
    fixture-prepare-branch: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "${#1}" -le 60
      grep -Eq '^[a-z][a-z0-9-]*/DAR-42-[a-z0-9]+(-[a-z0-9]+)*$' <<< "$1"
      git check-ref-format --branch "$1" >/dev/null
      test ! -e .fixture-state/branch-invocations
      if git show-ref --verify --quiet "refs/heads/$1"; then
        git switch "$1"
      else
        git switch -c "$1"
      fi
      printf '%s\n' "$1" >>.fixture-state/branch-invocations
      printf 'branch: %s\n' "$1"
    decisionctl: |
      #!/usr/bin/env bash
      set -eu
      trace=.fixture-state/ticket-feedback-trace
      state=.fixture-state/ticket-feedback-state
      case "${1-}" in
        discover)
          test "$#" -eq 1
          test ! -e "$state"
          { git rev-parse HEAD; git diff --binary HEAD; git ls-files --others --exclude-standard; } >.fixture-state/feedback-product-current
          cmp .git/feedback-product-before .fixture-state/feedback-product-current
          printf '%s\n' "$1" >>.fixture-state/feedback-product-unchanged
          git hash-object src/migration.js >"$state"
          printf 'discover\tmigration-policy\t%s\n' "$(cat "$state")" >>"$trace"
          printf '%s\n' \
            'feedback_required' \
            'id: migration-policy' \
            'question: Which migration policy should this product use: strict or compatible? Include the approval reference in your reply.'
          ;;
        acknowledge)
          test "$#" -eq 3
          test "$2" = migration-policy
          if test "$3" != 'Use the strict migration policy. Approval reference: cobalt-7391.'; then
            printf '%s\n' 'Acknowledgement rejected: supply the complete user reply, including its approval reference, as one argument. No production mutation is authorized until acknowledgement succeeds.' >&2
            exit 1
          fi
          test -s "$state"
          { git rev-parse HEAD; git diff --binary HEAD; git ls-files --others --exclude-standard; } >.fixture-state/feedback-product-current
          cmp .git/feedback-product-before .fixture-state/feedback-product-current
          printf '%s\n' "$1" >>.fixture-state/feedback-product-unchanged
          test "$(git hash-object src/migration.js)" = "$(cat "$state")"
          printf 'acknowledge\tmigration-policy\t%s\t%s\n' \
            "$3" "$(git hash-object src/migration.js)" >>"$trace"
          ;;
        *) exit 64 ;;
      esac
    fixture-create-commit: |
      #!/usr/bin/env bash
      set -eu
      bash test.sh
      git add -- src/migration.js test/ test.sh
      git commit -m 'feat(migration): select strict policy'
      printf '%s\n' "$(git rev-parse HEAD)" >>.fixture-state/commit-invocations
    fixture-create-pr: |
      #!/usr/bin/env bash
      set -eu
      branch=$(git branch --show-current)
      test "$branch" = "$(cat .fixture-state/branch-invocations)"
      git diff --quiet
      git diff --cached --quiet
      git push -u origin "$branch"
      test ! -e .fixture-state/pull-requests
      printf '%s\t%s\n' \
        "$branch" https://example.invalid/pull/42 \
        >.fixture-state/pull-requests
      head=$(git rev-parse HEAD)
      remote_head=$(git --git-dir=.fixture-state/remote.git rev-parse "refs/heads/$branch")
      test "$head" = "$remote_head"
      printf '%s\n' 'Pull request: https://example.invalid/pull/42' 'Repository: fixture/repository' "Head: $branch" 'Base: main' 'Draft: false' 'Open pull requests: 1'
      printf 'Remote head: %s\nForge head: %s\n' "$remote_head" "$remote_head"
  setup: |
    bash "{{case_dir}}/fixtures/setup-ci.sh" "{{case_dir}}/fixtures"
    git init --bare .fixture-state/remote.git >/dev/null
    git remote add origin "$PWD/.fixture-state/remote.git"
    { git rev-parse HEAD; git diff --binary HEAD; git ls-files --others --exclude-standard; } >.git/feedback-product-before
checks:
  - name: same owner implements the explicit decision
    run: >-
      bash test.sh && node --input-type=module -e 'import { identity,
      migrationMode } from "./src/migration.js"; import assert from
      "node:assert/strict"; assert.equal(identity("v"), "v");
      assert.equal(migrationMode(), "strict")'
  - name: user answer is acknowledged before production mutation
    run: |
      awk -F '\t' '
        NR == 1 {
          discovery_first = (NF == 3 && $1 == "discover" && $2 == "migration-policy" && $3 != "")
          before = $3
          next
        }
        {
          if (NF != 4 || $1 != "acknowledge" || $2 != "migration-policy" ||
              $3 != "Use the strict migration policy. Approval reference: cobalt-7391." || $4 != before)
            invalid = 1
        }
        END {
          if (discovery_first && NR >= 2 && !invalid) exit 0
          printf "acknowledgement trace: rows=%d discovery_first=%d invalid=%d\n", NR, discovery_first, invalid
          exit 1
        }
      ' .fixture-state/ticket-feedback-trace
  - name: delivery prepares the exact ticket branch once
    run: |
      cat .fixture-state/branch-invocations
      test "$(wc -l <.fixture-state/branch-invocations | tr -d ' ')" -eq 1
      grep -Eq '^[a-z][a-z0-9-]*/DAR-42-[a-z0-9]+(-[a-z0-9]+)*$' .fixture-state/branch-invocations
  - name: delivery remains on the exact ticket branch
    run: |
      branch=$(git branch --show-current)
      printf 'current branch: %s\n' "$branch"
      test "$branch" = "$(cat .fixture-state/branch-invocations)"
  - name: delivery invokes the bound commit capability once
    run: |
      count=$(wc -l <.fixture-state/commit-invocations | tr -d ' ')
      printf 'commit invocations: %s\n' "$count"
      test "$count" -eq 1
  - name: delivery creates one intended commit
    run: |
      count=$(git rev-list --count HEAD)
      printf 'history count including baseline: %s\n' "$count"
      test "$count" -eq 2
  - name: delivery commits the implementation and only scoped verification changes
    run: |
      changes=$(git diff-tree --no-commit-id --name-only -r HEAD)
      printf 'committed paths:\n%s\n' "$changes"
      implementation=false
      while IFS= read -r path; do
        case "$path" in
          src/migration.js) implementation=true ;;
          test/*|test.sh) ;;
          *) exit 1 ;;
        esac
      done <<< "$changes"
      test "$implementation" = true
  - name: exact current branch is published once
    run: >-
      test "$(wc -l <.fixture-state/pull-requests | tr -d ' ')" -eq 1 && test
      "$(cut -f1 .fixture-state/pull-requests)" = "$(cat .fixture-state/branch-invocations)" && test
      "$(cut -f2 .fixture-state/pull-requests)" =
      https://example.invalid/pull/42 && test "$(git
      --git-dir=.fixture-state/remote.git rev-parse
      "refs/heads/$(cat .fixture-state/branch-invocations)")" = "$(git rev-parse HEAD)"
  - name: readiness and authoritative ticket capabilities were used
    run: >-
      test "$(wc -l <.fixture-state/readiness-invocations | tr -d ' ')" -ge 1 &&
      test "$(wc -l <.fixture-state/read-ticket-invocations | tr -d ' ')" -ge 1
  - name: feedback fixture verifies product state before authorization
    run: test -s .fixture-state/feedback-product-unchanged && test "$(cat
      .fixture-state/feedback-product-unchanged)" = "$(printf
      'discover\nacknowledge')"
  - name: required CI was observed for the final commit
    run: |
      expected=$(git rev-parse HEAD)
      grep -Fx "$(printf '%s\t%s' "$expected" success)" .fixture-state/ci-observations
output_checks:
  - name: completion identifies the one pull request
    expect_regex: "https://example\\.invalid/pull/42"
semantic_output_checks:
  - name: completed delivery is reported
    proposition: >-
      The response unambiguously reports that the ticket implementation and
      pull-request publication are finished. It does not present delivery as
      blocked, incomplete, or still requiring action before publication.
transcript_checks:
  - name: observable plaintext feedback is not rewritten
    not_regex: '"type":"darrow.codex_native_feedback"[^\n]*"message_representation":"plaintext"[^\n]*"message_matches_expected":false'
  - name: user answer resumes the same native thread
    expect_regex: '"type":"darrow\.eval\.follow_up_turn"'
native_goal: required
