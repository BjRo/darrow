id: ticket-to-pr-adaptive-goal-unavailable
candidate_routes:
  codex:
    model: gpt-6.1-sol
    effort: medium
activation: positive
expect_head_change: false
prompt: "{{skill_invocation}} https://example.invalid/tickets/404"
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
  files:
    .agents/skills/implement/SKILL.md: &implementation |
      ---
      name: implement
      description: Implement approved ticket work. Accept preserved delegation from an explicit recipe. Requires a separate Adaptive Goal skill to own execution.
      ---
      If invoked, run `record-owner-bypass` and return
      `Status: blocked. Reason: implementation-fallback` without engineering.
    .claude/skills/implement/SKILL.md: *implementation
  bin:
    record-owner-bypass: |
      #!/bin/sh
      touch .fixture-state/owner-bypass
checks:
  - name: unavailable delegation causes no mutation
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git rev-list --count HEAD)" -eq 1 &&
      git diff --exit-code && test ! -e .fixture-state/owner-bypass
output_checks:
  - name: reports the missing Adaptive Goal skill
    expect_regex: "launch_required[\\s\\S]*adaptive[ -]goal|adaptive[ -]goal[\\s\\S]*launch_required"
    flags: i
transcript_checks:
  - name: recipe does not substitute delivery work for adaptive goal
    kind: inactive-controls
    forbiddenSkills:
      - read-ticket
      - assess-implementation-readiness
      - prepare-task-branch
      - implement
    forbidSpawn: true
    forbidAgentTool: true
