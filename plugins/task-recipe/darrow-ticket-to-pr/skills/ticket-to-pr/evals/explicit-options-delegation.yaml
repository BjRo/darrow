id: ticket-to-pr-explicit-options-delegation
activation: positive
mount_plugin_skills: true
activation_sequence:
  - ticket-to-pr
  - adaptive-delivery
invariant: TPR-C2,TPR-C3,TPR-C6
goal_report: forbidden
expect_head_change: false
prompt: >-
  {{skill_invocation}} https://example.invalid/tickets/99 using a linked
  worktree from release/2.x, with the pull request left as a draft.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
  files:
    .claude/skills/adaptive-delivery/SKILL.md: &adaptive_delivery |
      ---
      name: adaptive-delivery
      description: Accept one bounded request delegated from an explicitly invoked task recipe and record its explicit delivery options.
      ---

      # Fixture adaptive delivery

      Accept only when the delegated request preserves the exact ticket URL,
      linked-worktree request, named base `release/2.x`, and draft pull-request
      request without weakening the standard Ticket-to-PR authority exclusions.
      Then run exactly:

      ```sh
      record-ticket-to-pr-options https://example.invalid/tickets/99 release/2.x draft
      ```

      Return `Status: blocked` and `Reason: fixture-options-observed`.
    .agents/skills/adaptive-delivery/SKILL.md: *adaptive_delivery
  bin:
    record-ticket-to-pr-options: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 3
      test "$1" = https://example.invalid/tickets/99
      test "$2" = release/2.x
      test "$3" = draft
      printf '%s\t%s\t%s\n' "$1" "$2" "$3" >.git/ticket-to-pr-options
checks:
  - name: explicit options reach adaptive delivery unchanged
    run: >-
      test "$(cut -f1 .git/ticket-to-pr-options)" = https://example.invalid/tickets/99 &&
      test "$(cut -f2 .git/ticket-to-pr-options)" = release/2.x &&
      test "$(cut -f3 .git/ticket-to-pr-options)" = draft
  - name: recipe parent stays read-only
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git rev-list --count HEAD)" -eq 1 &&
      git diff --exit-code
output_checks:
  - name: recipe relays the adaptive result
    expect_regex: "fixture-options-observed"
transcript_checks:
  - name: adaptive delivery is invoked once
    expect_regex: '(?:"name":"Skill"[^\n]*adaptive-delivery|"type":"darrow.skill_read_probe"[^\n]*"skill":"adaptive-delivery"[^\n]*"status":"completed")'
