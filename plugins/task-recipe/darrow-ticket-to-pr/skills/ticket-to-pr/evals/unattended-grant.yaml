id: ticket-to-pr-unattended-grant
candidate_routes:
  codex:
    model: gpt-6.1-sol
    effort: medium
harnesses: [codex]
activation: positive
mount_plugin_skills: true
activation_sequence:
  - ticket-to-pr
  - adaptive-goal
invariant: TPR-C1,TPR-C2,TPR-C3,TPR-C6
goal_report: forbidden
expect_head_change: false
prompt: >-
  {{skill_invocation}} Authorized unattended Artificer entry from a saved human
  recurring grant, not a current-thread human invocation. Grant receipt:
  grant grant-157, grantor maintainer, repository fixture/repo, issue 157,
  delivery delivery-157, activation activation-157, reserved worktree
  /fixture/worktree-157, branch feat/157-existing, effects
  claims,questions,worktrees,recipe,commits,push,pr,archives.
  Deliver https://github.com/fixture/repo/issues/157 under that receipt.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
  files:
    .claude/skills/adaptive-goal/SKILL.md: &adaptive |
      ---
      name: adaptive-goal
      description: Provide adaptive-goal orchestration in the original main thread, owning preflight and one native goal for a bounded recipe-delegated delivery. Preserve the granted authority and reserved target.
      ---

      # Fixture handoff

      Record the complete request you received from the recipe, including its
      receipt and authority exclusions. The recorder is an executable shell
      command on PATH, not a native host function. Run it through the shell,
      replacing the placeholder with the complete request as one quoted argument:

      ```sh
      record-unattended-request '<complete delegated request>'
      ```

      Do not reconstruct missing data from earlier messages. Do not execute
      delivery. Return only `fixture-grant-observed` after the command succeeds.
    .agents/skills/adaptive-goal/SKILL.md: *adaptive
  bin:
    record-unattended-request: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      printf '%s\n' "$1" >.fixture-state/unattended-request
checks:
  - name: recipe remains read-only
    run: test "$(git rev-list --count HEAD)" -eq 1 && git diff --exit-code && test "$(git branch --show-current)" = main
  - name: receipt preserved at the delegation seam
    run: >-
      for value in grant-157 maintainer fixture/repo delivery-157 activation-157
      /fixture/worktree-157 feat/157-existing; do
      grep -F "$value" .fixture-state/unattended-request >/dev/null || exit 1; done
      && awk '{ for (i = 1; i <= NF; i++) {
      value = $i; sub(/^[<(\"]+/, "", value); sub(/[>)\",;.!]+$/, "", value);
      if (value == "https://github.com/fixture/repo/issues/157") found = 1;
      } } END { exit !found }' .fixture-state/unattended-request
semantic_artifact:
  path: .fixture-state/unattended-request
  checks:
    - name: request preserves unattended grant provenance
      proposition: >-
        The delegated request explicitly identifies an unattended entry under
        an existing recurring human grant, rather than claiming a fresh human
        invocation or treating ticket text as authorization. It preserves the
        supplied receipt and reserved worktree/branch as the delivery target.
    - name: request retains the restricted delivery authority
      proposition: >-
        The delegated request excludes merge, deployment, release, ticket
        mutation, destructive Git operations, unrelated changes and generic
        comments from its delivery authority. Ordinary wording such as
        "Limits: no ...", "Exclusions: ..." or "not authorized" may express
        those restrictions; no fixed heading or phrase is required.
semantic_output_checks:
  - name: no unsupported delivery claim
    proposition: >-
      The response relays the fixture result without claiming actual implementation,
      admission, branch creation or publication.
output_checks:
  - name: adaptive result relayed
    expect_regex: fixture-grant-observed
