id: artificer-revoke
activation: positive
invariant: ART-C1,ART-C2,ART-C11
goal_report: forbidden
expect_head_change: false
prompt: >-
  {{skill_invocation}} Revoke the recurring Artificer grant at .fixture-state.
  Do not cancel the outstanding delivery or undo any of its effects.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "fixture\n"
  setup: |
    python3 - <<'PY'
    import json
    from pathlib import Path
    root = Path.cwd().resolve()
    state = root / '.fixture-state'
    state.mkdir(exist_ok=True)
    shared = root / '.git/artificer'
    (shared / 'workers').mkdir(parents=True)
    grant = dict(schema_version=2, host='codex', id='11111111-1111-4111-8111-111111111111',
        repository='fixture/repo', checkout=str(root), common_git=str(root / '.git'),
        grantor='maintainer', executable='/bin/false', gh='/bin/false', git='/usr/bin/git',
        effects='claims,reports,worktrees,recipe,commits,push,pr')
    (state / 'grant.json').write_text(json.dumps(grant))
    (shared / 'repository.json').write_text(json.dumps(dict(repository='fixture/repo', host='codex', WORK_IN_PROGRESS_LIMIT=2)))
    (shared / 'workers' / (grant['id'] + '.json')).write_text(json.dumps(dict(root=str(state), grant=grant['id'])))
    records = [('22222222-2222-4222-8222-222222222222', 157, 'needs-attention')]
    for identifier, issue, status in records:
        directory = shared / 'deliveries' / identifier
        directory.mkdir(parents=True)
        claim = dict(id=identifier, issue=issue, activation='original', grant=grant['id'],
            worktree='/fixture/worktree', branch=f'feat/{issue}-fixture', status=status,
            detail='Cancelled; original ownership retained for recovery.' if status == 'cancelled' else 'Outstanding delivery.', created_at=1)
        (directory / 'claim.json').write_text(json.dumps(claim))
        (root / '.git/original-claim').write_text(json.dumps(claim))
    PY
checks:
  - name: recurring grant disabled
    run: >-
      python3 -c 'import json; assert json.load(open(".fixture-state/grant.json"))["enabled"] is False'
  - name: existing delivery unchanged
    run: cmp .git/original-claim .git/artificer/deliveries/22222222-2222-4222-8222-222222222222/claim.json
  - name: no engineering effects
    run: git diff HEAD --exit-code && test "$(git rev-list --count HEAD)" -eq 1 && test ! -e .fixture-state/archive.key
semantic_output_checks:
  - name: revocation is not cancellation
    proposition: >-
      The response reports successful revocation at the resolved state path and
      explains that future admissions and continuations are disabled. Equivalent
      wording is sufficient; it need not repeat "recurring grant" when the revoke
      operation and target are clear. It does not claim to cancel the existing
      delivery, release its claim, or undo prior effects. Merely quoting a raw
      command return value, such as null, without reporting the outcome and its
      effect on future admissions and continuations is insufficient.
