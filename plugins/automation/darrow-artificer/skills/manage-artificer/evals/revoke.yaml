id: artificer-revoke
activation: positive
invariant: ART-C1,ART-C2,ART-C11
goal_report: forbidden
expect_head_change: false
prompt: >-
  {{skill_invocation}} Revoke the recurring Artificer grant at .fixture-state.
  Do not cancel the outstanding delivery or undo any of its effects.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "fixture\n"
  setup: |
    python3 - <<'PY'
    import json
    from pathlib import Path
    root = Path.cwd().resolve()
    state = root / '.fixture-state'
    state.mkdir()
    grant = dict(id='11111111-1111-4111-8111-111111111111', repository='fixture/repo',
        checkout=str(root), common_git=str(root / '.git'), grantor='maintainer',
        codex='/bin/false', gh='/bin/false', git='/usr/bin/git', model='gpt-5.6-terra',
        effort='medium', credential_home='/fixture/credentials',
        subscription_only_confirmed=True,
        effects='claims,questions,worktrees,recipe,commits,push,pr,archives')
    (state / 'grant.json').write_text(json.dumps(grant))
    binding = root / '.git/artificer'
    binding.mkdir()
    (binding / 'installation.json').write_text(json.dumps(dict(root=str(state), grant=grant['id'])))
    delivery = state / 'deliveries/22222222-2222-4222-8222-222222222222'
    delivery.mkdir(parents=True)
    claim = dict(id=delivery.name, issue=157, activation='original', grant=grant['id'],
        worktree='/fixture/worktree', branch='feat/157-fixture', status='question', created_at=1)
    (delivery / 'claim.json').write_text(json.dumps(claim))
    (root / '.git/original-claim').write_text(json.dumps(claim))
    PY
checks:
  - name: recurring grant disabled
    run: >-
      python3 -c 'import json; assert json.load(open(".fixture-state/grant.json"))["enabled"] is False'
  - name: existing delivery unchanged
    run: cmp .git/original-claim .fixture-state/deliveries/22222222-2222-4222-8222-222222222222/claim.json
  - name: no engineering effects
    run: git diff HEAD --exit-code && test "$(git rev-list --count HEAD)" -eq 1 && test ! -e .fixture-state/archive.key
semantic_output_checks:
  - name: revocation is not cancellation
    proposition: >-
      The response reports the recurring grant revoked at the resolved state path,
      explains that future admissions and continuations are disabled, and does not
      claim to cancel the existing delivery, release its claim, or undo prior effects.
