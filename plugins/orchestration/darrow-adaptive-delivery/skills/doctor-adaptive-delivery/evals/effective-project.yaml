id: doctor-adaptive-delivery-effective-project
invariant: ADL-D1
activation: positive
prompt: >-
  {{skill_invocation}} Diagnose the represented Codex V2 host configuration,
  not this eval runner's own configuration. The current fixture checkout is
  explicitly trusted and is its project root. Its user configuration is
  ./user-config.toml. Check whether the effective configuration supports the
  full Adaptive Delivery path. Diagnose only; do not edit anything.
fixture:
  commits:
    - message: "chore: init"
      files:
        user-config.toml: "[agents]\nenabled = true\n"
        .codex/config.toml: "[agents]\nmax_concurrent_threads_per_session = 5\n"
checks:
  - name: diagnosis is read-only
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: trusted project layer contributes
    proposition: The response reports both the absolute user and project configuration paths as checked and contributing sources, says checkout configuration was used, and concludes that the baseline and full required-assessment paths are supported.
  - name: project precedence is effective
    proposition: The response treats the trusted checkout .codex/config.toml concurrency value of five as an effective project override rather than diagnosing only the user file.
transcript_checks:
  - name: orchestration does not activate
    not_regex: 'adaptive-delivery-preflight|"tool":"spawn_agent"|"name":"Agent"'
