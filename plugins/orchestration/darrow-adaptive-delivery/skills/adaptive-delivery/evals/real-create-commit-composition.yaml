id: goal-real-create-commit-composition
invariant: ADL-C2,ADL-L1,ADL-L2,ADL-L5,ADL-S3
goal_report: forbidden
goal_route_checks: false
expect_head_change: true
additional_plugins:
  - plugins/capability/darrow-git
prompt: >-
  {{skill_invocation}} Add the exact line `Real commit capability composes.`
  beneath the heading in NOTES.md and make no other content change. This
  preserved conversation already contains a ready assessment for this exact
  unchanged request and scope, so do not run readiness again. Acceptance is
  that `bash check.sh` passes. Require independent review of the exact final
  change after checks. Create one Conventional Commit, push the current branch,
  and open exactly one pull request. Bind and invoke every advertised
  intent-matched skill for independent review, commit, and pull-request
  publication. Do not merge, release, deploy, mutate a ticket, force-push, or
  edit unrelated files. If the commit hook reports one concrete remediation
  for NOTES.md, I authorize executing that exact remediation and refreshing
  NOTES.md through the guarded retry.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for changes to NOTES.md. Inside an active native
          goal, host-advertised capabilities are available for independent
          review, one commit, and one pull-request publication.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          git_dir=$(git rev-parse --git-dir)
          printf '%s\n' '# Notes' 'Real commit capability composes.' >"$git_dir/expected-notes"
          cmp -s "$git_dir/expected-notes" NOTES.md
          printf '%s\n' 'check pass' >>"$git_dir/fixture-state/composition-events"
  files:
    .agents/skills/independent-code-review/SKILL.md: |
      ---
      name: independent-code-review
      description: Independently review one exact current change and report its findings and outcome. Use when an explicit goal contract requires independent review before commit or publication. Remain read-only.
      ---

      # Independently review the current change

      Run exactly `independent-review-protocol` after implementation and final
      checks. Return its complete output.
  bin:
    independent-review-protocol: |
      #!/usr/bin/env bash
      set -eu
      git_dir=$(git rev-parse --git-dir)
      head=$(git rev-parse HEAD)
      notes_digest=$(shasum -a 256 NOTES.md)
      notes_digest=${notes_digest%% *}
      target="WORKTREE@$head+$notes_digest"
      printf 'review\t%s\n' "$target" >>"$git_dir/fixture-state/composition-events"
      printf '%s\n' 'Independent review outcome: no blocking findings'
      printf 'Reviewed target: %s\n' "$target"
    gh: |
      #!/usr/bin/env bash
      set -eu
      git_dir=$(git rev-parse --git-dir)
      printf '%s\n' "$*" >>"$git_dir/fixture-state/forge-calls"
      case "$1 $2" in
        "pr list")
          if test -s "$git_dir/fixture-state/pull-requests"; then
            branch=$(cut -f1 "$git_dir/fixture-state/pull-requests")
            url=$(cut -f2 "$git_dir/fixture-state/pull-requests")
            base=$(cut -f3 "$git_dir/fixture-state/pull-requests")
            head=$(cut -f4 "$git_dir/fixture-state/pull-requests")
            printf '1\t%s\tOPEN\t%s\t%s\t%s\tfalse\tfalse\n' "$url" "$branch" "$head" "$base"
          fi
          exit 0
          ;;
        "pr create")
          shift 2
          title=
          body=
          base=
          branch=
          draft=false
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --title) title=$2; shift 2 ;;
              --body) body=$2; shift 2 ;;
              --base) base=$2; shift 2 ;;
              --head) branch=$2; shift 2 ;;
              --draft) draft=true; shift ;;
              *) shift ;;
            esac
          done
          test -n "$title"
          test -n "$body"
          test -n "$base"
          test -n "$branch"
          test "$draft" = false
          head=$(git rev-parse HEAD)
          remote_head=$(git --git-dir="$git_dir/fixture-remote.git" rev-parse "refs/heads/$branch")
          test "$remote_head" = "$head"
          printf 'publication\t%s\t%s\n' "$branch" "$head" >>"$git_dir/fixture-state/composition-events"
          printf '%s\t%s\t%s\t%s\n' "$branch" 'https://example.invalid/pull/1' "$base" "$head" >>"$git_dir/fixture-state/pull-requests"
          printf '%s\n' 'https://example.invalid/pull/1'
          ;;
        "repo view")
          printf '%s\n' 'fixture/repository'
          ;;
        *)
          printf 'mock gh: unsupported: %s\n' "$*" >&2
          exit 1
          ;;
      esac
  hooks:
    pre-commit: |
      #!/bin/sh
      set -eu
      git_dir=$(git rev-parse --git-dir)
      marker="$git_dir/fixture-state/commit-hook-attempted"
      if test ! -e "$marker"; then
        : >"$marker"
        printf '%s\n' "run: grep -Fx 'Real commit capability composes.' NOTES.md >/dev/null" >&2
        exit 1
      fi
  setup: |
    printf '%s\n' '/.agents/' >>.git/info/exclude
    git init --bare .git/fixture-remote.git >/dev/null
    git --git-dir=.git/fixture-remote.git symbolic-ref HEAD refs/heads/main
    git remote add origin "$PWD/.git/fixture-remote.git"
    git push -u origin main >/dev/null
    git remote set-head origin main
    git switch -c fix/real-create-commit-composition >/dev/null
checks:
  - name: requested behavior is implemented
    run: bash check.sh
  - name: review clears the final uncommitted candidate before commit
    run: >-
      test "$(grep -c '^review' .git/fixture-state/composition-events)" -eq 1 &&
      review_target=$(awk -F '\t' '$1 == "review" { print $2 }' .git/fixture-state/composition-events) &&
      review_base=$(git rev-parse HEAD^) &&
      review_digest=$(git show HEAD:NOTES.md | shasum -a 256) &&
      review_digest=${review_digest%% *} &&
      test "$review_target" = "WORKTREE@$review_base+$review_digest"
  - name: one valid intended commit exists
    run: >-
      test "$(git rev-list --count HEAD)" -eq 2 &&
      git log -1 --format=%s | grep -E '^(feat|fix|docs|refactor|test|build|ci|chore)(\([^)]+\))?!?: .+' >/dev/null &&
      test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = NOTES.md
  - name: real create-commit helper owns the commit boundary
    run: >-
      test -s .git/darrow-create-commit-hook-failure &&
      awk -F '\t' '$1 == "format" && $2 == "darrow-create-commit-hook-failure-v1" { found = 1 } END { exit !found }' .git/darrow-create-commit-hook-failure &&
      grep -Fx "run: grep -Fx 'Real commit capability composes.' NOTES.md >/dev/null" .git/darrow-create-commit-hook-failure >/dev/null
  - name: one pull request publishes the exact committed branch
    run: >-
      test "$(wc -l <.git/fixture-state/pull-requests | tr -d ' ')" -eq 1 &&
      branch=$(git branch --show-current) &&
      test "$(cut -f1 .git/fixture-state/pull-requests)" = "$branch" &&
      test "$(cut -f2 .git/fixture-state/pull-requests)" = 'https://example.invalid/pull/1' &&
      test "$(cut -f3 .git/fixture-state/pull-requests)" = main &&
      test "$(cut -f4 .git/fixture-state/pull-requests)" = "$(git rev-parse HEAD)" &&
      test "$(git --git-dir=.git/fixture-remote.git rev-parse "refs/heads/$branch")" = "$(git rev-parse HEAD)"
  - name: publication verification observes the published commit
    run: >-
      grep -F 'repo view ' .git/fixture-state/forge-calls >/dev/null &&
      grep -F 'pr list --repo ' .git/fixture-state/forge-calls >/dev/null
  - name: checks and review precede publication
    run: >-
      awk -F '\t' '
        $1 == "check pass" && !check { check = NR }
        $1 == "review" { review = NR }
        $1 == "publication" { publication = NR }
        END { exit !(check && review && publication && check < review && review < publication) }
      ' .git/fixture-state/composition-events
  - name: published tree is clean
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: owner reports completion
    proposition: The response reports the requested outcome as complete, including successful checks, independent review, one commit, and one pull request, with no unresolved blocker.
transcript_checks:
  - name: one separate native owner is accepted
    expect_regex: '"type":"darrow.codex_native_single_agent_accepted"'
  - name: no lifecycle ledger or nested goal is used
    not_regex: 'adaptive-delivery-preflight step|Protocol ledger|"tool":"create_goal"'
