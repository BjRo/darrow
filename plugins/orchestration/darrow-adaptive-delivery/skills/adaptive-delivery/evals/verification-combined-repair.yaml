id: goal-verification-combined-repair
invariant: ADL-V1,ADL-A4,ADL-L1,ADL-L2,ADL-L5,LC-C5
goal_report: forbidden
goal_route_checks: false
prompt: >-
  Use {{skill_invocation}} to continue the existing candidate. Run bash check.sh and
  obtain its initial assessment before changing src/config.js. Select independent
  review and the compatible QA-like cache assessment through the advertised
  verification capability. The originating criteria are TIMEOUT_MS = 2500,
  RETRY_COUNT = 3, and CACHE_SIZE = 5. Repair is authorized only in src/config.js.
  Complete this local change when its selected assurance clears. No commits,
  publication, additional owner or new product behavior is authorized.
fixture:
  commits:
    - message: "chore: baseline"
      files:
        AGENTS.md: |
          Run bash check.sh before selected assessment. Keep scripts unchanged.
          The bounded assess-candidate fixture supports both selected providers.
        src/config.js: |
          export const TIMEOUT_MS = 1000;
          export const RETRY_COUNT = 3;
          export const CACHE_SIZE = 5;
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'export const TIMEOUT_MS = 2500;' src/config.js >/dev/null
          cksum <src/config.js >.git/fixture-state/check-target
  files:
    src/config.js: |
      export const TIMEOUT_MS = 2500;
      export const RETRY_COUNT = 0;
      export const CACHE_SIZE = 0;
  setup: |
    uv run --quiet --frozen --no-dev --project "{{case_dir}}/../../../backend" adaptive-delivery-fixture install verification "$PWD" "{{case_dir}}/fixtures" both
    printf '%s\n' 'RETRY_COUNT = 0' >.git/fixture-review-reject-pattern
    printf '%s\n' 'src/config.js' >.git/fixture-review-event-path
checks:
  - name: both provider blockers are repaired together
    run: |
      printf '%s\n' 'export const TIMEOUT_MS = 2500;' 'export const RETRY_COUNT = 3;' 'export const CACHE_SIZE = 5;' >.git/expected-config
      cmp .git/expected-config src/config.js
      test "$(cut -f1 .git/fixture-state/verification-invocations | tr '\n' ' ')" = 'initial follow-up '
      test "$(cut -f3 .git/fixture-state/verification-invocations | tr '\n' ' ')" = 'progress clear '
  - name: later selected result returns before one combined repair
    run: |
      awk -F '\t' '
        $1 == "assessment-start" { start=$3; active=1; review=0; qa=0 }
        $1 == "review-returned" && active && $3 == start { review=1 }
        $1 == "qa-returned" && review && $3 == start { qa=1 }
        $1 == "assessment-returned" && qa && $3 == start { complete++; active=0 }
        END { exit complete == 2 && !active ? 0 : 1 }
      ' .git/fixture-state/verification-events
      test "$(tail -n 1 .git/fixture-state/verification-invocations | cut -f2)" = "$(cksum <src/config.js)"
  - name: shared assessment stays local
    run: test "$(git rev-list --count HEAD)" -eq 1
semantic_output_checks:
  - name: completion preserves the combined conclusion
    proposition: The response reports completion after repairing the retry-count and cache-size blockers, with clear independent review and QA-like assessment of the repaired candidate. It accounts for all three originating criteria. The fixture establishes the attempt count; the response need not repeat that count explicitly.
  - name: no provider-specific repair allowance is claimed
    proposition: The response does not claim a budget reset when switching providers, extra repair attempts from another provider, or separate review and QA repair allowances. Any such claim fails this check even if it also claims successful completion. Omitting the attempt count is allowed.
transcript_checks:
  - name: same accepted owner performs the work
    expect_regex: '"type":"(?:darrow\.codex_native_single_agent_accepted|darrow\.goal_agent_completion)"'
  - name: no lifecycle ledger or nested goal
    not_regex: 'adaptive-delivery-preflight step|"tool":"create_goal"'
