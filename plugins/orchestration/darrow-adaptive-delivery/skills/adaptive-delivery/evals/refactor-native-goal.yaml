id: goal-preflight-refactor-native-goal
invariant: ADL-C1,ADL-R1,ADL-L1,ADL-L5
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Refactor src/label.js by extracting the trim-and-lower
  operation into a private normalizeLabel(value) helper and have formatLabel
  call it. Preserve every observable result and export exactly the same public
  API. Add a focused preservation case and run bash test.sh. Keep the result
  local.
fixture:
  commits:
    - message: "chore: init"
      files:
        package.json: '{"type":"module"}'
        src/label.js: |
          export const formatLabel = (value) => value.trim().toLowerCase();
        test/label.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { formatLabel } from "../src/label.js";
          test("formats a label", () => assert.equal(formatLabel(" Ready "), "ready"));
        test.sh: |
          #!/usr/bin/env bash
          node --test test/label.test.js
checks:
  - name: observable behavior and public API are preserved
    run: >-
      node --input-type=module -e
      "import('./src/label.js').then((module) => {
      if (Object.keys(module).join(',') !== 'formatLabel' ||
      module.formatLabel(' Mixed CASE ') !== 'mixed case') process.exit(1) })"
  - name: requested internal structure and preservation evidence exist
    run: >-
      grep -F 'normalizeLabel' src/label.js >/dev/null &&
      test "$(grep -Ec '^[[:space:]]*test[(]' test/label.test.js)" -ge 2 &&
      bash test.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
transcript_checks:
  - name: one separate native refactor owner is accepted
    expect_regex: '"type":"(?:darrow\.codex_native_single_agent_accepted|darrow\.goal_agent_completion)"'
  - name: no lifecycle ledger or nested goal is used
    not_regex: 'adaptive-delivery-preflight step|Protocol ledger|"tool":"create_goal"'
semantic_output_checks:
  - name: owner reports completion
    proposition: The response reports the requested outcome as complete, with no unresolved blocker or pending decision preventing completion.
