id: goal-ticket-branch-ambiguity
invariant: ADL-B1,ADL-S1,ADL-P2
activation: positive
mount_plugin_skills: true
goal_report: forbidden
goal_route_checks: false
expect_head_change: false
additional_plugins:
  - plugins/capability/darrow-git
prompt: >-
  {{skill_invocation}} Deliver this already-assessed ready request for canonical
  ticket token DAR-123: append `Resumed.` to NOTES.md after preparing its task
  branch. The scope and acceptance are unchanged. I suggest
  feat/DAR-123-new-suffix. Do not commit or publish.
fixture:
  commits:
    - message: "chore: init"
      files:
        NOTES.md: "# Notes\n"
  setup: |
    git branch fix/DAR-123-original
    git branch feat/DAR-123-other
checks:
  - name: no mutation occurs
    run: test "$(git status --porcelain)" = '' && test "$(git branch --show-current)" = main
  - name: no new branch exists
    run: git for-each-ref refs/heads --format='%(refname)' | wc -l | tr -d ' '
    expect_exact: "3"
semantic_output_checks:
  - name: asks for explicit selection among existing matches
    proposition: The response asks the user to choose exactly one of fix/DAR-123-original and feat/DAR-123-other before delivery proceeds, without treating the proposed new suffix as a selection or claiming implementation occurred.
activation_sequence:
  - adaptive-delivery
  - prepare-task-branch
