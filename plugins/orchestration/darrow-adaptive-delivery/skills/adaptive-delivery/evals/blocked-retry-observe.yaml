id: goal-blocked-retry-observes-publication
invariant: ADL-S2,ADL-E1,SE-C14,SE-C15
goal_report: forbidden
goal_route_checks: false
prompt: >-
  Use {{skill_invocation}} to decide the next lifecycle action only. The retained
  owner in this same thread is blocked because pull-request creation returned
  an ambiguous result, and the current forge state has not yet been observed.
  The user says "retry" without qualification. What is the retained owner's
  immediate next action? Answer in one sentence.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
checks: []
semantic_output_checks:
  - name: observes current publication state
    proposition: The response says the ambiguous publication result must be resolved by observing the current remote or pull-request state.
  - name: does not repeat the effect before observation
    proposition: The response says another publication attempt must not occur before that observation.
transcript_checks:
  - name: advice-only invocation launches no owner or helper
    not_regex: '"tool":"spawn_agent"|"type":"(?:darrow\.codex_native_spawn|darrow\.codex_native_single_agent_accepted|darrow\.goal_agent_completion)"|"name":"Agent"|adaptive-delivery-preflight (?:prepare|route|step)'
