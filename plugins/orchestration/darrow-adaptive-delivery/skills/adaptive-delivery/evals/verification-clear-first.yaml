id: goal-verification-clear-first
invariant: ADL-V1,ADL-A4,LC-C5
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Advice only; do not launch or perform work.
  The initial verification result combines clear independent review and clear selected QA, successful required checks on current content and sufficient evidence for every material criterion. No blocker remains. No owner repair has been attempted. What should happen next?
fixture:
  commits:
    - message: "chore: baseline"
      files:
        NOTES.md: "preserved\n"
checks:
  - name: advice leaves repository unchanged
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: combined evidence controls continuation
    proposition: The response accepts initial combined verification as clear and proceeds toward completion without a repair attempt. It does not require consuming the unused repair budget or grant new publication authority.
