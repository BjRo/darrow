id: goal-budgeted-repair-default-regression
invariant: ADL-A4,ADL-S3
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Advice only; do not launch or perform work.
  No user or repository repair limit was supplied. The owner used one repair attempt. Fix verification resolved every original blocker but identified a new blocking regression directly caused by that repair, with concrete causal evidence. Repairing that regression is within scope and authority. What should the owner do next?
fixture:
  commits:
    - message: "chore: init"
      files:
        NOTES.md: "preserved\n"
checks:
  - name: advice leaves repository unchanged
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: owner respects the repair continuation boundary
    proposition: The response permits exactly one remaining repair attempt on the direct repair-caused regression, followed by fix verification, and requires a clear result for completion. It does not authorize a third attempt under the default budget. It need not restate unasked publication restrictions or every verification prerequisite.
transcript_checks:
  - name: advice launches no agent
    not_regex: '"tool":"spawn_agent"|"type":"darrow.codex_native_spawn"|"type":"darrow.goal_agent_completion"'
