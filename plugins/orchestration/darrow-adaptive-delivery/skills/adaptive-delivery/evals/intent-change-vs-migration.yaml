id: goal-preflight-intent-change-vs-migration
invariant: ADL-C1,ADL-C2,ADL-L2,ADL-L5,ADL-S3
goal_report: forbidden
goal_route_checks: false
additional_plugins:
  - plugins/capability/darrow-verification
prompt: >-
  {{skill_invocation}} Migrate the persisted service configuration from v1 `{url}` to
  v2 `{endpoint}`. The writer must emit
  only v2, the reader must accept v1 and v2 during rollout, migrateConfig must
  convert stored v1 records, and both consumers must continue to work. This is
  an approved behavior change, but consumers and persisted formats require a
  sequenced coexistence transition. Add focused evidence and run bash test.sh.
  Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash test.sh` for persisted configuration changes.
        config.js: |
          export const writeConfig = (url) => JSON.stringify({ url });
          export const readConfig = (text) => JSON.parse(text).url;
        migrate.js: |
          export const migrateConfig = (record) => record;
        consumer-a.js: |
          import { readConfig } from "./config.js";
          export const connectTarget = (text) => readConfig(text);
        consumer-b.js: |
          import { readConfig } from "./config.js";
          export const healthTarget = (text) => readConfig(text);
        config.test.js: |
          import assert from "node:assert/strict";
          import { readConfig, writeConfig } from "./config.js";

          assert.deepEqual(JSON.parse(writeConfig("https://service.test")), {
            url: "https://service.test",
          });
          assert.equal(readConfig('{"url":"https://old.test"}'), "https://old.test");
        package.json: '{"type":"module"}'
        test.sh: |
          #!/usr/bin/env bash
          set -eu
          node config.test.js
          review_target=$(.agents/bin/independent-review-fixture "$PWD" fingerprint)
          printf 'check\t%s\n' "$review_target" >>.git/fixture-state/independent-review-events
  setup: >-
    bash "{{case_dir}}/fixtures/install-independent-review.sh" "$PWD"
    "{{case_dir}}/fixtures" codex
checks:
  - name: sequenced persisted-format transition works
    run: >-
      node --input-type=module -e
      "Promise.all([import('./config.js'), import('./migrate.js'),
      import('./consumer-a.js'), import('./consumer-b.js')]).then(([config,
      migration, a, b]) => { const endpoint = 'https://service.test';
      const written = JSON.parse(config.writeConfig(endpoint));
      if (written.endpoint !== endpoint || 'url' in written) process.exit(1);
      if (config.readConfig(JSON.stringify({url:endpoint})) !== endpoint ||
      config.readConfig(JSON.stringify({endpoint})) !== endpoint) process.exit(1);
      const migrated = migration.migrateConfig({url:endpoint});
      if (migrated.endpoint !== endpoint || 'url' in migrated) process.exit(1);
      if (a.connectTarget(JSON.stringify({url:endpoint})) !== endpoint ||
      b.healthTarget(JSON.stringify({endpoint})) !== endpoint) process.exit(1) })"
  - name: focused tests pass
    run: bash test.sh
  - name: migration compatibility receives one independent review
    run: test "$(wc -l <.git/fixture-state/independent-review-invocations | tr -d ' ')" -eq 1
  - name: independent review covers the migrated final target
    run: >-
      test "$(cut -f1 .git/fixture-state/independent-review-invocations)" =
      "$(.agents/bin/independent-review-fixture "$PWD" fingerprint)"
  - name: independent review starts after a matching current check
    run: >-
      awk -F '\t' '$1 == "check" { checked[$2]=1 }
      $1 == "review_start" && checked[$2] { ok=1 }
      END { exit ok ? 0 : 1 }' .git/fixture-state/independent-review-events
  - name: independent review reports a clear comprehensive outcome
    run: >-
      awk -F '\t' 'NF == 3 && $2 == "clear" && $3 == "comprehensive" { ok=1 }
      END { exit ok ? 0 : 1 }' .git/fixture-state/independent-review-invocations
output_checks:
  - name: no lifecycle protocol is reported
    not_regex: "darrow-native-goal-report|Protocol ledger|route_verified"
semantic_output_checks:
  - name: sequenced transition is classified as migration
    proposition: The response reports the requested outcome as complete, with no unresolved blocker or pending decision preventing completion.
  - name: completion reports the semantic review outcome
    proposition: The response says an independent review of the completed change found no blocking findings.
transcript_checks:
  - name: one native migration owner is accepted
    expect_regex: '"type":"(?:darrow\.codex_native_single_agent_accepted|darrow\.goal_agent_completion)"'
  - name: no lifecycle ledger or nested goal is used
    not_regex: 'adaptive-delivery-preflight step|Protocol ledger|"tool":"create_goal"'
