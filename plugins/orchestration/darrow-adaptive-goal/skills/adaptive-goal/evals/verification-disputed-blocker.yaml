id: goal-verification-disputed-blocker
prompt: >-
  {{skill_invocation}} Advice only. A completed fix verification still reports
  a blocking caller regression on the current candidate. Since then, the goal owner ran a targeted
  check on the same commit using the exact caller and input from the finding.
  The check passed and its output contradicts the reported failure. One
  implementation repair attempt remains. What should the owner do next?
fixture:
  commits:
    - message: "chore: baseline"
      files:
        NOTES.md: "preserved\n"
checks:
  - name: advice leaves repository unchanged
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: independently reassess the blocker before assigning repair
    proposition: >-
      Given concrete new evidence contradicting a blocker on the unchanged
      candidate, the response directs the owner to submit the evidence to the
      same review provider for fresh independent assessment before assigning a
      repair or treating the blocker as cleared. Repeating comprehensive review,
      spending an implementation repair attempt on reassessment, or unilaterally
      clearing the blocker fails.
native_goal: forbidden
