id: goal-preflight-verification-cadence
invariant: ADL-P4,ADL-L5,ADL-S3
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Add an exported isEven(value) function to src/math.js. Acceptance
  is that it returns true exactly for even integer inputs, focused evidence covers zero,
  a negative even integer, and an odd integer, and bash final.sh passes. Run the required
  repository checks, bash focused.sh and bash final.sh. Select and
  apply the policy route rather than pinning it. Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          For JavaScript behavior changes, use `bash focused.sh` for feedback
          while iterating and run `bash final.sh` against the final tree.
        package.json: '{"type":"module"}'
        src/math.js: |
          export const identity = (value) => value;
        test/math.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity } from "../src/math.js";

          test("identity", () => assert.equal(identity(-2), -2));
        focused.sh: |
          #!/usr/bin/env bash
          trace=.fixture-state/verification-trace
          status=fail
          if node --test test/math.test.js; then status=pass; fi
          printf 'focused\t%s\n' "$status" >>"$trace"
          [ "$status" = pass ]
        final.sh: |
          #!/usr/bin/env bash
          trace=.fixture-state/verification-trace
          status=fail
          if node --test; then status=pass; fi
          printf 'final\t%s\n' "$status" >>"$trace"
          [ "$status" = pass ]
  setup: |
    set -eu
    mkdir -p .git/eval-checks
    cp "{{case_dir}}/fixtures/is-even-test-evidence.sh" .git/eval-checks/is-even-test-evidence.sh
    cp "{{case_dir}}/../../../backend/tests/evals/verification_cadence.py" .git/eval-checks/
checks:
  - name: behavior is implemented
    run: >-
      node --input-type=module -e "import('./src/math.js').then(({isEven}) => { if
      (!isEven(0) || !isEven(-4) || isEven(3)) process.exit(1) })"
  - name: focused evidence is durable
    run: bash .git/eval-checks/is-even-test-evidence.sh
  - name: feedback precedes final-tree verification
    run: python3 .git/eval-checks/verification_cadence.py .fixture-state/verification-trace
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: final verification command is reported
    expect_regex: "final\\.sh"
  - name: no lifecycle protocol is reported
    not_regex: "darrow-native-goal-report|Protocol ledger|route_verified"
semantic_output_checks:
  - name: owner reports complete focused and final verification
    proposition:
      The response reports the requested outcome as complete, with no unresolved
      blocker or pending decision preventing completion.
  - name: focused verification is reported successful
    proposition:
      The response reports successful completed focused verification, whether it
      names focused.sh or identifies the focused check in ordinary prose. This fixture
      has only one focused command. Merely planning a check, reporting only a failed red
      check, or reporting only final verification fails.
  - name: final verification is reported successful
    proposition:
      In this case final.sh is the final verification command. The response
      reports that this command completed successfully, rather than merely advising or
      planning to run it. It need not repeat the label 'final verification' alongside
      the command name.
transcript_checks:
  - name: no lifecycle ledger is used
    not_regex: adaptive-goal-preflight step|Protocol ledger
native_goal: required
