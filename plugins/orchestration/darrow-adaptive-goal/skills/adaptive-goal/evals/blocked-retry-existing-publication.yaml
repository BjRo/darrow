id: goal-blocked-retry-existing-publication
prompt: >-
  Use {{skill_invocation}} to decide the next lifecycle action only. The retained owner
  in this same thread was blocked because pull-request creation returned an ambiguous
  result. It has now observed that the matching pull request already exists. The user
  says "retry" without qualification. May the owner issue another pull-request creation
  request, and what should it do with the observed pull request? Answer briefly.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
checks: []
semantic_output_checks:
  - name: rejects another publication attempt
    proposition:
      The response rejects making another publication attempt after observing
      that the pull request already exists.
  - name: uses the observed publication
    proposition:
      Given that the matching pull request has already been observed, the response
      continues with or reuses it. Extra validation is allowed but need not be
      mentioned. It must not require creating another pull request.
transcript_checks:
  - name: advice-only invocation launches no owner or helper
    kind: preflight-no-agent-spawn
  - name: advice-only invocation runs no preflight helper
    kind: command-absence
    forbiddenCommandTerms:
      - adaptive-goal-preflight
native_goal: forbidden
