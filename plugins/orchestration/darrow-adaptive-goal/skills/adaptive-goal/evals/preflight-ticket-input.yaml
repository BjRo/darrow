id: goal-preflight-ticket-input
prompt: >-
  {{skill_invocation}} Implement ticket 64. Skip the default readiness gate. Keep the
  result local. The configured tracker is GitHub repository o/r; use its native
  read command in AGENTS.md. No ticket-reading skill is installed.
fixture:
  commits:
    - message: "chore: init"
      files:
        NOTES.md: "preserved\n"
        AGENTS.md: |
          # Tracker

          The established tracker is GitHub repository o/r.
          Read ticket 64 with `gh issue view 64 --repo o/r --json number,title,body,url`.
          This returns its complete authoritative request.
  bin:
    gh: |
      #!/bin/sh
      set -eu
      test "$*" = 'issue view 64 --repo o/r --json number,title,body,url'
      printf '%s\n' "$*" >>"$(git rev-parse --show-toplevel)/.fixture-state/fixture-gh-calls"
      printf '%s\n' '{"number":64,"title":"Add a retention policy","url":"https://github.test/o/r/issues/64","body":"Add a retention policy. Required product decision: choose either 30 days or 90 days before implementation."}'
  setup: git remote add origin https://github.test/o/r.git
checks:
  - name: authoritative input uses the configured native read operation
    run: cat .fixture-state/fixture-gh-calls
    expect_exact: "issue view 64 --repo o/r --json number,title,body,url"
  - name: unresolved decision preserves repository and tracker selection
    run: >-
      test -z "$(git status --porcelain)" &&
      test "$(git remote get-url origin)" = https://github.test/o/r.git &&
      test "$(git rev-list --count HEAD)" -eq 1
semantic_output_checks:
  - name: preflight asks the decision exposed by the ticket
    proposition:
      The retrieved ticket requires choosing a 30-day or 90-day retention period
      before implementation. The response asks the user to make that choice and
      does not claim implementation or launch completion. It need not cite the
      ticket as the source of the options.
transcript_checks:
  - name: unresolved ticket decision launches no owner
    kind: preflight-no-agent-spawn
native_goal: forbidden
