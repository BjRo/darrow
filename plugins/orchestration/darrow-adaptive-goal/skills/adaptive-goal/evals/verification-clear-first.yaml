id: goal-verification-clear-first
prompt: >-
  {{skill_invocation}} Advice only; do not launch or perform work. The initial
  verification result combines clear independent review and clear selected QA,
  successful required checks on current content and sufficient evidence for every
  material criterion. No blocker remains. No owner repair has been attempted. What
  should happen next?
fixture:
  commits:
    - message: "chore: baseline"
      files:
        NOTES.md: "preserved\n"
checks:
  - name: advice leaves repository unchanged
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: combined evidence controls continuation
    proposition: >-
      The response accepts the initial combined verification as clear and stops
      repairs. It neither requires consuming unused repair budget nor grants new
      publication authority. An explicit completion instruction is unnecessary.
native_goal: forbidden
