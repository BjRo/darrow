id: goal-verification-stale-evidence
prompt: >-
  {{skill_invocation}} Advice only; do not launch or perform work. Review and QA are
  selected through their public workflows. Review and required checks are clear
  for current content. QA's clear result predates the last repair. No new code
  defect is reported. One shared repair attempt remains. What should the retained
  owner do next?
fixture:
  commits:
    - message: "chore: baseline"
      files:
        NOTES.md: "preserved\n"
checks:
  - name: advice leaves repository unchanged
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: combined evidence controls continuation
    proposition: >-
      Context: review and required checks cover current content; QA's clear result
      predates the last repair; no new code defect is reported; one shared attempt
      remains. The response calls for current QA first. Reject recommendations for
      code repair before fresh QA, spending an implementation attempt just to
      refresh QA, or completing/publishing using stale QA. Future repair under
      existing repair rules is allowed. Grade proposed actions. Concise advice
      such as "obtain current QA first" is sufficient. Repeating scenario facts,
      the budget, unchanged content, hypothetical branches or a publication
      disclaimer is not required.
native_goal: forbidden
