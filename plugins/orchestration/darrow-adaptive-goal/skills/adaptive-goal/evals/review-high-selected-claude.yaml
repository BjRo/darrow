id: goal-review-high-selected-claude
invariant: ADL-C1,ADL-C2,ADL-R2,ADL-L1,ADL-L2,ADL-L5,ADL-X1
goal_report: forbidden
goal_route_checks: false
additional_plugins:
  - plugins/capability/darrow-verification
prompt: >-
  /goal Use {{skill_invocation}} to change the exported sessionCookieOptions in auth-config.js so
  sameSite is exactly "strict" instead of "lax". This security boundary has high
  consequence risk, but the implementation is clear, localized and fully specified.
  Preserve the other options, add focused evidence and run bash test.sh. Select the
  implementation policy route, retain the native goal in this main thread and delegate
  bounded implementation and selected verification. Use the advertised
  independent-review capability through verification. Keep the result local; no commits
  or publication are authorized.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run bash test.sh for authentication configuration changes.
        auth-config.js: |
          export const sessionCookieOptions = Object.freeze({
            httpOnly: true,
            secure: true,
            sameSite: "lax",
          });
        auth-config.test.js: |
          import assert from "node:assert/strict";
          import { sessionCookieOptions } from "./auth-config.js";

          assert.equal(sessionCookieOptions.httpOnly, true);
          assert.equal(sessionCookieOptions.secure, true);
          assert.equal(sessionCookieOptions.sameSite, "lax");
        package.json: '{"type":"module"}'
        test.sh: |
          #!/usr/bin/env bash
          set -eu
          node auth-config.test.js
          review_target=$(uv run --quiet --no-project .claude/backend/scripts/run_locked.py adaptive-goal-fixture review "$PWD" fingerprint)
          printf 'check\t%s\n' "$review_target" >>.git/fixture-state/independent-review-events
  setup: >-
    uv run --quiet --frozen --no-dev --project "{{case_dir}}/../../../backend"
    adaptive-goal-fixture install review "$PWD" "{{case_dir}}/fixtures" claude
checks:
  - name: cookie behavior is changed and preserved
    run: >-
      node --input-type=module -e
      "import('./auth-config.js').then(({sessionCookieOptions}) => { if
      (sessionCookieOptions.sameSite !== 'strict' || sessionCookieOptions.httpOnly !==
      true || sessionCookieOptions.secure !== true) process.exit(1) })"
  - name: focused evidence covers the strict value
    run: grep -F '"strict"' auth-config.test.js >/dev/null && bash test.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
  - name: high risk invokes one matching independent review
    run:
      test "$(wc -l <.git/fixture-state/independent-review-invocations | tr -d ' ')" -eq
      1
  - name: review token exists only in the advertised skill instruction
    run: >-
      grep -F 'independent-review-skill-contract-v1'
      .claude/skills/independent-code-review/SKILL.md >/dev/null && ! grep -RF
      'independent-review-skill-contract-v1' .claude/backend >/dev/null
  - name: independent review clears the final changed target
    run: >-
      test "$(cut -f1 .git/fixture-state/independent-review-invocations)" = "$(uv run
      --quiet --no-project .claude/backend/scripts/run_locked.py
      adaptive-goal-fixture review "$PWD" fingerprint)" && awk -F '\t' '$1 ==
      "check" { checked[$2]=1 } $1 == "review_start" && checked[$2] { ok=1 } END { exit
      ok ? 0 : 1 }' .git/fixture-state/independent-review-events && awk -F '\t' 'NF == 3
      && $2 == "clear" && $3 == "comprehensive" { ok=1 } END { exit ok ? 0 : 1 }'
      .git/fixture-state/independent-review-invocations
semantic_output_checks:
  - name: owner reports completion
    proposition:
      The response reports the requested outcome as complete, with no unresolved
      blocker or pending decision preventing completion.
  - name: completion reports clear independent review
    proposition:
      The response says an independent review of the completed change found no
      blocking findings.
transcript_checks:
  - name: advertised independent review skill is invoked
    expect_regex: '"name":"Skill","input":\{"skill":"independent-code-review"\}|"type":"darrow.claude_nested_skill_invocations","complete":true[^\n]*"skill":"independent-code-review"'
  - name: no lifecycle ledger or retired route gate is used
    not_regex: adaptive-goal-preflight step|Protocol ledger|claude-route-gate
native_goal: required
