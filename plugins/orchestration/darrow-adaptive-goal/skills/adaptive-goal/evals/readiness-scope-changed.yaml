id: goal-readiness-scope-changed
prompt: >-
  {{skill_invocation}} Implement the authoritative accepted plan in REQUEST.md. We
  assessed the earlier plan to add `First revised line.`, but its scope has since
  changed materially: the current plan adds `Second revised line.` and another
  observable acceptance condition that were not assessed. NOTES.md is local
  documentation with no callers or compatibility impact. A new readiness request adds
  value for this current scope. Acceptance is that `bash check.sh` passes. Run bash
  check.sh. Select and apply the policy route. Keep the result local; publication is
  not authorized.
fixture:
  commits:
    - message: "chore: init"
      files:
        .readiness-verdict: |
          ready
        REQUEST.md: |
          # Revised accepted plan

          Preserve `existing = preserved` beneath the heading in NOTES.md, then
          add `First revised line.` and `Second revised line.` in that order.
        NOTES.md: |
          # Notes
          existing = preserved
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          printf '%s\n' '# Notes' 'existing = preserved' 'First revised line.' 'Second revised line.' >.fixture-state/expected-notes
          cmp -s .fixture-state/expected-notes NOTES.md
  setup: >-
    uv run --quiet --no-project "{{case_dir}}/../../../backend/scripts/run_locked.py"
    adaptive-goal-fixture install readiness "$PWD" "{{case_dir}}/fixtures" codex
checks:
  - name: changed-scope plan is implemented
    run: bash check.sh
  - name: material scope change reruns readiness
    run:
      test "$(wc -l <.fixture-state/implementation-readiness-invocations | tr -d '
      ')" -eq 1
  - name: reassessment precedes mutation
    run: test ! -s .fixture-state/implementation-readiness-pre-status
semantic_output_checks:
  - name: changed-scope readiness-gated goal completes
    proposition:
      The response reports the requested outcome as complete, with no unresolved
      blocker or pending decision preventing completion.
native_goal: required
