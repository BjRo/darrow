id: goal-verification-shared-exhausted
invariant: ADL-A4,ADL-V1,LC-C5
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Advice only; do not launch or perform work. The retained owner
  selected review and QA through verification. No explicit repair maximum was supplied.
  It used one attempt addressing combined review and QA blockers, then a second attempt
  on a remaining QA blocker. Fresh follow-up shows material progress but that QA blocker
  remains. Review is clear. The QA provider offers its own two-repair allowance. What
  should the owner do next?
fixture:
  commits:
    - message: "chore: init"
      files:
        NOTES.md: "preserved\n"
checks:
  - name: advice leaves repository unchanged
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: provider does not reset shared budget
    proposition: >-
      The response stops further repair under the exhausted shared two-attempt budget
      without adopting QA's offered extra allowance. An unambiguous refusal of another
      attempt under existing authority is sufficient; it need not repeat the supplied
      counts, provider results or QA offer, use the literal word "blocked", or add a
      separate publication disclaimer. Read-only investigation or seeking an explicit
      finite owner override is allowed; neither grants another attempt under the
      existing budget. Claiming completion, resetting budget per provider or authorizing
      more repair or uncleared publication in this state fails.
native_goal: forbidden
