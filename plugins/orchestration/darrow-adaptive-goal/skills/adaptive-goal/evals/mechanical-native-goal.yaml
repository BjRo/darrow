id: goal-preflight-mechanical-native-goal
prompt: >-
  {{skill_invocation}} Alphabetize the three entries in NOTES.md. Acceptance is exact
  alphabetical order under the existing heading, covered completely by bash check.sh.
  Run bash check.sh. Select and apply the policy route. Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for NOTES.md changes.
        NOTES.md: |
          # Notes

          - zebra
          - alpha
          - maple
        check.sh: |
          #!/usr/bin/env bash
          printf '%s\n' '# Notes' '' '- alpha' '- maple' '- zebra' >.fixture-state/expected-notes
          cmp -s .fixture-state/expected-notes NOTES.md
checks:
  - name: deterministic prose transformation is correct
    run: bash check.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: verification evidence is returned
    expect_regex: check\.sh
    flags: i
semantic_output_checks:
  - name: mechanical owner reports completion
    proposition:
      The response reports the requested outcome as complete, with no unresolved
      blocker or pending decision preventing completion.
native_goal: required
