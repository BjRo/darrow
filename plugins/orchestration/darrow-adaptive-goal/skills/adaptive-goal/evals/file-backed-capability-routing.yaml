id: goal-intent-capability-bindings
invariant: ADL-C2,ADL-L1,ADL-L2,ADL-S3,ADL-X1
goal_report: forbidden
goal_route_checks: false
additional_plugins:
  - plugins/capability/darrow-verification
expect_head_change: true
prompt: >-
  {{skill_invocation}} Read exact ticket 64 from the fixture tracker and implement its
  requested change on the current feature branch. This preserved conversation already
  contains a ready assessment for this exact unchanged ticket and scope, so do not run
  readiness again. Select the implementation policy route and keep the native goal in
  the main thread. Require independent review of the exact final change after checks and
  before publication. Create one Conventional Commit, push the current branch, and open
  exactly one pull request. Bind and invoke every advertised intent-matched skill for
  the ticket read, independent review, commit, and pull request; direct tracker, Git, or
  forge commands are not substitutes. Do not merge, release, deploy, mutate the ticket,
  force-push, or edit unrelated files.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for changes to NOTES.md.
          The host-advertised capabilities for an
          exact ticket read, one commit, and one pull-request publication are
          available at `.agents/skills/read-ticket`,
          `.agents/skills/create-commit`, and `.agents/skills/create-pr`. The
          explicitly required independent review is available at
          `.agents/skills/independent-code-review`.
          `adaptive-goal` preflight gathers required read-only ticket input and
          compiles review, commit, and publication for its owner.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          cmp -s NOTES.md - <<'EXPECTED'
          # Notes
          Capability routing survives file-backed goals.
          EXPECTED
          printf '%s\n' 'check final-tree pass' >>.fixture-state/capability-events
  files:
    .agents/skills/read-ticket/SKILL.md: |
      ---
      name: read-ticket
      description: Read one exact tracker ticket by ID. Use during authorized adaptive-goal preflight when the ticket is authoritative input, or when the accepted owner contract requires a refresh. Remain read-only.
      ---

      # Read one ticket

      Run exactly
      `read-ticket-protocol <id> read-ticket-skill-contract-v1` and return its
      complete output. Do not use `gh`, `ticketctl`, or another tracker command
      directly.
    .agents/skills/create-commit/SKILL.md: |
      ---
      name: create-commit
      description: Create exactly one Conventional Commit when the accepted owner contract authorizes the commit; do not use during adaptive-goal preflight.
      ---

      # Create one commit

      Run exactly
      `create-commit-protocol NOTES.md "<subject>" create-commit-skill-contract-v1`,
      substituting one valid imperative Conventional Commit subject. Do not
      stage or commit through raw Git commands.
    .agents/skills/create-pr/SKILL.md: |
      ---
      name: create-pr
      description: Push the current feature branch and open exactly one pull request when the accepted owner contract authorizes publication; do not use during adaptive-goal preflight.
      ---

      # Create one pull request

      Run exactly `create-pr-protocol create-pr-skill-contract-v1`. Do not push
      or invoke `gh` directly.
    .agents/skills/independent-code-review/SKILL.md: |
      ---
      name: independent-code-review
      description: Independently review one exact current change and report its findings and outcome. Use when an explicit goal contract requires independent review before commit or publication. Remain read-only.
      ---

      # Independently review the current change

      Accept the originating acceptance, standards, exact candidate and current
      successful checks. You are the provider coordinator in the fresh context
      supplied by verification. Launch separate fresh Standards and Acceptance
      readers; keep coordination separate from their assessments.

      On Codex use native `spawn_agent` with `fork_turns: "none"`,
      `model: "gpt-6.1-sol"` and `reasoning_effort: "xhigh"` for both readers.
      On Claude use fresh native Agent contexts pinned to Opus/high. Keep the
      caller's provider-coordinator route unchanged. Supply each reader its axis,
      absolute repository, exact candidate, acceptance, constraints and successful
      checks. Readers execute this bounded read-only command once and return its
      complete output; they do not coordinate another review or launch agents:

      `independent-review-protocol independent-review-skill-contract-v1`

      Start both readers before waiting. Require both complete results to name
      the same current target; return both unchanged outputs inline with their
      axis labels. Failed, missing, stale or conflicting evidence cannot clear.
      This fixture supports initial assessment. Closed follow-up returns
      unavailable and preserves the supplied finding and repair history.
      Do not execute the protocol as coordinator, implement, commit or publish.
  ticket:
    id: "64"
    title: "Add the capability-routing note"
    body: |
      Add the exact line `Capability routing survives file-backed goals.`
      beneath the existing heading in NOTES.md and make no other content
      change. Acceptance is that `bash check.sh` passes.
  bin:
    read-ticket-protocol: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 2
      test "$1" = 64
      test "$(printf '%s' "$2" | git hash-object --stdin)" = 60590c77f8ea6ff0507dfec7d34ad6e044d449ef
      git_dir="$PWD/.git"
      printf '%s\n' 'capability read-ticket start' >>"$(git rev-parse --show-toplevel)/.fixture-state/capability-events"
      printf '%s\n' 'operation read-ticket ticket get' >>"$(git rev-parse --show-toplevel)/.fixture-state/capability-events"
      DARROW_CAPABILITY_PROTOCOL=read-ticket \
        forge-ticket-read "$1" ".fixture-state/capability-ticket.md"
      printf '%s\n' "$1" >>"$(git rev-parse --show-toplevel)/.fixture-state/read-ticket-capability.log"
      cat ".fixture-state/capability-ticket.md"
    create-commit-protocol: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 3
      test "$1" = NOTES.md
      test "$(printf '%s' "$3" | git hash-object --stdin)" = e878c39395505de4417dc36b084e76d1cd8dcfbb
      git_dir="$PWD/.git"
      printf '%s\n' 'capability create-commit start' >>"$(git rev-parse --show-toplevel)/.fixture-state/capability-events"
      DARROW_CAPABILITY_PROTOCOL=create-commit git add -- "$1"
      DARROW_CAPABILITY_PROTOCOL=create-commit git commit -m "$2"
      printf '%s\n' "$2" >>"$(git rev-parse --show-toplevel)/.fixture-state/create-commit-capability.log"
    create-pr-protocol: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "$(printf '%s' "$1" | git hash-object --stdin)" = f4f149d98627c8c5cbcce07490d84c189070ec03
      git_dir="$PWD/.git"
      printf '%s\n' 'capability create-pr start' >>"$(git rev-parse --show-toplevel)/.fixture-state/capability-events"
      branch=$(DARROW_CAPABILITY_PROTOCOL=create-pr git branch --show-current)
      DARROW_CAPABILITY_PROTOCOL=create-pr git push -u origin "$branch"
      printf '%s\n' "$branch" >>"$(git rev-parse --show-toplevel)/.fixture-state/create-pr-capability.log"
      url=$(forge-pr-create "$branch")
      head=$(DARROW_CAPABILITY_PROTOCOL=create-pr git rev-parse HEAD)
      printf 'Pull request: %s\n' "$url"
      printf '%s\n' 'Repository: fixture/repository'
      printf 'Head: %s\n' "$branch"
      printf '%s\n' 'Base: main'
      printf '%s\n' 'Draft: false'
      printf 'Remote head: %s\n' "$head"
      printf 'Forge head: %s\n' "$head"
      printf '%s\n' 'Open pull requests: 1'
    independent-review-protocol: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "$(printf '%s' "$1" | git hash-object --stdin)" = b1d8706dabad37d43795dcba094c36681b029df5
      git_dir="$PWD/.git"
      printf '%s\n' 'capability independent-review start' >>"$(git rev-parse --show-toplevel)/.fixture-state/capability-events"
      if ! cmp -s NOTES.md - <<'EXPECTED'
      # Notes
      Capability routing survives file-backed goals.
      EXPECTED
      then
        printf '%s\n' 'Independent review blocked: NOTES.md does not match ticket 64.' >&2
        exit 1
      fi
      changed=$(DARROW_CAPABILITY_PROTOCOL=independent-review git diff HEAD --name-only)
      untracked=$(DARROW_CAPABILITY_PROTOCOL=independent-review git ls-files --others --exclude-standard)
      test "$changed" = NOTES.md && test -z "$untracked" || {
        printf '%s\n' 'Independent review blocked: change exceeds the NOTES.md scope.' >&2
        exit 1
      }
      bash check.sh || {
        printf '%s\n' 'Independent review blocked: required bash check.sh failed.' >&2
        exit 1
      }
      DARROW_CAPABILITY_PROTOCOL=independent-review git diff --check
      head=$(DARROW_CAPABILITY_PROTOCOL=independent-review git rev-parse HEAD)
      notes_digest=$(python3 -c 'import hashlib, pathlib; print(hashlib.sha256(pathlib.Path("NOTES.md").read_bytes()).hexdigest())')
      target="WORKTREE@$head+$notes_digest"
      printf '%s\tclear\tcomprehensive\n' "$target" >>"$(git rev-parse --show-toplevel)/.fixture-state/independent-review-invocations"
      printf '%s\n' 'Independent review outcome: no blocking findings'
      printf 'Reviewed target: %s\n' "$target"
      printf '%s\n' 'Acceptance evidence: NOTES.md exactly contains the original heading followed by the line required by ticket 64; byte comparison passed.'
      printf '%s\n' 'Standards evidence: only NOTES.md differs from HEAD; no untracked files; git diff --check passed.'
      printf '%s\n' 'Check evidence: bash check.sh passed on this reviewed target, satisfying the AGENTS.md requirement.'
      printf '%s\n' 'Findings: none. Evidence gaps: none.'
    forge-pr-create: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      git_dir="$PWD/.git"
      printf '%s\n' 'operation create-pr forge create' >>"$(git rev-parse --show-toplevel)/.fixture-state/capability-events"
      printf '%s\t%s\n' "$1" 'https://example.invalid/pull/64' >>"$(git rev-parse --show-toplevel)/.fixture-state/pull-requests"
      printf '%s\n' 'https://example.invalid/pull/64'
    forge-ticket-read: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 2
      git_dir="$PWD/.git"
      if test "${DARROW_CAPABILITY_PROTOCOL:-}" != read-ticket; then
        printf '%s\n' 'raw tracker read' >>"$(git rev-parse --show-toplevel)/.fixture-state/raw-tracker.log"
        exit 2
      fi
      test "$(cat "$git_dir/fixture-ticket-id")" = "$1"
      cp ".fixture-state/fixture-ticket.md" "$2"
      printf 'id: %s\nstate: open\ntitle: %s\n' \
        "$1" "$(cat "$git_dir/fixture-ticket-title")"
    git: |
      #!/usr/bin/env bash
      set -eu
      repo=$PWD
      while test ! -d "$repo/.git"; do
        test "$repo" != / || { printf '%s\n' 'fixture git requires a repository' >&2; exit 2; }
        repo=${repo%/*}
        test -n "$repo" || repo=/
      done
      git_dir="$repo/.git"
      real_git=$(sed -n '1p' "$git_dir/real-git-path")
      test -x "$real_git"
      mutating=
      for argument in "$@"; do
        case "$argument" in add|commit|push) mutating=$argument; break ;; esac
      done
      if test -n "${DARROW_CAPABILITY_PROTOCOL:-}"; then
        printf 'operation %s git %s\n' "$DARROW_CAPABILITY_PROTOCOL" "${mutating:-inspect}" >>"$repo/.fixture-state/capability-events"
      elif test -n "$mutating"; then
        printf 'raw git %s\n' "$mutating" >>"$repo/.fixture-state/raw-git.log"
      fi
      exec "$real_git" "$@"
    gh: |
      #!/usr/bin/env bash
      set -eu
      git_dir=$(git rev-parse --git-dir)
      case "$git_dir" in /*) ;; *) git_dir="$PWD/$git_dir" ;; esac
      printf '%s\n' "$*" >>"$(git rev-parse --show-toplevel)/.fixture-state/raw-gh.log"
      if test "${1-}" = issue && test "${2-}" = view && test "${3-}" = 64; then
        cat ".fixture-state/fixture-ticket.md"
        exit 0
      fi
      if test "${1-}" = pr && test "${2-}" = create; then
        printf '%s\n' 'https://example.invalid/pull/raw'
        exit 0
      fi
      printf '%s\n' "unsupported gh invocation: $*" >&2
      exit 2
  setup: |
    set -eu
    mkdir -p .git/eval-checks
    cp "{{case_dir}}/../../../backend/tests/evals/review_receipts.py" .git/eval-checks/
    printf '%s\n' '/.agents/' >>.git/info/exclude
    command -v git >.git/real-git-path
    git init --bare .fixture-state/remote.git >/dev/null
    git remote add origin "$PWD/.fixture-state/remote.git"
    git switch -c fix/file-backed-capability-routing >/dev/null
checks:
  - name: ticket capability is invoked exactly once
    run: >-
      test "$(wc -l <.fixture-state/read-ticket-capability.log | tr -d ' ')" -eq 1
      && test "$(cat .fixture-state/read-ticket-capability.log)" = 64 && test ! -s
      .fixture-state/ticketctl.log
  - name: requested behavior is implemented
    run: bash check.sh
  - name: selected independent review remains composed before publication
    run: |
      set -eu
      review_base=$(git rev-parse HEAD^)
      review_notes_digest=$(git show HEAD:NOTES.md | python3 -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')
      expected="WORKTREE@$review_base+$review_notes_digest"
      python3 .git/eval-checks/review_receipts.py --format comprehensive \
        --expected "$expected" .fixture-state/independent-review-invocations
  - name: commit capability creates the one intended commit
    run: >-
      test "$(wc -l <.fixture-state/create-commit-capability.log | tr -d ' ')" -eq 1
      && test "$(git rev-list --count HEAD)" -eq 2 && git log -1 --format=%s | grep -E
      '^(feat|fix|docs|refactor|test|build|ci|chore)(\([^)]+\))?!?: .+' >/dev/null &&
      test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = NOTES.md
  - name: pull-request capability publishes the exact current branch
    run: >-
      test "$(wc -l <.fixture-state/create-pr-capability.log | tr -d ' ')" -eq 1 &&
      branch=$(git branch --show-current) && test "$(cat
      .fixture-state/create-pr-capability.log)" = "$branch" && test "$(git
      --git-dir=.fixture-state/remote.git for-each-ref --format='%(refname)' refs/heads)"
      = "refs/heads/$branch" && test "$(git --git-dir=.fixture-state/remote.git rev-parse
      "refs/heads/$branch")" = "$(git rev-parse HEAD)" && test "$(wc -l
      <.fixture-state/pull-requests | tr -d ' ')" -eq 1 && test "$(cut -f1
      .fixture-state/pull-requests)" = "$branch" && test "$(cut -f2
      .fixture-state/pull-requests)" = 'https://example.invalid/pull/64'
  - name: capabilities precede every protected operation
    run: >-
      awk '
        $0 == "capability read-ticket start" { read_start = NR }
        $0 == "operation read-ticket ticket get" { read_operation = NR }
        $0 == "check final-tree pass" && !check_pass { check_pass = NR }
        $0 == "capability independent-review start" { review_start = NR }
        $0 == "capability create-commit start" { commit_start = NR }
        $0 == "operation create-commit git add" { add_operation = NR }
        $0 == "operation create-commit git commit" { commit_operation = NR }
        $0 == "capability create-pr start" { pr_start = NR }
        $0 == "operation create-pr git push" { push_operation = NR }
        $0 == "operation create-pr forge create" { pr_operation = NR }
        END {
          exit !(read_start && read_start < read_operation &&
            check_pass && review_start && check_pass < review_start &&
            review_start < commit_start &&
            commit_start < add_operation && add_operation < commit_operation &&
            pr_start && commit_operation < pr_start &&
            pr_start < push_operation && push_operation < pr_operation)
        }
      ' .fixture-state/capability-events
  - name: no direct command bypasses the capabilities
    run: >-
      test ! -e .fixture-state/raw-tracker.log && test ! -e
      .fixture-state/raw-git.log && test ! -e .fixture-state/raw-gh.log
  - name: protected capability tokens exist only in skill instructions
    run: |
      set -eu
      test -d .git/fixture-bin
      matches=$(grep -l -F 'skill-contract-v1' .agents/skills/*/SKILL.md)
      test "$(printf '%s\n' "$matches" | wc -l | tr -d ' ')" -eq 4
      if grep -R -F 'skill-contract-v1' .git/fixture-bin; then
        exit 1
      else
        status=$?
        test "$status" -eq 1
      fi
  - name: published tree is clean
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
transcript_checks:
  - name: no lifecycle ledger is used
    not_regex: adaptive-goal-preflight step|Protocol ledger
semantic_output_checks:
  - name: owner reports completion
    proposition: >-
      The requested endpoint is to implement ticket 64, pass checks, obtain clear
      independent review, create one commit, push the branch and open one pull
      request. The response reports that endpoint complete with no unresolved
      blocker or unfinished requested step. An open pull request is the completed
      publication endpoint; merging or closing it was not requested. A response
      may reuse the supplied ready assessment for this exact unchanged ticket and
      scope; the request explicitly says not to run readiness again. A response
      that stops before implementation, checks, review, commit, push or PR creation,
      or claims those required steps remain blocked, does not pass.
native_goal: required
