id: goal-preflight-bounded-native-goal
prompt: >-
  {{skill_invocation}} Add an exported double(value) function to src/math.js. Add
  focused tests for zero and a negative number. Acceptance is that double returns
  exactly two times its numeric input and bash test.sh passes. Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash test.sh` for JavaScript changes.
        package.json: '{"type":"module"}'
        src/math.js: |
          export const identity = (value) => value;
        test/math.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity } from "../src/math.js";
          test("identity", () => assert.equal(identity(-2), -2));
        test.sh: |
          #!/usr/bin/env bash
          node --test test/math.test.js
checks:
  - name: behavior is implemented
    run: >-
      node --input-type=module -e "import('./src/math.js').then(({double}) => { if
      (double(0) !== 0 || double(-4) !== -8) process.exit(1) })"
  - name: focused tests are durable
    run: >-
      grep -F 'double(0)' test/math.test.js >/dev/null && grep -F 'double(-'
      test/math.test.js >/dev/null && bash test.sh >/dev/null
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: verification evidence is returned
    expect_regex: bash test\.sh|test/math\.test\.js
semantic_output_checks:
  - name: owner reports completion
    proposition:
      The response reports the requested outcome as complete, with no unresolved
      blocker or pending decision preventing completion.
native_goal: required
