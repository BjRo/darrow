id: goal-client-goal-go-signal-claude
harnesses: [claude]
activation: positive
prompt: >-
  {{skill_invocation}} Add the exact line `Client goal accepted.` beneath the
  heading in NOTES.md and change nothing else. Acceptance is that bash check.sh
  passes. Keep the result local; no commits or publication.
follow_up_prompt: >-
  /goal Complete the adaptive-goal NOTES.md change prepared in this session:
  NOTES.md contains the exact line `Client goal accepted.` beneath its heading,
  the rest of NOTES.md is unchanged and bash check.sh passes. Keep the result
  local; no commits or publication.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for NOTES.md changes.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'Client goal accepted.' NOTES.md >/dev/null
checks:
  - name: go signal continues to the requested change
    run: printf '%s\n' '# Notes' 'Client goal accepted.' | cmp - NOTES.md && bash check.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
transcript_checks:
  - name: the go signal continues without a second preflight
    kind: command-absence
    turn: follow-up
    forbiddenCommandTerms:
      - adaptive-goal-preflight prepare
semantic_output_checks:
  - name: go signal completes the prepared goal
    proposition: The response reports that the NOTES.md change is complete and
      that the check passed, with no unresolved blocker, pending launch step or
      request to send another /goal message.
native_goal: complete
