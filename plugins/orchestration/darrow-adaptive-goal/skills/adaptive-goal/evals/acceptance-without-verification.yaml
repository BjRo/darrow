id: goal-acceptance-without-verification
invariant: ADL-V1,ADL-C2,ADL-L1,ADL-L2
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Change requireMfa from false to true in auth-policy.js. This
  authorization boundary is high risk, but localized and fully specified. Keep it local.
  Run bash check.sh and obtain independent review through the advertised
  independent-code-review public workflow. Preserve the check script. No commits
  or publication are authorized.
fixture:
  commits:
    - message: "chore: baseline"
      files:
        auth-policy.js: "export const requireMfa = false;\n"
        check.sh: |
          #!/usr/bin/env bash
          grep -Fx 'export const requireMfa = true;' auth-policy.js
  setup: |
    uv run --quiet --frozen --no-dev --project "{{case_dir}}/../../../backend" adaptive-goal-fixture install review "$PWD" "{{case_dir}}/fixtures" both
    printf '%s\n' '.agents/' '.claude/' >>.git/info/exclude
checks:
  - name: requested authorization value is implemented
    run: bash check.sh
  - name: independent review clears the current candidate
    run: >-
      test "$(tail -n 1 .fixture-state/independent-review-invocations | cut -f1)" =
      "$(uv run --quiet --no-project .agents/backend/scripts/run_locked.py
      adaptive-goal-fixture review "$PWD" fingerprint)" &&
      test "$(tail -n 1 .fixture-state/independent-review-invocations | cut -f2)" = clear
  - name: result stays local
    run: test "$(git rev-list --count HEAD)" -eq 1
semantic_output_checks:
  - name: acceptance clears without a standalone coordinator
    proposition: >-
      The response reports that the requested MFA change is complete, supported by
      successful current checks and independent review. It does not treat an absent
      standalone Verification plugin as a blocker or claim publication occurred.
native_goal: complete
harnesses: [codex]
