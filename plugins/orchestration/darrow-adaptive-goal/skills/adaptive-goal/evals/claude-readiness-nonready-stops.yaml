id: claude-readiness-nonready-stops
harnesses: [claude]
prompt: >-
  {{skill_invocation}} Implement the authoritative specification in REQUEST.md.
  Repository policy requires an implementation-readiness assessment before mutation, and
  neither implementation nor implementation delegation may start on a non-ready verdict.
  Acceptance would be that bash check.sh passes. Keep the result local; publication is
  not authorized.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Readiness policy

          Every adaptive-goal implementation must assess implementation
          readiness before repository mutation.
        .readiness-verdict: |
          needs-decision
        REQUEST.md: |
          # Authoritative request

          Add the exact line `Claude non-ready request completed.` beneath the
          heading in NOTES.md.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'Claude non-ready request completed.' NOTES.md >/dev/null
  setup: >-
    uv run --quiet --no-project "{{case_dir}}/../../../backend/scripts/run_locked.py"
    adaptive-goal-fixture install readiness "$PWD" "{{case_dir}}/fixtures" claude
checks:
  - name: Claude non-ready verdict stops before mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: Claude returns the complete readiness result
    expect_regex: "^## Implementation readiness[\\s\\S]*\\*\\*Verdict:\\*\\*
      `needs-decision`[\\s\\S]*### Required next action"
semantic_output_checks:
  - name: Claude non-ready result does not claim implementation
    proposition: The response does not claim that implementation occurred or completed.
transcript_checks:
  - name: Claude invokes the readiness skill exactly once
    kind: readiness-once
  - name: Claude does not retry readiness without a user resolution
    kind: readiness-no-retry
  - name: Claude launches no owner before ready
    kind: no-claude-owner
native_goal: forbidden
