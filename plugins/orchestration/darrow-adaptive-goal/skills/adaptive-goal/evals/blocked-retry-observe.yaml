id: goal-blocked-retry-observes-publication
prompt: >-
  Use {{skill_invocation}} to decide the next lifecycle action only. The retained owner
  in this same thread is blocked because pull-request creation returned an ambiguous
  result, and the current forge state has not yet been observed. The user says "retry"
  without qualification. What is the retained owner's immediate next action? Answer in
  one sentence.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
checks: []
semantic_output_checks:
  - name: observes current publication state
    proposition:
      The response says the ambiguous publication result must be resolved by
      observing the current remote or pull-request state.
  - name: does not repeat the effect before observation
    proposition:
      The response says another publication attempt must not occur before that
      observation.
transcript_checks:
  - name: advice-only invocation launches no owner or helper
    kind: preflight-no-agent-spawn
  - name: advice-only invocation runs no preflight helper
    kind: command-absence
    forbiddenCommandTerms:
      - adaptive-goal-preflight
native_goal: forbidden
