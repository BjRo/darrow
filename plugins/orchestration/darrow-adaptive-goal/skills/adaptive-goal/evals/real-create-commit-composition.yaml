id: goal-real-create-commit-composition
invariant: ADL-C2,ADL-L1,ADL-L2,ADL-L5,ADL-S3
goal_report: forbidden
goal_route_checks: false
expect_head_change: true
additional_plugins:
  - plugins/capability/darrow-verification
  - plugins/capability/darrow-git
prompt: >-
  {{skill_invocation}} Add the exact line `Real commit capability composes.` beneath the
  heading in NOTES.md and make no other content change. This preserved conversation
  already contains a ready assessment for this exact unchanged request and scope, so do
  not run readiness again. Acceptance is that `bash check.sh` passes. Run bash check.sh. Require
  independent review of the exact final change after checks. Create one Conventional
  Commit, push the current branch, and open exactly one pull request. Bind and invoke
  every advertised intent-matched skill for independent review, commit, and pull-request
  publication. Do not merge, release, deploy, mutate a ticket, force-push, or edit
  unrelated files. If the commit hook reports one concrete remediation for NOTES.md, I
  authorize executing that exact remediation and refreshing NOTES.md through the guarded
  retry.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for changes to NOTES.md. Inside an active native
          goal, host-advertised capabilities are available for independent
          review, one commit, and one pull-request publication.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          git_dir=$(git rev-parse --git-dir)
          cmp -s NOTES.md - <<'EXPECTED'
          # Notes
          Real commit capability composes.
          EXPECTED
          printf '%s\n' 'check pass' >>"$(git rev-parse --show-toplevel)/.fixture-state/composition-events"
  files:
    .agents/skills/independent-code-review/SKILL.md: |
      ---
      name: independent-code-review
      description: Independently review one exact current change and report its findings and outcome. Use when an explicit goal contract requires independent review before commit or publication. Remain read-only.
      ---

      # Independently review the current change

      Accept the originating acceptance, standards, exact candidate and current
      successful checks. You are the provider coordinator in the fresh context
      supplied by verification. Launch separate fresh Standards and Acceptance
      readers; keep coordination separate from their assessments.

      On Codex use native `spawn_agent` with `fork_turns: "none"`,
      `model: "gpt-6.1-sol"` and `reasoning_effort: "xhigh"` for both readers.
      On Claude use fresh native Agent contexts pinned to Opus/high. Keep the
      caller's provider-coordinator route unchanged. Supply each reader its axis,
      absolute repository, exact candidate, acceptance, constraints and successful
      checks. Readers execute this bounded read-only command once and return its
      complete output; they do not coordinate another review or launch agents:

      `independent-review-protocol`

      Start both readers before waiting. Require both complete results to name
      the same current target; return both unchanged outputs inline with their
      axis labels. Failed, missing, stale or conflicting evidence cannot clear.
      This fixture supports initial assessment. Closed follow-up returns
      unavailable and preserves the supplied finding and repair history.
      Do not execute the protocol as coordinator, implement, commit or publish.
  bin:
    independent-review-protocol: |
      #!/usr/bin/env bash
      set -eu
      case "${1-}" in -h|--help) printf '%s\n' 'Usage: independent-review-protocol'; exit 0 ;; esac
      test "$#" -eq 0 || { printf '%s\n' 'Usage: independent-review-protocol' >&2; exit 2; }
      git_dir=$(git rev-parse --git-dir)
      if ! cmp -s NOTES.md - <<'EXPECTED'
      # Notes
      Real commit capability composes.
      EXPECTED
      then
        printf '%s\n' 'Independent review blocked: NOTES.md does not match the originating request.' >&2
        exit 1
      fi
      changed=$(git diff HEAD --name-only)
      untracked=$(git ls-files --others --exclude-standard)
      test "$changed" = NOTES.md && test -z "$untracked" || {
        printf '%s\n' 'Independent review blocked: change exceeds the NOTES.md scope.' >&2
        exit 1
      }
      bash check.sh || {
        printf '%s\n' 'Independent review blocked: required bash check.sh failed.' >&2
        exit 1
      }
      git diff --check
      head=$(git rev-parse HEAD)
      notes_digest=$(python3 -c 'import hashlib, pathlib; print(hashlib.sha256(pathlib.Path("NOTES.md").read_bytes()).hexdigest())')
      target="WORKTREE@$head+$notes_digest"
      printf 'review\t%s\n' "$target" >>"$(git rev-parse --show-toplevel)/.fixture-state/composition-events"
      printf '%s\n' 'Independent review outcome: no blocking findings'
      printf 'Reviewed target: %s\n' "$target"
      printf '%s\n' 'Acceptance evidence: NOTES.md exactly contains the original heading followed by the requested line; byte comparison passed.'
      printf '%s\n' 'Standards evidence: only NOTES.md differs from HEAD; no untracked files; git diff --check passed.'
      printf '%s\n' 'Check evidence: bash check.sh passed on this reviewed target, satisfying the AGENTS.md requirement.'
      printf '%s\n' 'Findings: none. Evidence gaps: none.'
    gh: |
      #!/usr/bin/env bash
      set -eu
      git_dir=$(git rev-parse --git-dir)
      printf '%s\n' "$*" >>"$(git rev-parse --show-toplevel)/.fixture-state/forge-calls"
      case "$1 $2" in
        "pr list")
          if test -s "$(git rev-parse --show-toplevel)/.fixture-state/pull-requests"; then
            branch=$(cut -f1 "$(git rev-parse --show-toplevel)/.fixture-state/pull-requests")
            url=$(cut -f2 "$(git rev-parse --show-toplevel)/.fixture-state/pull-requests")
            base=$(cut -f3 "$(git rev-parse --show-toplevel)/.fixture-state/pull-requests")
            head=$(cut -f4 "$(git rev-parse --show-toplevel)/.fixture-state/pull-requests")
            printf '1\t%s\tOPEN\t%s\t%s\t%s\tfalse\tfalse\n' "$url" "$branch" "$head" "$base"
          fi
          exit 0
          ;;
        "pr create")
          shift 2
          title=
          body=
          base=
          branch=
          draft=false
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --title) title=$2; shift 2 ;;
              --body) body=$2; shift 2 ;;
              --body-file) body=$(cat -- "$2"); shift 2 ;;
              --base) base=$2; shift 2 ;;
              --head) branch=$2; shift 2 ;;
              --draft) draft=true; shift ;;
              *) shift ;;
            esac
          done
          test -n "$title"
          test -n "$body"
          test -n "$base"
          test -n "$branch"
          test "$draft" = false
          head=$(git rev-parse HEAD)
          remote_head=$(git --git-dir=.fixture-state/remote.git rev-parse "refs/heads/$branch")
          test "$remote_head" = "$head"
          printf 'publication\t%s\t%s\n' "$branch" "$head" >>"$(git rev-parse --show-toplevel)/.fixture-state/composition-events"
          printf '%s\t%s\t%s\t%s\n' "$branch" 'https://example.invalid/pull/1' "$base" "$head" >>"$(git rev-parse --show-toplevel)/.fixture-state/pull-requests"
          printf '%s\n' 'https://example.invalid/pull/1'
          ;;
        "repo view")
          printf '%s\n' 'fixture/repository'
          ;;
        *)
          printf 'mock gh: unsupported: %s\n' "$*" >&2
          exit 1
          ;;
      esac
  hooks:
    pre-commit: |
      #!/bin/sh
      set -eu
      git_dir=$(git rev-parse --git-dir)
      marker="$(git rev-parse --show-toplevel)/.fixture-state/commit-hook-attempted"
      if test ! -e "$marker"; then
        : >"$marker"
        printf '%s\n' "run: grep -Fx 'Real commit capability composes.' NOTES.md >/dev/null" >&2
        exit 1
      fi
  setup: |
    set -eu
    mkdir -p .git/eval-checks
    cp "{{case_dir}}/../../../backend/tests/evals/review_receipts.py" .git/eval-checks/
    printf '%s\n' '/.agents/' >>.git/info/exclude
    git init --bare .fixture-state/remote.git >/dev/null
    git --git-dir=.fixture-state/remote.git symbolic-ref HEAD refs/heads/main
    git remote add origin "$PWD/.fixture-state/remote.git"
    git push -u origin main >/dev/null
    git remote set-head origin main
    git switch -c fix/real-create-commit-composition >/dev/null
checks:
  - name: requested behavior is implemented
    run: bash check.sh
  - name: review clears the final uncommitted candidate before commit
    run: |
      set -eu
      review_base=$(git rev-parse HEAD^)
      review_digest=$(git show HEAD:NOTES.md | python3 -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')
      expected="WORKTREE@$review_base+$review_digest"
      python3 .git/eval-checks/review_receipts.py --format events \
        --expected "$expected" .fixture-state/composition-events
  - name: one valid intended commit exists
    run: >-
      test "$(git rev-list --count HEAD)" -eq 2 && git log -1 --format=%s | grep -E
      '^(feat|fix|docs|refactor|test|build|ci|chore)(\([^)]+\))?!?: .+' >/dev/null &&
      test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = NOTES.md
  - name: real create-commit helper owns the commit boundary
    run: >-
      test -s .git/darrow-create-commit-hook-failure && awk -F '\t' '$1 == "format" &&
      $2 == "darrow-create-commit-hook-failure-v1" { found = 1 } END { exit !found }'
      .git/darrow-create-commit-hook-failure && grep -Fx "run: grep -Fx 'Real commit
      capability composes.' NOTES.md >/dev/null" .git/darrow-create-commit-hook-failure
      >/dev/null
  - name: one pull request publishes the exact committed branch
    run: >-
      test "$(wc -l <.fixture-state/pull-requests | tr -d ' ')" -eq 1 &&
      branch=$(git branch --show-current) && test "$(cut -f1
      .fixture-state/pull-requests)" = "$branch" && test "$(cut -f2
      .fixture-state/pull-requests)" = 'https://example.invalid/pull/1' && test
      "$(cut -f3 .fixture-state/pull-requests)" = main && test "$(cut -f4
      .fixture-state/pull-requests)" = "$(git rev-parse HEAD)" && test "$(git
      --git-dir=.fixture-state/remote.git rev-parse "refs/heads/$branch")" = "$(git
      rev-parse HEAD)"
  - name: publication verification observes the published commit
    run: >-
      grep -F 'repo view ' .fixture-state/forge-calls >/dev/null && grep -F 'pr list
      --repo ' .fixture-state/forge-calls >/dev/null
  - name: checks and review precede publication
    run: >-
      awk -F '\t' '
        $1 == "check pass" && !check { check = NR }
        $1 == "review" { review = NR }
        $1 == "publication" { publication = NR }
        END { exit !(check && review && publication && check < review && review < publication) }
      ' .fixture-state/composition-events
  - name: published tree is clean
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
semantic_output_checks:
  - name: owner reports completion
    proposition: >-
      Judge whether the response communicates that the requested NOTES.md change,
      required check, independent review, commit and PR publication are finished.
      This is a controlled local fixture: example.invalid/pull/1 is its valid
      mock PR URL. Separate executable checks assess exact note content, scope,
      commit and published identities, counts and ordering. This completion
      report need not quote the added line, restate its position under the heading,
      narrate each command, or add a standalone completion or blocker-free phrase.
      A verified PR with a matching published commit communicates publication.
      An open PR is the requested endpoint; merge was not requested.
      Reject a plan-only response, a claim of a different or unfinished requested
      change, failing checks, unavailable required review, pending commit or
      publication, or a remaining required step or blocker.
transcript_checks:
  - name: no lifecycle ledger is used
    not_regex: adaptive-goal-preflight step|Protocol ledger
native_goal: required
