id: goal-verification-combined-pending
invariant: ADL-A4,ADL-V1,LC-C5
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Advice only; do not launch or perform work. The retained owner
  selected independent review and a compatible QA assessment through verification.
  Current required checks passed. Review returned an actionable timeout blocker; the QA
  assessment is still running and may identify a separate blocker. Repair is authorized
  and no attempt has been used. What is the next owner action?
fixture:
  commits:
    - message: "chore: init"
      files:
        NOTES.md: "preserved\n"
checks:
  - name: advice leaves repository unchanged
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: collect all results before repair
    proposition: >-
      Given scenario context, which the answer need not repeat: current checks passed,
      independent review returned an actionable timeout blocker, repair is authorized
      with no attempt used, and selected QA is still running. Judge only the next-action
      advice: the response waits for or collects QA's complete result before deciding,
      starting or assigning repair.
      That is sufficient; do not require hypothetical QA-outcome branches, an advance
      promise to repair when QA finds no blocker, a separate aggregation phrase or
      repeated owner identity. Optional later repair may depend on the returned combined
      evidence and existing authority. Explicit advice to repair while QA is pending,
      ignore selected QA, transfer goal ownership or complete without QA's required
      result fails. Delegating bounded implementation under the same owner is not an
      ownership transfer.
transcript_checks:
  - name: advice launches no agent
    not_regex: '"tool":"spawn_agent"|"type":"darrow.codex_native_spawn"|"type":"darrow.goal_agent_completion"'
native_goal: forbidden
