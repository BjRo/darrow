id: doctor-adaptive-goal-indirect-claude
invariant: ADL-D1
activation: positive
prompt: >-
  Before I use Darrow's delivery workflow, diagnose a represented Claude Code
  2.1.219 session, not this executing host. Its effective process environment has
  CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS=5 and
  CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH=4. Use those supplied values only for the
  diagnosis command. Does that session have enough parallel and nested subagent
  capacity for the full review topology? Do not change configuration.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "fixture\n"
checks:
  - name: diagnosis is read-only
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: controls are distinguished
    proposition: The response reports a completed helper diagnosis of the represented Claude Code 2.1.219 environment with concurrency five and nesting four. Reporting the returned helper conclusion or guidance establishes completion; using the supplied environment values for that command is valid. It identifies CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS and CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH as separate supported controls and concludes that the full path is supported. A response that says the helper could not run fails.
transcript_checks:
  - name: orchestration does not activate
    not_regex: '"skill":"adaptive-goal"|adaptive-goal-preflight|"tool":"spawn_agent"|"name":"Agent"'
