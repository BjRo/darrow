id: doctor-adaptive-goal-effective-project
invariant: ADL-D1
activation: positive
prompt: >-
  {{skill_invocation}} Diagnose the represented Codex V2 host configuration,
  not this eval runner's own configuration. The represented project at
  ./represented-project is explicitly trusted and is its project root. Change
  into that directory for the diagnosis. Its user configuration is the fixture
  checkout's ./user-config.toml. Check whether the effective configuration supports the
  full Adaptive Goal path. Diagnose only; do not edit anything.
fixture:
  commits:
    - message: "chore: init"
      files:
        user-config.toml: "[agents]\nenabled = true\n"
        represented-project/.codex/config.toml: "[agents]\nmax_concurrent_threads_per_session = 5\n"
checks:
  - name: diagnosis is read-only
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: trusted project layer contributes
    proposition: The response reports both the absolute user and project configuration paths as checked and contributing sources, says checkout configuration was used, and concludes that the baseline and full required-assessment paths are supported.
  - name: effective concurrency is five
    proposition: >-
      The response reports a completed diagnosis with effective Codex concurrency
      five. Five concurrent threads and five spawned-agent slots are equivalent
      descriptions of that limit. The topology's required minimum of four is a
      separate value and does not contradict a diagnosed limit of five. A supplied
      value without a completed diagnosis, a recommendation, a hypothetical limit,
      a different diagnosed value or a failed diagnosis is insufficient.
transcript_checks:
  - name: orchestration does not activate
    not_regex: 'adaptive-goal-preflight|"tool":"spawn_agent"|"name":"Agent"'
