id: goal-review-bounded-default
invariant: AGL-L11,AGL-L12,AGL-S5,AGL-X6
prompt: >-
  /adaptive-goal Continue the existing candidate in settings.env. On Codex,
  invoke the $adaptive-goal skill. Treat it as ready for final review and use
  the default independent-review continuation budget. Repair review findings
  only under the existing authorization to edit settings.env, rerun `bash
  check.sh` after every edit, and never publish. Complete only if review clears
  the exact final content; otherwise stop with the unsatisfied review gate.
  Select and apply the policy route.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash check.sh` after changes to settings.env.
        settings.env: |
          PRIMARY=bad
          SECONDARY=bad
          TERTIARY=bad
          LEGACY_ADVISORY=remove
          LATER_ADVISORY=keep
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          test -s settings.env
          git_dir=$(git rev-parse --git-dir)
          subject_oid=$(git hash-object settings.env)
          printf 'check\t%s\n' "$subject_oid" >>"$git_dir/review-events"
  setup: |
    bash "{{case_dir}}/fixtures/install-independent-review.sh" "$PWD" \
      "{{case_dir}}/fixtures" codex
    git_dir=$(git rev-parse --git-dir)
    printf '%s\n' 'settings.env' >"$git_dir/fixture-review-event-path"
    printf '%s\n' '0' >"$git_dir/fixture-review-delay-seconds"
    printf '%s\t%s\t%s\n' \
      blocking 'Replace PRIMARY=bad with PRIMARY=good.' \
        'Remove the clearly in-scope, low-risk LEGACY_ADVISORY=remove line.' \
      blocking 'Replace SECONDARY=bad with SECONDARY=good.' \
        'Remove the non-blocking LATER_ADVISORY=keep line.' \
      blocking 'Replace TERTIARY=bad with TERTIARY=good.' '' \
      clear '' '' >"$git_dir/fixture-review-sequence"
checks:
  - name: first rework resolves its blocker and eligible advisory
    run: >-
      grep -Fx 'PRIMARY=good' settings.env >/dev/null &&
      ! grep -F 'LEGACY_ADVISORY=remove' settings.env >/dev/null
  - name: second rework resolves only its blocker
    run: >-
      grep -Fx 'SECONDARY=good' settings.env >/dev/null &&
      grep -Fx 'LATER_ADVISORY=keep' settings.env >/dev/null
  - name: terminal third review causes no third rework or fourth review
    run: >-
      grep -Fx 'TERTIARY=bad' settings.env >/dev/null &&
      test "$(wc -l <.git/independent-review-invocations | tr -d ' ')" -eq 3 &&
      test "$(cut -f2 .git/independent-review-invocations | sort -u)" = blocking &&
      reviewed_target=$(tail -n 1 .git/independent-review-invocations | cut -f1) &&
      final_target=$(bash .agents/bin/independent-review-fixture "$PWD" fingerprint) &&
      test "$reviewed_target" = "$final_target"
  - name: invalidated checks precede all three reviews
    run: >-
      awk -F '\t' '
      $1 == "check" { last_check = $2; next }
      $1 == "review_start" && last_check == $3 { starts++; last_check = ""; next }
      $1 == "review_start" { bad = 1 }
      END { exit !bad && starts == 3 ? 0 : 1 }
      ' .git/review-events
  - name: each review targets different content
    run: >-
      cut -f1 .git/independent-review-invocations | sort -u >.git/review-targets &&
      test "$(wc -l <.git/review-targets | tr -d ' ')" -eq 3
  - name: bounded review remains local
    run: test "$(git rev-list --count HEAD)" -eq 1 && test -z "$(git remote)"
output_checks:
  - name: terminal review reports the unsatisfied gate
    expect_regex: "(review[\\s\\S]{0,300}(block|unsatisfied|fail|incomplete)|(block|unsatisfied|fail|incomplete)[\\s\\S]{0,300}review)"
    flags: i
  - name: terminal review does not claim completion or publication
    not_regex: "(^|[.!?]\\s+)(the )?(goal|task|work|change|implementation) (is )?(complete|completed|done|finished)\\b|(committed|pushed|opened).{0,80}(success|complete|https?://)|pull request[^\\n]+https?://"
    flags: i
