id: goal-review-progress-convergence
invariant: AGL-L11,AGL-L12,AGL-S5,AGL-X6
prompt: >-
  /adaptive-goal Continue the existing candidate in settings.env. On Codex,
  invoke the $adaptive-goal skill. Treat it as ready for its one comprehensive
  review. First rework must attempt all eligible findings together, then request
  fix-scoped verification rather than another comprehensive review. Repair only
  under the existing authorization to edit settings.env, rerun `bash check.sh`
  after every edit, and never publish. Complete only after exact-target clear
  verification. Use progress-bounded convergence without a numeric limit and
  select and apply the policy route.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash check.sh` after changes to settings.env.
        settings.env: |
          PRIMARY=bad
          SECONDARY=bad
          LEGACY_ADVISORY=remove
          UNRELATED_ADVISORY=keep
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          test -s settings.env
          git_dir=$(git rev-parse --git-dir)
          subject_oid=$(git hash-object settings.env)
          printf 'check\t%s\n' "$subject_oid" >>"$git_dir/review-events"
  setup: |
    bash "{{case_dir}}/fixtures/install-independent-review.sh" "$PWD" \
      "{{case_dir}}/fixtures" codex
    git_dir=$(git rev-parse --git-dir)
    printf '%s\n' 'settings.env' >"$git_dir/fixture-review-event-path"
    printf '%s\n' '0' >"$git_dir/fixture-review-delay-seconds"
    printf '%s\t%s\t%s\t%s\n' \
      blocking \
        'Replace PRIMARY=bad and SECONDARY=bad with their good values.' \
        'Remove the clearly in-scope, low-risk LEGACY_ADVISORY=remove line.' \
        'UNRELATED_ADVISORY=keep is outside the closed finding set.' \
      clear '' '' '' >"$git_dir/fixture-review-sequence"
checks:
  - name: first rework fixes all original blockers together
    run: grep -Fx 'PRIMARY=good' settings.env >/dev/null && grep -Fx 'SECONDARY=good' settings.env >/dev/null
  - name: first rework handles only its eligible advisory
    run: "! grep -F 'LEGACY_ADVISORY=remove' settings.env >/dev/null && grep -Fx 'UNRELATED_ADVISORY=keep' settings.env >/dev/null"
  - name: one comprehensive review is followed by one fix verification
    run: >-
      test "$(wc -l <.git/independent-review-invocations | tr -d ' ')" -eq 2 &&
      test "$(cut -f3 .git/independent-review-invocations | sed -n '1p')" = comprehensive &&
      test "$(cut -f3 .git/independent-review-invocations | sed -n '2p')" = verify &&
      test "$(cut -f2 .git/independent-review-invocations | sed -n '2p')" = clear
  - name: invalidated checks precede both invocations
    run: >-
      awk -F '\t' '
      $1 == "check" { last_check = $2; next }
      $1 == "review_start" && last_check == $3 { starts++; last_check = ""; next }
      $1 == "review_start" { bad = 1 }
      END { exit !bad && starts == 2 ? 0 : 1 }
      ' .git/review-events
  - name: clear verification matches the final target
    run: >-
      test "$(tail -n 1 .git/independent-review-invocations | cut -f1)" =
      "$(bash .agents/bin/independent-review-fixture "$PWD" fingerprint)"
  - name: convergence remains local
    run: test "$(git rev-list --count HEAD)" -eq 1 && test -z "$(git remote)"
output_checks:
  - name: completion reports targeted clear verification
    expect_regex: "(fix|repair)[ -](verification|verify)[\\s\\S]{0,220}(clear|no blocking|pass)"
    flags: i
  - name: completion preserves the outer launch record
    expect_regex: "format: darrow-native-goal-report-v1"
