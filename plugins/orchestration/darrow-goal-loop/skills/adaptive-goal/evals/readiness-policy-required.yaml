id: goal-readiness-policy-required
invariant: AGL-P13,AGL-E10,AGL-L14,AGL-S6
prompt: >-
  /adaptive-goal Implement the authoritative specification in REQUEST.md. On
  Codex, invoke the $adaptive-goal skill. I would otherwise skip the default
  readiness gate, but obey the repository's explicit readiness requirement.
  Acceptance is that `bash check.sh` passes. Select and apply the policy route.
  Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        .readiness-verdict: |
          ready
        AGENTS.md: |
          # Repository policy

          Every implementation derived from REQUEST.md requires an
          implementation-readiness capability before mutation. Users may not
          waive this repository requirement through a default-gate skip.
        REQUEST.md: |
          # Authoritative request

          Add `Repository required readiness.` beneath the heading in NOTES.md.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          printf '%s\n' '# Notes' 'Repository required readiness.' >.git/expected-notes
          cmp -s .git/expected-notes NOTES.md
  setup: >-
    bash "{{case_dir}}/fixtures/install-implementation-readiness.sh" "$PWD"
    "{{case_dir}}/fixtures" codex
checks:
  - name: repository-required request is implemented
    run: bash check.sh
  - name: repository requirement survives default skip
    run: test "$(wc -l <.git/implementation-readiness-invocations | tr -d ' ')" -eq 1
  - name: required readiness runs before mutation
    run: test ! -s .git/implementation-readiness-pre-status
