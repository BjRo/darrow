id: goal-review-regression-closed-set
invariant: AGL-L11,AGL-L12,AGL-S5,AGL-X6
prompt: >-
  /adaptive-goal Continue the existing candidate in mode.env. On Codex, invoke
  the $adaptive-goal skill. Run one comprehensive review, attempt all eligible
  findings, then use fix-scoped verification. Later rework may address only an
  unresolved blocker or a direct repair-caused regression. Ignore unrelated
  observations excluded by verification. Existing authority permits editing
  mode.env and explicitly includes adding RESULT=ok when verification first
  reports that direct repair-caused regression; do that rework, rerun `bash
  check.sh`, and fix-verify again. Never publish. Select and apply the policy
  route.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: "# Repository instructions\nRun `bash check.sh` after mode.env edits.\n"
        mode.env: |
          MODE=bad
          SIDE=keep
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -E '^MODE=(bad|good)$' mode.env >/dev/null
          git_dir=$(git rev-parse --git-dir)
          printf 'check\t%s\n' "$(git hash-object mode.env)" >>"$git_dir/review-events"
  setup: |
    bash "{{case_dir}}/fixtures/install-independent-review.sh" "$PWD" "{{case_dir}}/fixtures" codex
    git_dir=$(git rev-parse --git-dir)
    printf '%s\n' mode.env >"$git_dir/fixture-review-event-path"
    printf '%s\n' 0 >"$git_dir/fixture-review-delay-seconds"
    printf '%s\t%s\t%s\t%s\n' \
      blocking 'Replace MODE=bad with MODE=good.' '' '' \
      continue 'Direct repair-caused regression: add RESULT=ok.' '' 'Renaming SIDE is unrelated and excluded.' \
      clear '' '' '' >"$git_dir/fixture-review-sequence"
checks:
  - name: later rework fixes the repair-caused regression
    run: grep -Fx 'MODE=good' mode.env >/dev/null && grep -Fx 'RESULT=ok' mode.env >/dev/null
  - name: unrelated observation never enters rework
    run: grep -Fx 'SIDE=keep' mode.env >/dev/null
  - name: convergence uses one comprehensive and two targeted verifications
    run: >-
      test "$(cut -f3 .git/independent-review-invocations | tr '\n' ' ')" = 'comprehensive verify verify ' &&
      test "$(cut -f2 .git/independent-review-invocations | tr '\n' ' ')" = 'blocking continue clear '
output_checks:
  - name: completion reports repaired regression and clear verification
    expect_regex: "regression[\\s\\S]{0,260}(fix|resolved)[\\s\\S]{0,260}(clear|pass|no blocking)"
    flags: i
  - name: completion does not promote the excluded observation
    not_regex: "renam(e|ing|ed) SIDE"
