id: goal-readiness-artifact-selected
invariant: AGL-L2,AGL-L1,AGL-X1
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Implement the authoritative specification in REQUEST.md.
  The specification has not previously
  been assessed for implementation readiness. Acceptance is that `bash
  check.sh` passes. Select and apply the policy route. Keep the result local;
  commits, pushes, pull requests, and other publication are not authorized.
fixture:
  commits:
    - message: "chore: init"
      files:
        .readiness-verdict: |
          ready
        REQUEST.md: |
          # Authoritative request

          Add the exact line `Artifact request completed.` beneath the heading
          in NOTES.md. Preserve the heading and add no other content.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          printf '%s\n' '# Notes' 'Artifact request completed.' >.git/expected-notes
          cmp -s .git/expected-notes NOTES.md
  setup: >-
    bash "{{case_dir}}/fixtures/install-implementation-readiness.sh" "$PWD"
    "{{case_dir}}/fixtures" codex
checks:
  - name: artifact request reaches its exact outcome
    run: bash check.sh
  - name: readiness runs exactly once
    run: test "$(wc -l <.git/implementation-readiness-invocations | tr -d ' ')" -eq 1
  - name: readiness runs before product mutation
    run: test ! -s .git/implementation-readiness-pre-status
  - name: artifact request stays local
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: completed readiness-gated goal reports success
    expect_regex: "Status:[ \\t]*complete"
    flags: i
  - name: completed goal does not expose internal readiness records
    not_regex: "readiness_selection\\t|readiness_verdict\\t"
transcript_checks:
  - name: readiness is invoked before the separate owner
    expect_regex: '"skill":"(?:darrow-readiness-gate:)?assess-implementation-readiness"[\s\S]*"tool":"spawn_agent"[^\n]*"prompt":"- phase: adaptive-goal-owner'
  - name: no lifecycle ledger or nested goal is used
    not_regex: 'goal-loop step|Protocol ledger|"tool":"create_goal"'
