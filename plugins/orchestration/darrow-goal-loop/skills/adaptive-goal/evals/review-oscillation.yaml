id: goal-review-oscillation
invariant: AGL-L11,AGL-L12,AGL-S5
prompt: >-
  /adaptive-goal Continue the existing candidate in state.env. On Codex, invoke
  the $adaptive-goal skill. Run one comprehensive review, repair eligible
  findings under the existing authority to edit state.env, rerun `bash
  check.sh`, and then use fix-scoped verification. Stop if the target
  oscillates to an earlier fingerprint. Preserve the verifier's returned
  `Fix verification: continue.` line even though that prospective-target check
  makes the outer gate stop as no progress; report the oscillation separately
  and do not relabel the verifier outcome. Because the requested restoration is
  known to reproduce the original `STATE=A` target, reject that later repair
  before editing `state.env` or rerunning `bash check.sh`; preserve the current
  `STATE=B` target. Never publish. Select and apply the policy route.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: "# Repository instructions\nRun `bash check.sh` after state.env edits.\n"
        state.env: "STATE=A\n"
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -E '^STATE=[AB]$' state.env >/dev/null
          git_dir=$(git rev-parse --git-dir)
          printf 'check\t%s\n' "$(git hash-object state.env)" >>"$git_dir/review-events"
  setup: |
    bash "{{case_dir}}/fixtures/install-independent-review.sh" "$PWD" "{{case_dir}}/fixtures" codex
    git_dir=$(git rev-parse --git-dir)
    printf '%s\n' state.env >"$git_dir/fixture-review-event-path"
    printf '%s\n' 0 >"$git_dir/fixture-review-delay-seconds"
    printf '%s\t%s\t%s\t%s\n' \
      blocking 'Replace STATE=A with STATE=B.' '' '' \
      continue 'The repair caused a direct regression; restore STATE=A.' '' '' \
      clear '' '' '' >"$git_dir/fixture-review-sequence"
    git ls-files --others --exclude-standard |
      while IFS= read -r path; do
        printf '%s\t%s\n' "$path" "$(git hash-object -- "$path")"
      done >"$git_dir/fixture-untracked-baseline"
checks:
  - name: convergence rejects the known oscillating repair
    run: >-
      test "$(cat state.env)" = 'STATE=B' &&
      test "$(git diff --name-only HEAD --)" = state.env &&
      git ls-files --others --exclude-standard |
      while IFS= read -r path; do
        printf '%s\t%s\n' "$path" "$(git hash-object -- "$path")"
      done >.git/fixture-untracked-final &&
      cmp .git/fixture-untracked-baseline .git/fixture-untracked-final &&
      test "$(wc -l <.git/independent-review-invocations | tr -d ' ')" -eq 2
  - name: oscillation sequence avoids a redundant verification
    run: test "$(cut -f3 .git/independent-review-invocations | tr '\n' ' ')" = 'comprehensive verify '
  - name: oscillation stop performs no third invocation
    run: test "$(tail -n 1 .git/review-events | cut -f1)" = review
output_checks:
  - name: output preserves the continuing verification outcome
    expect_regex: "^[ \\t]*(?:[-*+][ \\t]+)?Fix verification:[ \\t]*continue\\.[ \\t]*$"
  - name: output identifies the repeated target
    expect_regex: "oscillat|earlier (?:target|fingerprint)|repeated (?:target|fingerprint)|repeat(?:ed|ing)? (?:the )?(?:original|prior|earlier) (?:target|fingerprint)"
    flags: i
  - name: output reports the terminal stop
    expect_regex: "no[ _-]?progress|stop|blocked"
    flags: i
