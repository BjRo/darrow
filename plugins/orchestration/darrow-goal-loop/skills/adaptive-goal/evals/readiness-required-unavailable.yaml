id: goal-readiness-required-unavailable
invariant: AGL-P13,AGL-E9,AGL-L14,AGL-S4,AGL-S6
prompt: >-
  /adaptive-goal Implement the authoritative specification in REQUEST.md. On
  Codex, invoke the $adaptive-goal skill. The specification has not previously
  been assessed for implementation readiness. Acceptance is that `bash
  check.sh` passes. Select and apply the policy route. Keep the result local;
  commits, pushes, pull requests, and other publication are not authorized.
fixture:
  commits:
    - message: "chore: init"
      files:
        REQUEST.md: |
          # Authoritative request

          Change `enabled` in policy.js from false to true.
        policy.js: |
          export const enabled = false;
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -F 'enabled = true' policy.js >/dev/null
checks:
  - name: unavailable readiness stops before mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: unavailable readiness creates no commit
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: stop identifies unavailable readiness
    expect_regex: "^[ \\t]*(?:[-*+][ \\t]+)?Implementation readiness availability: unavailable\\.[ \\t]*$"
    flags: i
  - name: unavailable gate preserves launch-required report
    expect_regex: "format: darrow-native-goal-report-v1[\\s\\S]*launch_boundary: launch_required"
transcript_checks:
  - name: unavailable readiness stops before generic delegation
    not_regex: '"tool":"spawn_agent"'
