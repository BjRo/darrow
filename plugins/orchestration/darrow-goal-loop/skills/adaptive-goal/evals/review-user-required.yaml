id: goal-review-user-required
invariant: AGL-P11,AGL-L11,AGL-S5,AGL-X6
prompt: >-
  /adaptive-goal Add the exact line "Cache entries expire." beneath the heading
  in NOTES.md. On Codex, invoke the $adaptive-goal skill. This is routine,
  localized, reversible work, but I explicitly require independent code review
  of the exact final content before completion. Acceptance is that `bash
  check.sh` passes. Select and apply the policy route. Keep the result local;
  commits, pushes, pull requests, and other publication are not authorized.
fixture:
  commits:
    - message: "chore: init"
      files:
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          printf '%s\n' '# Notes' 'Cache entries expire.' >.git/expected-notes
          cmp -s .git/expected-notes NOTES.md
  setup: >-
    bash "{{case_dir}}/fixtures/install-independent-review.sh" "$PWD"
    "{{case_dir}}/fixtures" codex
checks:
  - name: explicitly reviewed routine change is complete
    run: bash check.sh
  - name: explicit user policy invokes one independent review
    run: test "$(wc -l <.git/independent-review-invocations | tr -d ' ')" -eq 1
  - name: user-required review clears the final changed target
    run: >-
      awk -F '\t' 'NF == 2 && $2 == "clear" { ok=1 } END { exit ok ? 0 : 1 }'
      .git/independent-review-invocations
  - name: user-required review stays local
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: completion reports the semantic review outcome
    expect_regex: "(independent[ -]review[\\s\\S]{0,120}(no blocking|clear|pass)|(no blocking|clear|pass)[\\s\\S]{0,120}independent[ -]review)"
    flags: i
  - name: routine risk remains proportionate despite explicit review
    expect_regex: "format\\tdarrow-native-goal-preflight-v4[\\s\\S]*risk\\troutine[\\s\\S]*verification_gate\\troutine"
