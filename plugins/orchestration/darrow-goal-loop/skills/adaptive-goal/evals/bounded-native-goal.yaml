id: goal-preflight-bounded-native-goal
invariant: AGL-P1,AGL-P2,AGL-P4,AGL-C1,AGL-R1,AGL-R2,AGL-L1,AGL-L5,AGL-X1
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Add an exported double(value) function to src/math.js.
  Add focused tests for zero and a negative number. Acceptance is that double
  returns exactly two times its
  numeric input and bash test.sh passes. Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash test.sh` for JavaScript changes.
        package.json: '{"type":"module"}'
        src/math.js: |
          export const identity = (value) => value;
        test/math.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity } from "../src/math.js";
          test("identity", () => assert.equal(identity(-2), -2));
        test.sh: |
          #!/usr/bin/env bash
          node --test test/math.test.js
checks:
  - name: behavior is implemented
    run: >-
      node --input-type=module -e
      "import('./src/math.js').then(({double}) => {
      if (double(0) !== 0 || double(-4) !== -8) process.exit(1) })"
  - name: focused tests are durable
    run: >-
      grep -F 'double(0)' test/math.test.js >/dev/null &&
      grep -F 'double(-' test/math.test.js >/dev/null && bash test.sh >/dev/null
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: verification evidence is returned
    expect_regex: "bash test\\.sh|test/math\\.test\\.js"
  - name: no canonical ledger report is required
    not_regex: "darrow-native-goal-report|Protocol ledger|route_verified|evaluation_child_invocations"
transcript_checks:
  - name: launch preserves selected workflow and risk
    expect_regex: '"type":"darrow.goal_owner_accepted"[^\n]*"workflow":"implement-feature","risk":"routine"'
  - name: exactly one separate Codex owner is accepted
    expect_regex: '"type":"darrow.goal_owner_accepted"'
  - name: no replacement Codex owner is launched
    not_regex: '"type":"darrow.goal_owner_accepted"[\s\S]*"type":"darrow.goal_owner_accepted"'
  - name: no lifecycle ledger or nested goal is used
    not_regex: 'goal-loop step|"tool":"create_goal"'
semantic_output_checks:
  - name: owner reports completion
    proposition: The response reports the requested outcome as complete, with no unresolved blocker or pending decision preventing completion.
