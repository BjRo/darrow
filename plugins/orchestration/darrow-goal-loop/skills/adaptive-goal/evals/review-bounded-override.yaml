id: goal-review-explicit-limit
invariant: AGL-L11,AGL-L12,AGL-S5,AGL-X6
prompt: >-
  /adaptive-goal Continue the existing candidate in counter.env. On Codex,
  invoke the $adaptive-goal skill. Treat it as ready for comprehensive review.
  I explicitly set the independent-review limit to two review rounds. Existing
  repair authority permits editing counter.env by one increment per rework and
  requires `bash check.sh` after every edit. Preserve that limit as a hard cap,
  even if verification reports material progress. Keep the review capability's
  exact semantic outcome distinct from the outer review-gate decision: preserve
  its canonical outcome line without relabeling it because the cap was reached.
  Never publish. Select and apply the policy route.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash check.sh` after changes to counter.env.
        counter.env: "COUNTER=0\n"
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -E '^COUNTER=[01]$' counter.env >/dev/null
          git_dir=$(git rev-parse --git-dir)
          subject_oid=$(git hash-object counter.env)
          printf 'check\t%s\n' "$subject_oid" >>"$git_dir/review-events"
  setup: |
    bash "{{case_dir}}/fixtures/install-independent-review.sh" "$PWD" \
      "{{case_dir}}/fixtures" codex
    git_dir=$(git rev-parse --git-dir)
    printf '%s\n' 'counter.env' >"$git_dir/fixture-review-event-path"
    printf '%s\n' '0' >"$git_dir/fixture-review-delay-seconds"
    git hash-object counter.env >"$git_dir/fixture-initial-counter-oid"
    printf '%s\t%s\t%s\t%s\n' \
      blocking 'Set COUNTER from 0 to exactly 1, then request fix verification before any second attempt.' '' '' \
      continue 'COUNTER=1 progressed but remains below 3; a later rework would increment it once more.' '' '' \
      clear '' '' '' >"$git_dir/fixture-review-sequence"
    git ls-files --others --exclude-standard |
      while IFS= read -r path; do
        printf '%s\t%s\n' "$path" "$(git hash-object -- "$path")"
      done >"$git_dir/fixture-untracked-baseline"
checks:
  - name: explicit cap stops otherwise-progressing convergence
    run: >-
      grep -Fx 'COUNTER=1' counter.env >/dev/null &&
      test "$(wc -l <.git/independent-review-invocations | tr -d ' ')" -eq 2 &&
      test "$(cut -f2 .git/independent-review-invocations | sed -n '2p')" = continue
  - name: capped sequence uses comprehensive then verification modes
    run: test "$(cut -f3 .git/independent-review-invocations | tr '\n' ' ')" = 'comprehensive verify '
  - name: repaired content is checked before fix verification
    run: >-
      test "$(awk -F '\t' '$1 == "review" && $2 == "blocking" { print $3; exit }'
      .git/review-events)" = "$(cat .git/fixture-initial-counter-oid)" &&
      awk -F '\t' '
      $1 == "review" && $2 == "blocking" { initial = $3; stage = 1; next }
      $1 == "check" && stage == 1 && $2 != initial { checked = $2; next }
      $1 == "review_start" && stage == 1 && checked == $3 { stage = 2 }
      END { exit stage == 2 ? 0 : 1 }
      ' .git/review-events
  - name: terminal cap causes no later check or review
    run: test "$(tail -n 1 .git/review-events | cut -f1)" = review
  - name: terminal cap causes no later worktree mutation
    run: >-
      test "$(.agents/bin/independent-review-fixture "$PWD" fingerprint)" =
      "$(cut -f1 .git/independent-review-invocations | sed -n '2p')"
  - name: repair changes only the authorized product file
    run: >-
      test "$(git diff --name-only HEAD --)" = counter.env &&
      git ls-files --others --exclude-standard |
      while IFS= read -r path; do
        printf '%s\t%s\n' "$path" "$(git hash-object -- "$path")"
      done >.git/fixture-untracked-final &&
      cmp .git/fixture-untracked-baseline .git/fixture-untracked-final
  - name: capped stop remains local
    run: test "$(git rev-list --count HEAD)" -eq 1 && test -z "$(git remote)"
output_checks:
  - name: terminal output reports the exact explicit-cap stop
    expect_regex: '^[ \t]*(?:[-*+][ \t]+)?Review gate:[ \t]*blocked[ \t]+[-—][ \t]+explicit limit reached\.[ \t]*$'
  - name: terminal output preserves the exact verification outcome
    expect_regex: '^[ \t]*(?:[-*+][ \t]+)?Fix verification:[ \t]*continue\.[ \t]*$'
  - name: capped convergence does not claim completion
    not_regex: "(^|[.!?]\\s+|,\\s*(but|and)\\s+)[ \\t]*(?:[-*+][ \\t]+)?(?:(?:all[ \\t]+)?(?:the[ \\t]+)?(?:goal|task|work|change|implementation|everything)[ \\t]+(?:(?:is|was)[ \\t]+|has[ \\t]+been[ \\t]+)?(?:complete|completed|done|finished)\\b(?![ \\t]+(?:only|if|when|after|once|unless|pending)\\b)|(?:I|we)[ \\t]+(?:have[ \\t]+)?(?:completed|finished)[ \\t]+(?:the[ \\t]+)?(?:goal|task|work|change|implementation)\\b)"
    flags: i
  - name: capped convergence does not claim publication
    not_regex: "(^|[.!?]\\s+|,\\s*(but|and)\\s+)[ \\t]*(?:[-*+][ \\t]+)?(?:(?:(?:I|we)[ \\t]+(?:have[ \\t]+)?|(?:the[ \\t]+)?(?:change|branch|commit|work)[ \\t]+(?:(?:was|is)[ \\t]+|has[ \\t]+been[ \\t]+)?)?(?:committed|pushed|opened[ \\t]+(?:a[ \\t]+)?(?:PR|pull request)|deployed|released|published)|(?:a[ \\t]+)?(?:PR|pull request)[ \\t]+(?:(?:was|is)[ \\t]+|has[ \\t]+been[ \\t]+)opened)\\b"
    flags: i
