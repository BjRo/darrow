id: goal-blocked-unchanged-evidence-does-not-retry
invariant: AGL-L16,AGL-L17
goal_report: forbidden
prompt: >-
  Use $adaptive-goal to decide the next lifecycle action only. A retained owner
  stopped after deterministic verification failed, and a second observation
  has exactly the same evidence digest and conditions. The user says
  "continue." Explain whether the failed operation runs again.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
checks: []
output_checks:
  - name: does not retry unchanged deterministic failure
    expect_regex: "(do not|does not|must not|cannot)[^.!?]{0,100}(retry|run again)|unchanged[^.!?]{0,100}(no retry|not retried|cannot retry)"
    flags: i
  - name: requires changed evidence or conditions
    expect_regex: "changed (evidence|conditions)|evidence or conditions (change|changed)"
    flags: i
