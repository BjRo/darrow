id: goal-preflight-mechanical-native-goal
invariant: AGL-C1,AGL-R1,AGL-L1,AGL-L5
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Alphabetize the three entries in NOTES.md. Acceptance is exact alphabetical order under the existing
  heading, covered completely by bash check.sh. Select and apply the policy
  route. Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for NOTES.md changes.
        NOTES.md: |
          # Notes

          - zebra
          - alpha
          - maple
        check.sh: |
          #!/usr/bin/env bash
          printf '%s\n' '# Notes' '' '- alpha' '- maple' '- zebra' >.git/expected-notes
          cmp -s .git/expected-notes NOTES.md
checks:
  - name: deterministic prose transformation is correct
    run: bash check.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: verification evidence is returned
    expect_regex: "check\\.sh"
    flags: i
  - name: no lifecycle protocol is reported
    not_regex: "darrow-native-goal-report|Protocol ledger|route_verified"
transcript_checks:
  - name: launch preserves mechanical workflow and routine risk
    expect_regex: '"type":"darrow.goal_owner_accepted"[^\n]*"workflow":"mechanical","risk":"routine"'
  - name: no lifecycle ledger or nested goal is used
    not_regex: 'goal-loop step|Protocol ledger|"tool":"create_goal"'
semantic_output_checks:
  - name: mechanical owner reports completion
    proposition: The response reports the requested outcome as complete, with no unresolved blocker or pending decision preventing completion.
