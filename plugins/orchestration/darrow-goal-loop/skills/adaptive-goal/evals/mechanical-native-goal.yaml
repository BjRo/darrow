id: goal-preflight-mechanical-native-goal
invariant: AGL-P1,AGL-P4,AGL-R1,AGL-L1,AGL-L2,AGL-S3
prompt: >-
  /adaptive-goal Alphabetize the three entries in NOTES.md. On Codex, invoke the
  $adaptive-goal skill. Acceptance is exact alphabetical order under the existing
  heading, covered completely by bash check.sh. Select and apply the policy
  route. Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for NOTES.md changes.
        NOTES.md: |
          # Notes

          - zebra
          - alpha
          - maple
        check.sh: |
          #!/usr/bin/env bash
          printf '%s\n' '# Notes' '' '- alpha' '- maple' '- zebra' >.git/expected-notes
          cmp -s .git/expected-notes NOTES.md
checks:
  - name: deterministic prose transformation is correct
    run: bash check.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: mechanical routine route is selected
    expect_regex: "format: darrow-native-goal-report-v1[\\s\\S]*workflow: mechanical[\\s\\S]*risk: routine[\\s\\S]*profile: routine[\\s\\S]*harness: codex[\\s\\S]*model: openai > gpt-5\\.6-luna[\\s\\S]*effort: medium"
  - name: selected route is effective
    expect_regex: "model: openai > gpt-5\\.6-luna[\\s\\S]*effort: medium[\\s\\S]*route_verified: true"
  - name: matching routine route uses a zero-child host boundary
    expect_regex: "launch_boundary: (?:same_thread|host_api)[\\s\\S]*evaluation_child_invocations: 0"
  - name: final record reports no human stop
    expect_regex: "evaluation_human_interruptions: 0"
  - name: routine verification gate is reported
    expect_regex: "verification_gate: routine"
