id: goal-review-high-selected-claude
invariant: AGL-P4,AGL-P7,AGL-P11,AGL-R7,AGL-L9,AGL-L10,AGL-L11,AGL-S5,AGL-X6
prompt: >-
  /adaptive-goal Change the exported sessionCookieOptions in auth-config.js so
  sameSite is exactly "strict" instead of "lax". On Claude, invoke the
  $adaptive-goal skill. This is a security boundary where the cost of a mistake
  is high, but the requested implementation is clear, localized, and fully
  specified. Add focused evidence for the new value and preserve the other
  cookie options. Acceptance is that bash test.sh passes. Select and apply the
  policy route rather than pinning it. Keep the result local; commits, pushes,
  pull requests, and other publication are not authorized.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run bash test.sh for authentication configuration changes.
        auth-config.js: |
          export const sessionCookieOptions = Object.freeze({
            httpOnly: true,
            secure: true,
            sameSite: "lax",
          });
        auth-config.test.js: |
          import assert from "node:assert/strict";
          import { sessionCookieOptions } from "./auth-config.js";

          assert.equal(sessionCookieOptions.httpOnly, true);
          assert.equal(sessionCookieOptions.secure, true);
          assert.equal(sessionCookieOptions.sameSite, "lax");
        package.json: '{"type":"module"}'
        test.sh: |
          #!/usr/bin/env bash
          node auth-config.test.js
  setup: >-
    bash "{{case_dir}}/fixtures/install-independent-review.sh" "$PWD"
    "{{case_dir}}/fixtures" claude
checks:
  - name: cookie behavior is changed and preserved
    run: >-
      node --input-type=module -e
      "import('./auth-config.js').then(({sessionCookieOptions}) => {
      if (sessionCookieOptions.sameSite !== 'strict' ||
      sessionCookieOptions.httpOnly !== true ||
      sessionCookieOptions.secure !== true) process.exit(1) })"
  - name: focused evidence covers the strict value
    run: grep -F '"strict"' auth-config.test.js >/dev/null && bash test.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
  - name: high risk invokes one matching independent review
    run: test "$(wc -l <.git/independent-review-invocations | tr -d ' ')" -eq 1
  - name: independent review clears the final changed target
    run: >-
      awk -F '\t' 'NF == 3 && $1 ~ /^WORKTREE@/ && $2 == "clear" && $3 == "comprehensive" { ok=1 }
      END { exit ok ? 0 : 1 }' .git/independent-review-invocations
output_checks:
  - name: high risk uses the Claude routine route
    expect_regex: "format\\tdarrow-native-goal-preflight-v4[\\s\\S]*workflow\\tchange-feature[\\s\\S]*risk\\thigh[\\s\\S]*profile\\troutine[\\s\\S]*selected_route\\tclaude\\tanthropic\\tclaude-sonnet-5\\tlow"
  - name: route is verified or unavailable honestly
    expect_regex: "(effective_route\\tclaude\\tanthropic\\tclaude-sonnet-5\\tlow[\\s\\S]*route_verified\\ttrue[\\s\\S]*launch_boundary\\tnative_subagent|effective_route\\tclaude\\tanthropic\\tunknown\\tunknown[\\s\\S]*route_verified\\tfalse[\\s\\S]*launch_boundary\\tlaunch_required)"
  - name: exactly one observable native Claude goal runner is reported
    expect_regex: "route_applied_by\\tnative-subagent[\\s\\S]*launch_boundary\\t(native_subagent|launch_required)[\\s\\S]*evaluation_child_invocations\\t1"
  - name: failed verification never copies the selected route
    not_regex: "effective_route\\tclaude\\tanthropic\\tclaude-sonnet-5\\tlow[\\s\\S]*route_verified\\tfalse"
  - name: completion reports the semantic review outcome
    expect_regex: "(independent[ -]review[\\s\\S]{0,120}(no blocking|clear|pass)|(no blocking|clear|pass)[\\s\\S]{0,120}independent[ -]review)"
    flags: i
  - name: high verification gate is reported
    expect_regex: "verification_gate\\thigh"
  - name: no human stop was needed
    expect_regex: "evaluation_human_interruptions\\t0"
