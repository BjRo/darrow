id: goal-review-high-selected-claude
invariant: AGL-P4,AGL-P7,AGL-P11,AGL-R7,AGL-E1,AGL-E2,AGL-E3,AGL-E4,AGL-E5,AGL-E6,AGL-E7,AGL-E8,AGL-L9,AGL-L10,AGL-L11,AGL-S5,AGL-X6
prompt: >-
  /adaptive-goal Change the exported sessionCookieOptions in auth-config.js so
  sameSite is exactly "strict" instead of "lax". On Claude, invoke the
  $adaptive-goal skill. This is a security boundary where the cost of a mistake
  is high, but the requested implementation is clear, localized, and fully
  specified. Add focused evidence for the new value and preserve the other
  cookie options. Acceptance is that bash test.sh passes. Select and apply the
  policy route rather than pinning it. Keep the result local; commits, pushes,
  pull requests, and other publication are not authorized. Follow the skill's
  numbered Claude launch sequence literally. The goal owner must run `bash
  test.sh` against the final edited target before invoking the comprehensive
  independent review, and must not rerun it after a clear review response.
  Before its one Agent starts, use
  only native Read, Glob, or Grep for inspection; do not call Bash `echo`,
  `ls`, `find`, another placeholder/no-op, a redirect, or a command list. An
  exact standalone `true` is tolerated only as an inert no-op and supplies no
  evidence; do not combine it with anything. Make the literal standalone
  ledger-start helper the first protocol-bearing Bash call.
  The repository is `{{repo_dir}}` and the helper directory is
  `{{repo_dir}}/.git/eval-plugin/bin`; no additional inspection, listing, or
  path discovery is needed before the owner. Make the first protocol-bearing
  Bash call exactly `/bin/bash {{repo_dir}}/.git/eval-plugin/bin/goal-loop step
  start --repo {{repo_dir}} --host claude`, then pass its returned ledger path
  to every subsequent helper step.
  Do not use Bash `pwd` before the owner or `git status` after it. After the
  Agent returns, use only the exact route gate, objective-release, and terminal
  report calls.
  Begin the final response directly with the raw `format:` report line, with no
  prose or Markdown fence before or around the report.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run bash test.sh for authentication configuration changes.
        auth-config.js: |
          export const sessionCookieOptions = Object.freeze({
            httpOnly: true,
            secure: true,
            sameSite: "lax",
          });
        auth-config.test.js: |
          import assert from "node:assert/strict";
          import { sessionCookieOptions } from "./auth-config.js";

          assert.equal(sessionCookieOptions.httpOnly, true);
          assert.equal(sessionCookieOptions.secure, true);
          assert.equal(sessionCookieOptions.sameSite, "lax");
        package.json: '{"type":"module"}'
        test.sh: |
          #!/usr/bin/env bash
          set -eu
          node auth-config.test.js
          review_target=$(.claude/bin/independent-review-fixture "$PWD" fingerprint)
          printf 'check\t%s\n' "$review_target" >>.git/independent-review-events
  setup: >-
    bash "{{case_dir}}/fixtures/install-independent-review.sh" "$PWD"
    "{{case_dir}}/fixtures" claude
checks:
  - name: cookie behavior is changed and preserved
    run: >-
      node --input-type=module -e
      "import('./auth-config.js').then(({sessionCookieOptions}) => {
      if (sessionCookieOptions.sameSite !== 'strict' ||
      sessionCookieOptions.httpOnly !== true ||
      sessionCookieOptions.secure !== true) process.exit(1) })"
  - name: focused evidence covers the strict value
    run: grep -F '"strict"' auth-config.test.js >/dev/null && bash test.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
  - name: high risk invokes one matching independent review
    run: test "$(wc -l <.git/independent-review-invocations | tr -d ' ')" -eq 1
  - name: independent review clears the final changed target
    run: >-
      test "$(cut -f1 .git/independent-review-invocations)" =
      "$(.claude/bin/independent-review-fixture "$PWD" fingerprint)" &&
      awk -F '\t' '$1 == "check" { checked[$2]=1 }
      $1 == "review_start" && checked[$2] { ok=1 }
      END { exit ok ? 0 : 1 }' .git/independent-review-events &&
      awk -F '\t' 'NF == 3 && $2 == "clear" && $3 == "comprehensive" { ok=1 }
      END { exit ok ? 0 : 1 }' .git/independent-review-invocations
output_checks:
  - name: completion preserves the selected workflow dimensions
    expect_regex: "^workflow: change-feature$[\\s\\S]*^risk: high$[\\s\\S]*^profile: routine$"
  - name: completion reports the clear independent-review outcome
    expect_regex: "^[ \\t]*(?:[-*+][ \\t]+)?Initial independent review:[ \\t]*clear\\.[ \\t]*$"
transcript_checks:
  - name: one marked selected foreground runner is id-bound to route observation
    expect_regex: '"name":"Agent","id":"([^"]+)","input":\{"subagent_type":"darrow-goal-loop:adaptive-goal-sonnet-5-low","run_in_background":false,"prompt":"- phase: adaptive-goal-runner"\}[\s\S]*"type":"darrow.goal_agent_completion","tool_use_id":"\1","subagent_type":"darrow-goal-loop:adaptive-goal-sonnet-5-low","status":"completed","agent_id":"([A-Za-z0-9]+)"[\s\S]*"type":"darrow.claude_route_observation"[^\r\n]*"goal_tool_use_id":"\1","agent_id":"\2"'
  - name: no second adaptive-goal runner is launched
    not_regex: '"name":"Agent"[^\r\n]*"subagent_type":"darrow-goal-loop:adaptive-goal-(?:sonnet-5-(?:low|medium)|opus-5-high)"[\s\S]*"name":"Agent"[^\r\n]*"subagent_type":"darrow-goal-loop:adaptive-goal-(?:sonnet-5-(?:low|medium)|opus-5-high)"'
