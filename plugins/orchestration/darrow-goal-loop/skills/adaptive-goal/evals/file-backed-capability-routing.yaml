id: goal-intent-capability-bindings
invariant: AGL-C2,AGL-L1,AGL-L2,AGL-S3,AGL-X1
goal_report: forbidden
goal_route_checks: false
expect_head_change: true
prompt: >-
  {{skill_invocation}} Read exact ticket 64 from the fixture tracker and
  implement its requested change on the current feature branch. This preserved
  conversation already contains a ready assessment for this exact unchanged
  ticket and scope, so do not run readiness again. Select the policy route and
  launch one separate owner. Require independent review of the exact final
  change after checks and before publication. Create one Conventional Commit,
  push the current branch, and open exactly one pull request. Bind and invoke
  every advertised intent-matched skill for the ticket read, independent
  review, commit, and pull request; direct tracker, Git, or forge commands are
  not substitutes. Do not merge, release, deploy, mutate the ticket,
  force-push, or edit unrelated files.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for changes to NOTES.md.
          Inside an active native goal, the host-advertised capabilities for an
          exact ticket read, one commit, and one pull-request publication are
          available at `.agents/skills/read-ticket`,
          `.agents/skills/create-commit`, and `.agents/skills/create-pr`. The
          explicitly required independent review is available at
          `.agents/skills/independent-code-review`.
          Adaptive-goal preflight only compiles those operations for its owner.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          printf '%s\n' '# Notes' 'Capability routing survives file-backed goals.' >.git/expected-notes
          cmp -s .git/expected-notes NOTES.md
          printf '%s\n' 'check final-tree pass' >>.git/fixture-state/capability-events
  files:
    .agents/skills/read-ticket/SKILL.md: |
      ---
      name: read-ticket
      description: Read one exact tracker ticket by ID. Use during authorized adaptive-goal preflight when the ticket is authoritative input, or inside an active native goal when its complete contract requires that read. Remain read-only.
      ---

      # Read one ticket

      Run exactly
      `read-ticket-protocol <id> read-ticket-skill-contract-v1` and return its
      complete output. Do not use `gh`, `ticketctl`, or another tracker command
      directly.
    .agents/skills/create-commit/SKILL.md: |
      ---
      name: create-commit
      description: Create exactly one Conventional Commit inside an active native goal. Use when its complete contract authorizes the commit; do not use during adaptive-goal preflight.
      ---

      # Create one commit

      Run exactly
      `create-commit-protocol NOTES.md "<subject>" create-commit-skill-contract-v1`,
      substituting one valid imperative Conventional Commit subject. Do not
      stage or commit through raw Git commands.
    .agents/skills/create-pr/SKILL.md: |
      ---
      name: create-pr
      description: Push the current feature branch and open exactly one pull request inside an active native goal. Use when its complete contract authorizes publication; do not use during adaptive-goal preflight.
      ---

      # Create one pull request

      Run exactly `create-pr-protocol create-pr-skill-contract-v1`. Do not push
      or invoke `gh` directly.
    .agents/skills/independent-code-review/SKILL.md: |
      ---
      name: independent-code-review
      description: Independently review one exact current change and report its findings and outcome. Use when an explicit goal contract requires independent review before commit or publication. Remain read-only.
      ---

      # Independently review the current change

      Run exactly
      `independent-review-protocol independent-review-skill-contract-v1` after
      implementation and final checks. Return its complete ordinary response.
      Do not edit, commit, push, publish, or invoke another capability.
  ticket:
    id: "64"
    title: "Add the capability-routing note"
    body: |
      Add the exact line `Capability routing survives file-backed goals.`
      beneath the existing heading in NOTES.md and make no other content
      change. Acceptance is that `bash check.sh` passes.
  bin:
    read-ticket-protocol: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 2
      test "$1" = 64
      test "$(printf '%s' "$2" | git hash-object --stdin)" = 60590c77f8ea6ff0507dfec7d34ad6e044d449ef
      git_dir="$PWD/.git"
      printf '%s\n' 'capability read-ticket start' >>"$git_dir/fixture-state/capability-events"
      printf '%s\n' 'operation read-ticket ticket get' >>"$git_dir/fixture-state/capability-events"
      DARROW_CAPABILITY_PROTOCOL=read-ticket \
        forge-ticket-read "$1" "$git_dir/capability-ticket.md"
      printf '%s\n' "$1" >>"$git_dir/fixture-state/read-ticket-capability.log"
      cat "$git_dir/capability-ticket.md"
    create-commit-protocol: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 3
      test "$1" = NOTES.md
      test "$(printf '%s' "$3" | git hash-object --stdin)" = e878c39395505de4417dc36b084e76d1cd8dcfbb
      git_dir="$PWD/.git"
      printf '%s\n' 'capability create-commit start' >>"$git_dir/fixture-state/capability-events"
      DARROW_CAPABILITY_PROTOCOL=create-commit git add -- "$1"
      DARROW_CAPABILITY_PROTOCOL=create-commit git commit -m "$2"
      printf '%s\n' "$2" >>"$git_dir/fixture-state/create-commit-capability.log"
    create-pr-protocol: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "$(printf '%s' "$1" | git hash-object --stdin)" = f4f149d98627c8c5cbcce07490d84c189070ec03
      git_dir="$PWD/.git"
      printf '%s\n' 'capability create-pr start' >>"$git_dir/fixture-state/capability-events"
      branch=$(DARROW_CAPABILITY_PROTOCOL=create-pr git branch --show-current)
      DARROW_CAPABILITY_PROTOCOL=create-pr git push -u origin "$branch"
      printf '%s\n' "$branch" >>"$git_dir/fixture-state/create-pr-capability.log"
      url=$(forge-pr-create "$branch")
      head=$(DARROW_CAPABILITY_PROTOCOL=create-pr git rev-parse HEAD)
      printf 'Pull request: %s\n' "$url"
      printf '%s\n' 'Repository: fixture/repository'
      printf 'Head: %s\n' "$branch"
      printf '%s\n' 'Base: main'
      printf '%s\n' 'Draft: false'
      printf 'Remote head: %s\n' "$head"
      printf 'Forge head: %s\n' "$head"
      printf '%s\n' 'Open pull requests: 1'
    independent-review-protocol: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      test "$(printf '%s' "$1" | git hash-object --stdin)" = b1d8706dabad37d43795dcba094c36681b029df5
      git_dir="$PWD/.git"
      printf '%s\n' 'capability independent-review start' >>"$git_dir/fixture-state/capability-events"
      head=$(DARROW_CAPABILITY_PROTOCOL=independent-review git rev-parse HEAD)
      notes_digest=$(shasum -a 256 NOTES.md)
      notes_digest=${notes_digest%% *}
      target="WORKTREE@$head+$notes_digest"
      printf '%s\tclear\tcomprehensive\n' "$target" >>"$git_dir/fixture-state/independent-review-invocations"
      printf '%s\n' 'Independent review outcome: no blocking findings'
      printf 'Reviewed target: %s\n' "$target"
      printf '%s\n' 'Summary: The exact final change satisfies ticket 64 and the repository instructions.'
    forge-pr-create: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 1
      git_dir="$PWD/.git"
      printf '%s\n' 'operation create-pr forge create' >>"$git_dir/fixture-state/capability-events"
      printf '%s\t%s\n' "$1" 'https://example.invalid/pull/64' >>"$git_dir/fixture-state/pull-requests"
      printf '%s\n' 'https://example.invalid/pull/64'
    forge-ticket-read: |
      #!/usr/bin/env bash
      set -eu
      test "$#" -eq 2
      git_dir="$PWD/.git"
      if test "${DARROW_CAPABILITY_PROTOCOL:-}" != read-ticket; then
        printf '%s\n' 'raw tracker read' >>"$git_dir/fixture-state/raw-tracker.log"
        exit 2
      fi
      test "$(cat "$git_dir/fixture-ticket-id")" = "$1"
      cp "$git_dir/fixture-ticket.md" "$2"
      printf 'id: %s\nstate: open\ntitle: %s\n' \
        "$1" "$(cat "$git_dir/fixture-ticket-title")"
    git: |
      #!/usr/bin/env bash
      set -eu
      repo=$PWD
      while test ! -d "$repo/.git"; do
        test "$repo" != / || { printf '%s\n' 'fixture git requires a repository' >&2; exit 2; }
        repo=${repo%/*}
        test -n "$repo" || repo=/
      done
      git_dir="$repo/.git"
      real_git=$(sed -n '1p' "$git_dir/real-git-path")
      test -x "$real_git"
      mutating=
      for argument in "$@"; do
        case "$argument" in add|commit|push) mutating=$argument; break ;; esac
      done
      if test -n "${DARROW_CAPABILITY_PROTOCOL:-}"; then
        printf 'operation %s git %s\n' "$DARROW_CAPABILITY_PROTOCOL" "${mutating:-inspect}" >>"$git_dir/fixture-state/capability-events"
      elif test -n "$mutating"; then
        printf 'raw git %s\n' "$mutating" >>"$git_dir/fixture-state/raw-git.log"
      fi
      exec "$real_git" "$@"
    gh: |
      #!/usr/bin/env bash
      set -eu
      git_dir=$(git rev-parse --git-dir)
      case "$git_dir" in /*) ;; *) git_dir="$PWD/$git_dir" ;; esac
      printf '%s\n' "$*" >>"$git_dir/fixture-state/raw-gh.log"
      if test "${1-}" = issue && test "${2-}" = view && test "${3-}" = 64; then
        cat "$git_dir/fixture-ticket.md"
        exit 0
      fi
      if test "${1-}" = pr && test "${2-}" = create; then
        printf '%s\n' 'https://example.invalid/pull/raw'
        exit 0
      fi
      printf '%s\n' "unsupported gh invocation: $*" >&2
      exit 2
  setup: |
    printf '%s\n' '/.agents/' >>.git/info/exclude
    command -v git >.git/real-git-path
    git init --bare .git/fixture-remote.git >/dev/null
    git remote add origin "$PWD/.git/fixture-remote.git"
    git switch -c fix/file-backed-capability-routing >/dev/null
checks:
  - name: ticket capability is invoked exactly once
    run: >-
      test "$(wc -l <.git/fixture-state/read-ticket-capability.log | tr -d ' ')" -eq 1 &&
      test "$(cat .git/fixture-state/read-ticket-capability.log)" = 64 &&
      test ! -s .git/fixture-state/ticketctl.log
  - name: requested behavior is implemented
    run: bash check.sh
  - name: selected independent review remains composed before publication
    run: >-
      test "$(wc -l <.git/fixture-state/independent-review-invocations | tr -d ' ')" -eq 1 &&
      grep -F $'\tclear\tcomprehensive' .git/fixture-state/independent-review-invocations >/dev/null &&
      review_target=$(cut -f1 .git/fixture-state/independent-review-invocations) &&
      review_base=$(git rev-parse HEAD^) &&
      review_notes_digest=$(git show HEAD:NOTES.md | shasum -a 256) &&
      review_notes_digest=${review_notes_digest%% *} &&
      test "$review_target" = "WORKTREE@$review_base+$review_notes_digest"
  - name: commit capability creates the one intended commit
    run: >-
      test "$(wc -l <.git/fixture-state/create-commit-capability.log | tr -d ' ')" -eq 1 &&
      test "$(git rev-list --count HEAD)" -eq 2 &&
      git log -1 --format=%s | grep -E '^(feat|fix|docs|refactor|test|build|ci|chore)(\([^)]+\))?!?: .+' >/dev/null &&
      test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = NOTES.md
  - name: pull-request capability publishes the exact current branch
    run: >-
      test "$(wc -l <.git/fixture-state/create-pr-capability.log | tr -d ' ')" -eq 1 &&
      branch=$(git branch --show-current) &&
      test "$(cat .git/fixture-state/create-pr-capability.log)" = "$branch" &&
      test "$(git --git-dir=.git/fixture-remote.git for-each-ref --format='%(refname)' refs/heads)" = "refs/heads/$branch" &&
      test "$(git --git-dir=.git/fixture-remote.git rev-parse "refs/heads/$branch")" = "$(git rev-parse HEAD)" &&
      test "$(wc -l <.git/fixture-state/pull-requests | tr -d ' ')" -eq 1 &&
      test "$(cut -f1 .git/fixture-state/pull-requests)" = "$branch" &&
      test "$(cut -f2 .git/fixture-state/pull-requests)" = 'https://example.invalid/pull/64'
  - name: capabilities precede every protected operation
    run: >-
      awk '
        $0 == "capability read-ticket start" { read_start = NR }
        $0 == "operation read-ticket ticket get" { read_operation = NR }
        $0 == "check final-tree pass" && !check_pass { check_pass = NR }
        $0 == "capability independent-review start" { review_start = NR }
        $0 == "capability create-commit start" { commit_start = NR }
        $0 == "operation create-commit git add" { add_operation = NR }
        $0 == "operation create-commit git commit" { commit_operation = NR }
        $0 == "capability create-pr start" { pr_start = NR }
        $0 == "operation create-pr git push" { push_operation = NR }
        $0 == "operation create-pr forge create" { pr_operation = NR }
        END {
          exit !(read_start && read_start < read_operation &&
            check_pass && review_start && check_pass < review_start &&
            review_start < commit_start &&
            commit_start < add_operation && add_operation < commit_operation &&
            pr_start && commit_operation < pr_start &&
            pr_start < push_operation && push_operation < pr_operation)
        }
      ' .git/fixture-state/capability-events
  - name: no direct command bypasses the capabilities
    run: >-
      test ! -e .git/fixture-state/raw-tracker.log &&
      test ! -e .git/fixture-state/raw-git.log &&
      test ! -e .git/fixture-state/raw-gh.log
  - name: protected capability tokens exist only in skill instructions
    run: >-
      test "$(rg -l 'skill-contract-v1' .agents/skills/*/SKILL.md | wc -l | tr -d ' ')" -eq 4 &&
      ! rg -q 'skill-contract-v1' .agents/bin
  - name: published tree is clean
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
transcript_checks:
  - name: one separate native owner is accepted
    expect_regex: '"type":"darrow.codex_native_single_agent_accepted"'
  - name: no lifecycle ledger or nested goal is used
    not_regex: 'goal-loop step|Protocol ledger|"tool":"create_goal"'
semantic_output_checks:
  - name: owner reports completion
    proposition: The response reports the requested outcome as complete, with no unresolved blocker or pending decision preventing completion.
