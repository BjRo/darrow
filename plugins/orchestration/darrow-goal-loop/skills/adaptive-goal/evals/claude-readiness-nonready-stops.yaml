id: claude-readiness-nonready-stops
invariant: AGL-P2,AGL-L2,AGL-X1
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Implement the authoritative specification in REQUEST.md.
  Repository policy requires an
  implementation-readiness assessment before mutation, and neither
  implementation nor the separate owner may start on a non-ready verdict.
  Acceptance would be that bash check.sh passes. Keep the result local;
  publication is not authorized.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Readiness policy

          Every adaptive-goal implementation must assess implementation
          readiness before repository mutation.
        .readiness-verdict: |
          needs-decision
        REQUEST.md: |
          # Authoritative request

          Add the exact line `Claude non-ready request completed.` beneath the
          heading in NOTES.md.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'Claude non-ready request completed.' NOTES.md >/dev/null
  setup: >-
    bash "{{case_dir}}/fixtures/install-implementation-readiness.sh" "$PWD"
    "{{case_dir}}/fixtures" claude
checks:
  - name: Claude non-ready verdict stops before mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: Claude returns the complete readiness result
    expect_regex: "^## Implementation readiness[\\s\\S]*\\*\\*Verdict:\\*\\* `needs-decision`[\\s\\S]*### Required next action"
  - name: Claude non-ready result does not claim implementation
    not_regex: "Status:[ \\t]*complete|(?:^|\\r?\\n)Claude non-ready request completed\\.(?=\\r?\\n|$)"
transcript_checks:
  - name: Claude invokes the readiness skill exactly once
    expect_regex: '"name":"Skill"[^\r\n]*"skill":"(?:darrow-readiness-gate:)?assess-implementation-readiness"'
  - name: Claude does not retry readiness without a user resolution
    not_regex: '"name":"Skill"[^\r\n]*"skill":"(?:darrow-readiness-gate:)?assess-implementation-readiness"[\s\S]*"name":"Skill"[^\r\n]*"skill":"(?:darrow-readiness-gate:)?assess-implementation-readiness"'
  - name: Claude launches no owner before ready
    not_regex: '"name":"Agent"[^\r\n]*"subagent_type":"darrow-goal-loop:adaptive-goal-'
  - name: Claude uses no lifecycle ledger
    not_regex: "goal-loop step|darrow-native-goal-report"
