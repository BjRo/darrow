id: claude-readiness-nonready-stops
invariant: AGL-E7,AGL-E10,AGL-L9,AGL-L14,AGL-S6
prompt: >-
  /adaptive-goal Implement the authoritative specification in REQUEST.md. On
  Claude, invoke the $adaptive-goal skill. Repository policy requires an
  implementation-readiness assessment before mutation, and implementation must
  stop on any non-ready verdict. Acceptance would be that bash check.sh passes.
  Select and apply the policy route. Keep the result local; publication is not
  authorized. Follow the skill's numbered Claude launch sequence literally.
  Before its one Agent starts, use only native Read, Glob, or Grep for
  inspection. The repository is `{{repo_dir}}` and the helper directory is
  `{{repo_dir}}/.git/eval-plugin/bin`; no path discovery is needed. Make the
  helper path a resolved literal: do not list, test, search for, assign, or
  derive it, and repeat that exact absolute executable in one standalone Bash
  call per protocol step with no shell variable or command list. Follow the
  ordered start, prepare, route, runner, stage, materialize, release-staging,
  activate sequence exactly once. Make the
  first protocol-bearing Bash call exactly `/bin/bash
  {{repo_dir}}/.git/eval-plugin/bin/goal-loop step start --repo {{repo_dir}}
  --host claude`, then pass its returned ledger path to every subsequent helper
  step. Do not use Bash `pwd` before the owner or `git status` after it. After
  the Agent returns, use only the exact route gate, blocker, and report calls;
  retain any objective while blocked. Never invoke a skill, send a message,
  schedule a wakeup, or retry readiness after the Agent returns. If route
  observation is unavailable, do not call `step block` or attempt a blocked
  report; release the objective, render exactly one truthful `launch-required`
  report, and stop. Wait for the route-gate result before choosing the report
  status. For the non-ready ordering exception, begin the final response with the
  complete implementation-readiness result and place the raw blocked `format:`
  snapshot after it. Add no heading, label, quote, or Markdown code fence before
  or around either result. Paste the Agent's readiness result byte-for-byte:
  do not summarize, reflow, relabel, or omit its Quality bar, finding, evidence,
  or action lines. Make no further tool call after the report succeeds.
  The readiness result already contains the next action; put no explanation,
  ledger summary, or other prose between that result and the `format:` report.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Readiness policy

          Every adaptive-goal implementation must assess implementation
          readiness before repository mutation.
        .readiness-verdict: |
          needs-decision
        REQUEST.md: |
          # Authoritative request

          Add the exact line `Claude non-ready request completed.` beneath the
          heading in NOTES.md.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'Claude non-ready request completed.' NOTES.md >/dev/null
  setup: >-
    bash "{{case_dir}}/fixtures/install-implementation-readiness.sh" "$PWD"
    "{{case_dir}}/fixtures" claude
checks:
  - name: Claude non-ready verdict stops before mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: Claude complete readiness result precedes outer report
    expect_regex: "^## Implementation readiness[\\s\\S]*\\*\\*Verdict:\\*\\* `needs-decision`[\\s\\S]*### Required next action[\\s\\S]*format: darrow-native-goal-report-v1[\\s\\S]*Native goal (?:blocked; valid continuation responses are listed above|requires host launch)\\."
  - name: Claude non-ready result does not claim implementation
    not_regex: "Native goal completed\\.|Claude non-ready request completed\\."
transcript_checks:
  - name: Claude non-ready readiness invokes the capability exactly once
    expect_regex: '"name":"Skill"[^\r\n]*"skill":"assess-implementation-readiness"'
  - name: Claude non-ready readiness does not retry the capability
    not_regex: '"name":"Skill"[^\r\n]*"skill":"assess-implementation-readiness"[\s\S]*"name":"Skill"[^\r\n]*"skill":"assess-implementation-readiness"'
  - name: Claude non-ready readiness uses one foreground goal owner
    expect_regex: '"name":"Agent","id":"([^"]+)","input":\{"subagent_type":"darrow-goal-loop:adaptive-goal-sonnet-5-low","run_in_background":false,"prompt":"- phase: adaptive-goal-runner"\}[\s\S]*"type":"darrow.goal_agent_completion","tool_use_id":"\1"'
  - name: Claude non-ready readiness launches no replacement owner
    not_regex: '"name":"Agent"[^\r\n]*"subagent_type":"darrow-goal-loop:adaptive-goal-(?:sonnet-5-(?:low|medium)|opus-5-high)"[\s\S]*"name":"Agent"[^\r\n]*"subagent_type":"darrow-goal-loop:adaptive-goal-(?:sonnet-5-(?:low|medium)|opus-5-high)"'
