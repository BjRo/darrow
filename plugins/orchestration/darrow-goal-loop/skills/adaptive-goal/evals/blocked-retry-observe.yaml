id: goal-blocked-retry-observes-publication
invariant: AGL-S2
goal_report: forbidden
goal_route_checks: false
prompt: >-
  Use {{skill_invocation}} to decide the next lifecycle action only. The retained
  owner in this same thread is blocked because pull-request creation returned
  an ambiguous result, and the current forge state has not yet been observed.
  The user says "retry" without qualification. What is the retained owner's
  immediate next action? Answer in one sentence.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
checks: []
output_checks:
  - name: observes current publication state
    expect_regex: "(?:observe|check|query|inspect)[^.!?\\n]{0,120}(?:pull[- ]request|PR|publication|forge|remote)"
    flags: i
  - name: does not repeat the effect before observation
    not_regex: "(?:(?<!not[ \\t])(?<!never[ \\t])\\b(?:retry|repeat|reissue|create|open)(?:ing)?[^.!?\\n]{0,30}\\b(?:first|immediately)\\b|(?<!not[ \\t])(?<!never[ \\t])\\b(?:first|immediately)\\b[^.!?\\n]{0,30}\\b(?:retry|repeat|reissue|create|open)(?:ing)?\\b|(?<!not[ \\t])(?<!never[ \\t])\\b(?:retry|repeat|reissue|create|open)(?:ing)?\\b[^.!?\\n]{0,50}\\b(?:then|before)\\b[^.!?\\n]{0,50}\\b(?:observe|check|query|inspect)\\b)"
    flags: i
transcript_checks:
  - name: advice-only invocation launches no owner or helper
    not_regex: '"tool":"spawn_agent"|"name":"Agent"|goal-loop (?:prepare|route|step)'
