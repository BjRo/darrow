id: goal-blocked-retry-observes-publication
invariant: AGL-L4,AGL-S2,AGL-X1
goal_report: forbidden
goal_route_checks: false
prompt: >-
  Use {{skill_invocation}} to decide the next lifecycle action only. The retained
  owner in this same thread is blocked because pull-request creation returned
  an ambiguous result. The user says "retry" without qualification. Explain
  the permitted retry behavior and how duplicate publication is prevented.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
checks: []
output_checks:
  - name: preserves a semantic blocker rather than inventing retry state
    expect_regex: "(blocked|blocker)[\\s\\S]{0,180}(ambiguous|pull request|publication)[\\s\\S]{0,180}(observe|check|query|inspect|next action)"
    flags: i
  - name: observes ambiguous publication before retry
    expect_regex: "(observe|check|query|inspect)[\\s\\S]{0,160}(external[\\s\\S]{0,40}state|pull request|publication|remote)"
    flags: i
  - name: maps observed completion without duplicating the effect
    expect_regex: "(already|has)[\\s\\S]{0,80}(completed|exists|created)[\\s\\S]{0,120}(do not|must not|without)[\\s\\S]{0,80}(retry|repeat|duplicate)"
    flags: i
  - name: maps observed absence to one retry
    expect_regex: "(not|has not)[\\s\\S]{0,80}(completed|exists|created)[\\s\\S]{0,120}(one|single)[\\s\\S]{0,40}(retry|attempt)"
    flags: i
  - name: limits retry to the exact failed operation
    expect_regex: "(one|single)[\\s\\S]{0,40}(attempt|retry)|exact failed operation"
    flags: i
transcript_checks:
  - name: advice-only invocation launches no owner or helper
    not_regex: '"tool":"spawn_agent"|"name":"Agent"|goal-loop (?:prepare|route|step)'
