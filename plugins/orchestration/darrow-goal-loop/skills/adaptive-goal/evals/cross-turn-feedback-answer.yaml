id: goal-cross-turn-feedback-answer
invariant: AGL-L13,AGL-X3
goal_report: optional
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Add an exported migrationMode() function to
  src/migration.js that returns `strict`. This leading command is the explicit
  orchestration invocation. On Claude, make its Skill call the first tool call;
  on Codex, select the routine policy route. Run no inspection, shell command,
  or mutation before that invocation. The owner must run `decisionctl discover` before
  editing production code. When it reports a material product question, keep
  that exact owner active, surface its complete human-feedback request, and end
  the parent turn without recording a blocker. When the user's answer arrives
  in a later turn of this same host thread, relay its exact text to that retained
  owner without starting another goal or repeating preflight. The resumed owner
  must acknowledge the exact answer through decisionctl before mutation, finish
  the implementation, run `bash test.sh`, and keep the result local. On Claude,
  follow the skill's numbered Claude launch sequence literally. The repository
  is `{{repo_dir}}` and the helper directory is
  `{{repo_dir}}/.git/eval-plugin/bin`; no path discovery is needed. Before the
  first Agent, use only native Read, Glob, or Grep for inspection and make one
  standalone helper call per protocol step—no shell variables, redirects,
  command lists, or derived paths. The supplied paths are authoritative: do not
  call Bash `ls`, `pwd`, `find`, `command`, `which`, or `cat`, and do not inspect
  or probe `decisionctl`. Make the first protocol-bearing Bash call exactly
  `/bin/bash {{repo_dir}}/.git/eval-plugin/bin/goal-loop step start --repo
  {{repo_dir}} --host claude`, then use its returned ledger in the exact ordered
  prepare, route, runner, stage, materialize, release-staging, and activate
  calls. Launch exactly one foreground Agent with the exact selected runner and
  materialized objective. When it returns a valid feedback request, use only the
  exact route gate, retain its reported id and objective, surface the question,
  and end the turn. After the later answer, call SendMessage exactly once with
  that id, the skill's fixed feedback summary, and the feedback-response marker
  followed by the exact answer. Do not invoke Agent again, call a blocker
  transition, or use ScheduleWakeup. Yield until the task notification for that
  id, then use only objective release when applicable and the exact complete
  report call. On Codex, do not call close_agent or interrupt_agent while
  feedback is pending; in the later turn call followup_task exactly once for the
  retained agent reference and then wait_agent for its result.
follow_up_prompt: "Use the strict migration policy."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash test.sh` for migration behavior changes. During
          implementation run `decisionctl discover` before editing production
          code. Its reported migration-policy question is product-owned. Pause
          without mutating or blocking until the same owner receives the exact
          user answer. Then run `decisionctl acknowledge migration-policy
          "Use the strict migration policy."` before editing production code.
        package.json: '{"type":"module"}'
        src/migration.js: |
          export const identity = (value) => value;
        test/migration.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity, migrationMode } from "../src/migration.js";

          test("identity", () => assert.equal(identity("v"), "v"));
          test("uses the strict migration mode", () => {
            assert.equal(migrationMode(), "strict");
          });
        test.sh: |
          #!/usr/bin/env bash
          node --test test/migration.test.js
  bin:
    decisionctl: |
      #!/usr/bin/env bash
      set -eu
      git_dir=$(git rev-parse --git-dir)
      trace="$git_dir/cross-turn-feedback-trace"
      state="$git_dir/cross-turn-feedback-state"
      case "${1-}" in
        discover)
          test "$#" -eq 1
          test ! -e "$state"
          git hash-object src/migration.js >"$state"
          printf 'discover\tmigration-policy\t%s\n' "$(cat "$state")" >>"$trace"
          printf '%s\n' \
            'feedback_required' \
            'id: migration-policy' \
            'question: Which migration policy should this product use?'
          ;;
        acknowledge)
          test "$#" -eq 3
          test "${2-}" = migration-policy
          test "${3-}" = 'Use the strict migration policy.'
          test -s "$state"
          test "$(git hash-object src/migration.js)" = "$(cat "$state")"
          test "$(grep -c '^acknowledge.' "$trace" 2>/dev/null || true)" -eq 0
          printf 'acknowledge\tmigration-policy\t%s\t%s\n' \
            "${3-}" "$(git hash-object src/migration.js)" >>"$trace"
          ;;
        *)
          printf '%s\n' \
            'usage: decisionctl discover|acknowledge <id> <exact-answer>' >&2
          exit 64
          ;;
      esac
checks:
  - name: resumed owner implements the approved migration behavior
    run: bash test.sh
  - name: discovery precedes exact same-owner acknowledgement and mutation
    run: |
      awk -F '\t' '
        NR == 1 && $1 == "discover" && $2 == "migration-policy" {
          before = $3; next
        }
        NR == 2 && $1 == "acknowledge" && $2 == "migration-policy" &&
          $3 == "Use the strict migration policy." && $4 == before {
          ok = 1
        }
        END { exit ok && NR == 2 ? 0 : 1 }
      ' .git/cross-turn-feedback-trace
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1 && test -z "$(git remote)"
transcript_checks:
  - name: a real owner pauses before the later host turn
    expect_regex: '(?:"type":"darrow.goal_agent_completion"[^\n]*"agent_id":"([^"]+)"[^\n]*"feedback_pending":true|"tool":"spawn_agent"[^\n]*"status":"completed"[^\n]*"receiver_thread_ids":\["([^"]+)"\])[\s\S]*"type":"darrow.eval.follow_up_turn"'
  - name: the later turn relays to and completes the retained owner
    expect_regex: '(?:"type":"darrow.goal_agent_completion"[^\n]*"agent_id":"([^"]+)"[^\n]*"feedback_pending":true[\s\S]*"type":"darrow.eval.follow_up_turn"[\s\S]*"type":"darrow.human_feedback_relay"[^\n]*"answer":"Use the strict migration policy\."[^\n]*"agent_id":"\1"[^\n]*"same_owner":true[\s\S]*"type":"darrow.goal_agent_resumption"[^\n]*"agent_id":"\1"[^\n]*"status":"completed"[^\n]*"same_owner":true|"tool":"spawn_agent"[^\n]*"status":"completed"[^\n]*"receiver_thread_ids":\["([^"]+)"\][\s\S]*"type":"darrow.eval.follow_up_turn"[\s\S]*"tool":"send_input"[^\n]*"receiver_thread_ids":\["\2"\][^\n]*"prompt":"- phase: human-feedback-response")'
  - name: later turn creates no replacement owner or blocker transition
    not_regex: '"type":"darrow.eval.follow_up_turn"[\s\S]*(?:"tool":"(?:spawn_agent|interrupt_agent)"|"name":"Agent"|step\\tblock|"status":"blocked")'
  - name: later turn issues exactly one continuation call
    not_regex: '(?:"type":"darrow.human_feedback_relay"[^\n]*[\s\S]*"type":"darrow.human_feedback_relay"|"type":"darrow.parent_repository_tool_after_goal"[^\n]*"tool":"SendMessage"|"type":"darrow.eval.follow_up_turn"[\s\S]*"tool":"send_input"[^\n]*[\s\S]*"tool":"send_input")'
