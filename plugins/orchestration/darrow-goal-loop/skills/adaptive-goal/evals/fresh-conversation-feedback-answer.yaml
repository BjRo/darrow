id: goal-fresh-conversation-feedback-answer-requires-invocation
invariant: AGL-L13,AGL-X3
goal_report: forbidden
prompt: >-
  /fresh-feedback-parent An adaptive goal in a different, already destroyed
  conversation had asked which migration policy to use. This fresh conversation
  contains no retained owner, objective, blocker, or pending feedback question.
  The user says only "Use the strict migration policy." Invoke the
  $fresh-feedback-parent helper and return its result unchanged.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "base\n"
        .claude/skills/fresh-feedback-parent/SKILL.md: &parent_skill |
          ---
          name: fresh-feedback-parent
          description: Exercise adaptive-goal authority for an answer from a different conversation. Use only when explicitly invoked for this fixture.
          disable-model-invocation: true
          ---

          # Fresh feedback parent

          Invoke the installed adaptive-goal skill exactly once. Preserve that
          the user did not invoke orchestration and that this fresh conversation
          has no retained owner, objective, blocker, or pending feedback
          question. Return the invoked skill's response byte-for-byte without
          preamble, explanation, or follow-up prose. Do not run repository work.
        .agents/skills/fresh-feedback-parent/SKILL.md: *parent_skill
        .agents/skills/fresh-feedback-parent/agents/openai.yaml: |
          interface:
            display_name: "Fresh Feedback Parent"
            short_description: "Exercise fresh-conversation feedback authority"
            default_prompt: "Use $fresh-feedback-parent for this authority probe."
          policy:
            allow_implicit_invocation: false
checks: []
output_checks:
  - name: fresh answer requires explicit orchestration invocation
    expect_regex: "format: darrow-adaptive-goal-authority-stop-v1[\\s\\S]*status: invocation_required[\\s\\S]*reason: explicit-orchestration-entrypoint-required"
  - name: fresh answer starts no adaptive owner
    not_regex: "darrow-native-goal-preflight|selected_route|launch_boundary"
transcript_checks:
  - name: owning adaptive skill is actually invoked before refusing
    expect_regex: '(?:"name":"Skill"[^\n]*"skill":"[^"]*adaptive-goal"|"type":"darrow.skill_read_probe"[^\n]*"skill":"adaptive-goal"[^\n]*"status":"completed")'
