id: goal-readiness-iterative-resolution
invariant: AGL-P2,AGL-L2,AGL-L1,AGL-X1
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Implement the authoritative REQUEST.md. It has not been
  assessed for implementation readiness, and its required safe-or-fast choice
  is unresolved. Stop before mutation and owner launch if readiness is not
  ready, then continue this same goal only after I resolve the finding.
follow_up_prompt: >-
  Choose safe mode. That is my resolution of the readiness finding for this
  same unchanged request; assess the now-resolved scope again and, if ready,
  continue the same explicitly invoked adaptive goal. Acceptance is that bash
  check.sh passes. Keep the result local.
fixture:
  commits:
    - message: "chore: init"
      files:
        .readiness-verdict: |
          needs-decision-then-ready
        REQUEST.md: |
          # Authoritative request

          Write the user-selected `safe` or `fast` mode to policy.txt.
        policy.txt: |
          mode = undecided
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'mode = safe' policy.txt >/dev/null
  setup: >-
    bash "{{case_dir}}/fixtures/install-implementation-readiness.sh" "$PWD"
    "{{case_dir}}/fixtures" codex
checks:
  - name: resolved request is implemented
    run: bash check.sh
  - name: readiness runs once before and once after resolution
    run: test "$(wc -l <.git/implementation-readiness-invocations | tr -d ' ')" -eq 2
output_checks:
  - name: resolved same goal completes
    expect_regex: "Status:[ \\t]*complete[\\s\\S]*Readiness:[^\n]*(?:ready|passed)"
    flags: i
transcript_checks:
  - name: readiness starts before resolution and owner launch follows it
    expect_regex: '"skill":"(?:darrow-readiness-gate:)?assess-implementation-readiness"[\s\S]*"type":"darrow.eval.follow_up_turn"[\s\S]*"type":"darrow.goal_owner_accepted"'
  - name: no owner launches before the user resolves the finding
    not_regex: '"type":"darrow.goal_owner_accepted"[\s\S]*"type":"darrow.eval.follow_up_turn"'
  - name: no lifecycle ledger is used
    not_regex: "goal-loop step|Protocol ledger"
