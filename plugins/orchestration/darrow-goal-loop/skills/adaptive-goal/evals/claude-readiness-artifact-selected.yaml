id: claude-readiness-artifact-selected
invariant: AGL-P13,AGL-E10,AGL-L9,AGL-L14,AGL-S6
prompt: >-
  /adaptive-goal Implement the unassessed authoritative specification in
  REQUEST.md. On Claude, invoke the $adaptive-goal skill. Acceptance is that
  bash check.sh passes. Select and apply the policy route. Keep the result
  local; publication is not authorized. Follow the skill's numbered Claude
  launch sequence literally. Before its one Agent starts, use only native Read,
  Glob, or Grep for inspection. The repository is `{{repo_dir}}` and the helper
  directory is `{{repo_dir}}/.git/eval-plugin/bin`; no path discovery is
  needed. Make the first protocol-bearing Bash call exactly `/bin/bash
  {{repo_dir}}/.git/eval-plugin/bin/goal-loop step start --repo {{repo_dir}}
  --host claude`, then pass its returned ledger path to every subsequent helper
  step. Do not use Bash `pwd` before the owner or `git status` after it. After
  the Agent returns, use only the exact route gate, objective-release when
  required, and terminal report calls. Begin the final response directly with
  the raw `format:` report line.
fixture:
  commits:
    - message: "chore: init"
      files:
        .readiness-verdict: |
          ready
        REQUEST.md: |
          # Authoritative request

          Add the exact line `Claude artifact request completed.` beneath the
          heading in NOTES.md.
        NOTES.md: |
          # Notes
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          printf '%s\n' '# Notes' 'Claude artifact request completed.' >.git/expected-notes
          cmp -s .git/expected-notes NOTES.md
  setup: >-
    bash "{{case_dir}}/fixtures/install-implementation-readiness.sh" "$PWD"
    "{{case_dir}}/fixtures" claude
checks:
  - name: Claude artifact request reaches its exact outcome
    run: bash check.sh
output_checks:
  - name: Claude selected readiness reports its truthful route outcome
    expect_regex: "^format: darrow-native-goal-report-v1[\\s\\S]*Native goal (?:completed|requires host launch)\\."
  - name: Claude result omits internal readiness records
    not_regex: "readiness_selection\\t|readiness_verdict\\t"
transcript_checks:
  - name: Claude selected readiness invokes the capability exactly once
    expect_regex: '"name":"Skill"[^\r\n]*"skill":"assess-implementation-readiness"'
  - name: Claude selected readiness does not retry the capability
    not_regex: '"name":"Skill"[^\r\n]*"skill":"assess-implementation-readiness"[\s\S]*"name":"Skill"[^\r\n]*"skill":"assess-implementation-readiness"'
  - name: Claude selected readiness uses one foreground goal owner
    expect_regex: '"name":"Agent","id":"([^"]+)","input":\{"subagent_type":"darrow-goal-loop:adaptive-goal-sonnet-5-low","run_in_background":false,"prompt":"- phase: adaptive-goal-runner"\}[\s\S]*"type":"darrow.goal_agent_completion","tool_use_id":"\1"'
  - name: Claude selected readiness launches no replacement owner
    not_regex: '"name":"Agent"[^\r\n]*"subagent_type":"darrow-goal-loop:adaptive-goal-(?:sonnet-5-(?:low|medium)|opus-5-high)"[\s\S]*"name":"Agent"[^\r\n]*"subagent_type":"darrow-goal-loop:adaptive-goal-(?:sonnet-5-(?:low|medium)|opus-5-high)"'
