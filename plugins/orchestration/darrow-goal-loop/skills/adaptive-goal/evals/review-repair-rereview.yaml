id: goal-review-repair-verification
invariant: AGL-C2,AGL-L2,AGL-L5,AGL-S3
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Continue the existing candidate in src/config.js. Treat the existing candidate as ready for its
  first final review: run `bash check.sh`, then independently review its exact
  current content before changing or completing it. The approved outcome is
  TIMEOUT_MS equal to 2500, while RETRY_COUNT must remain 3. On a blocking
  finding, repair it under the existing authorization to edit src/config.js,
  rerun `bash check.sh`, and request fix-scoped verification of that attempted
  finding against the changed target fingerprint. If verification is
  unavailable or inconclusive, stop. Complete only after exact-target clear
  verification. Every check, review, and edit named here belongs to the
  activated goal owner; the classifier must compile those steps and activate
  that owner before executing any of them. Select and apply the
  policy route. Keep the result local; commits, pushes, pull requests, and other
  publication are not authorized.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash check.sh` for configuration changes.
        src/config.js: |
          export const TIMEOUT_MS = 1000;
          export const RETRY_COUNT = 3;
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -Fx 'export const TIMEOUT_MS = 2500;' src/config.js >/dev/null
          git_dir=$(git rev-parse --git-dir)
          subject_oid=$(git hash-object src/config.js)
          printf 'check\t%s\n' "$subject_oid" >>"$git_dir/fixture-state/review-events"
  files:
    src/config.js: |
      export const TIMEOUT_MS = 2500;
      export const RETRY_COUNT = 0;
  setup: >-
    bash "{{case_dir}}/fixtures/install-independent-review.sh" "$PWD"
    "{{case_dir}}/fixtures" codex && printf '%s\n' 'RETRY_COUNT = 0' >
    .git/fixture-review-reject-pattern && printf '%s\n' 'src/config.js' >
    .git/fixture-review-event-path && printf '%s\n' '2' >
    .git/fixture-review-delay-seconds
checks:
  - name: authorized repair reaches the approved outcome
    run: |
      bash check.sh
      printf '%s\n' \
        'export const TIMEOUT_MS = 2500;' \
        'export const RETRY_COUNT = 3;' >.git/expected-config.js
      cmp -s .git/expected-config.js src/config.js
  - name: blocking target is repaired and fix verified
    run: |
      # Keep bounded synthetic protocol evidence for sequence-failure diagnosis.
      tail -n 20 .git/fixture-state/independent-review-invocations .git/fixture-state/review-events >&2
      test "$(wc -l <.git/fixture-state/independent-review-invocations | tr -d ' ')" -eq 2 &&
      test "$(cut -f2 .git/fixture-state/independent-review-invocations | sed -n '1p')" = blocking &&
      test "$(cut -f2 .git/fixture-state/independent-review-invocations | sed -n '2p')" = clear &&
      test "$(cut -f3 .git/fixture-state/independent-review-invocations | sed -n '1p')" = comprehensive &&
      test "$(cut -f3 .git/fixture-state/independent-review-invocations | sed -n '2p')" = verify
  - name: invalidated checks run before each review
    run: >-
      awk -F '\t' '
      $1 == "check" {
        last_check = $2
        if (stage == 1 && $2 != initial) { final = $2; stage = 2 }
        next
      }
      $1 == "review" && $2 == "blocking" && stage == 0 && last_check == $3 {
        initial = $3; stage = 1; next
      }
      $1 == "review" && $2 == "clear" && stage == 2 && final == $3 {
        stage = 3
      }
      END { exit stage == 3 && initial != final ? 0 : 1 }
      ' .git/fixture-state/review-events
  - name: goal owner waits for each review response before changing content
    run: >-
      awk -F '\t' '
      $1 == "review_start" && !active { start = $2; active = 1; next }
      $1 == "review_start" { bad = 1; next }
      $1 == "review_end" && active && $2 == start { complete++; active = 0; next }
      $1 == "review_end" { bad = 1 }
      END { exit !bad && !active && complete == 2 ? 0 : 1 }
      ' .git/fixture-state/review-events
  - name: final worktree still matches the clear reviewed target
    run: >-
      test "$(tail -n 1 .git/fixture-state/independent-review-invocations | cut -f1)" =
      "$(bash .agents/bin/independent-review-fixture "$PWD" fingerprint)"
  - name: repair changes the reviewed target fingerprint
    run: >-
      cut -f1 .git/fixture-state/independent-review-invocations | sort -u >.git/fixture-state/review-targets &&
      test "$(wc -l <.git/fixture-state/review-targets | tr -d ' ')" -eq 2
  - name: repair and fix verification stay local
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: no lifecycle protocol is reported
    not_regex: "darrow-native-goal-report|Protocol ledger|route_verified"
semantic_output_checks:
  - name: owner reports completion after bounded repair verification
    proposition: The response reports the requested outcome as complete, with no unresolved blocker or pending decision preventing completion.
  - name: completion reports the clear fix-verification outcome
    proposition: The response says fix verification cleared the repaired change.
  - name: completion reports the prior blocking finding
    proposition: >-
      In this case, the review finding is RETRY_COUNT = 0 instead of the required
      3. The response conveys that review found this wrong retry count, numerically
      or as a retry-count defect. Merely listing the final value 3 or the final
      clear review verdict is insufficient.
transcript_checks:
  - name: no lifecycle ledger or nested goal is used
    not_regex: 'goal-loop step|Protocol ledger|"tool":"create_goal"'
