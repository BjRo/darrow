id: goal-readiness-required-unavailable
invariant: ADL-L2,ADL-X1
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Implement the authoritative specification in REQUEST.md.
  The specification has not previously
  been assessed for implementation readiness. Acceptance is that `bash
  check.sh` passes. Select and apply the policy route. Keep the result local;
  commits, pushes, pull requests, and other publication are not authorized.
fixture:
  commits:
    - message: "chore: init"
      files:
        REQUEST.md: |
          # Authoritative request

          Change `enabled` in policy.js from false to true.
        policy.js: |
          export const enabled = false;
        check.sh: |
          #!/usr/bin/env bash
          set -eu
          grep -F 'enabled = true' policy.js >/dev/null
checks:
  - name: unavailable readiness stops before mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: unavailable readiness creates no commit
    run: test "$(git rev-list --count HEAD)" -eq 1
semantic_output_checks:
  - name: unavailable readiness stops launch
    proposition: The response reports that launch cannot proceed or is launch_required because the readiness capability or boundary is unavailable.
  - name: stop identifies unavailable readiness
    proposition: The response identifies the required implementation-readiness capability or boundary as unavailable.
transcript_checks:
  - name: unavailable readiness stops before generic delegation
    not_regex: '"tool":"spawn_agent"|"type":"(?:darrow\.codex_native_spawn|darrow\.codex_native_single_agent_accepted|darrow\.goal_agent_completion)"'
  - name: unavailable readiness uses no lifecycle ledger
    not_regex: "goal-loop step|darrow-native-goal-report"
