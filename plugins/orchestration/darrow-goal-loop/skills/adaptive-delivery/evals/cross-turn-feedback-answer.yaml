id: goal-cross-turn-feedback-answer
activation: positive
invariant: ADL-L1,ADL-L3,ADL-L5,ADL-X1
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Add an exported migrationMode() function to
  src/migration.js that returns `strict`. The separate owner must run
  `decisionctl discover` before editing. When it returns a material product
  question, keep that exact owner available, surface the question, and end the
  turn without mutation. When the user's answer arrives in this same host
  thread, relay its exact text to that retained owner rather than launching a
  replacement or repeating preflight. The resumed owner must acknowledge the
  answer through decisionctl, implement the change, run `bash test.sh`, and
  keep the result local.
follow_up_prompt: "Use the strict migration policy."
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Run `bash test.sh` for migration behavior changes. During
          implementation run `decisionctl discover` before editing production
          code. Its reported migration-policy question is product-owned. Pause
          without mutating or blocking until the same owner receives the exact
          user answer. Then run `decisionctl acknowledge migration-policy
          "Use the strict migration policy."` before editing production code.
        package.json: '{"type":"module"}'
        src/migration.js: |
          export const identity = (value) => value;
        test/migration.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity, migrationMode } from "../src/migration.js";

          test("identity", () => assert.equal(identity("v"), "v"));
          test("uses the strict migration mode", () => {
            assert.equal(migrationMode(), "strict");
          });
        test.sh: |
          #!/usr/bin/env bash
          node --test test/migration.test.js
  bin:
    decisionctl: |
      #!/usr/bin/env bash
      set -eu
      git_dir=$(git rev-parse --git-dir)
      trace="$git_dir/fixture-state/cross-turn-feedback-trace"
      state="$git_dir/cross-turn-feedback-state"
      case "${1-}" in
        discover)
          test "$#" -eq 1
          test ! -e "$state"
          git hash-object src/migration.js >"$state"
          printf 'discover\tmigration-policy\t%s\n' "$(cat "$state")" >>"$trace"
          printf '%s\n' \
            'feedback_required' \
            'id: migration-policy' \
            'question: Which migration policy should this product use?'
          ;;
        acknowledge)
          test "$#" -eq 3
          test "${2-}" = migration-policy
          test "${3-}" = 'Use the strict migration policy.'
          test -s "$state"
          test "$(git hash-object src/migration.js)" = "$(cat "$state")"
          test "$(grep -c '^acknowledge.' "$trace" 2>/dev/null || true)" -eq 0
          printf 'acknowledge\tmigration-policy\t%s\t%s\n' \
            "${3-}" "$(git hash-object src/migration.js)" >>"$trace"
          ;;
        *)
          printf '%s\n' \
            'usage: decisionctl discover|acknowledge <id> <exact-answer>' >&2
          exit 64
          ;;
      esac
checks:
  - name: resumed owner implements the approved migration behavior
    run: bash test.sh
  - name: discovery precedes exact same-owner acknowledgement and mutation
    run: |
      awk -F '\t' '
        NR == 1 && $1 == "discover" && $2 == "migration-policy" {
          before = $3; next
        }
        NR == 2 && $1 == "acknowledge" && $2 == "migration-policy" &&
          $3 == "Use the strict migration policy." && $4 == before {
          ok = 1
        }
        END { exit ok && NR == 2 ? 0 : 1 }
      ' .git/fixture-state/cross-turn-feedback-trace
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1 && test -z "$(git remote)"
transcript_checks:
  # Native delivery is opaque. Task evidence also requires the fixture
  # acknowledgement, unchanged pre-feedback worktree, and no parent work.
  - name: native source is unchanged at the actual feedback boundary
    expect_regex: '"type":"darrow.eval.follow_up_turn"[^\n]*"pre_feedback_worktree_unchanged":true|"type":"darrow.goal_agent_completion"'
  - name: one accepted owner exists before the feedback boundary
    expect_regex: '(?:"type":"darrow.goal_agent_completion"[^\n]*"status":"completed"[^\n]*"agent_id":"[^"]+"[\s\S]*"type":"darrow.eval.follow_up_turn"|"tool":"spawn_agent"[^\n]*"status":"completed"[^\n]*"receiver_thread_ids":\["[^"]+"\][^\n]*"prompt":"- phase: adaptive-delivery-owner"[\s\S]*"type":"darrow.eval.follow_up_turn"|"type":"darrow.codex_native_single_agent_accepted"[^\n]*"accepted_before_follow_up":true)'
  - name: later turn targets the retained owner; native delivery remains unverified
    expect_regex: '(?:"type":"darrow.goal_agent_completion"[^\n]*"agent_id":"([^"]+)"[\s\S]*"type":"darrow.human_feedback_request"[^\n]*"agent_id":"\1"[^\n]*"question_present":true[\s\S]*"type":"darrow.eval.follow_up_turn"[\s\S]*"type":"darrow.human_feedback_relay"[^\n]*"agent_id":"\1"[^\n]*"same_owner":true[\s\S]*"type":"darrow.goal_agent_resumption"[^\n]*"agent_id":"\1"[^\n]*"status":"completed"[^\n]*"same_owner":true|"tool":"spawn_agent"[^\n]*"status":"completed"[^\n]*"receiver_thread_ids":\["([^"]+)"\][^\n]*"agent_ref":"\2"[\s\S]*"type":"darrow.eval.follow_up_turn"[\s\S]*"tool":"(?:followup_task|send_input)"[^\n]*"status":"completed"[^\n]*"receiver_thread_ids":\["\2"\][^\n]*"agent_ref":"\2"|"type":"darrow.codex_native_single_agent_accepted"[^\n]*"agent_ref":"([^"]+)"[\s\S]*"type":"darrow.codex_native_feedback"[^\n]*"tool":"(?:followup_task|send_message)"[^\n]*"agent_ref":"\3"[^\n]*"same_owner":true[^\n]*"after_follow_up":true[^\n]*"delivery":"unverified")'
  - name: later turn creates no replacement owner or lifecycle transition
    not_regex: '"type":"darrow.eval.follow_up_turn"[\s\S]*(?:"type":"darrow.parent_spawn_after_goal"|"tool":"spawn_agent"|goal-loop step|Protocol ledger|"tool":"create_goal")'
semantic_output_checks:
  - name: resumed owner reports completion
    proposition: The response reports the requested outcome as complete, with no unresolved blocker or pending decision preventing completion.
