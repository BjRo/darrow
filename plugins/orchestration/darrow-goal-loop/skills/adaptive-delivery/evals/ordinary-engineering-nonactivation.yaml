id: goal-ordinary-engineering-does-not-activate
invariant: ADL-P1,ADL-P3
activation: negative
goal_report: forbidden
goal_route_checks: false
prompt: >-
  Add an exported triple(value) function to src/math.js and a focused test for
  a negative number. Acceptance is that bash test.sh passes. Keep the change
  local.
fixture:
  commits:
    - message: "chore: init"
      files:
        package.json: '{"type":"module"}'
        src/math.js: |
          export const identity = (value) => value;
        test/math.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity } from "../src/math.js";
          test("identity", () => assert.equal(identity(-2), -2));
        test.sh: |
          #!/usr/bin/env bash
          node --test test/math.test.js
checks:
  - name: ordinary request is implemented directly
    run: >-
      node --input-type=module -e
      "import('./src/math.js').then(({triple}) => {
      if (triple(-4) !== -12) process.exit(1) })" && bash test.sh
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
transcript_checks:
  - name: adaptive-delivery is not selected for ordinary engineering intent
    not_regex: '"skill":"adaptive-delivery"|goal-loop prepare|"type":"(?:darrow\.codex_native_spawn|darrow\.codex_native_single_agent_accepted|darrow\.goal_agent_completion)"|"name":"Agent"[^\n]*"adaptive-delivery-owner"'
