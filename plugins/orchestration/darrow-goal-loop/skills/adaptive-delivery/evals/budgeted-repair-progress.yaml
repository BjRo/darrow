id: goal-budgeted-repair-progress
invariant: ADL-A4,ADL-S3
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Advice only; do not launch or perform work. The retained
  owner has an explicit contract budget of two closed-set repair attempts and
  has used one. Fix verification confirms one original blocker resolved and
  narrows the remaining original blocker to a missed null input. Repairing it
  is within scope and authority. What should the owner do next, and may it
  publish before that verification clears?
fixture:
  commits:
    - message: "chore: init"
      files:
        NOTES.md: "preserved\n"
checks:
  - name: advice leaves repository unchanged
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: remaining budget and material progress permit another repair
    proposition: The response permits the retained owner to use the one remaining repair attempt on the remaining original blocker. It need not label this attempt 'final' or restate the budget arithmetic. Do not pass advice that authorizes attempts beyond the stated total budget of two.
  - name: publication waits for clear fix verification
    proposition: The response withholds publication until fix verification clears the repaired content.
  - name: advice does not waive required verification
    proposition: The response does not authorize bypassing required checks or fix verification. It need not restate each prerequisite or every completion step in this advice-only answer.
transcript_checks:
  - name: advice launches no agent
    not_regex: '"tool":"spawn_agent"|"type":"darrow.codex_native_spawn"|"type":"darrow.goal_agent_completion"'
