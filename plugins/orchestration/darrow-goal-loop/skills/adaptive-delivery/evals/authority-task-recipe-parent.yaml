id: goal-preflight-authority-task-recipe-parent
invariant: ADL-P1,ADL-P3,ADL-P4,ADL-L1
goal_report: forbidden
goal_route_checks: false
prompt: >-
  The user explicitly invoked a ticket-to-PR orchestration recipe. That recipe
  delegates this one bounded request to adaptive-delivery: add the exact line
  `Delegated request completed.` after `base` in README.md, run `bash check.sh`,
  and keep the result local. The delegating recipe grants local edit and
  verification authority but no branch, commit, push, pull-request, or other
  publication authority. Continue through one route-selected subagent owner.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: |
          base
        check.sh: |
          #!/usr/bin/env bash
          printf '%s\n' 'base' 'Delegated request completed.' >.git/expected-readme
          cmp -s .git/expected-readme README.md
checks:
  - name: delegated bounded request is implemented
    run: bash check.sh
  - name: delegation adds no publication authority
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: delegation is not mistaken for ordinary intent
    not_regex: "darrow-adaptive-delivery-authority-stop-v1"
transcript_checks:
  - name: delegated work receives one separate Codex owner
    expect_regex: '"type":"(?:darrow\.codex_native_single_agent_accepted|darrow\.goal_agent_completion)"'
  - name: no lifecycle ledger or nested goal is used
    not_regex: 'goal-loop step|Protocol ledger|"tool":"create_goal"'
semantic_output_checks:
  - name: explicit orchestration delegation is accepted
    proposition: The response reports the requested outcome as complete, with no unresolved blocker or pending decision preventing completion.
