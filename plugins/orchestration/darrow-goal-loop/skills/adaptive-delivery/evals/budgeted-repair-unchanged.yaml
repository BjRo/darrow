id: goal-budgeted-repair-unchanged
invariant: ADL-A4,ADL-S3
goal_report: forbidden
goal_route_checks: false
prompt: >-
  {{skill_invocation}} Advice only; do not launch or perform work. The retained
  owner has a budget of three repair attempts and has used one. Fix verification
  reports the same blockers and unchanged evidence, without resolving anything
  or narrowing the cause. Publication was authorized for a verified change.
  What is the owner's next action?
fixture:
  commits:
    - message: "chore: init"
      files:
        NOTES.md: "preserved\n"
checks:
  - name: advice leaves repository unchanged
    run: test -z "$(git status --porcelain)"
semantic_output_checks:
  - name: budget alone does not authorize ineffective retries
    proposition: The response stops further repair attempts on unchanged evidence and prohibits completing or publishing the uncleared change. It need not restate the unused numeric budget already supplied by the prompt.
