id: ticket-pipeline-normal-ticket-delivery
invariant: TP-D1,TP-A1,TP-T1,TP-P1,TP-E1,TP-V1,TP-C1
mount_plugin_skills: true
prompt: >-
  Explicitly invoke {{skill_invocation}} for ticket 7 in the current repository.
  A backend-neutral ticket capability is installed as `ticketctl`; discover
  its exact read and description-replacement interface with `ticketctl help`.
  Deliver the ticket through fresh phase agents, keep publication outside the
  authorized local-tree and ticket-description boundary, and stop only with
  honest final-tree evidence.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash test.sh` for JavaScript changes. Do not commit, push, or edit tracker state during ticket pipeline verification.
        package.json: '{"type":"module"}'
        src/math.js: |
          export const identity = (value) => value;
        test/math.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity } from "../src/math.js";

          test("identity", () => assert.equal(identity(-2), -2));
        test.sh: |
          #!/usr/bin/env bash
          node --test test/math.test.js
  bin:
    ticketctl: |
      #!/usr/bin/env bash
      set -euo pipefail
      git_dir=$(git rev-parse --git-dir)
      body="$git_dir/fixture-ticket.md"
      log="$git_dir/ticketctl.log"
      usage() {
        printf '%s\n' \
          'ticketctl get <id> --body-file <output>' \
          'ticketctl describe <id> --body-file <input>' \
          'The interface is backend-neutral. Only description replacement is supported.'
      }
      command=${1:-help}
      shift || true
      case "$command" in
        help)
          usage
          printf 'help\t7\n' >>"$log"
          ;;
        get|describe)
          id=${1:-}
          shift || true
          [ "$id" = 7 ] || { printf 'ticket not found: %s\n' "$id" >&2; exit 4; }
          [ "${1:-}" = --body-file ] && [ -n "${2:-}" ] || { usage >&2; exit 2; }
          target=$2
          if [ "$command" = get ]; then
            cp "$body" "$target"
            printf 'id\t7\nstate\topen\ntitle\tExport triple(value)\nbody\t%s\n' "$target"
          else
            cp "$target" "$body"
            printf 'ticket\t7\ndescription\treplaced\n'
          fi
          printf '%s\t7\n' "$command" >>"$log"
          ;;
        *) usage >&2; exit 64 ;;
      esac
  setup: |
    cat >.git/fixture-ticket.md <<'EOF'
    ## Outcome

    Export triple(value), returning exactly three times a numeric input.

    ## Done criteria

    - [ ] triple(0) is 0.
    - [ ] triple(-4) is -12.
    - [ ] `bash test.sh` passes.

    Preserve this operator note.
    EOF
    : >.git/ticketctl.log
checks:
  - name: final behavior is correct
    run: >-
      node --input-type=module -e
      'import("./src/math.js").then(({triple}) => { if(triple(0) !== 0 || triple(-4) !== -12) process.exit(1) })'
  - name: focused tests and repository gate pass
    run: grep -E 'triple\((0|-4)' test/math.test.js >/dev/null && bash test.sh >/dev/null
  - name: ticket retains all phase artifacts and verified state
    run: >-
      grep -F 'Preserve this operator note.' .git/fixture-ticket.md >/dev/null &&
      awk -F '\t' '$1=="state" && $2=="verified" {f=1} END {exit !f}' .git/fixture-ticket.md &&
      for phase in refine challenge implement review qa codify; do
        grep -F "## Ticket Pipeline Artifact — $phase — Iteration 1" .git/fixture-ticket.md >/dev/null || exit 1;
      done
  - name: execution ledger records every normal-path child
    run: >-
      test "$(awk '/^\| (refine|challenge|implement|review|qa|codify) \| [0-9]+ \|/ {n++} END {print n+0}' .git/fixture-ticket.md)" -eq 6
  - name: only the named ticket description is mutated externally
    run: >-
      test -s .git/ticketctl.log &&
      awk -F '\t' '$2 != "7" {bad=1} END {exit bad}' .git/ticketctl.log &&
      awk -F '\t' '$1=="help" {help=1} $1=="get" && help {get=1} $1=="describe" && get {describe=1} END {exit !(help && get && describe)}' .git/ticketctl.log &&
      awk -F '\t' '$1=="describe" && $2=="7" {f=1} END {exit !f}' .git/ticketctl.log
  - name: no publication occurs
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: ticket-pipeline result is verified
    expect_regex: "format\\tdarrow-ticket-pipeline-result-v1[\\s\\S]*status\\tverified"
  - name: all normal phases are reported
    expect_regex: "phase\\trefine[\\s\\S]*phase\\tchallenge[\\s\\S]*phase\\timplement[\\s\\S]*phase\\treview[\\s\\S]*phase\\tqa[\\s\\S]*phase\\tcodify"
  - name: actual child count is comparable
    expect_regex: "evaluation_child_invocations\\t6"
  - name: normal path needs no human interruption
    expect_regex: "evaluation_human_interruptions\\t0"
