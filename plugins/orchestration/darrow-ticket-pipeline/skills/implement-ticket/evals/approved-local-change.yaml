id: ticket-pipeline-implement-approved-local-change
invariant: TP-P1,TP-S1,TP-E1
prompt: >-
  Explicitly invoke $implement-ticket for run eval-implement, phase implement,
  iteration 1, agent implementer-eval. The current absolute repository is the
  write boundary, the approved ticket snapshot is .ticket-pipeline-input/ticket.md,
  there are no pre-existing changes, and the artifact output is the absolute
  path {{repo_dir}}/.git/implement-artifact.tsv. Implement only the approved local change;
  do not publish it.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash test.sh` for JavaScript changes.
        .ticket-pipeline-input/ticket.md: |
          ## Outcome

          Export double(value), returning exactly two times a numeric input.

          ## Done criteria

          - [ ] Zero and a negative input are covered.
          - [ ] `bash test.sh` passes.

          ## Ticket Pipeline Artifact — refine — Iteration 1

          ### Implementation plan

          Add `double` to src/math.js and focused node:test cases for zero and -4. Run `bash test.sh`.

          ## Ticket Pipeline Artifact — challenge — Iteration 1

          ### Verdict evidence

          Approved as scoped and verifiable.
        package.json: '{"type":"module"}'
        src/math.js: |
          export const identity = (value) => value;
        test/math.test.js: |
          import test from "node:test";
          import assert from "node:assert/strict";
          import { identity } from "../src/math.js";

          test("identity", () => assert.equal(identity(-2), -2));
        test.sh: |
          #!/usr/bin/env bash
          node --test test/math.test.js
checks:
  - name: requested behavior is implemented
    run: >-
      node --input-type=module -e
      'import("./src/math.js").then(({double}) => { if(double(0) !== 0 || double(-4) !== -8) process.exit(1) })'
  - name: focused tests and repository gate pass
    run: grep -E 'double\((0|-4)' test/math.test.js >/dev/null && bash test.sh >/dev/null
  - name: implementation remains unpublished
    run: test "$(git rev-list --count HEAD)" -eq 1
  - name: implementation artifact is complete
    run: >-
      awk -F '\t' '$1=="phase" && $2=="implement" {f=1} END {exit !f}' .git/implement-artifact.tsv &&
      awk -F '\t' '$1=="status" && $2=="complete" {f=1} END {exit !f}' .git/implement-artifact.tsv &&
      grep -F 'bash test.sh' .git/implement-artifact.tsv >/dev/null
output_checks:
  - name: implementation reports its artifact
    expect_regex: "implement-artifact\\.tsv"
