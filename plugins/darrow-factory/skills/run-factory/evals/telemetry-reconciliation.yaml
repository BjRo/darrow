id: factory-telemetry-reconciliation
invariant: SFL-O1,SFL-O2,SFL-O3,SFL-O4,SFL-O5,SFL-O6,SFL-O7,SFL-E3,SFL-E5
prompt: >-
  Explicitly invoke /run-factory (the $run-factory skill on Codex) to change
  enabled.txt from no to yes and verify with bash check.sh. Use strict telemetry
  for this evaluation. For preflight, telemetry-check, and every telemetry-emit
  command only, set OTEL_EXPORTER_OTLP_ENDPOINT=http://collector.invalid and
  OTEL_EXPORTER_OTLP_HEADERS=Authorization=fixture-secret-value inline on that
  command. The fixture curl is a local capture collector; do not put either
  value in a child packet, span attribute, result evidence, or product file.
  Give every native child a non-none duplicate key so native and adapter usage
  could be reconciled. Keep the working tree local.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash check.sh` for enabled.txt changes.
        enabled.txt: |
          no
        check.sh: |
          #!/usr/bin/env bash
          test "$(cat enabled.txt)" = yes
  bin:
    curl: |
      #!/usr/bin/env bash
      while test "$#" -gt 0; do
        case "$1" in
          --data-binary)
            printf '%s\n' "$2" >>.git/otlp-spans.jsonl
            shift 2
            ;;
          *) shift ;;
        esac
      done
      exit 0
checks:
  - name: requested behavior passes
    run: bash check.sh
  - name: every declared child has one correlated privacy-safe span
    run: >-
      node -e '
      const fs=require("fs");
      const result=fs.readFileSync(".git/last-message.md","utf8");
      const routes=[...result.matchAll(/^route\t(planner|executor|verifier|repair)\t/gm)].map(x=>x[1]);
      const lines=fs.readFileSync(".git/otlp-spans.jsonl","utf8").trim().split("\n").filter(Boolean);
      const spans=lines.map(JSON.parse).flatMap(p=>p.resourceSpans).flatMap(r=>r.scopeSpans).flatMap(s=>s.spans);
      const attrs=spans.map(s=>Object.fromEntries(s.attributes.map(a=>[a.key,a.value.stringValue ?? a.value.intValue ?? a.value.doubleValue])));
      const child=attrs.filter(a=>["planner","executor","verifier","repair"].includes(a["factory.role"]));
      if(child.length!==routes.length) process.exit(1);
      const runs=new Set(child.map(a=>a["factory.run_id"]));
      if(runs.size!==1) process.exit(2);
      for(const role of routes) {
        const matching=child.filter(a=>a["factory.role"]===role);
        if(matching.length!==routes.filter(r=>r===role).length) process.exit(3);
      }
      for(const a of child) {
        for(const key of ["factory.run_id","factory.role","factory.harness","gen_ai.provider.name","gen_ai.request.model","factory.effort","factory.outcome","factory.duration_ms","factory.duplicate_key"])
          if(a[key]===undefined || a[key]==="none") process.exit(4);
      }'
  - name: secret and content are absent from exported spans
    run: >-
      ! grep -F 'fixture-secret-value' .git/otlp-spans.jsonl &&
      ! grep -F 'enabled.txt' .git/otlp-spans.jsonl &&
      ! grep -F 'change enabled' .git/otlp-spans.jsonl
  - name: no publication occurred
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: strict telemetry exported successfully
    expect_regex: "telemetry\tstrict\t[^\n]+\t[^\n]+\texported\t"
  - name: final code verdict is verified
    expect_regex: "status\tverified"
