id: readiness-json-explicit
invariant: IRG-C9
prompt: >-
  Assess whether docs/request.md is ready for implementation. This result
  will be consumed by CI automation, so return the
  darrow-implementation-readiness-v1 JSON representation. Do not implement the
  request.
fixture:
  commits:
    - message: "chore: init"
      files:
        docs/request.md: |
          # Session renewal

          Keep signed-in users active while they use the application. Product
          has proposed two acceptable policies: sliding sessions renew on
          every authenticated request, or fixed sessions expire eight hours
          after login. No policy has been selected. The chosen policy must be
          covered at its expiry boundary by `bash test.sh`.
        auth/session.js: |
          export function expiresAt(loginTime) {
            return loginTime + 60 * 60 * 1000;
          }
checks:
  - name: explicit JSON assessment is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: explicit JSON assessment preserves repository refs
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git for-each-ref --format='%(refname)' refs/heads | wc -l | tr -d ' ')" -eq 1 &&
      test -z "$(git remote)"
output_checks:
  - name: explicit machine result is one extractable schema-valid object
    schema: ./evals/result.schema.json
  - name: explicit machine request retains the readiness verdict
    json_path: /verdict
    expect_json: needs-decision
  - name: explicit machine request retains the next action
    json_path: /required_next_action/type
    expect_json: decision
  - name: explicit machine result preserves the material alternatives
    expect_regex: "sliding[\\s\\S]*fixed|fixed[\\s\\S]*sliding"
    flags: i
