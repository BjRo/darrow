id: readiness-needs-decision
invariant: IRG-C4
prompt: >-
  Assess whether docs/request.md is ready for implementation. Return only the
  readiness result and do not choose a product policy on my behalf.
fixture:
  commits:
    - message: "chore: init"
      files:
        docs/request.md: |
          # Session renewal

          Keep signed-in users active while they use the application. Product
          has proposed two acceptable policies: sliding sessions renew on
          every authenticated request, or fixed sessions expire eight hours
          after login. No policy has been selected. The chosen policy must be
          covered at its expiry boundary by `bash test.sh`.
        auth/session.js: |
          export function expiresAt(loginTime) {
            return loginTime + 60 * 60 * 1000;
          }
checks:
  - name: unresolved decision causes no repository mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: public verdict needs a decision
    run: grep -Ei 'verdict.{0,80}needs-decision' .git/last-message.md
  - name: decision verdict preserves repository refs
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git for-each-ref --format='%(refname)' refs/heads | wc -l | tr -d ' ')" -eq 1 &&
      test -z "$(git remote)"
output_checks:
  - name: one readiness report owns the complete response
    expect_regex: "(?<![\\s\\S])## Implementation readiness[\\s\\S]*^- \\*\\*Description:\\*\\* \\S[^\\n]*\\n?$(?![\\s\\S])"
    not_regex: "^## Implementation readiness$[\\s\\S]*^## Implementation readiness$|^\\*\\*Verdict:\\*\\* `[a-z-]+`$[\\s\\S]*^\\*\\*Verdict:\\*\\* `[a-z-]+`$"
  - name: default result uses the human-readable report
    expect_regex: "^## Implementation readiness$"
  - name: material policy choice needs a decision
    expect_regex: "^\\*\\*Verdict:\\*\\* `needs-decision`$"
  - name: next action requests a decision
    expect_regex: "^### Required next action$[\\s\\S]*^- \\*\\*Type:\\*\\* `decision`$[\\s\\S]*^- \\*\\*Description:\\*\\* \\S[^\\n]*$"
  - name: both authoritative alternatives remain visible
    expect_regex: "sliding[\\s\\S]*fixed|fixed[\\s\\S]*sliding"
    flags: i
  - name: default result preserves typed basis and finding fields
    expect_regex: "^### Basis$[\\s\\S]*^- \\*\\*Source:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Authority:\\*\\* `(authoritative|repository|supporting)`$[\\s\\S]*^  - \\*\\*Status:\\*\\* `(available|missing|contradictory)`$[\\s\\S]*^  - \\*\\*Summary:\\*\\* \\S[^\\n]*$[\\s\\S]*^### Quality bar$[\\s\\S]*^### Findings$[\\s\\S]*^- \\*\\*Type:\\*\\* `(missing-information|unresolved-decision|contradiction|dependency|permission|quality-bar-gap)`$[\\s\\S]*^  - \\*\\*Summary:\\*\\* \\S[^\\n]*$[\\s\\S]*^  - \\*\\*Evidence:\\*\\*$[\\s\\S]*^    - \\S[^\\n]*$"
  - name: quality bar is explicitly empty or contains typed items
    expect_regex: "^### Quality bar$\\n\\n(?:None\\.|- \\*\\*Criterion:\\*\\* \\S[^\\n]*\\n  - \\*\\*Oracle:\\*\\* \\S[^\\n]*\\n  - \\*\\*Verification:\\*\\* \\S[^\\n]*(?:\\n\\n- \\*\\*Criterion:\\*\\* \\S[^\\n]*\\n  - \\*\\*Oracle:\\*\\* \\S[^\\n]*\\n  - \\*\\*Verification:\\*\\* \\S[^\\n]*)*)\\n\\n### Findings$"
  - name: default result does not claim the JSON representation
    not_regex: '"format"\s*:\s*"darrow-implementation-readiness-v1"'
