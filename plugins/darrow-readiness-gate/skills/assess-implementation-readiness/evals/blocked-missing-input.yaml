id: readiness-blocked-missing-input
invariant: IRG-C2
prompt: >-
  Assess implementation readiness for ticket SEC-42. I have not supplied its
  contents, there is no tracker capability in this environment, and the
  repository contains no copy. Return the readiness result without inventing
  the ticket.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\n"
checks:
  - name: missing authoritative input causes no repository mutation
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: public verdict is blocked
    run: grep -Eq '"verdict"[[:space:]]*:[[:space:]]*"blocked"' .git/last-message.md
  - name: blocked verdict preserves repository refs
    run: >-
      test "$(git branch --show-current)" = main &&
      test "$(git for-each-ref --format='%(refname)' refs/heads | wc -l | tr -d ' ')" -eq 1 &&
      test -z "$(git remote)"
output_checks:
  - name: result satisfies the public schema
    schema: ./evals/result.schema.json
  - name: unavailable authoritative input blocks assessment
    json_path: /verdict
    expect_json: blocked
  - name: next action asks to unblock the input
    json_path: /required_next_action/type
    expect_json: unblock
  - name: ticket contents are not invented
    expect_regex: "(supply|provide|make available|resolve)[\\s\\S]{0,200}(SEC-42|ticket|contents)"
    flags: i
