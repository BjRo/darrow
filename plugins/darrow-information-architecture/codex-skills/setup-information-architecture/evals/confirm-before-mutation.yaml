id: setup-information-architecture-confirm-before-mutation
invariant: IA-S7
prompt: >-
  Set up a lean dual-runtime agent information architecture for this
  repository. Inspect it and propose the file graph first.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\n"
        package.json: "{\"private\":true,\"scripts\":{\"test\":\"vitest\"}}\n"
        src/index.ts: "export const service = true;\n"
checks:
  - name: proposal phase leaves the worktree clean
    run: git status --porcelain --untracked-files=all
    not_regex: "\\S"
  - name: proposal phase creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
  - name: response maps an exact action to AGENTS.md
    run: cat .git/last-message.md
    expect_regex: "(create|add|write)[\\s\\S]{0,100}AGENTS\\.md|AGENTS\\.md[\\s\\S]{0,100}(create|add|write)"
    flags: i
  - name: response maps an exact action to CLAUDE.md
    run: cat .git/last-message.md
    expect_regex: "(create|add|link|import|route)[\\s\\S]{0,100}CLAUDE\\.md|CLAUDE\\.md[\\s\\S]{0,100}(create|add|link|import|route)"
    flags: i
  - name: response requests confirmation before file changes
    run: cat .git/last-message.md
    expect_regex: "please confirm (the|these|this)|do you approve (the|these|this)|shall I (apply|create|proceed)|may I (apply|create|proceed)|would you like me to (apply|create|proceed)"
    flags: i
