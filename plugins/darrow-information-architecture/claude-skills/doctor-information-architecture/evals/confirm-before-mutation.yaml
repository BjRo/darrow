id: doctor-information-architecture-confirm-before-mutation
invariant: IA-D7
prompt: >-
  Doctor this repository's agent information architecture. Give me the exact
  keep, move, rewrite, and remove proposal before changing checked-in files.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Agent Instructions

          Never self-merge a pull request.
          Package manager: Bun 1.3.
        CLAUDE.md: "# Claude adapter\n\nRead `AGENTS.md` before work.\n"
        package.json: "{\"private\":true,\"packageManager\":\"bun@1.3.0\"}\n"
checks:
  - name: unapproved doctor phase leaves the worktree clean
    run: git status --porcelain --untracked-files=all
    not_regex: "\\S"
  - name: unapproved doctor phase creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
  - name: response names the exact file and proposed action
    run: cat .git/last-message.md
    expect_regex: "AGENTS\\.md[\\s\\S]{0,240}(keep|rewrite|remove)|(keep|rewrite|remove)[\\s\\S]{0,240}AGENTS\\.md"
    flags: i
  - name: response estimates resident byte impact
    run: cat .git/last-message.md
    expect_regex: "[0-9]+\\s*bytes|bytes\\s*(saved|reduced|before|after|impact)"
    flags: i
  - name: response explains why the proposed edit is safe
    run: cat .git/last-message.md
    expect_regex: "manifest|package\\.json|deriv|because|canonical source"
    flags: i
  - name: response asks before applying the proposal
    run: cat .git/last-message.md
    expect_regex: "please confirm (the|these|this)|do you approve (the|these|this)|shall I (apply|rewrite|proceed)|may I (apply|rewrite|proceed)|would you like me to (apply|rewrite|proceed)"
    flags: i
