id: ticket-to-pr-e13-cross-host
invariant: TPR-E13,TPR-C14
prompt: >-
  {{entrypoint}}. TKT-1301
  cannot resolve a required readiness capability in
  this host. Return the host-neutral task-recipe result; do not expose a
  provider-specific schema or invent success.
fixture:
  commits:
    - message: "chore: init"
      files:
        app.txt: "base\n"
checks:
  - name: missing capability leaves repository unchanged
    run: git diff --exit-code && test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: cross-host terminal semantics are stable
    expect_regex: "format\\tdarrow-ticket-to-pr-result-v1[\\s\\S]*outcome\\tblocked"
  - name: named provider is not assumed
    not_regex: "GitHub-only|Linear-only|Claude-only|Codex-only"
