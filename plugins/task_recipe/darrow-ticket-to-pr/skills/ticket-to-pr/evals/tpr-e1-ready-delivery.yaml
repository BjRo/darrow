id: ticket-to-pr-e1-ready-delivery
invariant: TPR-E1,TPR-C3,TPR-C4
expect_head_change: true
prompt: >-
  {{entrypoint}}. Use the
  supplied authoritative ticket: TKT-101, “Document the
  widget”, outcome: add `Widget ready.` below the README heading, acceptance:
  `grep -Fx 'Widget ready.' README.md`. Use adaptive-goal and the mocked forge
  to deliver the ticket.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Fixture instructions

          For this headless fixture, the current invocation is the compatible
          adaptive native goal-owner boundary. Continue in this current boundary
          as the one goal owner; do not delegate to a descendant Agent or create
          another checkout.

          The compatible branch contract is the executable command
          `git switch -c BRANCH main`, invoked once with the chosen task branch;
          it preserves `main`. Do not rename the current branch.

          The compatible forge inspection contract is the executable command
          `gh pr list`, available on PATH. The complete proposal-creation
          contract is `gh pr create --base main --head BRANCH --title TITLE
          --body BODY`, invoked exactly once with the final values. Invoke these
          commands through the host shell facility. Do not invoke `gh pr create`
          for help, probing, validation, test arguments, or a dry run.
        README.md: "# Fixture\n"
  bin:
    gh: |
      #!/usr/bin/env bash
      set -eu
      if [ "${1-}" = pr ] && [ "${2-}" = list ]; then exit 0; fi
      if [ "${1-}" = pr ] && [ "${2-}" = create ]; then
        printf '%s\n' create >>.git/pr-call-count
        printf '%s\n' "$*" >>.git/pr-calls
        printf '%s\n' 'https://example.invalid/pr/101'
        exit 0
      fi
      exit 2
  setup: |
    git init --bare .git/remote.git >/dev/null
    git remote add origin "$PWD/.git/remote.git"
checks:
  - name: intended content exists
    run: grep -Fx 'Widget ready.' README.md
  - name: intended commit is ahead on a task branch
    run: >-
      test "$(git rev-list --count HEAD)" -eq 2 &&
      test "$(git branch --show-current)" != main &&
      test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = README.md
  - name: non-force push publishes exact head
    run: >-
      branch=$(git branch --show-current) &&
      remote=$(git --git-dir=.git/remote.git rev-parse "refs/heads/$branch") &&
      test "$remote" = "$(git rev-parse HEAD)"
  - name: exactly one proposal is created
    run: >-
      { test "$(wc -l <.git/pr-call-count | tr -d ' ')" -eq 1 &&
      grep -E '(^| )--title(=| )[^ ]*(feat|fix|docs|refactor|test|build|ci|chore)' .git/pr-calls >/dev/null &&
      grep -F 'TKT-101' .git/pr-calls >/dev/null &&
      ! grep -E '(^| )--draft( |$)' .git/pr-calls; } ||
      { printf '%s\n' 'mocked gh invocation:' >&2; cat .git/pr-calls >&2; exit 1; }
  - name: published checkout is clean
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: created outcome identifies verified PR
    expect_regex: "\\bpr_created\\b[\\s\\S]*https://example.invalid/pr/101"
  - name: native goal and current verification are evidenced
    expect_regex: "verification[\\s\\S]*review|review[\\s\\S]*verification"
