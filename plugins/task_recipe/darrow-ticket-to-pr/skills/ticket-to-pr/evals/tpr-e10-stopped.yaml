id: ticket-to-pr-e10-stopped
invariant: TPR-E10,TPR-C11
prompt: >-
  {{entrypoint}} for TKT-1012. Reconstruct the terminal result: adaptive-goal
  preflight selected decision-gated because retry behavior is unspecified.
  Report the stopped outcome, reason, and smallest useful next action concisely.
fixture:
  commits:
    - message: "chore: init"
      files:
        app.txt: "unchanged\\n"
checks: []
output_checks:
  - name: decision-gated preflight is reported as stopped
    expect_regex: "TKT-1012[\\s\\S]*\\bstopped\\b[\\s\\S]*decision-gated|\\bstopped\\b[\\s\\S]*decision-gated[\\s\\S]*TKT-1012"
  - name: stopped delivery does not invent publication state
    not_regex: "https?://"
