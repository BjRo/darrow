id: ticket-to-pr-activation-negative
invariant: TPR-C1
activation: negative
prompt: >-
  Explain what ticket TKT-44 is asking for. Do not implement, publish, or run a
  delivery recipe.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
checks:
  - name: ordinary ticket discussion remains read only
    run: git diff --exit-code && test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: recipe terminal outcome is absent
    not_regex: "\\b(pr_created|pr_existing|stopped|blocked|interrupted)\\b"
