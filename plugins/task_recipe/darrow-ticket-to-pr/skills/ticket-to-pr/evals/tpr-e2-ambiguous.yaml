id: ticket-to-pr-e2-ambiguous
invariant: TPR-E2,TPR-C2
prompt: >-
  {{entrypoint}} for either TKT-204 or TKT-205;
  choose whichever seems easier.
fixture:
  commits:
    - message: "chore: init"
      files:
        app.txt: "unchanged\n"
checks:
  - name: ambiguous ticket choice causes no mutation
    run: git diff --exit-code && test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: ambiguity stops before choosing
    expect_regex: "\\bstopped\\b[\\s\\S]*(ambiguous|exactly one|choose|TKT-204 or TKT-205|one non-contradictory authoritative request|alternative ticket references)"
    flags: i
