id: ticket-to-pr-activation-direct
invariant: TPR-C1
activation: positive
prompt: >-
  /ticket-to-pr On Codex, invoke $ticket-to-pr. Use TKT-41
  and deliver this one ticket from the current repository to
  one verified pull request.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
checks:
  - name: no delivery mutation without resolvable ticket and readiness capability
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: explicit recipe reports one terminal outcome
    expect_regex: "outcome\\t(blocked|stopped)"
