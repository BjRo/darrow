id: ticket-to-pr-e2-missing
invariant: TPR-E2,TPR-C2
activation: positive
prompt: "/ticket-to-pr On Codex, invoke $ticket-to-pr, but no ticket was supplied."
fixture:
  commits:
    - message: "chore: init"
      files:
        app.txt: "unchanged\n"
checks:
  - name: missing authority causes no mutation
    run: git diff --exit-code && test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: missing input requests exactly one ticket
    expect_regex: "(one|single).*(ticket|specification)"
    flags: i
