id: ticket-to-pr-e6-recoverable-push
invariant: TPR-E6,TPR-C10
expect_repository_change: true
prompt: >-
  {{entrypoint}}. Continue this durable re-entry for the supplied authoritative
  ticket TKT-605: outcome, change app.txt from `base` to `done`; acceptance,
  `grep -Fx done app.txt`; current-content verification passed on the exact
  correlated commit. The
  first non-force push fails transiently and the next is accepted. Persist
  safely. This is unfinished publication recovery, not a historical terminal
  result; adaptive-goal must own it rather than the recipe parent. Publish the
  verified exact head once, and never force-push or use a fixed retry count.
  Use the repository-declared compatible native-goal, Git, and forge contracts.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Fixture instructions

          Adaptive delivery must use one host-observed native-subagent goal
          boundary. The goal owner works in this checkout and must not
          delegate to another checkout.

          The compatible Git and forge contracts are the executable commands
          `git` and `gh`, available on PATH. Invoke them through the host shell
          facility so the fixture can model transient recovery.
        app.txt: "base\n"
  bin:
    git: |
      #!/usr/bin/env bash
      set -eu
      real_git=$(command -v /usr/bin/git)
      if [ "${1-}" = push ]; then
        printf '%s\n' "$*" >>.git/push-attempts
        if [ ! -e .git/first-push-failed ]; then
          : >.git/first-push-failed
          exit 1
        fi
      fi
      exec "$real_git" "$@"
    gh: |
      #!/usr/bin/env bash
      set -eu
      if [ "${1-}" = pr ] && [ "${2-}" = list ]; then exit 0; fi
      if [ "${1-}" = pr ] && [ "${2-}" = create ]; then
        printf '%s\n' create >>.git/pr-call-count
        printf '%s\n' "$*" >>.git/pr-calls
        printf '%s\n' https://example.invalid/pr/605
        exit 0
      fi
      exit 2
  setup: |
    git checkout -b feat/tkt-605 >/dev/null
    printf '%s\n' done >app.txt
    git add app.txt
    git commit -m 'fix: satisfy TKT-605' >/dev/null
    git init --bare .git/remote.git >/dev/null
    git remote add origin "$PWD/.git/remote.git"
checks:
  - name: transient push converges without force
    run: >-
      test "$(wc -l <.git/push-attempts | tr -d ' ')" -eq 2 &&
      ! grep -E '(^| )(--force|-f)( |$)' .git/push-attempts &&
      test "$(git rev-parse HEAD)" = "$(git --git-dir=.git/remote.git rev-parse refs/heads/feat/tkt-605)"
  - name: exactly one pull request follows recovery
    run: test "$(wc -l <.git/pr-call-count | tr -d ' ')" -eq 1
output_checks:
  - name: recovered publication reports current verification
    expect_regex: "(?=[\\s\\S]*\\bpr_created\\b)(?=[\\s\\S]*https://example.invalid/pr/605)(?=[\\s\\S]*(verification|verified))"
    flags: i
