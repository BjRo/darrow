id: ticket-to-pr-e11-telemetry-failed
invariant: TPR-E11,TPR-C11,TPR-C12
prompt: >-
  {{entrypoint}} for TKT-1103. Contradictory
  authority stops delivery. The configured compatible telemetry adapter fails;
  preserve the delivery outcome and report telemetry independently.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Fixture instructions

          The compatible telemetry adapter contract is `telemetry-adapter emit`.
          Send the semantic lifecycle on stdin.
        app.txt: "unchanged\n"
  bin:
    telemetry-adapter: |
      #!/usr/bin/env bash
      set -eu
      [ "${1-}" = emit ]
      {
        printf '%s\n' '--- darrow-eval-telemetry-attempt ---'
        cat
      } >>.git/telemetry-attempt
      exit 1
checks:
  - name: adapter was attempted once without delivery mutation
    run: >-
      test -s .git/telemetry-attempt &&
      test "$(grep -Fc -- '--- darrow-eval-telemetry-attempt ---' .git/telemetry-attempt)" -eq 1 &&
      git diff --exit-code
output_checks:
  - name: adapter failure remains independent
    expect_regex: "outcome\\tstopped[\\s\\S]*telemetry_status\\tfailed"
