id: ticket-to-pr-activation-natural
invariant: TPR-C1,TPR-C12
activation: negative
prompt: >-
  Use the installed ticket-to-PR task recipe for issue TKT-42 in this
  repository, but do not invoke the slash command or dollar-prefixed skill.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
checks:
  - name: unresolved intake preserves repository
    run: git diff --exit-code && test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: natural language alone does not claim activation
    not_regex: "\\b(pr_created|pr_existing|stopped|blocked|interrupted)\\b"
