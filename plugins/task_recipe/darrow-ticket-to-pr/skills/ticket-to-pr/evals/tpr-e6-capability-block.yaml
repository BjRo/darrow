id: ticket-to-pr-e6-capability-block
invariant: TPR-E6,TPR-C10
activation: positive
prompt: >-
  /ticket-to-pr On Codex, invoke $ticket-to-pr for TKT-604. Ticket intake is
  authoritative, but the required readiness capability is unavailable. Stop
  honestly before delivery mutation and preserve the capability evidence gap.
fixture:
  commits:
    - message: "chore: init"
      files:
        app.txt: "base\n"
checks:
  - name: missing capability causes no delivery mutation
    run: git diff --exit-code && test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: capability failure is blocked
    expect_regex: "outcome\\tblocked[\\s\\S]*(readiness|capability)"
    flags: i
