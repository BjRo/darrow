id: ticket-to-pr-e5-reentry
invariant: TPR-E5,TPR-C7,TPR-C8
expect_head_change: true
prompt: >-
  {{entrypoint}}. Re-enter delivery for the supplied authoritative ticket
  TKT-501: outcome, change app.txt from `base` to `complete`; acceptance,
  `grep -Fx complete app.txt`; the adaptive native goal produced the current
  correlated branch. An open
  correlated PR already exists, but its recorded verification predates the
  current head and the current content is only `partial`. Reconstruct durable
  state through the repository-declared compatible forge contract, do not
  duplicate the proposal, and require current evidence.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Fixture instructions

          Adaptive delivery must use one host-observed native-subagent goal
          boundary. The goal owner works in this checkout and must not
          delegate recovery to another checkout.

          The compatible forge inspection contract is the executable command
          `gh`, available on PATH. Invoke it through the host shell facility.
        app.txt: "base\n"
  bin:
    gh: |
      #!/usr/bin/env bash
      set -eu
      printf '%s\n' "$*" >>.git/gh-calls
      if [ "${1-}" = pr ] && { [ "${2-}" = list ] || [ "${2-}" = view ]; }; then
        printf '%s\n' '[{"url":"https://example.invalid/pr/501","headRefName":"feat/tkt-501","baseRefName":"main","isDraft":false,"title":"fix: partial TKT-501","body":"TKT-501"}]'
        exit 0
      fi
      exit 2
  setup: |
    git checkout -b feat/tkt-501 >/dev/null
    printf '%s\n' partial >app.txt
    git add app.txt
    git commit -m 'fix: partial TKT-501' >/dev/null
    git init --bare .git/remote.git >/dev/null
    git remote add origin "$PWD/.git/remote.git"
    git push -u origin feat/tkt-501 >/dev/null
checks:
  - name: incomplete correlated branch is completed in place
    run: >-
      test "$(git branch --show-current)" = feat/tkt-501 &&
      grep -Fx complete app.txt >/dev/null &&
      test "$(git rev-list --count main..HEAD)" -eq 2 &&
      test "$(git diff --name-only main..HEAD)" = app.txt &&
      git diff --exit-code
  - name: current correlated head is published
    run: >-
      test "$(git --git-dir=.git/remote.git rev-parse refs/heads/feat/tkt-501)" =
      "$(git rev-parse HEAD)"
  - name: existing proposal is inspected and never duplicated
    run: >-
      grep -E '^pr (list|view)( |$)' .git/gh-calls >/dev/null &&
      ! grep -E '^pr create( |$)' .git/gh-calls
output_checks:
  - name: stale evidence is replaced with current successful evidence
    expect_regex: "(?=[\\s\\S]*\\bpr_existing\\b)(?=[\\s\\S]*(verification|verified))(?=[\\s\\S]*(complete|current|passed))"
    flags: i
  - name: duplicate creation is not claimed
    not_regex: "\\bpr_created\\b"
