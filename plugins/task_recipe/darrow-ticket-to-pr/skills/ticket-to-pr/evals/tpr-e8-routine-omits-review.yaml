id: ticket-to-pr-e8-routine-omits-review
invariant: TPR-E8,TPR-C9
prompt: >-
  {{entrypoint}}. Use the supplied authoritative specification SPEC-802:
  outcome, preserve the README heading `# Fixture`; acceptance,
  `grep -Fx '# Fixture' README.md`; risk, routine. Neither the user nor
  repository requires
  review. The compatible native-goal launch is unavailable after review
  selection; report that boundary without inventing a review requirement.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
checks:
  - name: unavailable launch causes no mutation
    run: git diff --exit-code
output_checks:
  - name: routine review is omitted
    expect_regex: "review[\\s\\S]*(omitted|not required|not selected)"
