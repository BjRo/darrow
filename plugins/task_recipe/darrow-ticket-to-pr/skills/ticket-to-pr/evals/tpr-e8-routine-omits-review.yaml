id: ticket-to-pr-e8-routine-omits-review
invariant: TPR-E8,TPR-C9
prompt: >-
  {{entrypoint}} for a ready routine documentation
  ticket. Neither the user nor repository requires review. The compatible
  native goal launch is unavailable after review selection; report that
  boundary without inventing a review requirement.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
checks:
  - name: unavailable launch causes no mutation
    run: git diff --exit-code
output_checks:
  - name: routine review is omitted
    expect_regex: "independent_review\\tomitted"
