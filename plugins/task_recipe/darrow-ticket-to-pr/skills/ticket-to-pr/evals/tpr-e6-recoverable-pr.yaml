id: ticket-to-pr-e6-recoverable-pr
invariant: TPR-E6,TPR-C10
prompt: >-
  {{entrypoint}} for ready TKT-606. The verified
  exact head is already pushed. The first PR-create call fails transiently and
  the next succeeds. Persist without duplicating the proposal, bypassing
  checks, broadening scope, or using a fixed retry count.
fixture:
  commits:
    - message: "chore: init"
      files:
        app.txt: "base\n"
  bin:
    gh: |
      #!/usr/bin/env bash
      set -eu
      if [ "${1-}" = pr ] && [ "${2-}" = list ]; then exit 0; fi
      if [ "${1-}" = pr ] && [ "${2-}" = create ]; then
        printf '%s\n' "$*" >>.git/pr-attempts
        if [ ! -e .git/first-pr-failed ]; then
          : >.git/first-pr-failed
          exit 1
        fi
        printf '%s\n' https://example.invalid/pr/606
        exit 0
      fi
      exit 2
  setup: |
    git checkout -b feat/tkt-606 >/dev/null
    printf '%s\n' done >app.txt
    git add app.txt
    git commit -m 'fix: satisfy TKT-606' >/dev/null
    git init --bare .git/remote.git >/dev/null
    git remote add origin "$PWD/.git/remote.git"
    git push -u origin feat/tkt-606 >/dev/null
checks:
  - name: transient PR failure converges to one durable proposal
    run: test "$(wc -l <.git/pr-attempts | tr -d ' ')" -eq 2
  - name: local and remote exact heads remain identical
    run: >-
      test "$(git rev-parse HEAD)" = "$(git --git-dir=.git/remote.git rev-parse refs/heads/feat/tkt-606)"
output_checks:
  - name: recovered PR publication reports exact URL
    expect_regex: "outcome\\tpr_created[\\s\\S]*pull_request_url\\thttps://example.invalid/pr/606"
