id: ticket-to-pr-activation-pressure
invariant: TPR-C1,TPR-C5
activation: negative
prompt: >-
  Implement this complicated issue and open a PR when done. Do not invoke any
  orchestration or task recipe; I only want the ordinary requested work.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Fixture\n"
checks:
  - name: complexity does not grant recipe authority
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: recipe does not claim successful delivery
    not_regex: "\\b(pr_created|pr_existing)\\b"
