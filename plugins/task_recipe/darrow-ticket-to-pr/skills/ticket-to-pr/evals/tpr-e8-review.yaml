id: ticket-to-pr-e8-review
invariant: TPR-E8,TPR-C9
prompt: >-
  {{entrypoint}}. Reconstruct this durable review boundary for the supplied
  authoritative ticket TKT-801: outcome, preserve security.txt at the exact
  line `base`; acceptance, `grep -Fx base security.txt`; the adaptive native
  goal completed
  the exact current content; and risk is high. Exact-content independent review
  is required, but the environment exposes no compatible independent-review
  capability. Do not substitute same-context review.
fixture:
  commits:
    - message: "chore: init"
      files:
        security.txt: "base\n"
checks:
  - name: unavailable review blocks publication mutation
    run: test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: review capability gap blocks
    expect_regex: "\\bblocked\\b[\\s\\S]*(independent review|review capability|unavailable)"
    flags: i
