id: ticket-to-pr-e11-cross-host
invariant: TPR-E11,TPR-C12
prompt: >-
  {{entrypoint}}. Use the supplied authoritative ticket TKT-1101: outcome,
  change app.txt from `base` to `complete`; description, complete the fixture
  state; acceptance, `grep -Fx complete app.txt`. No compatible adaptive-goal
  capability can be resolved in this host. Return the host-neutral task-recipe
  result; do not expose a provider-specific schema
  or invent success.
fixture:
  commits:
    - message: "chore: init"
      files:
        app.txt: "base\n"
checks:
  - name: missing capability leaves repository unchanged
    run: git diff --exit-code && test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: cross-host terminal semantics are stable
    expect_regex: "TKT-1101[\\s\\S]*\\bblocked\\b|\\bblocked\\b[\\s\\S]*TKT-1101"
  - name: named provider is not assumed
    not_regex: "GitHub-only|Linear-only|Claude-only|Codex-only"
