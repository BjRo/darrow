id: ticket-to-pr-e11-telemetry
invariant: TPR-E11,TPR-C12
activation: positive
prompt: >-
  /ticket-to-pr On Codex, invoke $ticket-to-pr for TKT-1101.
  Tracker and supplied specification contradict with no precedence, so
  delivery must stop. A compatible telemetry adapter is configured by the
  repository. Emit one safe versioned lifecycle and keep its status independent
  from delivery.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Fixture instructions

          The compatible telemetry adapter contract is `telemetry-adapter emit`.
          Send the semantic lifecycle on stdin. It returns accepted on success.
        app.txt: "done\n"
  bin:
    telemetry-adapter: |
      #!/usr/bin/env bash
      set -eu
      [ "${1-}" = emit ]
      cat >.git/telemetry-lifecycle
      printf '%s\n' accepted
checks:
  - name: one versioned correlated lifecycle is accepted
    run: >-
      test -s .git/telemetry-lifecycle &&
      grep -F TKT-1101 .git/telemetry-lifecycle >/dev/null &&
      grep -Ei 'version|schema' .git/telemetry-lifecycle >/dev/null &&
      grep -Ei 'stopped|contradict' .git/telemetry-lifecycle >/dev/null
output_checks:
  - name: accepted telemetry does not overwrite stopped delivery
    expect_regex: "outcome\\tstopped[\\s\\S]*telemetry_status\\temitted"
