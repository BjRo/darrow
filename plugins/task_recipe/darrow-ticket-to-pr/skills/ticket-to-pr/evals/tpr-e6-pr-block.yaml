id: ticket-to-pr-e6-pr-block
invariant: TPR-E6,TPR-C10
prompt: >-
  {{entrypoint}}. Continue the supplied authoritative ticket TKT-603: outcome,
  change app.txt from `base` to `done`; acceptance, `grep -Fx done app.txt`.
  The verified branch is already pushed, but PR creation fails externally.
  This is unfinished publication recovery, not a historical terminal result;
  adaptive-goal must own it rather than the recipe parent.
  Preserve durable branch, commit, and remote state without a duplicate or
  unrelated mutation. Use the repository-declared compatible forge contract.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Fixture instructions

          Adaptive delivery must use one host-observed native-subagent goal
          boundary. The goal owner works in this checkout and must not
          delegate publication to another checkout.

          The compatible forge contract is the executable command `gh`,
          available on PATH. Invoke it through the host shell facility.
        app.txt: "base\n"
  bin:
    gh: |
      #!/usr/bin/env bash
      set -eu
      if [ "${1-}" = pr ] && [ "${2-}" = list ]; then exit 0; fi
      if [ "${1-}" = pr ] && [ "${2-}" = create ]; then exit 1; fi
      exit 2
  setup: |
    git checkout -b feat/tkt-603 >/dev/null
    printf '%s\n' done >app.txt
    git add app.txt
    git commit -m 'fix: satisfy TKT-603' >/dev/null
    git init --bare .git/remote.git >/dev/null
    git remote add origin "$PWD/.git/remote.git"
    git push -u origin feat/tkt-603 >/dev/null
checks:
  - name: local and remote durable commits remain identical
    run: >-
      test "$(git rev-parse HEAD)" = "$(git --git-dir=.git/remote.git rev-parse refs/heads/feat/tkt-603)"
output_checks:
  - name: PR block preserves durable publication evidence
    expect_regex: "(?=[\\s\\S]*\\bblocked\\b)(?=[\\s\\S]*(remote[ -]?branch|pushed[ -]?branch|branch[^\\n]*(remote|pushed|published|preserved)))(?=[\\s\\S]*(pull request|proposal|\\bPR\\b))(?=[\\s\\S]*(not created|unavailable|fail(?:ed|s|ure)|could not|couldn't|creation[^\\n]*blocked))"
    flags: i
