id: ticket-to-pr-e10-pr-existing
invariant: TPR-E10,TPR-C11
prompt: >-
  {{entrypoint}}. Reconstruct this durable terminal result for the supplied
  authoritative ticket TKT-1011: outcome, change app.txt from unchanged to
  complete; acceptance, `grep -Fx complete app.txt`; current-content
  verification passed; the adaptive
  native goal completed; and the existing correlated verified proposal is
  https://example.invalid/pr/1011. The preserved historical terminal outcome
  is `pr_existing`. Preserve the supplied durable goal completion evidence even
  though this turn did not witness the earlier goal. Report the successful
  outcome, verified pull request, verification, and review result concisely.
  Inspect the proposal through the repository-declared compatible forge
  contract.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Fixture instructions

          The compatible forge inspection contract is the executable command
          `gh`, available on PATH. Invoke it through the host shell facility.
        app.txt: "unchanged\\n"
  bin:
    gh: |
      #!/usr/bin/env bash
      set -eu
      printf '%s\n' "$*" >>.git/gh-calls
      if [ "${1-}" = pr ] && { [ "${2-}" = list ] || [ "${2-}" = view ]; }; then
        printf '%s\n' '[{"url":"https://example.invalid/pr/1011","headRefName":"feat/tkt-1011","baseRefName":"main","isDraft":false,"title":"fix: satisfy TKT-1011","body":"TKT-1011"}]'
        exit 0
      fi
      exit 2
  setup: |
    git checkout -b feat/tkt-1011 >/dev/null
    printf '%s\n' complete >app.txt
    git add app.txt
    git commit -m 'fix: satisfy TKT-1011' >/dev/null
    git init --bare .git/remote.git >/dev/null
    git remote add origin "$PWD/.git/remote.git"
    git push -u origin feat/tkt-1011 >/dev/null
checks:
  - name: existing proposal state is durable and inspection only
    run: >-
      test "$(git branch --show-current)" = feat/tkt-1011 &&
      test "$(git --git-dir=.git/remote.git rev-parse refs/heads/feat/tkt-1011)" = "$(git rev-parse HEAD)" &&
      grep -E '^pr (list|view)( |$)' .git/gh-calls >/dev/null &&
      ! grep -E '^pr create( |$)' .git/gh-calls
output_checks:
  - name: historical existing outcome and proposal are reported
    expect_regex: "TKT-1011[\\s\\S]*\\bpr_existing\\b[\\s\\S]*https://example.invalid/pr/1011|\\bpr_existing\\b[\\s\\S]*TKT-1011[\\s\\S]*https://example.invalid/pr/1011"
  - name: successful result includes verification and review
    expect_regex: "verification[\\s\\S]*review|review[\\s\\S]*verification"
