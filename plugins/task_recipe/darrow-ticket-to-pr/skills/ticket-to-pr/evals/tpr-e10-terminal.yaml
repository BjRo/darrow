id: ticket-to-pr-e10-terminal
invariant: TPR-E10,TPR-C11
forbidden_skill_activations: [adaptive-goal]
prompt: >-
  {{entrypoint}}. Reconstruct this durable terminal state for the supplied
  authoritative ticket TKT-1001: outcome, change app.txt from `base` toward
  `complete`; acceptance, `grep -Fx complete app.txt`; and the adaptive native
  goal launched on the
  correlated task branch. The user interrupted that active goal after its one
  local partial commit but before any push. No remote branch or pull request
  exists. The preserved historical terminal classification is `interrupted`;
  do not resume or finish that work. This completed interruption is
  authoritative historical evidence. Reconstruct it read-only without
  inspecting, loading, or invoking adaptive-goal. Report the terminal delivery
  outcome concisely, preserving the durable local state without guessing.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Fixture instructions

          TKT-1001's interrupted adaptive goal is authoritative historical
          workflow evidence. Reconstruct it read-only without inspecting,
          loading, or invoking adaptive-goal. Do not mutate its preserved local
          branch or commit.
        app.txt: "base\n"
  setup: |
    git checkout -b feat/tkt-1001 >/dev/null
    printf '%s\n' partial >app.txt
    git add app.txt
    git commit -m 'fix: partial TKT-1001' >/dev/null
checks:
  - name: interrupted durable local work remains unchanged
    run: >-
      test "$(git branch --show-current)" = feat/tkt-1001 &&
      test "$(git log -1 --format=%s)" = 'fix: partial TKT-1001' &&
      git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: interruption is reported for the ticket
    expect_regex: "TKT-1001[\\s\\S]*\\binterrupted\\b|\\binterrupted\\b[\\s\\S]*TKT-1001"
  - name: durable local branch and commit are preserved
    expect_regex: "feat/tkt-1001[\\s\\S]*(partial|commit)|(partial|commit)[\\s\\S]*feat/tkt-1001"
  - name: unpublished state is not misreported as a pull request
    not_regex: "https?://"
