id: ticket-to-pr-e10-terminal
invariant: TPR-E10,TPR-C11
prompt: >-
  {{entrypoint}} for TKT-1001.
  The user interrupted the active native goal after one
  local commit but before push. Report the one terminal delivery outcome and
  all durable or unavailable values without guessing.
fixture:
  commits:
    - message: "chore: init"
      files:
        app.txt: "base\n"
  setup: |
    git checkout -b feat/tkt-1001 >/dev/null
    printf '%s\n' partial >app.txt
    git add app.txt
    git commit -m 'fix: partial TKT-1001' >/dev/null
checks:
  - name: interrupted durable local work remains unchanged
    run: >-
      test "$(git branch --show-current)" = feat/tkt-1001 &&
      test "$(git log -1 --format=%s)" = 'fix: partial TKT-1001' &&
      git status --porcelain --untracked-files=all
    expect_exact: ""
output_checks:
  - name: exactly one complete versioned terminal record is emitted
    expect_regex: "^format\\tdarrow-ticket-to-pr-result-v1$"
    count_regex: "^(?:format|ticket|repository|outcome|reason|readiness|branch|base|commits|remote_branch|pull_request_url|verification|independent_review|local_work|adaptive_goal|telemetry_status|telemetry_evidence)\\t"
    expect_count: 17
  - name: interrupted is the sole outcome
    expect_regex: "outcome\\tinterrupted"
  - name: record includes required evidence fields
    expect_regex: "ticket\\t[\\s\\S]*repository\\t[\\s\\S]*reason\\t[\\s\\S]*readiness\\t[\\s\\S]*branch\\t[\\s\\S]*base\\t[\\s\\S]*commits\\t[\\s\\S]*remote_branch\\t[\\s\\S]*pull_request_url\\t[\\s\\S]*verification\\t[\\s\\S]*independent_review\\t[\\s\\S]*local_work\\t[\\s\\S]*adaptive_goal\\t[\\s\\S]*telemetry_status\\t[\\s\\S]*telemetry_evidence\\t"
  - name: interrupted facts match durable local state
    expect_regex: "branch\\tfeat/tkt-1001[\\s\\S]*commits\\t(?!unavailable)[^\\n]+[\\s\\S]*remote_branch\\tunavailable[\\s\\S]*pull_request_url\\tunavailable"
