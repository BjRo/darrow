id: ticket-to-pr-e8-repository-required
invariant: TPR-E8,TPR-C9
forbidden_skill_activations: [adaptive-goal]
prompt: >-
  {{entrypoint}}. Reconstruct this durable review boundary for the supplied
  authoritative ticket TKT-804: outcome, preserve app.txt at the exact line
  `base`; acceptance, `grep -Fx base app.txt`; the adaptive native goal
  completed the exact current content; and risk is routine. Repository policy
  requires independent exact-content review for every pull request. The prior
  required-review attempt ended blocked because no compatible reviewer was
  available at that boundary. That completed attempt is authoritative
  historical evidence; current capability discovery cannot rewrite it. Return
  read-only, do not invoke adaptive-goal, and do not emit a v4 record. Report
  the blocked required-review gap.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Fixture instructions

          Every pull request requires independent exact-content review. The
          prior blocked required-review attempt is authoritative historical
          workflow evidence. Current capability discovery cannot rewrite that
          attempt. Reconstruct it read-only without inspecting, loading, or
          invoking adaptive-goal.
        app.txt: "base\n"
checks:
  - name: repository review policy prevents mutation
    run: git diff --exit-code && test "$(git rev-list --count HEAD)" -eq 1
output_checks:
  - name: required unavailable review blocks
    expect_regex: "(?=[\\s\\S]*\\bblocked\\b)(?=[\\s\\S]*review)(?=[\\s\\S]*(unavailable|not available|no compatible|blocked))"
    flags: i
