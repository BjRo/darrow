id: code-review-both-axes
invariant: CR-E2,CR-E4,CR-E7,CR-E8
prompt: >-
  Review my uncommitted changes against this originating requirement:
  parseAge must return null for non-numeric input. Do not repair the code.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Library standards

          Library modules must never write to console output.
          Run `bash test.sh` for JavaScript changes.
        src/age.js: |
          export function parseAge(value) {
            return Number(value);
          }
        test.sh: |
          #!/usr/bin/env bash
          node -e 'import("./src/age.js").then(({parseAge}) => { if (parseAge("42") !== 42) process.exit(1) })'
  files:
    src/age.js: |
      export function parseAge(value) {
        console.log("parsing", value);
        return Number(value);
      }
  setup: git status --porcelain --untracked-files=all >.git/status-before
checks:
  - name: review is read-only
    run: git status --porcelain --untracked-files=all >.git/status-after; cmp .git/status-before .git/status-after
  - name: final review record validates
    run: >-
      if [ -x .agents/bin/review-result ]; then tool=.agents/bin/review-result;
      else tool=.claude/bin/review-result; fi;
      bash "$tool" validate .git/last-message.md
    expect_regex: "^valid: darrow-review-result-v1$"
output_checks:
  - name: both axes fail
    expect_regex: "^standards\\tfail$[\\s\\S]*^spec\\tfail$"
  - name: Standards owns the console violation
    expect_regex: "^finding\\tstandards\\t(critical|high|medium)\\tblocking\\t[^\\n]+age\\.js[^\\n]+AGENTS\\.md[^\\n]+console"
    flags: i
  - name: Spec owns the missing null behavior
    expect_regex: "^finding\\tspec\\t(critical|high|medium)\\tblocking\\t[^\\n]+age\\.js[^\\n]+(parseAge|null|originating requirement)[^\\n]+non.numeric"
    flags: i
  - name: axes do not swap their sources
    not_regex: "^finding\\tstandards[^\\n]+parseAge must return null|^finding\\tspec[^\\n]+AGENTS\\.md"
    flags: i
