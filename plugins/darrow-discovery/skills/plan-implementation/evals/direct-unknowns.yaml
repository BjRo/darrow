id: plan-implementation-direct-unknowns
invariant: PI-C1,PI-C2,DG-C2,DG-C3,DG-C4,DC-C1,SE-C9,SE-C10,SE-C11
activation: competition
mount_plugin_skills: true
prompt: >-
  Help me plan the implementation of configurable request timeouts. Inspect the
  repository instead of asking me for technical facts. Discuss material
  unknowns with recommendations before producing the plan. We have not decided
  whether configuration is process-wide or per request; the compatibility
  strategy depends on that choice. Do not modify files or create tickets.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# HTTP client library\n"
        src/client.js: |
          import { DEFAULT_TIMEOUT_MS } from "./config.js";
          export async function request(url) {
            return fetch(url, { signal: AbortSignal.timeout(DEFAULT_TIMEOUT_MS) });
          }
        src/config.js: "export const DEFAULT_TIMEOUT_MS = 1000;\n"
        test/client.test.js: "// Public request behavior tests live here.\n"
checks:
  - name: planning conversation is read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: unresolved architecture uses a grilling round
    run: |
      awk '
        NF { if (paragraph) printf " "; printf "%s", $0; paragraph = 1; next }
        { if (paragraph) printf "\n"; paragraph = 0 }
        END { if (paragraph) printf "\n" }
      ' .git/last-message.md | awk '
        {
          line = tolower($0)
          question = line
          sub(/\?.*/, "?", question)
          numbered = question ~ /^[[:space:]*#>_-]*(q0*1[*_.):[:space:]—-]+|1[.)][[:space:]]+)/
          labels = question ~ /process[- ]wide/ && question ~ /per[- ]request/
          subject = question ~ /(timeout|configuration|scope)/
          child = question ~ /(migration|rollout|compatib|backward|default|precedence|validation|api shape|public api)/
          questions = gsub(/\?/, "?", question)
          if (numbered && labels && subject && !child && questions == 1) roots++
        }
        END {
          if (roots == 1) print "scope_root_questions=1"
          else exit 1
        }
      '
    expect_exact: "scope_root_questions=1"
  - name: technical recommendations preserve user choice
    run: |
      awk '
        NF { if (paragraph) printf " "; printf "%s", $0; paragraph = 1; next }
        { if (paragraph) printf "\n"; paragraph = 0 }
        END { if (paragraph) printf "\n" }
      ' .git/last-message.md | awk '
        {
          line = tolower($0)
          if (line !~ /recommendation:/) next
          recommendation = line
          sub(/^.*recommendation:/, "", recommendation)
          process_wide = recommendation ~ /process[- ]wide/
          per_request = recommendation ~ /per[- ]request/
          refuses = recommendation ~ /(cannot|can.t|unable|no recommendation|without your guidance|need your guidance|depends on your)/
          combined = recommendation ~ /(^|[^[:alnum:]_])(both|combined)([^[:alnum:]_]|$)/
          if (process_wide + per_request == 1 && !refuses && !combined) concrete++
        }
        END {
          if (concrete == 1) print "concrete_root_recommendations=1"
          else exit 1
        }
      '
    expect_exact: "concrete_root_recommendations=1"
  - name: repository facts are used
    run: cat .git/last-message.md
    expect_regex: "1000|request\\(url|DEFAULT_TIMEOUT_MS|src/(client|config)\\.js"
    flags: i
  - name: dependent choices are neither asked nor selected prematurely
    run: |
      message=.git/last-message.md
      normalized=.git/last-message-normalized.md
      awk '
        NF { if (paragraph) printf " "; printf "%s", $0; paragraph = 1; next }
        { if (paragraph) printf "\n"; paragraph = 0 }
        END { if (paragraph) printf "\n" }
      ' "$message" > "$normalized"
      if ! awk '
        function question_count(value, cleaned, count) {
          cleaned = value
          gsub(/https?:\/\/[^[:space:]]+/, "", cleaned)
          count = gsub(/\?/, "?", cleaned)
          return count
        }
        {
          line = tolower($0)
          root = line ~ /^[[:space:]*#>_-]*(q0*1[*_.):[:space:]—-]+|1[.)][[:space:]]+)/ && line ~ /process[- ]wide/ && line ~ /per[- ]request/
          questions = question_count($0)
          if (root) {
            roots++
            if (questions != 1) invalid = 1
          } else if (questions != 0) {
            invalid = 1
          }

          if (line ~ /^[[:space:]*#>_-]*(q0*([2-9]|[1-9][0-9]+)[*_.):[:space:]—-]+|([2-9]|[1-9][0-9]+)[.)][[:space:]]+)/) invalid = 1

          preserves_default = line ~ /(keep(s|ing)?|preserv(e|es|ed|ing)|retain(s|ed|ing)?|continu(e|es|ed|ing)( to)? (use|using)).*(1000|default|fallback|existing behavior|current behavior|today.s?[^?]*behavior)/ || line ~ /(1000|default|fallback|existing behavior|current behavior).*(remain|unchang|preserv|retain|keep|continu)/ || line ~ /today.s?[^?]*behavior[^?]*(remain|unchang|preserv|retain|keep|continu)/
          adds_combined_scope = root && line ~ /(^|[^[:alnum:]_])(both|combined)([^[:alnum:]_]|$)/
          selects_combined_scope = line ~ /recommendation:[^?]*(both|combined)/
          recommendation = line
          sub(/^.*recommendation:/, "", recommendation)
          recommendation_has_both_roots = line ~ /recommendation:/ && recommendation ~ /process[- ]wide/ && recommendation ~ /per[- ]request/
          selects_seam_compatibility = line ~ /recommendation:[^?]*(preserv|retain|keep|unchang)[^?]*(signature|request\(url\)|existing caller|current caller)|(signature|request\(url\)|existing caller|current caller)[^?]*(preserv|retain|keep|unchang)/
          selects_precedence = line ~ /(let|make|have|give)[^?]*(per[- ]request|request[- ]level|request[- ]specific|call[- ]level)[^?]*override/ || line ~ /(per[- ]request|request[- ]level|request[- ]specific|call[- ]level|explicit value on (a )?call).*(takes? precedence|has precedence|wins?|overrides?|takes effect instead)/ || line ~ /(precedence|priority).*(goes to|for|given to).*(per[- ]request|request[- ]level|request[- ]specific|call[- ]level)/
          selects_call_shape = line ~ /request\(url,/ || line ~ /(add|use|accept|expose|introduce|provide|support|take)[[:space:]]+(a[[:space:]]+|an[[:space:]]+|the[[:space:]]+)?(options?[ -](object|parameter)|positional[ -](argument|parameter)|global setter|module[- ]level setter|environment variable|env var)/ || line ~ /with[[:space:]]+(a[[:space:]]+|an[[:space:]]+|the[[:space:]]+)(options?[ -](object|parameter)|positional[ -](argument|parameter)|global setter|module[- ]level setter|environment variable|env var)/ || line ~ /(configure(timeout)?\(|setdefaulttimeout|settimeout)/
          selects_validation = line ~ /(invalid|zero|negative|non-finite|infinity).*(throw|rangeerror|typeerror|fallback)|(throw|rangeerror|typeerror|fallback).*(invalid|zero|negative|non-finite|infinity)/
          selects_compatibility = line ~ /(existing callers|backward compatibility|backwards compatibility|migration).*(keep working|unchanged|no change|none|required no|preserv|retain)/
          selects_scope_from_current_shape = line ~ /recommendation:[^?]*(smallest|minimal|least disruptive)[^?]*(change|migration)/ || line ~ /recommendation:[^?]*(because|since)[^?]*(today|currently|existing|already)[^?]*(constant|config|implementation|codebase|shape|surface|call site)/ || line ~ /recommendation:[^?]*matches?[^?]*(current|existing)[ -](shape|structure|model)/
          if (preserves_default || adds_combined_scope || selects_combined_scope || recommendation_has_both_roots || selects_seam_compatibility || selects_precedence || selects_call_shape || selects_validation || selects_compatibility || selects_scope_from_current_shape) invalid = 1
        }
        END {
          if (roots == 1 && !invalid) print "root_frontier_questions=1"
          else exit 1
        }
      ' "$normalized"; then
        cat "$message"
        rm -f "$normalized"
        exit 1
      fi
      rm -f "$normalized"
    expect_exact: "root_frontier_questions=1"
  - name: deferred children and next frontier remain explicit
    run: |
      awk '
        NF { if (paragraph) printf " "; printf "%s", $0; paragraph = 1; next }
        { if (paragraph) printf "\n"; paragraph = 0 }
        END { if (paragraph) printf "\n" }
      ' .git/last-message.md | awk '
        {
          line = tolower($0)
          if (line !~ /deferred:/) next
          deferred = line
          sub(/^.*deferred:/, "", deferred)
          interface_child = deferred ~ /(api shape|public api|public interface|interface|configuration mechanism)/
          default_child = deferred ~ /(default|fallback|precedence)/
          validation_child = deferred ~ /validation/
          compatibility_child = deferred ~ /(compatib|migration)/
          recomputes = line ~ /(recompute|next frontier)/
          verification_child = deferred ~ /(test|verification|coverage)/
          child_groups = interface_child + default_child + validation_child + compatibility_child + verification_child
          if (interface_child && compatibility_child && child_groups >= 3 && recomputes) valid++
        }
        END {
          if (valid == 1) print "deferred_frontier=explicit"
          else exit 1
        }
      '
    expect_exact: "deferred_frontier=explicit"
  - name: unresolved choices do not become or promise a final plan
    run: |
      message=.git/last-message.md
      if grep -Ei "^[*_#> -]{0,12}(Final[[:space:]]+)?Implementation plan|^[*_#> -]{0,12}Plan complete|^[*_#> -]{0,12}Confirmed implementation plan|Here (is|'s) (the )?(final )?implementation plan|^[*_#> -]{0,12}(Step|Slice|Phase)[[:space:]]+[0-9]+|((Once|After|When)[^?]{0,100}(confirm|answer|choose|decide)[^?]{0,100}(scope|Q1|this)|confirm[^?]{0,80}(scope|Q1)[[:space:][:print:]]{0,120}Then)[[:space:][:print:]]{0,200}(draft|produce|deliver|write)[^?]{0,50}(implementation )?plan" "$message" >/dev/null; then
        cat "$message"
        exit 1
      fi
      action_lines=$(awk '
        /^[[:space:]]*([+*-][[:space:]]+|[*_]*[0-9]+[.)][*_]*[[:space:]]+)/ {
          line = tolower($0)
          sub(/^[[:space:]]*([+*-][[:space:]]+|[*_]*[0-9]+[.)][*_]*[[:space:]]+)/, "", line)
          if (line ~ /^(add|build|create|implement|migrate|deploy|roll out|wire|extend|change|remove|test|verify|cover)([^[:alnum:]_]|$)/) actions++
        }
        END { print actions + 0 }
      ' "$message")
      if test "$action_lines" -ne 0; then
        cat "$message"
        exit 1
      fi
      printf 'premature_plan_markers=0\n'
    expect_exact: "premature_plan_markers=0"
