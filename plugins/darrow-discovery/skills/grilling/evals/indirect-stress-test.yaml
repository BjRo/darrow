id: grilling-indirect-stress-test
invariant: DG-C1,DG-C4,DC-C1
mount_plugin_skills: true
prompt: >-
  Stress-test my thinking relentlessly before I commit to this API design. The
  proposal is a public bulk-delete endpoint, but its authorization behavior,
  partial-failure semantics, and maximum batch size are unsettled. Challenge
  me in decision rounds and do not modify the repository.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Bulk API\n"
checks:
  - name: indirect grilling remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: indirect intent receives multiple concrete frontier questions
    run: cat .git/last-message.md
    expect_regex: "^[*_#> -]{0,12}Q1[\\s\\S]*^[*_#> -]{0,12}Q2|^[*_#> -]{0,12}1[.)][\\s\\S]*^[*_#> -]{0,12}2[.)]"
  - name: questions carry recommendations
    run: cat .git/last-message.md
    expect_regex: "recommend(ed|ation)?[\\s\\S]*recommend(ed|ation)?"
    flags: i
