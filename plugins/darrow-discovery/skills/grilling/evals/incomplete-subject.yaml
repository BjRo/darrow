id: grilling-incomplete-subject
invariant: DG-C1,DC-E4,DC-C1
mount_plugin_skills: true
prompt: "Grill me."
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Unrelated repository\n"
checks:
  - name: subjectless request remains read-only
    run: git status --porcelain --untracked-files=all
    expect_exact: ""
  - name: response asks for the missing subject
    run: cat .git/last-message.md
    expect_regex: "(what|which).{0,100}(idea|plan|decision|design|topic|subject)|(idea|plan|decision|design|topic|subject).{0,100}(grill|stress.test)"
    flags: i
  - name: response does not invent a decision tree
    run: cat .git/last-message.md
    not_regex: "Q2|2[.)]"
