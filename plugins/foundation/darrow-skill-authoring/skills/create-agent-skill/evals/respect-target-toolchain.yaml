id: create-agent-skill-respect-target-toolchain
invariant: SA-C5,SA-C7,SA-C8
activation: positive
mount_plugin_skills: true
prompt: >-
  Create one cross-platform agent skill named validate-capability-manifest in
  the existing plugins/schema-helper plugin. It should validate JSON capability
  manifests before review. A valid manifest is an object with non-empty string
  `name` and `description` fields and no unknown top-level fields. Put the
  deterministic validation behind a narrow entrypoint, add appropriate tests,
  keep semantic review of the description in SKILL.md, and follow this
  repository's established toolchain. Do not commit.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Plugins are independently installable. Executable plugin mechanics
          use JavaScript ES modules and package-local package.json files. Use
          pnpm for package operations. Do not add Python, uv, or shell wrappers.
          Never commit automatically.
        plugins/schema-helper/.claude-plugin/plugin.json: |
          {"name":"schema-helper","version":"0.1.0","description":"Schema review helpers","author":{"name":"Example"}}
        plugins/schema-helper/.codex-plugin/plugin.json: |
          {"name":"schema-helper","version":"0.1.0","description":"Schema review helpers","author":{"name":"Example"},"skills":"./skills/"}
        plugins/schema-helper/package.json: |
          {"name":"schema-helper-mechanics","private":true,"type":"module","scripts":{"test":"node --test"}}
        valid.json: |
          {"name":"release-check","description":"Validate a release before review."}
checks:
  - name: focused skill has valid discovery metadata
    run: >-
      skill=plugins/schema-helper/skills/validate-capability-manifest/SKILL.md;
      test -r "$skill";
      grep -E '^name:[[:space:]]*validate-capability-manifest[[:space:]]*$' "$skill" >/dev/null;
      grep -Ei '^description:.*(manifest|capability).*(validat|review)|^description:.*(validat|review).*(manifest|capability)' "$skill" >/dev/null
  - name: target JavaScript toolchain owns the mechanic
    run: |
      plugin=plugins/schema-helper
      test -r "$plugin/package.json"
      mechanic=$(find "$plugin" -type f \( -name '*.js' -o -name '*.mjs' \) ! -name '*.test.js' ! -name '*.test.mjs' ! -path '*/test/*' ! -path '*/tests/*' | sed -n '1p')
      test -n "$mechanic"
      test -z "$(find "$plugin" -type f \( -name '*.py' -o -name pyproject.toml -o -name uv.lock -o -name '*.sh' \) -print)"
  - name: target-native entrypoint validates success and failure
    run: |
      plugin=plugins/schema-helper
      mechanic=$(find "$plugin" -type f \( -name '*.js' -o -name '*.mjs' \) ! -name '*.test.js' ! -name '*.test.mjs' ! -path '*/test/*' ! -path '*/tests/*' | sed -n '1p')
      node "$mechanic" valid.json >/dev/null
      for invalid in \
        '{"description":"Valid."}' \
        '{"name":"missing-description"}' \
        '{"name":3,"description":"Valid."}' \
        '{"name":"release-check","description":"Valid.","extra":true}' \
        '{"name":"","description":"Valid."}' \
        '{"name":"release-check","description":3}'
      do
        printf '%s\n' "$invalid" >.git/invalid.json
        ! node "$mechanic" .git/invalid.json
      done
  - name: package tests pass with the target toolchain
    run: |
      plugin=plugins/schema-helper
      tests=$(find "$plugin" \( -name node_modules -o -name .pnpm -o -name dist -o -name build \) -prune -o -type f \( -name '*.test.js' -o -name '*.test.mjs' -o -path '*/test/*.js' -o -path '*/test/*.mjs' -o -path '*/tests/*.js' -o -path '*/tests/*.mjs' \) -print)
      test -n "$tests"
      cd "$plugin" && pnpm test
  - name: workflow keeps semantic judgment in the skill
    run: cat plugins/schema-helper/skills/validate-capability-manifest/SKILL.md
    expect_regex: "clear|specific|audience|semantic|meaning|quality"
    flags: i
  - name: authoring creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
