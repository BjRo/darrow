id: author-agent-skill-create-focused-skill
invariant: SA-C1,SA-C2,SA-C3,SA-C5,SA-C7,SA-C8
activation: positive
prompt: >-
  Create one cross-runtime agent skill named validate-release-note in the
  existing plugins/release-helper plugin. It should help when someone asks to
  validate a Markdown release note before review. A valid note has non-empty
  `# Summary` and `# Testing` sections. Put that mechanical check in
  scripts/validate-release-note, keep editorial judgment in SKILL.md, and add
  scripts/validate-release-note.test.sh. Support Claude Code and Codex. Do not
  commit.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Skills must be self-contained within their plugin. Bundled shell
          scripts support Bash 5 and /bin/bash 3.2. Run each script test with
          both shells. Never commit automatically.
        plugins/release-helper/.claude-plugin/plugin.json: |
          {"name":"release-helper","version":"0.1.0","description":"Release review helpers","author":{"name":"Example"}}
        plugins/release-helper/.codex-plugin/plugin.json: |
          {"name":"release-helper","version":"0.1.0","description":"Release review helpers","author":{"name":"Example"},"skills":"./skills/"}
        valid-note.md: |
          # Summary

          Add retry reporting.

          # Testing

          Ran the focused integration suite.
checks:
  - name: focused skill has valid discovery metadata
    run: >-
      skill=plugins/release-helper/skills/validate-release-note/SKILL.md;
      test -r "$skill";
      grep -E '^name:[[:space:]]*validate-release-note[[:space:]]*$' "$skill" >/dev/null;
      grep -Ei '^description:.*(release note|changelog).*(validat|review)|^description:.*(validat|review).*(release note|changelog)' "$skill" >/dev/null
  - name: deterministic validator canonicalizes paths under both shells
    run: |
      validator=plugins/release-helper/skills/validate-release-note/scripts/validate-release-note
      root=$(pwd -P)
      canonical=$root/valid-note.md
      spelled=$root//valid-note.md
      for shell in bash /bin/bash; do
        if output=$("$shell" "$validator" "$spelled" 2>&1); then
          :
        else
          validator_status=$?
          printf 'canonical-path check failed: shell=%s reason=validator-exit status=%s\ninput=%s\noutput:\n%s\n' \
            "$shell" "$validator_status" "$spelled" "$output" >&2
          exit 1
        fi
        case "$output" in
          *"$spelled"*)
            printf 'canonical-path check failed: shell=%s reason=retained-input-spelling\nexpected=%s\nrejected=%s\noutput:\n%s\n' \
              "$shell" "$canonical" "$spelled" "$output" >&2
            exit 1
            ;;
        esac
        case "$output" in
          *"$canonical"*) ;;
          *)
            printf 'canonical-path check failed: shell=%s reason=canonical-path-omitted\nexpected=%s\noutput:\n%s\n' \
              "$shell" "$canonical" "$output" >&2
            exit 1
            ;;
        esac
      done
  - name: deterministic validator rejects a missing section under both shells
    run: |
      validator=plugins/release-helper/skills/validate-release-note/scripts/validate-release-note
      printf '# Summary\n\nOnly summary.\n' >.git/invalid-note.md
      ! bash "$validator" .git/invalid-note.md
      ! /bin/bash "$validator" .git/invalid-note.md
  - name: bundled tests pass with both shells and temp path forms
    run: |
      test_script=plugins/release-helper/skills/validate-release-note/scripts/validate-release-note.test.sh
      temp_parent=${TMPDIR:-/tmp}
      case "$temp_parent" in
        /) plain_temp=/ ;;
        */) plain_temp=${temp_parent%/} ;;
        *) plain_temp=$temp_parent ;;
      esac
      case "$plain_temp" in
        /) trailing_temp=/ ;;
        *) trailing_temp=$plain_temp/ ;;
      esac
      TMPDIR="$plain_temp" bash "$test_script" >/dev/null
      TMPDIR="$trailing_temp" bash "$test_script" >/dev/null
      TMPDIR="$plain_temp" /bin/bash "$test_script" >/dev/null
      TMPDIR="$trailing_temp" /bin/bash "$test_script" >/dev/null
  - name: workflow keeps contextual judgment in the skill
    run: >-
      cat plugins/release-helper/skills/validate-release-note/SKILL.md
    expect_regex: "editorial|tone|clarity|audience|specific|accurate|risk"
    flags: i
  - name: workflow defines its completion criterion
    run: >-
      cat plugins/release-helper/skills/validate-release-note/SKILL.md
    expect_regex: "ready for review|complete when|completion|done when"
    flags: i
  - name: result is self-contained
    run: >-
      backend_file=$(find . -path '*/author-agent-skill/backend/pyproject.toml' -type f | sed -n '1p');
      test -n "$backend_file";
      backend=${backend_file%/pyproject.toml};
      uv run --quiet --frozen --no-dev --project "$backend" inspect-skill inspect plugins/release-helper/skills/validate-release-note plugins/release-helper >/dev/null;
      ! grep -R -E '(plugins/[^/]+/skills|~/|/Users/|/home/)' plugins/release-helper/skills/validate-release-note
  - name: authoring creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
semantic_output_checks:
  - name: shell evidence distinguishes observed runs from unverified coverage
    proposition: >-
      The response gives an evidence status for each required target, Bash 3.2
      and Bash 5: an observed version and test outcome, or an explicit statement
      that the target was unavailable or unexecuted and remains unverified.
      Observed passing runs of both targets establish complete coverage; no
      unavailable-target statement is needed in that situation. Command names
      alone (bash and /bin/bash) or simulated version labels do not establish
      actual version coverage.
