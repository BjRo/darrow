id: author-agent-skill-create-python-mechanic
invariant: SA-C5,SA-C6,SA-C7,SA-C8
activation: positive
prompt: >-
  Create one cross-platform agent skill named validate-capability-manifest in
  the existing plugins/schema-helper plugin. It should validate JSON capability
  manifests before review. A valid manifest is an object with non-empty string
  `name` and `description` fields and no unknown top-level fields. This is a
  native Windows, macOS, and Linux workflow, so put the substantial validation
  mechanic in a contained Python package managed by uv, expose a narrow locked
  entrypoint, and add appropriate tests. Keep semantic review of the description
  in SKILL.md. Do not commit.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Repository instructions

          Plugins are independently installable. Substantial cross-platform
          mechanics use a plugin-local Python package with pyproject.toml and
          uv.lock. A package used by one skill lives inside that skill and is
          invoked from the host-provided installed skill directory. Do not add
          a launcher solely to locate the package or forward arguments. Runtime
          and development dependencies stay separate. Runtime entrypoints use
          uv with frozen resolution and no development group. Support Python
          3.10 through 3.13. Never commit automatically.
        plugins/schema-helper/.claude-plugin/plugin.json: |
          {"name":"schema-helper","version":"0.1.0","description":"Schema review helpers","author":{"name":"Example"}}
        plugins/schema-helper/.codex-plugin/plugin.json: |
          {"name":"schema-helper","version":"0.1.0","description":"Schema review helpers","author":{"name":"Example"},"skills":"./skills/"}
        valid.json: |
          {"name":"release-check","description":"Validate a release before review."}
checks:
  - name: focused skill has valid discovery metadata
    run: >-
      skill=plugins/schema-helper/skills/validate-capability-manifest/SKILL.md;
      test -r "$skill";
      grep -E '^name:[[:space:]]*validate-capability-manifest[[:space:]]*$' "$skill" >/dev/null;
      grep -Ei '^description:.*(manifest|capability).*(validat|review)|^description:.*(validat|review).*(manifest|capability)' "$skill" >/dev/null
  - name: Python package is skill-contained, locked, and directly invoked
    run: |
      skill=plugins/schema-helper/skills/validate-capability-manifest
      project=$(find plugins/schema-helper -name pyproject.toml -type f | sed -n '1p')
      test -n "$project"
      backend=$(dirname "$project")
      case "$backend" in "$skill"/*) ;; *) exit 1 ;; esac
      test -r "$backend/uv.lock"
      grep -F 'requires-python = ">=3.10,<3.14"' "$project" >/dev/null
      grep -F 'default-groups = []' "$project" >/dev/null
      ! find "$skill" -type f -name '*.sh' | grep .
      test ! -d plugins/schema-helper/bin ||
        test -z "$(find plugins/schema-helper/bin -type f -print -quit)"
  - name: locked runtime entrypoint validates success and failure
    run: |
      backend=$(dirname "$(find plugins/schema-helper -name pyproject.toml -type f | sed -n '1p')")
      entrypoint=$(sed -n '/^\[project.scripts\]/,/^\[/ { /^[a-z][a-z0-9-]*[[:space:]]*=/ { s/[[:space:]]*=.*//; p; q; }; }' "$backend/pyproject.toml")
      test -n "$entrypoint"
      output=$(uv run --quiet --frozen --no-dev --project "$backend" "$entrypoint" valid.json)
      case "$output" in *"$(pwd -P)/valid.json"*) ;; *) exit 1 ;; esac
      for invalid in \
        '{"name":"missing-description"}' \
        '{"name":"","description":"empty name"}' \
        '{"name":7,"description":"wrong type"}' \
        '{"name":"unknown-field","description":"reject extras","extra":true}'
      do
        printf '%s\n' "$invalid" >.git/invalid.json
        ! uv run --quiet --frozen --no-dev --project "$backend" "$entrypoint" .git/invalid.json
      done
  - name: package tests pass without repository dependencies
    run: |
      backend=$(dirname "$(find plugins/schema-helper -name pyproject.toml -type f | sed -n '1p')")
      uv lock --check --project "$backend"
      (cd "$backend" && uv run --all-groups pytest -q)
  - name: workflow keeps semantic judgment in the skill
    run: cat plugins/schema-helper/skills/validate-capability-manifest/SKILL.md
    expect_regex: "clear|specific|audience|semantic|meaning|quality"
    flags: i
  - name: authoring creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
