id: capture-decision-work-item-owner
invariant: DM-7
activation: competition
mount_plugin_skills: true
prompt: >-
  In the GitHub issue tracker, capture this ticket-local implementation
  decision on ticket acme/service#42: retry only idempotent requests with exponential
  backoff. This is scoped to that work item and is not repository architecture.
  The tracker may be unavailable; do not create a repository substitute.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\n"
        docs/decisions/.gitkeep: ""
  bin:
    gh: |
      #!/bin/sh
      printf '%s\n' "$*" >> .git/gh-calls
      echo 'tracker unavailable' >&2
      exit 1
checks:
  - name: no repository substitute is created
    run: git status --porcelain --untracked-files=all
    not_regex: "\\S"
  - name: ticket owner integration was attempted
    run: >-
      test -s .git/gh-calls;
      calls=$(cat .git/gh-calls);
      printf '%s\n' "$calls";
      printf '%s\n' "$calls" | grep -Ei 'issue (view|comment|edit) (#?42)( |$)|api .*(issue|issues|42)' >/dev/null;
      printf '%s\n' "$calls" | grep -Ei -- '--repo[ =]+acme/service|repos/acme/service|github\.com/acme/service' >/dev/null
    expect_regex: "(42|issue|api)"
    flags: i
  - name: capture creates no commit
    run: git rev-list --all --reflog --count
    expect_exact: "1"
semantic_output_checks:
  - name: response preserves owner content and the unconfirmed persistence gap
    proposition: >-
      The response identifies GitHub issue acme/service#42 and the requested
      idempotent-request exponential-backoff policy, reports that the tracker
      operation was unavailable, and clearly leaves persistence unconfirmed
      without claiming the decision was applied to the issue.
