id: capture-decision-no-manufactured-decision
invariant: DM-2
activation: competition
mount_plugin_skills: true
prompt: >-
  Capture our repository database decision. We observed that SQLite was faster
  in one local benchmark, one teammate recommends PostgreSQL, and I currently
  prefer SQLite. The team has not selected an option, and I am not asking to
  preserve a proposal. Record only what this discussion actually established.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\n"
        docs/decisions/.gitkeep: ""
checks:
  - name: discussion without a choice causes no mutation
    run: git status --porcelain --untracked-files=all
    not_regex: "\\S"
  - name: no ADR is manufactured
    run: find docs/decisions -maxdepth 1 -type f -name 'ADR-*.md' -print
    expect_exact: ""
  - name: response preserves classification and unresolved state
    run: >-
      message=.git/last-message.md;
      grep -Ei 'observation|observed|benchmark' "$message" >/dev/null;
      grep -Ei 'recommendation|recommends' "$message" >/dev/null;
      grep -Ei 'preference|prefer' "$message" >/dev/null;
      grep -Ei 'unresolved|not selected|no.*decision|which.*option' "$message" >/dev/null;
      echo classified
    expect_exact: "classified"
  - name: capture creates no commit
    run: git rev-list --all --reflog --count
    expect_exact: "1"
