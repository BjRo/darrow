id: list-decisions-cross-surface
invariant: DM-L2
activation: positive
prompt: >-
  List only recorded decisions whose subject is authentication, considering
  repository architecture, normative capability behavior, and contributor
  policy. Report their canonical records and scopes without changing anything.
  Silently omit decisions about other subjects: do not name them even as
  excluded records.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\n"
        CONTRIBUTING.md: |
          # Contributor policy

          Authentication changes require a security review before merge.
        docs/specs/authentication.md: |
          # Authentication capability

          - **AUTH-1 — Session transport.** API sessions must use HttpOnly
            SameSite cookies.
        docs/decisions/ADR-0001-oidc.md: |
          # ADR-0001: Use OIDC for external identity

          Status: Accepted
          Date: 2026-06-01
          Summary: Use OIDC for external identity.

          ## Context

          External users need federated identity.

          ## Decision

          Use OIDC for external identity.

          ## Consequences

          Identity providers must support OIDC.
        docs/decisions/ADR-0002-storage.md: |
          # ADR-0002: Use object storage for exports

          Status: Accepted
          Date: 2026-06-02
          Summary: Use object storage for exports.

          ## Context

          Large exports need durable storage.

          ## Decision

          Use object storage for exports.

          ## Consequences

          Export workers upload generated files.
checks:
  - name: listing is read-only
    run: git status --porcelain --untracked-files=all
    not_regex: "\\S"
  - name: reports each canonical authentication record exactly once
    run: >-
      root=$(pwd -P); message=.git/last-message.md;
      adr="$root/docs/decisions/ADR-0001-oidc.md";
      specification="$root/docs/specs/authentication.md";
      policy="$root/CONTRIBUTING.md";
      test "$(grep -F -c "$adr" "$message")" -eq 1;
      test "$(grep -F -c "$specification" "$message")" -eq 1;
      test "$(grep -F -c "$policy" "$message")" -eq 1;
      echo complete
    expect_exact: "complete"
  - name: unrelated decision is omitted
    run: cat .git/last-message.md
    not_regex: "ADR-0002\\b|ADR-0002-storage|object storage|exports"
    flags: i
  - name: listing creates no commit
    run: git rev-list --all --reflog --count
    expect_exact: "1"
semantic_output_checks:
  - name: accepted architecture decision is classified correctly
    proposition: >-
      The response reports the OIDC external-identity decision as Accepted,
      owned by the canonical ADR, and scoped to repository architecture.
  - name: normative authentication rule is classified correctly
    proposition: >-
      The response reports HttpOnly SameSite cookies as a distinct normative
      capability effect with no recorded status, owned by the authentication
      specification rather than the ADR or contributor policy.
  - name: contributor authentication policy is classified correctly
    proposition: >-
      The response reports the security-review-before-merge requirement as a
      distinct contributor-policy effect with no recorded status, owned by
      CONTRIBUTING.md rather than the ADR or specification.
