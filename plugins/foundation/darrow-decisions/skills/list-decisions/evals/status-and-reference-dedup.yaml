id: list-decisions-status-and-reference-dedup
invariant: "DM-L2,DM-L3"
activation: competition
mount_plugin_skills: true
prompt: >-
  List recorded authentication decisions and unresolved authentication
  proposals across ADR and specification surfaces. Distinguish actual statuses,
  report each canonical effect once with an absolute path, and silently omit
  unrelated records without naming them, even as excluded examples. Do not
  change anything.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\n"
        docs/specs/authentication.md: |
          # Authentication capability

          External identity follows [ADR-0001](../decisions/ADR-0001-oidc.md).
          API sessions must use HttpOnly SameSite cookies.
        docs/decisions/ADR-0001-oidc.md: |
          # ADR-0001: Use OIDC for external identity

          Status: Accepted
          Date: 2026-06-01
          Summary: Use OIDC for external identity.

          ## Context

          External users need federated identity.

          ## Decision

          Use OIDC for external identity.

          ## Consequences

          Identity providers must support OIDC.
        docs/decisions/ADR-0002-passwordless.md: |
          # ADR-0002: Evaluate passwordless authentication

          Status: Proposed
          Date: 2026-07-10
          Summary: Evaluate passkeys before selecting a passwordless replacement.

          ## Context

          Password recovery creates support load.

          ## Decision

          Evaluate passkeys before selecting a replacement.

          ## Consequences

          This proposal has not taken effect.
        docs/decisions/ADR-0003-storage.md: |
          # ADR-0003: Use object storage for exports

          Status: Accepted
          Date: 2026-07-11
          Summary: Use object storage for exports.

          ## Context

          Exports need durable storage.

          ## Decision

          Use object storage.

          ## Consequences

          Workers upload exports.
checks:
  - name: listing is read-only
    run: git status --porcelain --untracked-files=all
    not_regex: "\\S"
  - name: canonical records are deduplicated
    run: >-
      root=$(pwd -P); message=.git/last-message.md;
      test "$(grep -F -c "$root/docs/decisions/ADR-0001-oidc.md" "$message")" -eq 1;
      test "$(grep -F -c "$root/docs/decisions/ADR-0002-passwordless.md" "$message")" -eq 1;
      test "$(grep -F -c "$root/docs/specs/authentication.md" "$message")" -eq 1;
      echo unique
    expect_exact: "unique"
  - name: unrelated record is omitted
    run: cat .git/last-message.md
    not_regex: "ADR-0003\\b|ADR-0003-storage|object storage|exports"
    flags: i
  - name: listing creates no commit
    run: git rev-list --all --reflog --count
    expect_exact: "1"
semantic_output_checks:
  - name: accepted authentication decision keeps its actual status
    proposition: >-
      The response reports the OIDC external-identity effect as an Accepted
      repository-architecture decision owned by ADR-0001.
  - name: unresolved authentication proposal keeps its actual status
    proposition: >-
      The response reports the passkey or passwordless evaluation as a
      Proposed repository-architecture decision owned by ADR-0002 and does not
      imply that it is already in effect.
  - name: specification effect remains distinct from its ADR reference
    proposition: >-
      The response reports the HttpOnly SameSite cookie rule as a distinct
      normative capability effect with no recorded status, owned by the
      authentication specification rather than duplicating the OIDC ADR.
