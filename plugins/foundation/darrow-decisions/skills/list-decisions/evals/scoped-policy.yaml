id: list-decisions-scoped-policy
invariant: DM-L2
activation: competition
mount_plugin_skills: true
prompt: >-
  What recorded contributor policy governs authentication changes in the API
  service? Follow the repository's policy routing, report the canonical
  absolute record and scope, and do not change anything.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\n"
        CONTRIBUTING.md: |
          # Contributor policy map

          Service-specific contributor policy is authoritative in each
          `services/<name>/POLICY.md`. Authentication work belongs to the API
          service policy.
        services/api/POLICY.md: |
          # API contributor policy

          Authentication changes require approval from two security reviewers.
        services/worker/POLICY.md: |
          # Worker contributor policy

          Queue changes require one reliability reviewer.
checks:
  - name: listing is read-only
    run: git status --porcelain --untracked-files=all
    not_regex: "\\S"
  - name: reports the canonical scoped policy path
    run: >-
      root=$(pwd -P); message=.git/last-message.md;
      grep -F "$root/services/api/POLICY.md" "$message" >/dev/null;
      echo scoped
    expect_exact: "scoped"
  - name: does not report unrelated scoped policy
    run: cat .git/last-message.md
    not_regex: "services/worker/POLICY\\.md|reliability reviewer|Queue changes"
    flags: i
  - name: listing creates no commit
    run: git rev-list --all --reflog --count
    expect_exact: "1"
semantic_output_checks:
  - name: scoped contributor policy is authoritative
    proposition: >-
      The response reports that API authentication changes require approval
      from two security reviewers, classifies this as contributor policy for
      the API service, and owns the effect in services/api/POLICY.md.
