id: setup-information-architecture-codex-only-scope
invariant: IA-S6,IA-S8,IA-S11
activation: competition
mount_plugin_skills: true
prompt: >-
  Set up a lean information architecture for Codex only. Do not add Claude
  guidance or adapters. I approve the proposed file-level actions.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\n"
        package.json: "{\"private\":true}\n"
  setup: cp "{{case_dir}}/../../../bin/ia-doctor" .git/ia-doctor
checks:
  - name: Codex entrypoint is created
    run: test -f AGENTS.md && echo created
    expect_regex: "^created$"
  - name: Claude entrypoint is not created
    run: >-
      test ! -e CLAUDE.md && test ! -e .claude/CLAUDE.md &&
      test ! -d .claude/rules && echo absent
    expect_regex: "^absent$"
  - name: Codex-only verification passes
    run: >-
      bash .git/ia-doctor verify --runtime codex . >/dev/null && echo verified
    expect_regex: "^verified$"
  - name: setup creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
