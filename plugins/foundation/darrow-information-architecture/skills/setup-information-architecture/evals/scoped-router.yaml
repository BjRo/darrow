id: setup-information-architecture-scoped-router
invariant: IA-S2,IA-S3,IA-S4,IA-S6,IA-S8,IA-S11
activation: competition
mount_plugin_skills: true
prompt: >-
  Set up a lean agent information architecture for this repository. Database
  work must preserve integer cents. Frontend changes must preserve keyboard
  navigation and semantic accessibility. Agents must never self-merge a pull
  request. I approve creating the proposed instruction files now.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Budget app\n"
        package.json: "{\"private\":true,\"packageManager\":\"bun@1.3.0\"}\n"
        apps/api/src/db.ts: "export const schemaVersion = 1;\n"
        apps/web/src/app.tsx: "export const App = () => null;\n"
  setup: cp "{{case_dir}}/../../../bin/ia-doctor" .git/ia-doctor
checks:
  - name: root entrypoint created
    run: test -f AGENTS.md && echo created
    expect_regex: "^created$"
  - name: Claude adapter created for default dual-runtime scope
    run: test -e CLAUDE.md && echo created
    expect_regex: "^created$"
  - name: Claude entrypoint is a thin adapter rather than an independent copy
    run: >-
      if [ -L CLAUDE.md ] && [ CLAUDE.md -ef AGENTS.md ]; then echo adapter;
      elif grep -Eiq '@AGENTS\.md|(read|consult|load|follow).{0,80}AGENTS\.md' CLAUDE.md &&
      [ "$(wc -c < CLAUDE.md)" -lt "$(wc -c < AGENTS.md)" ]; then echo adapter;
      else exit 1; fi
    expect_regex: "^adapter$"
  - name: universal merge safety stays resident
    run: cat AGENTS.md
    expect_regex: "self[- ]?merge|never merge a pull request|merge (its|your) own|do not merge (a )?pull requests? yourself|must not merge (a )?pull requests? yourself"
    flags: i
  - name: root contains an explicit deferred read route
    run: cat AGENTS.md
    expect_regex: "(database|apps/api)[\\s\\S]*(read|consult|load)[\\s\\S]*\\.md|(read|consult|load)[\\s\\S]*\\.md[\\s\\S]*(database|apps/api)"
    flags: i
  - name: database guidance is in a deferred project file
    run: >-
      find . -type f -name '*.md' ! -path './AGENTS.md' ! -path './CLAUDE.md'
      -not -path './.git/*' -not -path './.agents/*' -not -path './.claude/*'
      -exec grep -il 'integer cents\|cents.*integer' {} + | LC_ALL=C sort
    expect_regex: "\\.md$"
  - name: accessibility guidance is in a distinct deferred project file
    run: >-
      find . -type f -name '*.md' ! -path './AGENTS.md' ! -path './CLAUDE.md'
      -not -path './.git/*' -not -path './.agents/*' -not -path './.claude/*'
      -exec grep -il 'accessib\|keyboard navigation\|semantic HTML' {} + | LC_ALL=C sort
    expect_regex: "\\.md$"
    flags: i
  - name: database and accessibility guidance use different scoped files
    run: >-
      db=$(find . -type f -name '*.md' ! -path './AGENTS.md' ! -path './CLAUDE.md'
      -not -path './.git/*' -not -path './.agents/*' -not -path './.claude/*'
      -exec grep -il 'integer cents\|cents.*integer' {} + | sed -n '1p');
      web=$(find . -type f -name '*.md' ! -path './AGENTS.md' ! -path './CLAUDE.md'
      -not -path './.git/*' -not -path './.agents/*' -not -path './.claude/*'
      -exec grep -il 'accessib\|keyboard navigation\|semantic HTML' {} + | sed -n '1p');
      test -n "$db" && test -n "$web" && test "$db" != "$web" && echo distinct
    expect_regex: "^distinct$"
  - name: exactly one scoped file owns each domain invariant
    run: >-
      db_count=$(find . -type f -name '*.md' ! -path './AGENTS.md' ! -path './CLAUDE.md'
      -not -path './.git/*' -not -path './.agents/*' -not -path './.claude/*'
      -exec grep -il 'integer cents\|cents.*integer' {} + | wc -l | tr -d ' ');
      web_count=$(find . -type f -name '*.md' ! -path './AGENTS.md' ! -path './CLAUDE.md'
      -not -path './.git/*' -not -path './.agents/*' -not -path './.claude/*'
      -exec grep -il 'accessib\|keyboard navigation\|semantic HTML' {} + | wc -l | tr -d ' ');
      test "$db_count" = 1 && test "$web_count" = 1 && echo unique
    expect_regex: "^unique$"
  - name: root binds each domain intent to its discovered target
    run: >-
      db=$(find . -type f -name '*.md' ! -path './AGENTS.md' ! -path './CLAUDE.md'
      -not -path './.git/*' -not -path './.agents/*' -not -path './.claude/*'
      -exec grep -il 'integer cents\|cents.*integer' {} + | sed -n '1p');
      web=$(find . -type f -name '*.md' ! -path './AGENTS.md' ! -path './CLAUDE.md'
      -not -path './.git/*' -not -path './.agents/*' -not -path './.claude/*'
      -exec grep -il 'accessib\|keyboard navigation\|semantic HTML' {} + | sed -n '1p');
      db=${db#./}; web=${web#./}; test -n "$db" && test -n "$web";
      DB="$db" WEB="$web" awk '
      function without_target(value, target, pos) {if (target == "") return value; while ((pos=index(value, target))) value=substr(value, 1, pos-1) " " substr(value, pos+length(target)); return value}
      function has_loader(value) {return tolower(value) ~ /(^|[^[:alnum:]_])(read|consult|load|follow)([^[:alnum:]_]|$)/}
      function check(    db,web,lower) {db=ENVIRON["DB"]; web=ENVIRON["WEB"]; lower=tolower(without_target(block, db)); if (index(block, db) && lower ~ /(database|persistence|migration|money|apps\/api)/ && has_loader(lower)) db_found=1; lower=tolower(without_target(block, web)); if (index(block, web) && lower ~ /(frontend|web|accessib|keyboard|apps\/web)/ && has_loader(lower)) web_found=1}
      /\|/ {check(); block=$0; check(); block=""; next}
      /^[[:space:]]*([-*+]|[0-9][0-9]*[.)])[[:space:]]/ {check(); if (has_loader(block) && block !~ /[.A-Za-z0-9_\/-]+\.md/) block=block " " $0; else block=$0; next}
      /^[[:space:]]*#[#]*[[:space:]]/ {check(); block=$0; next}
      /^[[:space:]]*$/ {if (block ~ /[.A-Za-z0-9_\/-]+\.md/) {check(); block=""} else if (has_loader(block)) block=block " "; else block=""; next}
      {if (has_loader($0) && $0 ~ /[.A-Za-z0-9_\/-]+\.md/ && block ~ /[.A-Za-z0-9_\/-]+\.md/) {check(); block=$0; next}}
      {block=block " " $0}
      END {check(); if (db_found && web_found) print "routed"}' AGENTS.md
    expect_regex: "^routed$"
  - name: scoped invariants are absent from the resident root
    run: cat AGENTS.md
    not_regex: "integer cents|cents.*integer|keyboard navigation|semantic HTML"
    flags: i
  - name: universal merge rule is not duplicated into scoped guidance
    run: >-
      count=$(find . -type f -name '*.md' -not -path './.git/*'
      -not -path './.agents/*' -not -path './.claude/*'
      -exec grep -Eil 'self[- ]?merge|merge (its|your) own|do not merge (a )?pull requests? yourself|must not merge (a )?pull requests? yourself' {} + | wc -l | tr -d ' ');
      test "$count" = 1 && echo single
    expect_regex: "^single$"
  - name: money invariant is preserved in project guidance
    run: >-
      find . -type f -name '*.md' -not -path './.git/*'
      -not -path './.agents/*' -not -path './.claude/*' -exec cat {} +
    expect_regex: "integer cents|cents.*integer"
    flags: i
  - name: deterministic dual-runtime verification passes
    run: >-
      bash .git/ia-doctor verify --runtime both . >/dev/null && echo verified
    expect_regex: "^verified$"
  - name: setup creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
