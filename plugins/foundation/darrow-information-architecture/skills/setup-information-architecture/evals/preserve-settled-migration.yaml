id: setup-information-architecture-preserve-settled-migration
invariant: IA-S9,IA-S11
activation: competition
mount_plugin_skills: true
prompt: >-
  Set up a lean dual-runtime information architecture and record the settled
  persistence direction from canonical repository evidence. I approve the
  proposed file-level changes.
fixture:
  commits:
    - message: "chore: init"
      files:
        docs/decisions/004-storage.md: |
          # ADR 004: Storage access

          Status: Accepted

          New persistence work uses the raw SQL package. The ORM package is
          legacy migration surface only; do not add new ORM repositories.
        src/storage/orm/legacy.ts: "export const legacy = true;\n"
        src/storage/sql/users.ts: "export const users = true;\n"
        package.json: "{\"private\":true}\n"
  setup: mkdir -p .git/ia-backend; cp -R "{{case_dir}}/../../../backend/src" .git/ia-backend/; cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/ia-backend/
checks:
  - name: dual-runtime agent entrypoints are created
    run: test -f AGENTS.md && test -e CLAUDE.md && echo created
    expect_regex: "^created$"
  - name: settled guidance passes deterministic dual-runtime verification
    run: >-
      uv run --quiet --frozen --no-dev --project .git/ia-backend ia-doctor verify --runtime both . >/dev/null && echo verified
    expect_regex: "^verified$"
  - name: setup creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
semantic_output_checks:
  - name: settled persistence direction is retained and not reopened
    proposition: >-
      The response says the accepted raw-SQL direction and the legacy-only ORM
      restriction were retained in resident guidance or through an explicit
      reachable route, identifies where that guidance now lives, and treats it
      as settled repository policy rather than asking the user to choose
      between the ORM and SQL patterns again.
