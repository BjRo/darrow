id: setup-information-architecture-preserve-settled-migration
invariant: IA-S2,IA-S8,IA-S9,IA-S11
activation: competition
mount_plugin_skills: true
prompt: >-
  Set up a lean dual-runtime information architecture and record the settled
  persistence direction from canonical repository evidence in
  .agent-shared/rules/persistence.md. Make that shared guidance reachable for
  persistence work in both runtimes. I approve the proposed file-level changes.
fixture:
  commits:
    - message: "chore: init"
      files:
        docs/decisions/004-storage.md: |
          # ADR 004: Storage access

          Status: Accepted

          New persistence work uses the raw SQL package. The ORM package is
          legacy migration surface only; do not add new ORM repositories.
        src/storage/orm/legacy.ts: "export const legacy = true;\n"
        src/storage/sql/users.ts: "export const users = true;\n"
        package.json: "{\"private\":true}\n"
  setup: mkdir -p .git/ia-backend; cp -R "{{case_dir}}/../../../backend/src" .git/ia-backend/; cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/ia-backend/
checks:
  - name: dual-runtime agent entrypoints are created
    run: test -f AGENTS.md && test -e CLAUDE.md && echo created
    expect_regex: "^created$"
  - name: settled guidance passes deterministic dual-runtime verification
    run: >-
      uv run --quiet --frozen --no-dev --project .git/ia-backend ia-doctor verify --runtime both . >/dev/null && echo verified
    expect_regex: "^verified$"
  - name: setup creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
  - name: canonical accepted decision remains unchanged
    run: git diff --exit-code HEAD -- docs/decisions/004-storage.md
semantic_artifact:
  path: .agent-shared/rules/persistence.md
  checks:
    - name: settled persistence direction is retained and not reopened
      proposition: >-
        This persistence guidance preserves the accepted ADR 004 policy: new
        persistence work uses raw SQL, and ORM is legacy migration surface
        only, with no new ORM repositories. It may state that policy inline
        or require reading docs/decisions/004-storage.md before persistence
        work; that accepted source is preserved by a separate check.
        An explicit persistence-work route to that ADR retains both policy
        points without repeating them. The guidance does not reopen the
        SQL-versus-ORM choice or replace the accepted direction with a guess.
semantic_output_checks:
  - name: final response does not reopen the settled policy
    proposition: >-
      The response does not ask the user to choose ORM versus SQL for new
      persistence work as an unresolved decision. It need not repeat the ADR's
      policy details when reporting that the guidance was saved. Questions
      about structural file actions do not by themselves reopen that policy.
