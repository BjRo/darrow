id: setup-information-architecture-confirm-before-mutation
invariant: IA-S7,IA-S11
activation: positive
mount_plugin_skills: true
prompt: >-
  {{skill_invocation}} Set up a lean dual-runtime agent information architecture for this
  repository. Inspect it and propose the file graph first.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\n"
        package.json: "{\"private\":true,\"scripts\":{\"test\":\"vitest\"}}\n"
        src/index.ts: "export const service = true;\n"
checks:
  - name: proposal phase leaves the worktree clean
    run: git status --porcelain --untracked-files=all
    not_regex: "\\S"
  - name: proposal phase creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
semantic_output_checks:
  - name: proposal names the graph and pauses for confirmation
    proposition: >-
      The response proposes concrete file-level actions for both AGENTS.md and
      CLAUDE.md and asks the user to confirm the proposal before any files are
      created or changed.
