id: doctor-information-architecture-move-procedure-to-skill
invariant: IA-D6,IA-D12
activation: competition
mount_plugin_skills: true
prompt: >-
  Doctor the agent information architecture and apply the safe reorganization.
  Preserve the release behavior and every safety gate.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Agent Instructions

          Never publish from an unclean worktree.

          ## Release procedure

          1. Run `./tools/preflight`.
          2. Read the version from package.json.
          3. Run `./tools/build-release`.
          4. Inspect dist/checksums.txt.
          5. Run `./tools/publish` only after explicit confirmation.
        CLAUDE.md: "# Claude adapter\n\nRead `AGENTS.md` before work.\n"
        package.json: "{\"private\":true,\"version\":\"1.2.3\"}\n"
        tools/preflight: "#!/bin/sh\nexit 0\n"
        tools/build-release: "#!/bin/sh\nexit 0\n"
        tools/publish: "#!/bin/sh\nexit 0\n"
        dist/checksums.txt: "fixture\n"
  setup: cp "{{case_dir}}/../../../bin/ia-doctor" .git/ia-doctor
checks:
  - name: release procedure becomes an intent-triggered project skill
    run: >-
      find . -type f -name SKILL.md
      ! -path '*doctor-information-architecture*' -exec grep -il 'build-release' {} +
    expect_regex: "SKILL\\.md$"
  - name: release skill is tracked or visible to version control
    run: >-
      skill=$(find . -type f -name SKILL.md
      ! -path '*doctor-information-architecture*' -exec grep -il 'build-release' {} +
      | sed -n '1p');
      test -n "$skill";
      if git check-ignore -q -- "$skill"; then exit 1; fi;
      echo visible
    expect_regex: "^visible$"
  - name: release skill preserves every step and confirmation gate
    run: >-
      skill=$(find . -type f -name SKILL.md
      ! -path '*doctor-information-architecture*' -exec grep -il 'build-release' {} +
      | sed -n '1p'); cat "$skill"
    expect_regex: "preflight[\\s\\S]*package\\.json[\\s\\S]*build-release[\\s\\S]*dist/checksums\\.txt[\\s\\S]*tools/publish[\\s\\S]*explicit confirmation"
    flags: i
  - name: release skill has valid discovery metadata
    run: >-
      skill=$(find . -type f -name SKILL.md
      ! -path '*doctor-information-architecture*' -exec grep -il 'build-release' {} +
      | sed -n '1p');
      awk 'function valid(value, lower) {sub(/^[^:]*:[[:space:]]*/, "", value); sub(/[[:space:]]+#.*$/, "", value); sub(/^[[:space:]]+|[[:space:]]+$/, "", value); lower=tolower(value); return value != "" && value !~ /^(\[|\{)/ && lower !~ /^(null|~|true|false|yes|no|on|off|[0-9]+)$/ && value != "\"\"" && value != "\047\047"} NR==1 && $0=="---" {front=1; next} front && /^name[[:space:]]*:/ && valid($0) {name=1} front && /^description[[:space:]]*:/ && valid($0) {description=1} front && $0=="---" {exit} END {if (name && description) print "valid"}' "$skill"
    expect_regex: "^valid$"
  - name: universal clean-worktree invariant stays resident
    run: cat AGENTS.md
    expect_regex: "never publish from an unclean worktree"
    flags: i
  - name: full ordered procedure leaves the resident root
    run: cat AGENTS.md
    not_regex: "tools/preflight|dist/checksums\\.txt|tools/publish"
    flags: i
  - name: release intent remains discoverable from root or skill metadata
    run: >-
      find . -type f -name '*.md'
      \( -path './AGENTS.md' -o -name SKILL.md \)
      ! -path '*doctor-information-architecture*' -exec cat {} +
    expect_regex: "release|publish"
    flags: i
  - name: release procedure is reachable by an exact route or both native skill loaders
    run: >-
      skill=$(find . -type f -name SKILL.md
      ! -path '*doctor-information-architecture*' -exec grep -il 'build-release' {} +
      | sed -n '1p');
      target=${skill#./}; test -n "$target";
      skill_abs=$(cd "$(dirname "$target")" && pwd -P)/$(basename "$target");
      root=$(pwd -P); routes=$(bash .git/ia-doctor inspect --runtime codex .);
      graph_route=false;
      case "$routes" in *"$root/AGENTS.md -> $skill_abs"*) graph_route=true;; esac;
      intent_route=false;
      while IFS= read -r line; do
      case "$line" in *"$target"*)
      lower=$(printf '%s\n' "$line" | tr '[:upper:]' '[:lower:]');
      case "$lower" in *release*|*publish*)
      case "$lower" in *read*|*load*|*use*) intent_route=true;; esac;; esac;; esac;
      done < AGENTS.md;
      if [ "$graph_route" = true ] && [ "$intent_route" = true ]; then echo discoverable; exit 0; fi;
      codex=$(find -L .agents/skills -type f -name SKILL.md -exec grep -il 'build-release' {} + 2>/dev/null || :);
      claude=$(find -L .claude/skills -type f -name SKILL.md -exec grep -il 'build-release' {} + 2>/dev/null || :);
      valid_native() { for native in $1; do
      if git check-ignore -q -- "$native"; then continue; fi;
      flat=$(tr '\n' ' ' < "$native");
      if printf '%s\n' "$flat" | grep -Ei 'preflight.*package\.json.*build-release.*dist/checksums\.txt.*tools/publish.*explicit confirmation' >/dev/null; then return 0; fi;
      done; return 1; };
      valid_native "$codex" && valid_native "$claude" && echo discoverable
    expect_regex: "^discoverable$"
  - name: procedure move passes deterministic dual-runtime verification
    run: >-
      bash .git/ia-doctor verify --runtime both . >/dev/null && echo verified
    expect_regex: "^verified$"
  - name: doctor creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
