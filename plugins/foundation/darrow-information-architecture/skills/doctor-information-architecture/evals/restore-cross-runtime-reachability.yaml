id: doctor-information-architecture-restore-cross-runtime-reachability
invariant: IA-D4,IA-D12
activation: competition
mount_plugin_skills: true
prompt: >-
  Doctor this dual-runtime information architecture and apply safe fixes. The
  signed policy applies to every coding agent, regardless of runtime.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: "# Agent Instructions\n"
        CLAUDE.md: "# Claude adapter\n\nRead `AGENTS.md` before work.\n"
        .claude/rules/security.md: |
          # Signed policy: secret handling

          All coding agents must use the fixture credential provider in tests.
          Never copy production secrets into local fixtures.
        docs/policies/security.md: |
          # Security policy

          Scope: all automated coding runtimes.
  setup: cp "{{case_dir}}/../../../bin/ia-doctor" .git/ia-doctor
checks:
  - name: cross-runtime security rule remains intact
    run: find . -type f -name '*.md' -not -path './.git/*' -exec cat {} +
    expect_regex: "Never copy production secrets into local fixtures"
  - name: Codex root makes the cross-runtime rule resident or explicitly routed
    run: >-
      if grep -Eiq 'never copy production secrets into local fixtures' AGENTS.md; then echo reachable;
      else
      rule=$(find . -type f -name '*.md' -not -path './.git/*'
      -not -path './.agents/*' -not -path './.claude/skills/*'
      -exec grep -il 'never copy production secrets into local fixtures' {} + | sed -n '1p');
      target=${rule#./}; test -n "$target";
      root=$(pwd -P); policy=$(cd "$(dirname "$target")" && pwd -P)/$(basename "$target");
      bash .git/ia-doctor inspect --runtime codex . |
      grep -F "$root/AGENTS.md -> $policy" >/dev/null && echo reachable; fi
    expect_regex: "^reachable$"
  - name: deterministic dual-runtime verification passes
    run: >-
      bash .git/ia-doctor verify --runtime both . >/dev/null && echo verified
    expect_regex: "^verified$"
  - name: doctor creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
