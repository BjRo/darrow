id: doctor-information-architecture-trim-derived-keep-contracts
invariant: IA-D2,IA-D3,IA-D9,IA-D12
activation: competition
mount_plugin_skills: true
prompt: Doctor the repository information architecture and apply the clearly
  safe improvements while preserving behavioral contracts and routing. Also save
  before-and-after root metrics to .fixture-state/root-metrics.json. Use codex
  and claude keys, each containing before and after objects with integer bytes
  and tokens (the UTF-8 byte count divided by four, rounded up).
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Agent Instructions

          ## Delivery
          - Never self-merge a pull request.
          - Before calling work done, run `./tools/guard verify`.

          ## Rule Index
          Before editing a matching path, read every listed rule.
          - `apps/api/src/**` -> `.agent-shared/rules/api.md`
          - `apps/web/src/**` -> `.agent-shared/rules/web.md`

          ## Stack
          - Package manager: Bun 1.3.
          - Tests: Vitest.
          - Lint and format: Biome.
          - Runtime: Bun 1.3; never use npm because it rewrites the lockfile.
        CLAUDE.md: |
          # Claude adapter

          Read `AGENTS.md` before work.
        .agent-shared/rules/api.md: |
          # API

          Keep error responses typed.
        .agent-shared/rules/web.md: |
          # Web

          Preserve keyboard navigation.
        package.json: |
          {"private":true,"packageManager":"bun@1.3.0","scripts":{"test":"vitest","lint":"biome check ."}}
        tools/guard: |
          #!/bin/sh
          exit 0
  setup: mkdir -p .git/ia-backend; cp -R "{{case_dir}}/../../../backend/src"
    .git/ia-backend/; cp "{{case_dir}}/../../../backend/pyproject.toml"
    "{{case_dir}}/../../../backend/uv.lock" .git/ia-backend/; mkdir -p
    .git/eval-checks/ia; cp
    "{{case_dir}}/../../../backend/tests/evals/eval_root_metrics.py"
    .git/eval-checks/ia/
checks:
  - name: self-merge prohibition remains
    run: cat AGENTS.md
    expect_regex: never self-merge
    flags: i
  - name: unusual completion command remains
    run: cat AGENTS.md
    expect_regex: \./tools/guard verify
  - name: API route remains
    run: cat AGENTS.md
    expect_regex: \.agent-shared/rules/api\.md
  - name: web route remains
    run: cat AGENTS.md
    expect_regex: \.agent-shared/rules/web\.md
  - name: manifest-derived stack inventory is trimmed
    run: cat AGENTS.md
    not_regex: Bun|Vitest|Biome|existing toolchain|use the (repository|existing)
      (stack|toolchain)
    flags: i
  - name: mixed bullet keeps its prohibition and rationale
    run: cat AGENTS.md
    expect_regex: never use npm[\s\S]*rewrites the lockfile|rewrites the
      lockfile[\s\S]*never use npm
    flags: i
  - name: deterministic dual-runtime routing verification passes
    run:
      uv run --quiet --frozen --no-dev --project .git/ia-backend ia-doctor verify
      --runtime both . >/dev/null && echo verified
    expect_regex: ^verified$
  - name: requested metrics match the actual before and after roots
    run: uv run --quiet --frozen --no-dev --project .git/ia-backend python
      .git/eval-checks/ia/eval_root_metrics.py
    expect_regex: "^metrics-ok: "
  - name: doctor creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: ^1$
semantic_output_checks:
  - name: reports both runtime metrics
    proposition:
      The response reports before and after root bytes and approximate
      tokens separately for Codex and Claude, with clear runtime labels. A table
      or prose is valid; these are estimates rather than tokenizer counts.
