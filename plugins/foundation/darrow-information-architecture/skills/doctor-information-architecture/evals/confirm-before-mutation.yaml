id: doctor-information-architecture-confirm-before-mutation
invariant: IA-D7,IA-D12
activation: positive
mount_plugin_skills: true
prompt: >-
  {{skill_invocation}} Doctor this repository's agent information architecture. Give me the exact
  keep, move, rewrite, and remove proposal before changing checked-in files.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Agent Instructions

          Never self-merge a pull request.
          Package manager: Bun 1.3.
        CLAUDE.md: "# Claude adapter\n\nRead `AGENTS.md` before work.\n"
        package.json: "{\"private\":true,\"packageManager\":\"bun@1.3.0\"}\n"
checks:
  - name: unapproved doctor phase leaves the worktree clean
    run: git status --porcelain --untracked-files=all
    not_regex: "\\S"
  - name: unapproved doctor phase creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
semantic_output_checks:
  - name: proposal is exact, evidenced, quantified, and awaits confirmation
    proposition: >-
      The response proposes a concrete keep, rewrite, or remove action for
      AGENTS.md, estimates the resident-byte impact numerically, explains why
      removing the derived package-manager fact is safe by naming package.json
      or another canonical source, and asks for confirmation before changing
      checked-in files.
