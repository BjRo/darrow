id: doctor-information-architecture-ignore-unselected-guidance
invariant: IA-D4,IA-D9,IA-D12
activation: competition
mount_plugin_skills: true
prompt: >-
  Check only the Claude information architecture and apply safe structural
  fixes if needed. Leave Codex guidance alone.
fixture:
  commits:
    - message: "chore: init"
      files:
        CLAUDE.md: "# Claude\n\nPreserve public API compatibility.\n"
        AGENTS.md: "# Codex\n\nBefore API work, read `docs/codex-policy.md`.\n"
        .claude/rules/api.md: |
          ---
          paths: ["src/api/**"]
          ---

          Keep API errors typed.
  setup: mkdir -p .git/ia-backend; cp -R "{{case_dir}}/../../../backend/src" .git/ia-backend/; cp "{{case_dir}}/../../../backend/pyproject.toml" "{{case_dir}}/../../../backend/uv.lock" .git/ia-backend/
checks:
  - name: unrelated Codex guidance is unchanged
    run: git diff HEAD -- AGENTS.md
    not_regex: "\\S"
  - name: no unrelated missing Codex policy is invented
    run: test ! -e docs/codex-policy.md && echo absent
    expect_regex: "^absent$"
  - name: selected runtime verifies
    run: uv run --quiet --frozen --no-dev --project .git/ia-backend ia-doctor verify --runtime claude . >/dev/null && echo verified
    expect_regex: "^verified$"
  - name: doctor creates no commit
    run: git rev-list --all --reflog --count
    expect_regex: "^1$"
semantic_output_checks:
  - name: unrelated Codex routes do not block Claude verification
    proposition: >-
      In the context of the requested Claude-only audit, the response reports
      a successful or issue-free structural outcome. Wording such as "no
      structural issues found" is sufficient; the literal word "verified" is
      not required. It may mention Codex inventory, but does not require fixing
      its missing policy as a condition of the Claude outcome.
