id: doctor-information-architecture-no-trigger-setup
invariant: IA-D12
activation: negative
activation_excludes:
  - doctor-information-architecture
mount_plugin_skills: true
prompt: >-
  Set up a new dual-runtime agent-guidance architecture for this repository.
  There are no existing instruction files. Propose the file graph before
  changing anything.
fixture:
  commits:
    - message: "chore: init"
      files:
        README.md: "# Service\n"
        package.json: '{"private":true}'
checks:
  - name: proposal phase leaves the worktree clean
    run: git status --porcelain --untracked-files=all
    not_regex: "\\S"
semantic_output_checks:
  - name: doctor skill is not claimed for greenfield setup
    proposition: >-
      The response does not claim that doctor-information-architecture was
      selected, invoked, or used to carry out this greenfield setup. Merely
      naming the installed doctor skill in the proposed file graph, preserving
      its existing files, or proposing it for future audits is allowed.
