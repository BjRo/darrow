id: ticket-pipeline-review-seeded-behavior-defect
invariant: TP-P1,TP-E1,TP-V1
prompt: >-
  Explicitly invoke $review-ticket for run eval-review, phase review,
  iteration 1, agent reviewer-eval. Review the current working-tree change
  against .ticket-pipeline-input/ticket.md and base revision HEAD, remain read-only,
  and write the artifact to the absolute path {{repo_dir}}/.git/review-artifact.tsv.
fixture:
  commits:
    - message: "chore: init"
      files:
        AGENTS.md: |
          # Instructions

          Run `bash test.sh` for JavaScript changes.
        .ticket-pipeline-input/ticket.md: |
          ## Outcome

          Export clampPositive(value), returning zero for all negative inputs and the original value otherwise.

          ## Done criteria

          - [ ] Values below -1 are handled.
          - [ ] `bash test.sh` passes.

          ## Ticket Pipeline Artifact — refine — Iteration 1

          ### Acceptance criteria

          clampPositive(-8) is 0 and clampPositive(3) is 3.
        package.json: '{"type":"module"}'
        value.js: |
          export const clampPositive = (value) => value;
        test.sh: |
          #!/usr/bin/env bash
          node --input-type=module -e 'import("./value.js").then(({clampPositive}) => { if(clampPositive(3) !== 3) process.exit(1) })'
  files:
    value.js: |
      export const clampPositive = (value) => value === -1 ? 0 : value;
checks:
  - name: review does not repair the defect
    run: >-
      test "$(cat value.js)" =
      'export const clampPositive = (value) => value === -1 ? 0 : value;'
  - name: review remains otherwise read only
    run: >-
      test "$(git status --porcelain --untracked-files=all)" = ' M value.js' &&
      test -z "$(git diff --summary)"
  - name: review requests changes with concrete evidence
    run: >-
      awk -F '\t' '$1=="phase" && $2=="review" {f=1} END {exit !f}' .git/review-artifact.tsv &&
      awk -F '\t' '$1=="status" && $2=="changes_requested" {f=1} END {exit !f}' .git/review-artifact.tsv &&
      grep -E -- '-8|negative|below -1' .git/review-artifact.tsv >/dev/null &&
      grep -F 'value.js' .git/review-artifact.tsv >/dev/null
output_checks:
  - name: review reports its artifact
    expect_regex: "review-artifact\\.tsv"
