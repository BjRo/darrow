id: verify-and-repair-non-blocking-diagnostic
invariant: DL-13
prompt: "Use the darrow-delivery:verify-and-repair command to review the existing safeDivide implementation. The requested behavior is: divide finite numbers and throw RangeError('division by zero') for a zero divisor while preserving add(). Run `bun run test` as a broad diagnostic. It includes an unrelated pre-existing runner failure; report it honestly without treating it as a defect in this change when focused verification covers the requested behavior."
fixture:
  commits:
    - message: "chore: initialize calculator"
      files:
        package.json: '{"scripts":{"test":"bun calculator.test.ts && bun unrelated.test.ts"},"packageManager":"bun@1.3.13"}'
        calculator.ts: "export function add(left: number, right: number) { return left + right; }\n"
        calculator.test.ts: "import { add } from './calculator';\nif (add(2, 3) !== 5) throw new Error('add regression');\n"
        unrelated.test.ts: "throw new Error('pre-existing runner incompatibility');\n"
  files:
    calculator.ts: "export function add(left: number, right: number) { return left + right; }\nexport function safeDivide(dividend: number, divisor: number) {\n  if (divisor === 0) throw new RangeError('division by zero');\n  return dividend / divisor;\n}\n"
    calculator.test.ts: "import { add, safeDivide } from './calculator';\nif (add(2, 3) !== 5) throw new Error('add regression');\nif (safeDivide(6, 3) !== 2) throw new Error('divide regression');\ntry {\n  safeDivide(1, 0);\n  throw new Error('zero divisor accepted');\n} catch (error) {\n  if (!(error instanceof RangeError) || error.message !== 'division by zero') throw error;\n}\n"
  setup: git diff --binary | git hash-object --stdin > .git/expected-review-diff
output_checks:
  - name: result satisfies the verification contract
    schema: ./output.schema.json
  - name: covered diagnostic permits verification
    json_path: /verified
    expect_json: true
  - name: broad failure is nested under a passing verdict check
    json_path: /verification
    contains_json:
      command:
        $regex: calculator(\.test)?\.ts
      exitStatus: 0
      purpose:
        $regex: safeDivide|requested|calculator|finite|division|zero
      diagnosticChecks:
        - command: bun run test
          exitStatus: 1
          nonBlockingReason:
            $regex: pre-existing|runner
checks:
  - name: correct implementation is not rewritten
    run: 'test "$(git diff --binary | git hash-object --stdin)" = "$(cat .git/expected-review-diff)"'
  - name: focused requested behavior remains green
    run: bun calculator.test.ts
  - name: unrelated failure remains unrelated
    run: "if bun unrelated.test.ts >/dev/null 2>&1; then exit 1; else exit 0; fi"
  - name: no commit or branch created
    run: 'test "$(git rev-list --count HEAD)" = 1 && test "$(git for-each-ref --format=''%(refname)'' refs/heads | wc -l | tr -d '' '')" = 1 && test "$(git branch --show-current)" = main'
  - name: index remains unchanged
    run: git diff --cached --quiet
  - name: guard state is cleaned
    run: 'test -z "$(find .git -name ''darrow-review-guard.*'' -print -quit)"'
