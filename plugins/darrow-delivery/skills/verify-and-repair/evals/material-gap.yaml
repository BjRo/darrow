id: verify-and-repair-material-gap
invariant: DL-12
prompt: "Use the darrow-delivery:verify-and-repair command to review and repair the existing implementation of safeDivide. The requested behavior is: safeDivide divides finite numbers and throws RangeError('division by zero') for a zero divisor while preserving add()."
fixture:
  commits:
    - message: "chore: initialize calculator"
      files:
        package.json: '{"scripts":{"test":"bun calculator.test.ts"},"packageManager":"bun@1.3.13"}'
        calculator.ts: "export function add(left: number, right: number) { return left + right; }\n"
        calculator.test.ts: "import { add } from './calculator';\nif (add(2, 3) !== 5) throw new Error('add regression');\n"
  files:
    calculator.ts: "export function add(left: number, right: number) { return left + right; }\nexport function safeDivide(dividend: number, divisor: number) { return dividend / divisor; }\n"
    calculator.test.ts: "import { add, safeDivide } from './calculator';\nif (add(2, 3) !== 5) throw new Error('add regression');\nif (safeDivide(6, 3) !== 2) throw new Error('divide regression');\n"
output_checks:
  - name: result satisfies the verification contract
    schema: ./output.schema.json
  - name: repaired behavior is verified
    json_path: /verified
    expect_json: true
checks:
  - name: no commit or branch created
    run: 'test "$(git rev-list --count HEAD)" = 1 && test "$(git for-each-ref --format=''%(refname)'' refs/heads | wc -l | tr -d '' '')" = 1 && test "$(git branch --show-current)" = main'
  - name: index remains unchanged
    run: git diff --cached --quiet
  - name: zero divisor is rejected
    run: 'bun -e "import { safeDivide } from ''./calculator.ts''; try { safeDivide(1, 0); process.exit(1); } catch (error) { if (!(error instanceof RangeError) || error.message !== ''division by zero'') process.exit(1); }"'
  - name: focused regression covers the repaired boundary
    run: "grep -F 'division by zero' calculator.test.ts && bun calculator.test.ts"
  - name: unrelated behavior remains green
    run: 'bun -e "import { add } from ''./calculator.ts''; if (add(2, 3) !== 5) process.exit(1)"'
  - name: guard state is cleaned
    run: 'test -z "$(find .git -name ''darrow-review-guard.*'' -print -quit)"'
