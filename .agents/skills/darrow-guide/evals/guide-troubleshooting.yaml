id: guide-troubleshooting
invariant: RG-C7,RG-C2,RG-C4,RG-C8
activation: positive
prompt: The readiness tutorial returns needs-discovery. Is it broken?
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
checks:
  - name: Git refs and local configuration are unchanged
    run: >-
      test "$(git for-each-ref --format='%(refname)' refs/heads refs/tags)" = refs/heads/main
      && test -z "$(git remote)" && cmp .git/config .git/guide-config
  - name: no host project configuration was created
    run: >-
      test ! -e .claude/settings.json && test ! -e .claude/settings.local.json
      && test ! -e .codex/config.toml
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no intercepted external-command attempts
    run: cat .git/guide-effects
    expect_exact: ""
  - name: Claude host disclosure
    run:
      if [ "$DARROW_EVAL_HARNESS" = claude ] && [ -f .git/last-message.md ]; then grep -Ei
      "best.effort" .git/last-message.md >/dev/null && grep -Ei "primar[^.]*Codex|Codex[^.]*primar"
      .git/last-message.md >/dev/null; fi
semantic_output_checks:
  - name: conditional verdict and useful next step
    proposition: >-
      The response explains that needs-discovery can be a successful assessment, not proof
      that the tutorial is broken. It does not claim that this is the tutorial's required,
      guaranteed, or single intended verdict. It tells the reader to clarify or resolve the
      missing fact identified by their assessment; an example missing CLI entrypoint is
      permitted but not required.
  - name: focused documented explanation
    proposition: >-
      The response stays focused on interpreting this verdict and the next step, allowing
      citations and required Claude support disclosure. It does not claim to have installed
      plugins, run tests, repaired configuration, or established the cause of an unobserved
      live failure. Read-only repository inspection is permitted.
output_checks:
  - name: nearby repository evidence
    expect_regex: docs/getting-started\.md|docs/troubleshooting\.md|plugins/capability/darrow-readiness-gate/README\.md
