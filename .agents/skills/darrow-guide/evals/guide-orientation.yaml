id: guide-orientation
invariant: RG-C1,RG-C2,RG-C4,RG-C8
activation: positive
prompt: What is Darrow, and where should I start with one safe first workflow?
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
checks:
  - name: Git refs and local configuration are unchanged
    run: >-
      test "$(git for-each-ref --format='%(refname)' refs/heads refs/tags)" = refs/heads/main
      && test -z "$(git remote)" && cmp .git/config .git/guide-config
  - name: no host project configuration was created
    run: >-
      test ! -e .claude/settings.json && test ! -e .claude/settings.local.json
      && test ! -e .codex/config.toml
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no intercepted external-command attempts
    run: cat .fixture-state/guide-effects
    expect_exact: ""
  - name: Claude host disclosure
    run:
      if [ "$DARROW_EVAL_HARNESS" = claude ] && [ -f .git/last-message.md ]; then grep -Ei
      "best.effort" .git/last-message.md >/dev/null && grep -Ei "primar[^.]*Codex|Codex[^.]*primar"
      .git/last-message.md >/dev/null; fi
semantic_output_checks:
  - name: question contract
    proposition: >-
      The response concisely explains independently adoptable plugins, capabilities
      matching ordinary intent, and orchestration requiring explicit invocation. It
      recommends a documented read-only assessment or exploration, such as readiness,
      as a safe first workflow, with no
      implementation or tracker effects from that assessment. Describing plugin
      installation as a prerequisite is permitted advice, not a performed effect.
      Reporting an advertised skill as unavailable in the current session is also
      permitted guidance, not a claim of performing environment diagnosis. It
      must not claim that it performed installations, tests, repairs, or environment
      diagnosis.
output_checks:
  - name: nearby repository evidence
    expect_regex: README\.md|docs/design\.md
