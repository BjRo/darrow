id: guide-rationale
invariant: RG-C1,RG-C2,RG-C3,RG-C4,RG-C8
activation: positive
prompt: Why doesn't Darrow run a second agent runtime, and why is the ticket pipeline retained?
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
checks:
  - name: Git refs and local configuration are unchanged
    run: >-
      test "$(git for-each-ref --format='%(refname)' refs/heads refs/tags)" = refs/heads/main
      && test -z "$(git remote)" && cmp .git/config .git/guide-config
  - name: no host project configuration was created
    run: >-
      test ! -e .claude/settings.json && test ! -e .claude/settings.local.json
      && test ! -e .codex/config.toml
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no intercepted external-command attempts
    run: cat .fixture-state/guide-effects
    expect_exact: ""
  - name: Claude host disclosure
    run:
      if [ "$DARROW_EVAL_HARNESS" = claude ] && [ -f .git/last-message.md ]; then grep -Ei
      "best.effort" .git/last-message.md >/dev/null && grep -Ei "primar[^.]*Codex|Codex[^.]*primar"
      .git/last-message.md >/dev/null; fi
semantic_output_checks:
  - name: question contract
    proposition: >-
      The response explains that the host supplies execution, recovery, delegation,
      or continuation, so Darrow does not add a second execution runtime. It explains
      that the ticket pipeline remains an executable reference and benchmark baseline
      for comparisons. It does not present ADR-0004's superseded subagent-owner
      boundary as current or unresolved policy. Citing ADR-0004 for
      its recorded benchmark rationale is permitted when that supersession is clear.
      Main-thread and bounded-delegation details, supersession history, and a separate
      explanation of how to activate orchestration are not required. The response
      remains focused on this rationale question; brief relevant source context,
      the required Claude best-effort/primary-Codex disclosure, and one useful next
      source are permitted. It does not claim to have performed installations,
      tests, repairs, or environment diagnosis.
output_checks:
  - name: nearby repository evidence
    expect_regex: docs/design\.md|docs/decisions/ADR-0012-keep-native-goal-ownership-in-the-main-thread\.md|docs/specs/ticket-pipeline\.md
