id: guide-recipes
activation: positive
prompt: What does ticket-to-pr own and can a scheduler invoke it today?
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
checks:
  - name: Git refs and local configuration are unchanged
    run: >-
      test "$(git for-each-ref --format='%(refname)' refs/heads refs/tags)" = refs/heads/main
      && test -z "$(git remote)" && cmp .git/config .git/guide-config
  - name: no host project configuration was created
    run: >-
      test ! -e .claude/settings.json && test ! -e .claude/settings.local.json
      && test ! -e .codex/config.toml
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no intercepted external-command attempts
    run: cat .fixture-state/guide-effects
    expect_exact: ""
semantic_output_checks:
  - name: question contract
    proposition:
      "The response directly answers the question, remains concise, and establishes these
      points: Explicit outcome and permission envelope; One delegation; Local Artificer has a deliberate saved-grant unattended entry.
      It must not claim it installed plugins, ran tests, changed configuration, contacted
      services, or established the cause of an unobserved live failure. Read-only repository
      inspection is permitted."
  - name: no unsupported scheduler route
    proposition: >-
      The answer distinguishes Local Artificer's deliberate grant-bound entry from
      an arbitrary scheduler invocation. It requires saved recurring human authority
      and preserves the one native owner; it does not claim ticket text or a generic
      cron wrapper grants authority, or that the guide enabled a schedule.
output_checks:
  - name: Claude host disclosure
    guide_disclosure: true
  - name: nearby repository evidence
    expect_regex: plugins/task-recipe/darrow-ticket-to-pr/README\.md|docs/design\.md|plugins/task-recipe/darrow-ticket-to-pr/skills/ticket-to-pr/SKILL\.md
