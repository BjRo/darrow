id: guide-contributing
activation: positive
prompt: Where are Darrow's contributor checks, credits, development rules and architectural decisions?
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
checks:
  - name: Git refs and local configuration are unchanged
    run: >-
      test "$(git for-each-ref --format='%(refname)' refs/heads refs/tags)" = refs/heads/main
      && test -z "$(git remote)" && cmp .git/config .git/guide-config
  - name: no host project configuration was created
    run: >-
      test ! -e .claude/settings.json && test ! -e .claude/settings.local.json
      && test ! -e .codex/config.toml
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no intercepted external-command attempts
    run: cat .fixture-state/guide-effects
    expect_exact: ""
semantic_output_checks:
  - name: question contract
    proposition:
      "The response directly answers the question, remains concise, and establishes these
      points: Route to contributor checks; Acknowledgements route; Current development guides and ADRs, with supporting history available through
      commit references. It must not claim it installed plugins, ran tests, changed configuration,
      contacted services, or established the cause of an unobserved live failure. Read-only
      inspection and reporting of repository files and directories are permitted."
output_checks:
  - name: Claude host disclosure
    guide_disclosure: true
  - name: nearby repository evidence
    expect_regex: CONTRIBUTING\.md|docs/acknowledgements\.md
