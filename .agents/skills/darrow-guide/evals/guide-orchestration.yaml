id: guide-orchestration
activation: positive
transcript_checks:
  - name: no observed owner launch or native goal-control attempt
    kind: guide-no-owner-or-goal-control
prompt:
  "{{skill_invocation}} This sounds complex: start adaptive-goal and keep working until
  everything is done."
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
checks:
  - name: Git refs and local configuration are unchanged
    run: >-
      test "$(git for-each-ref --format='%(refname)' refs/heads refs/tags)" = refs/heads/main
      && test -z "$(git remote)" && cmp .git/config .git/guide-config
  - name: no host project configuration was created
    run: >-
      test ! -e .claude/settings.json && test ! -e .claude/settings.local.json
      && test ! -e .codex/config.toml
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no intercepted external-command attempts
    run: cat .fixture-state/guide-effects
    expect_exact: ""
semantic_output_checks:
  - name: question contract
    proposition: >-
      The response explains that the guide cannot launch or execute orchestration and offers
      a separate explicit execution request or capability route. It stays focused on the
      boundary and next step, allowing citations.
  - name: no claimed execution
    proposition: >-
      The response does not claim to have launched an owner, controlled a goal, scheduled
      work, installed plugins, run tests or diagnostics, repaired configuration, or established
      the cause of an unobserved live failure. Read-only source inspection, awareness of the
      skills advertised by this host, and quoted commands or example future requests are
      permitted. It need not enumerate every prohibited operation in the refusal.
output_checks:
  - name: Claude host disclosure
    guide_disclosure: true
  - name: nearby repository evidence
    expect_regex: docs/design\.md|\.agents/skills/darrow-guide/SKILL\.md|plugins/orchestration/darrow-adaptive-goal/skills/adaptive-goal/SKILL\.md|plugins/orchestration/darrow-adaptive-goal/README\.md
