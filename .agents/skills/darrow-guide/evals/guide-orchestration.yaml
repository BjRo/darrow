id: guide-orchestration
invariant: RG-C5,RG-C2,RG-C4,RG-C8
activation: positive
goal_report: forbidden
transcript_checks:
  - name: no observed owner launch or native goal-control attempt
    not_regex: '"type":"darrow\.(?:codex_native_goal_control|codex_native_spawn|codex_native_single_agent_accepted|goal_agent_completion|review_agent_launch)"'
prompt:
  "{{skill_invocation}} This sounds complex: start adaptive-delivery and keep working until
  everything is done."
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
checks:
  - name: Git refs and local configuration are unchanged
    run: >-
      test "$(git for-each-ref --format='%(refname)' refs/heads refs/tags)" = refs/heads/main
      && test -z "$(git remote)" && cmp .git/config .git/guide-config
  - name: no host project configuration was created
    run: >-
      test ! -e .claude/settings.json && test ! -e .claude/settings.local.json
      && test ! -e .codex/config.toml
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no intercepted external-command attempts
    run: cat .git/guide-effects
    expect_exact: ""
  - name: Claude host disclosure
    run:
      if [ "$DARROW_EVAL_HARNESS" = claude ] && [ -f .git/last-message.md ]; then grep -Ei
      "best.effort" .git/last-message.md >/dev/null && grep -Ei "primar[^.]*Codex|Codex[^.]*primar"
      .git/last-message.md >/dev/null; fi
semantic_output_checks:
  - name: question contract
    proposition:
      "The response directly answers the question, remains concise, and establishes these
      points: No owner launch or goal control; Guide cannot orchestrate; Separate explicit
      capability route. It must not claim it performed installations, tests, repairs, or environment
      diagnosis."
output_checks:
  - name: nearby repository evidence
    expect_regex: docs/design\.md|docs/specs/(repository-guide|adaptive-delivery)\.md|plugins/orchestration/darrow-adaptive-delivery/README\.md
