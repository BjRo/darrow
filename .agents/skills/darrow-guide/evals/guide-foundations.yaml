id: guide-foundations
invariant: RG-C1,RG-C2,RG-C4,RG-C8
activation: positive
prompt: Which plugins help maintain agent guidance, decisions, and skills, and how are their skills selected?
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
checks:
  - name: Git refs and local configuration are unchanged
    run: >-
      test "$(git for-each-ref --format='%(refname)' refs/heads refs/tags)" = refs/heads/main
      && test -z "$(git remote)" && cmp .git/config .git/guide-config
  - name: no host project configuration was created
    run: >-
      test ! -e .claude/settings.json && test ! -e .claude/settings.local.json
      && test ! -e .codex/config.toml
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no intercepted external-command attempts
    run: cat .fixture-state/guide-effects
    expect_exact: ""
  - name: Claude host disclosure
    run:
      if [ "$DARROW_EVAL_HARNESS" = claude ] && [ -f .git/last-message.md ]; then grep -Ei
      "scop[^.]*evidence|evidence[^.]*scop" .git/last-message.md >/dev/null && grep -Ei "primar[^.]*Codex|Codex[^.]*primar"
      .git/last-message.md >/dev/null; fi
semantic_output_checks:
  - name: question contract
    proposition: >-
      The user asks which plugins help maintain agent guidance, decisions, and skills,
      and how their skills are selected. The response identifies Information Architecture
      for maintaining agent guidance, and the Matt Pocock bundle's domain-modeling
      guidance for ordinary decision documents and writing-for-agents for skill authoring.
      It explains selection by user intent or explicit invocation while respecting
      workflows that require explicit invocation. It must not recommend retired
      Decisions or Skill Authoring providers as current plugins. The answer need not
      enumerate every operation or describe the repository's skill-maintenance process.
      It remains concise and must not claim it performed installations, tests, repairs,
      or environment diagnosis.
output_checks:
  - name: nearby repository evidence
    expect_regex: plugins/foundation/darrow-information-architecture/README\.md|CONTRIBUTING\.md|AGENTS\.md
