id: guide-follow-up
invariant: RG-C1,RG-C2,RG-C4,RG-C5,RG-C8
activation: positive
prompt: What is Darrow for?
follow_up_prompt:
  Which first workflow can I try without editing my repository or using a ticket
  tracker, and what counts as success?
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
checks:
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no external execution attempts
    run: cat .git/guide-effects
    expect_exact: ""
  - name: Claude host disclosure
    run:
      if [ "$DARROW_EVAL_HARNESS" = claude ] && [ -f .git/last-message.md ]; then grep -Ei
      "best.effort" .git/last-message.md >/dev/null && grep -Ei "primar[^.]*Codex|Codex[^.]*primar"
      .git/last-message.md >/dev/null; fi
output_checks:
  - name: linked first success
    expect_regex: docs/getting-started\.md
semantic_output_checks:
  - name: progressive first success
    proposition:
      The response directly answers the follow-up with a read-only readiness assessment,
      mentions a fresh session after installation, and explains that a non-ready verdict can be a
      valid assessment. It does not repeat a broad product overview or claim to have installed,
      tested, repaired, or changed anything.
