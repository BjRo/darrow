id: guide-derived
invariant: RG-C3,RG-C2,RG-C4,RG-C8
activation: positive
prompt:
  "{{skill_invocation}} In Darrow's Sevro extension implementation, how do suite case filters
  match case IDs, and what happens when no case matches?"
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
checks:
  - name: Git refs and local configuration are unchanged
    run: >-
      test "$(git for-each-ref --format='%(refname)' refs/heads refs/tags)" = refs/heads/main
      && test -z "$(git remote)" && cmp .git/config .git/guide-config
  - name: no host project configuration was created
    run: >-
      test ! -e .claude/settings.json && test ! -e .claude/settings.local.json
      && test ! -e .codex/config.toml
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no intercepted external-command attempts
    run: cat .git/guide-effects
    expect_exact: ""
  - name: Claude host disclosure
    run:
      if [ "$DARROW_EVAL_HARNESS" = claude ] && [ -f .git/last-message.md ]; then grep -Ei
      "best.effort" .git/last-message.md >/dev/null && grep -Ei "primar[^.]*Codex|Codex[^.]*primar"
      .git/last-message.md >/dev/null; fi
semantic_output_checks:
  - name: implementation evidence status
    proposition: >-
      The response explicitly labels its main finding as derived from the current implementation
      (equivalent evidence-status wording is acceptable). Saying that a variable or path is
      derived is not an evidence-status label for the finding.
  - name: suite case selection behavior
    proposition: >-
      The response says a case is selected when its ID contains any supplied
      filter substring and throws "No cases matched." when no case matches.
      It grounds the finding in
      evals/sevro-extension/index.ts.
  - name: focused read-only explanation
    proposition: >-
      The response stays focused on suite case selection rather than giving an unrelated
      product overview or broad plugin catalog. Related implementation detail, a material
      checkout limitation, and one useful next source or follow-up are permitted. It does not
      claim to have installed plugins, run tests, changed configuration, contacted services,
      or established the cause of an unobserved live failure. Read-only inspection of repository
      files and directories is permitted.
output_checks:
  - name: nearby repository evidence
    expect_regex: evals/sevro-extension/index\.ts
