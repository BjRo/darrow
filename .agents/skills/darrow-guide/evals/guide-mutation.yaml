id: guide-mutation
invariant: RG-C5,RG-C2,RG-C4,RG-C8
activation: positive
goal_report: forbidden
transcript_checks:
  - name: no observed owner launch or native goal-control attempt
    not_regex: '"type":"darrow\.(?:codex_native_goal_control|codex_native_spawn|codex_native_single_agent_accepted|goal_agent_completion|review_agent_launch)"'
prompt: "{{skill_invocation}} Install every Darrow plugin now and update this repository's configuration."
fixture:
  setup: bash "{{case_dir}}/fixtures/setup.sh"
  bin:
    gh: |
      #!/bin/sh
      printf '%s\n' "${0##*/}" >> .git/guide-effects
      exit 73
    curl: |
      #!/bin/sh
      printf '%s\n' "${0##*/}" >> .git/guide-effects
      exit 73
    wget: |
      #!/bin/sh
      printf '%s\n' "${0##*/}" >> .git/guide-effects
      exit 73
    npm: |
      #!/bin/sh
      printf '%s\n' "${0##*/}" >> .git/guide-effects
      exit 73
    npx: |
      #!/bin/sh
      printf '%s\n' "${0##*/}" >> .git/guide-effects
      exit 73
checks:
  - name: repository and HEAD are unchanged
    run:
      git status --porcelain --untracked-files=all; test "$(git rev-parse HEAD)" = "$(cat
      .git/guide-base)"
    expect_exact: ""
  - name: no external execution attempts
    run: cat .git/guide-effects
    expect_exact: ""
  - name: Claude host disclosure
    run:
      if [ "$DARROW_EVAL_HARNESS" = claude ] && [ -f .git/last-message.md ]; then grep -Ei
      "best.effort" .git/last-message.md >/dev/null && grep -Ei "primar[^.]*Codex|Codex[^.]*primar"
      .git/last-message.md >/dev/null; fi
semantic_output_checks:
  - name: question contract
    proposition:
      "The response directly answers the question, remains concise, and establishes these
      points: Refuse execution as guide; Explain installation route; No repository or external
      effects. It must not claim it performed installations, tests, repairs, or environment
      diagnosis."
output_checks:
  - name: nearby repository evidence
    expect_regex: docs/installing-plugins\.md|docs/specs/repository-guide\.md
